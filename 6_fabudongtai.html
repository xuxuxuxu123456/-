<!DOCTYPE html>
<!--
    6_fabudongtai —— 发布动态（独立界面，原为 5 页内的弹窗）。

    从 5_dongtai.html 底部发布入口进入：
        ?type=说说  → 纯文字
        ?type=视频  → 进入后自动弹出选择面板（拍摄 / 从相册选择）
        ?type=图片  → 同上，支持多选，最多 9 张

    结构（参考微信朋友圈发布页）：
      顶部固定区：返回 / 标题 / 发表按钮（与 2 页同款胶囊按钮）
      中间滚动区：文字输入区（无边框）
                  媒体网格（九宫格，末尾「+」可继续添加）
                  「谁可以看」行 → 公开 / 不给谁看 / 给谁看

    ★ 文字与媒体可同时存在：输入文字不影响已选的图/视频。

    数据：
      读 localStorage「联系人索引」→ 谁可以看（与 4 页通讯录同源）
      写 localStorage「我的动态」   → 发表后返回 5 页，5 页自动渲染

    媒体说明（重要）：
      选中的图/视频仅在本次用 blob URL 预览（页面刷新即失效）。
      发表时只把「文字 + 类型 + 可见性」写进 localStorage ——
      图片转 dataURL 会撑爆 5MB 配额，接后端时换成真实地址即可。

    风格：与 1~5 页统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>发布动态</title>
    <style>
        /* ===== 统一色板（与 1~5 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;

            /* ★ rgb 伴生变量：hex 变量【不能】直接进 rgba()（整条声明会被静默丢弃），
               要带透明度时必须用这批数值三元组。与 1 / 4 / 7 / 8 / 9 页同一套。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) {
            .手机主题背景容器 { box-shadow: none; }
        }

        .主题背景图片 {
            width: 100%;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        .全局白色遮罩 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 顶部固定区（与 2 页同款：返回 / 标题 / 动作按钮） ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;
        }

        .返回按钮 {
            cursor: pointer;
            width: clamp(24px, 7vw, 28px);
            height: clamp(24px, 7vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .返回按钮 svg {
            width: clamp(18px, 5vw, 22px);
            height: clamp(18px, 5vw, 22px);
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .中间标题 {
            font-size: clamp(16px, 4.5vw, 18px);
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
        }

        /* 发表按钮：胶囊描边（与 2 页「保存」同款），禁用时变淡 */
        .发表按钮 {
            cursor: pointer;
            padding: clamp(4px, 1.5vw, 6px) clamp(12px, 3.4vw, 15px);
            border-radius: 20px;
            background: rgba(var(--panel), 0.5);
            border: 1px solid rgba(var(--panel), 0.2);
            font-family: inherit;
            font-size: clamp(12px, 3.5vw, 14px);
            font-weight: 500;
            color: var(--ink-2);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: opacity .18s, background .18s;
        }

        .发表按钮:disabled {
            opacity: .4;
            cursor: default;
        }

        .发表按钮:not(:disabled):active {
            background: rgba(var(--panel), 0.75);
        }

        /* ===== 中间滚动区 ===== */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 2;
            background: rgba(var(--panel), 0.15);
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ---- 文字输入区：无边框，像朋友圈那样直接写 ---- */
        .发布输入区 {
            padding: clamp(13px, 3.8vw, 17px) clamp(14px, 4vw, 18px);
        }

        .发布输入 {
            width: 100%;
            min-height: clamp(96px, 28vw, 120px);
            max-height: 30vh;
            resize: none;
            border: none;
            background: transparent;
            padding: 0;
            font-family: inherit;
            font-size: clamp(14px, 4vw, 16px);
            line-height: 1.66;
            color: var(--ink);
            outline: none;
            -webkit-appearance: none;
        }

        .发布输入::placeholder { color: var(--ink-4); }

        /* ---- 媒体网格：九宫格，末尾 + 号可继续添加 ---- */
        .发布媒体区 {
            padding: 0 clamp(14px, 4vw, 18px) clamp(12px, 3.6vw, 16px);
        }

        .媒体网格 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(5px, 1.5vw, 7px);
        }

        .媒体格 {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: clamp(7px, 2.1vw, 9px);
            overflow: hidden;
            background: rgba(var(--line), 0.12);
        }

        .媒体格 img,
        .媒体格 video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .媒体格 .媒体角标 {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 2px 0 3px;
            text-align: center;
            font-size: 9.5px;
            color: #fff;
            background: linear-gradient(to top, rgba(40, 40, 46, .55), transparent);
        }

        .移除媒体 {
            position: absolute;
            top: 3px;
            right: 3px;
            width: clamp(18px, 5.2vw, 21px);
            height: clamp(18px, 5.2vw, 21px);
            border: none;
            border-radius: 50%;
            background: rgba(40, 40, 46, 0.62);
            color: #fff;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* 末尾的「+」添加格（朋友圈同款） */
        .添加格 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border: 1px dashed rgba(var(--line), 0.42);
            background: rgba(var(--line), 0.05);
            cursor: pointer;
            color: var(--ink-3);
            -webkit-tap-highlight-color: transparent;
            transition: border-color .18s, background .18s;
        }
        .添加格:active {
            border-color: rgba(var(--line), 0.7);
            background: rgba(var(--line), 0.1);
        }
        .添加格 svg {
            width: clamp(17px, 5vw, 20px);
            height: clamp(17px, 5vw, 20px);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
        }
        .添加格.隐藏 { display: none; }

        .媒体计数 {
            margin-top: clamp(8px, 2.4vw, 11px);
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            text-align: right;
        }

        /* ================================================================
           ===== 「谁可以看」入口行（朋友圈同款）===== */
        .可见性行 {
            display: flex;
            align-items: center;
            gap: clamp(5px, 1.5vw, 7px);
            margin: 0 clamp(14px, 4vw, 18px);
            padding: clamp(11px, 3.2vw, 14px) clamp(12px, 3.6vw, 15px);
            border: none;
            background: rgba(var(--panel), 0.42);
            -webkit-backdrop-filter: blur(var(--blur-sm));
            backdrop-filter: blur(var(--blur-sm));
            border-radius: clamp(10px, 3vw, 13px);
            font-family: inherit;
            font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink-2);
            cursor: pointer;
            width: calc(100% - clamp(28px, 8vw, 36px));
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .可见性图标 {
            width: clamp(15px, 4.3vw, 17px);
            height: clamp(15px, 4.3vw, 17px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-3);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .可见性文字 { flex: 1; min-width: 0; }

        .可见性标签 {
            font-weight: 500;
            color: var(--ink);
        }

        .可见性摘要 {
            display: block;
            margin-top: 2px;
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .可见性箭头 {
            flex-shrink: 0;
            width: clamp(12px, 3.4vw, 14px);
            height: clamp(12px, 3.4vw, 14px);
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 底部留白，避免内容贴底 */
        .底部留白 { height: clamp(18px, 5vw, 26px); }

        /* ================================================================
           ===== 朋友圈式选择面板（拍摄 / 从手机相册选择 / 取消）=====
           每项：圆角图标 + 主标题 + 副标题 */
        .朋友圈遮罩 {
            position: fixed; inset: 0; z-index: 310;
            background: rgba(0, 0, 0, 0.42);
            display: none; align-items: flex-end; justify-content: center;
        }
        .朋友圈遮罩.显示 { display: flex; }
        .朋友圈面板 {
            width: 100%; max-width: 430px;
            padding: 0 clamp(8px, 2.4vw, 10px)
                     calc(clamp(8px, 2.4vw, 10px) + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .26s cubic-bezier(.32, .72, 0, 1);
        }
        .朋友圈遮罩.显示 .朋友圈面板 { transform: translateY(0); }
        .朋友圈组 {
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(13px, 3.8vw, 15px);
            overflow: hidden;
        }
        .朋友圈项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 13px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(14px, 4vw, 17px);
            border: none;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .朋友圈项 + .朋友圈项 { border-top: 1px solid rgba(var(--line), 0.15); }
        .朋友圈项:active { background: rgba(var(--line), 0.09); }

        .朋友圈图标 {
            width: clamp(30px, 8.8vw, 35px);
            height: clamp(30px, 8.8vw, 35px);
            flex-shrink: 0;
            border-radius: clamp(8px, 2.4vw, 10px);
            background: rgba(var(--line), 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
        }
        .朋友圈图标 svg {
            width: clamp(16px, 4.6vw, 18px);
            height: clamp(16px, 4.6vw, 18px);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .朋友圈文本 { min-width: 0; }
        .朋友圈主文 {
            display: block;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            font-weight: 500;
        }
        .朋友圈副文 {
            display: block;
            margin-top: 2px;
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
        }
        .朋友圈项.取消 {
            margin-top: clamp(7px, 2vw, 9px);
            border-radius: clamp(13px, 3.8vw, 15px);
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            justify-content: center;
            font-weight: 600;
        }
        .朋友圈项.取消 .朋友圈主文 { text-align: center; }

        /* ================================================================
           ===== 来源选择面板（拍摄 / 从手机相册选择 / 取消）=====
           ★ 全站统一面板：1 / 2 / 6 / 8 / 9 / 10 / 11 页共用这套结构与文案。
             改了这里，请把改动同步到其余六页（CSS 与 HTML 各一处）。
             上面的「朋友圈式面板」只留给本页「谁可以看」用。 */
        .来源遮罩 {
            position: fixed; inset: 0; z-index: 310;
            background: rgba(16, 16, 24, 0.45);
            display: none; align-items: flex-end; justify-content: center;
        }
        .来源遮罩.显示 { display: flex; }
        .来源面板 {
            width: 100%; max-width: 430px;
            padding: 0 clamp(8px, 2.4vw, 10px)
                     calc(clamp(8px, 2.4vw, 10px) + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .26s cubic-bezier(.32, .72, 0, 1);
        }
        .来源遮罩.显示 .来源面板 { transform: translateY(0); }

        .来源组 {
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(13px, 3.8vw, 15px);
            overflow: hidden;
        }
        .来源项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 13px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(14px, 4vw, 17px);
            border: none;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .来源项 + .来源项 { border-top: 1px solid rgba(var(--line), 0.15); }
        .来源项:active { background: rgba(var(--line), 0.09); }
        .来源项 svg {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(17px, 4.8vw, 19px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .来源文字 { font-size: clamp(13.5px, 3.9vw, 15px); color: var(--ink); font-weight: 500; }

        .来源项.取消 {
            margin-top: clamp(7px, 2vw, 9px);
            border-radius: clamp(13px, 3.8vw, 15px);
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            justify-content: center;
        }
        .来源项.取消 .来源文字 { font-weight: 600; }

        /* ================================================================
           ===== 联系人选择面板（全屏，朋友圈「谁可以看」同款）===== */
        .选人遮罩 {
            position: fixed; inset: 0; z-index: 320;
            background: rgba(252, 252, 254, 0.99);
            display: none;
            flex-direction: column;
        }
        .选人遮罩.显示 { display: flex; }

        .选人顶栏 {
            flex-shrink: 0;
            padding: calc(clamp(10px, 3vw, 13px) + env(safe-area-inset-top, 0px))
                     clamp(12px, 3.6vw, 15px) clamp(10px, 3vw, 13px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid rgba(var(--line), 0.14);
        }

        .选人标题 {
            font-size: clamp(15px, 4.3vw, 17px);
            font-weight: 600;
            color: var(--ink);
        }

        .选人完成键 {
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: clamp(12.5px, 3.6vw, 14px);
            font-weight: 600;
            padding: clamp(6px, 1.8vw, 8px) clamp(14px, 4vw, 17px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .选人搜索区 {
            flex-shrink: 0;
            padding: clamp(9px, 2.6vw, 12px) clamp(12px, 3.6vw, 15px);
        }

        .选人搜索 {
            width: 100%;
            border: none;
            border-radius: clamp(8px, 2.4vw, 10px);
            background: rgba(var(--line), 0.12);
            padding: clamp(8px, 2.4vw, 10px) clamp(11px, 3.2vw, 13px);
            font-family: inherit;
            font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink);
            outline: none;
            -webkit-appearance: none;
        }
        .选人搜索::placeholder { color: var(--ink-4); }

        .选人列表 {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 clamp(12px, 3.6vw, 15px)
                     calc(clamp(12px, 3.6vw, 16px) + env(safe-area-inset-bottom, 0px));
            scrollbar-width: none;
        }
        .选人列表::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .选人行 {
            display: flex;
            align-items: center;
            gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(9px, 2.6vw, 12px) 0;
            border-bottom: 1px solid rgba(var(--line), 0.1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .选人头像 {
            width: clamp(32px, 9.5vw, 38px);
            height: clamp(32px, 9.5vw, 38px);
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(var(--line), 0.12);
        }

        .选人姓名 {
            flex: 1;
            min-width: 0;
            font-size: clamp(13px, 3.8vw, 15px);
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .选人勾 {
            width: clamp(19px, 5.6vw, 22px);
            height: clamp(19px, 5.6vw, 22px);
            flex-shrink: 0;
            border-radius: 50%;
            border: 1.6px solid rgba(var(--line), 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .16s, border-color .16s;
        }

        .选人行.已选 .选人勾 {
            background: var(--accent);
            border-color: var(--accent);
        }

        .选人勾 svg {
            width: 60%;
            height: 60%;
            fill: none;
            stroke: #fff;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
        }

        .选人行.已选 .选人勾 svg { opacity: 1; }

        .选人空态 {
            text-align: center;
            color: var(--ink-4);
            font-size: clamp(12px, 3.4vw, 13.5px);
            padding: clamp(30px, 9vw, 40px) 0;
        }

        /* 移动端选文件的隐藏输入：必须留在渲染树内，
           否则 Android WebView / 部分 iOS 调 .click() 无效（与 1 / 2 页同做法）。 */
        .视觉隐藏文件输入 {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== Toast（与 1~5 页同款） ===== */
        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px); background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="手机主题背景容器">
        <img class="主题背景图片" src="2【图片】/默认主题背景.png" alt="手机主题背景占位图">
        <div class="全局白色遮罩"></div>

        <!-- ===== 顶部固定区：返回 / 标题 / 发表 ===== -->
        <div class="顶部固定区">
            <div class="顶部导航栏">
                <div class="返回按钮" id="返回按钮" title="返回">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <polyline points="15 6 9 12 15 18"></polyline>
                    </svg>
                </div>
                <div class="中间标题" id="页面标题">发布动态</div>
                <button class="发表按钮" id="发表按钮" type="button" disabled>发表</button>
            </div>
        </div>

        <!-- ===== 中间滚动区 ===== -->
        <div class="手机界面内容">
            <div class="发布输入区">
                <textarea class="发布输入" id="发布输入" maxlength="500"
                          placeholder="这一刻的想法..."></textarea>
            </div>

            <div class="发布媒体区">
                <div class="媒体网格" id="媒体网格">
                    <!-- 媒体格子由 JS 渲染；末尾是「+」添加格 -->
                    <div class="媒体格 添加格" id="添加格" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <line x1="12" y1="7" x2="12" y2="17"/>
                            <line x1="7" y1="12" x2="17" y2="12"/>
                        </svg>
                    </div>
                </div>
                <div class="媒体计数" id="媒体计数" hidden></div>
            </div>

            <!-- ★ 谁可以看（朋友圈同款） -->
            <button class="可见性行" id="可见性行" type="button">
                <svg class="可见性图标" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3.2 12h17.6"/>
                    <path d="M12 3.2c2.4 2.6 3.6 5.6 3.6 8.8S14.4 18.2 12 20.8C9.6 18.2 8.4 15.2 8.4 12S9.6 5.8 12 3.2z"/>
                </svg>
                <span class="可见性文字">
                    <span class="可见性标签" id="可见性标签">公开</span>
                    <span class="可见性摘要" id="可见性摘要">所有好友可见</span>
                </span>
                <svg class="可见性箭头" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="9,5 16,12 9,19"/>
                </svg>
            </button>

            <div class="底部留白"></div>
        </div>

        <div class="toast" id="toast"></div>

        <!-- ===== 媒体来源选择：拍摄 / 从手机相册选择 / 取消（全站统一面板）===== -->
        <div class="来源遮罩" id="媒体遮罩">
            <div class="来源面板">
                <div class="来源组">
                    <button class="来源项" data-动作="拍摄" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 8.5h3l1.5-2h7L17 8.5h3a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5z"></path>
                            <circle cx="12" cy="13.5" r="3.2"></circle>
                        </svg>
                        <span class="来源文字">拍摄</span>
                    </button>
                    <button class="来源项" data-动作="相册" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
                            <circle cx="8.6" cy="9.8" r="1.6"></circle>
                            <path d="M3.6 17.2l4.6-4.3 3.5 3.2 3.2-2.8 5.5 4.9"></path>
                        </svg>
                        <span class="来源文字">从手机相册选择</span>
                    </button>
                </div>
                <button class="来源项 取消" data-动作="取消" type="button">
                    <span class="来源文字">取消</span>
                </button>
            </div>
        </div>

        <!-- ===== 「谁可以看」模式选择 ===== -->
        <div class="朋友圈遮罩" id="可见性遮罩">
            <div class="朋友圈面板">
                <div class="朋友圈组">
                    <button class="朋友圈项" data-模式="公开" type="button">
                        <span class="朋友圈图标">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="9"/>
                                <path d="M3.2 12h17.6"/>
                                <path d="M12 3.2c2.4 2.6 3.6 5.6 3.6 8.8S14.4 18.2 12 20.8C9.6 18.2 8.4 15.2 8.4 12S9.6 5.8 12 3.2z"/>
                            </svg>
                        </span>
                        <span class="朋友圈文本">
                            <span class="朋友圈主文">公开</span>
                            <span class="朋友圈副文">所有好友可见</span>
                        </span>
                    </button>

                    <button class="朋友圈项" data-模式="不给谁看" type="button">
                        <span class="朋友圈图标">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M10.6 6.2A8.9 8.9 0 0 1 12 6c4.4 0 8.1 2.7 9.3 6.4a9.6 9.6 0 0 1-2.6 3.8"/>
                                <path d="M6.3 8A9.5 9.5 0 0 0 2.7 12.4C3.9 16.1 7.6 18.8 12 18.8c1.3 0 2.6-.2 3.7-.7"/>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                                <line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/>
                            </svg>
                        </span>
                        <span class="朋友圈文本">
                            <span class="朋友圈主文">不给谁看</span>
                            <span class="朋友圈副文">选中的好友不可见</span>
                        </span>
                    </button>

                    <button class="朋友圈项" data-模式="给谁看" type="button">
                        <span class="朋友圈图标">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/>
                                <circle cx="10" cy="8" r="3.4"/>
                                <path d="M16.5 11.2a3.4 3.4 0 0 0 0-6.4"/>
                                <path d="M19.5 20v-1.5a3.5 3.5 0 0 0-2.6-3.4"/>
                            </svg>
                        </span>
                        <span class="朋友圈文本">
                            <span class="朋友圈主文">给谁看</span>
                            <span class="朋友圈副文">仅选中的好友可见</span>
                        </span>
                    </button>
                </div>
                <button class="朋友圈项 取消" data-模式="取消" type="button">
                    <span class="朋友圈文本">
                        <span class="朋友圈主文">取消</span>
                    </span>
                </button>
            </div>
        </div>

        <!-- ===== 联系人选择面板 ===== -->
        <div class="选人遮罩" id="选人遮罩">
            <div class="选人顶栏">
                <div class="选人标题" id="选人标题">选择联系人</div>
                <button class="选人完成键" id="选人完成" type="button">完成</button>
            </div>
            <div class="选人搜索区">
                <input class="选人搜索" id="选人搜索" type="search"
                       placeholder="搜索联系人" autocomplete="off">
            </div>
            <div class="选人列表" id="选人列表"></div>
        </div>
    </div>

    <script>
        /* ============================================================
         * 0. 通用：Toast
         * ============================================================ */
        (function () {
            window.showToast = function (消息) {
                const 元素 = document.getElementById('toast');
                if (!元素) return;
                元素.textContent = 消息;
                元素.classList.add('显示');
                clearTimeout(元素._计时);
                元素._计时 = setTimeout(() => 元素.classList.remove('显示'), 1800);
            };
        })();

        /* ============================================================
         * 1. 发布动态主逻辑
         *
         *    类型来自 URL：?type=说说 | 视频 | 图片
         *    文字与媒体互不干扰；可见性取自通讯录联系人。
         *    发表 → 写 localStorage「我的动态」→ 返回 5 页
         * ============================================================ */
        (function () {
            const 参数 = new URLSearchParams(location.search);
            const 类型 = 参数.get('type') || '说说';

            const 标题 = document.getElementById('页面标题');
            const 输入 = document.getElementById('发布输入');
            const 发表键 = document.getElementById('发表按钮');
            const 返回键 = document.getElementById('返回按钮');
            const 网格 = document.getElementById('媒体网格');
            const 添加格 = document.getElementById('添加格');
            const 计数 = document.getElementById('媒体计数');

            const 可见性行 = document.getElementById('可见性行');
            const 可见性标签 = document.getElementById('可见性标签');
            const 可见性摘要 = document.getElementById('可见性摘要');
            const 可见性遮罩 = document.getElementById('可见性遮罩');
            const 选人遮罩 = document.getElementById('选人遮罩');
            const 选人标题 = document.getElementById('选人标题');
            const 选人列表 = document.getElementById('选人列表');
            const 选人搜索 = document.getElementById('选人搜索');
            const 选人完成 = document.getElementById('选人完成');
            const 媒体遮罩 = document.getElementById('媒体遮罩');

            const 最多图片 = 9;
            const 我的键 = '我的动态';

            // 已选媒体：{ 类型, 文件, 地址 }
            let 媒体表 = [];
            // 当前类型：说说时为空串（不发媒体）
            let 当前类型 = (类型 === '视频' || 类型 === '图片') ? 类型 : '';
            // 可见性：{ 模式, 名单 }
            let 可见性 = { 模式: '公开', 名单: [] };
            let 可见性名字 = [];

            /* ---------- 标题 ---------- */
            标题.textContent = 当前类型 ? ('发布' + 当前类型) : '发布说说';

            /* ---------- 读写「我的动态」 ---------- */
            const 读我的 = () => {
                try {
                    const 原 = JSON.parse(localStorage.getItem(我的键));
                    return Array.isArray(原) ? 原 : [];
                } catch (e) { return []; }
            };
            const 写我的 = 表 => {
                try { localStorage.setItem(我的键, JSON.stringify(表)); } catch (e) {}
            };

            // 发布者昵称：取首页设的「用户昵称」，没设过就是「我」
            function 我的昵称() {
                try {
                    const n = (localStorage.getItem('用户昵称') || '').trim();
                    if (n) return n;
                } catch (e) {}
                return '我';
            }

            /* ---------- 联系人（谁可以看） ----------
               ★ 通讯录只在本页打开时读一次，之后都走内存缓存。
                 原先每次打开选人面板都要 JSON.parse 一遍「联系人索引」。 */
            let 联系人缓存 = null;

            function 读联系人() {
                if (联系人缓存) return 联系人缓存;
                try {
                    const 索引 = JSON.parse(localStorage.getItem('联系人索引')) || [];
                    联系人缓存 = (Array.isArray(索引) ? 索引 : [])
                        .filter(项 => 项 && (项.名称 || 项.备注))
                        .map(项 => ({
                            id: 项.id || '',
                            名: 项.备注 || 项.名称 || '',
                            头像: 项.头像 || '',
                        }));
                } catch (e) { 联系人缓存 = []; }
                return 联系人缓存;
            }

            /* ---------- 可见性：读一次上次的选择，发表后记住 ----------
               ★ 权限设置不用每次重新选：首次读 localStorage「动态可见性」，
                 发表后写回，下次打开发布页仍是上次的范围。
                 找不到记录（或记录损坏）才退回「公开」。 */
            const 可见性键 = '动态可见性';

            function 读上次可见性() {
                try {
                    const 原 = JSON.parse(localStorage.getItem(可见性键));
                    if (原 && typeof 原.模式 === 'string' && Array.isArray(原.名单)) {
                        return { 模式: 原.模式, 名单: 原.名单.slice() };
                    }
                } catch (e) {}
                return { 模式: '公开', 名单: [] };
            }

            function 写可见性(值) {
                try { localStorage.setItem(可见性键, JSON.stringify(值)); } catch (e) {}
            }

            /* ---------- 媒体渲染 ---------- */
            function 渲染媒体() {
                Array.from(网格.querySelectorAll('.媒体格'))
                    .forEach(格 => { if (格 !== 添加格) 格.remove(); });

                媒体表.forEach((项, i) => {
                    const 格 = document.createElement('div');
                    格.className = '媒体格';

                    if (项.类型 === '视频') {
                        const v = document.createElement('video');
                        v.muted = true;
                        v.playsInline = true;
                        v.src = 项.地址;
                        // 载入元数据后定位到 0.1s，取首帧当封面，避免黑屏
                        v.addEventListener('loadedmetadata', () => {
                            try { v.currentTime = 0.1; } catch (e) {}
                        }, { once: true });
                        格.appendChild(v);
                        const 标 = document.createElement('div');
                        标.className = '媒体角标';
                        标.textContent = '视频';
                        格.appendChild(标);
                    } else {
                        const img = document.createElement('img');
                        img.alt = '选中的图片 ' + (i + 1);
                        img.src = 项.地址;
                        格.appendChild(img);
                    }

                    const 删 = document.createElement('button');
                    删.className = '移除媒体';
                    删.type = 'button';
                    删.title = '移除';
                    删.textContent = '×';
                    删.addEventListener('click', () => {
                        try { URL.revokeObjectURL(项.地址); } catch (e) {}
                        媒体表.splice(i, 1);
                        渲染媒体();
                        同步发表键();
                    });
                    格.appendChild(删);

                    网格.insertBefore(格, 添加格);
                });

                // 添加格：说说模式不显示；视频满 1 个、图片满 9 张则隐藏
                const 已满 = 当前类型 === '视频'
                    ? 媒体表.length >= 1
                    : 媒体表.length >= 最多图片;
                添加格.hidden = (当前类型 === '' || 已满);
                添加格.classList.toggle('隐藏', 添加格.hidden);

                if (当前类型 === '图片' && 媒体表.length) {
                    计数.hidden = false;
                    计数.textContent = 媒体表.length + ' / ' + 最多图片;
                } else {
                    计数.hidden = true;
                }
            }

            function 清空媒体() {
                媒体表.forEach(项 => {
                    try { URL.revokeObjectURL(项.地址); } catch (e) {}
                });
                媒体表 = [];
                渲染媒体();
            }

            /* ---------- 发表键可用性 ---------- */
            function 同步发表键() {
                // 有媒体时可只发媒体；纯说说必须有文字
                发表键.disabled = 媒体表.length
                    ? false
                    : 输入.value.trim().length === 0;
            }

            /* ---------- 可见性显示 ---------- */
            function 同步可见性显示() {
                const 数 = 可见性名字.length;
                if (可见性.模式 === '公开' || 数 === 0) {
                    可见性标签.textContent = 可见性.模式;
                    可见性摘要.textContent = 可见性.模式 === '公开'
                        ? '所有好友可见'
                        : '未选择好友（等同公开）';
                    return;
                }
                可见性标签.textContent = 可见性.模式 + '（' + 数 + '人）';
                const 前列 = 可见性名字.slice(0, 3).join('、');
                可见性摘要.textContent = 数 > 3
                    ? (前列 + ' 等 ' + 数 + ' 人')
                    : 前列;
            }

            /* ---------- 选中的媒体文件 ---------- */
            function 加入媒体(类型, 文件列表) {
                const 文件们 = Array.from(文件列表 || []);
                if (!文件们.length) return;

                // 视频与图片不混选
                if (当前类型 && 当前类型 !== 类型) 清空媒体();
                当前类型 = 类型;
                标题.textContent = '发布' + 类型;

                const 上限 = 类型 === '视频' ? 1 : 最多图片;
                let 已加 = 0;
                for (const 文件 of 文件们) {
                    if (媒体表.length >= 上限) break;
                    const 是视频 = /^video\//.test(文件.type);
                    const 是图片 = /^image\//.test(文件.type);
                    if (类型 === '视频' && !是视频) continue;
                    if (类型 === '图片' && !是图片) continue;
                    媒体表.push({ 类型, 文件, 地址: URL.createObjectURL(文件) });
                    已加++;
                }
                if (!已加) {
                    window.showToast(类型 === '视频' ? '请选择视频文件' : '请选择图片文件');
                } else if (文件们.length > 已加) {
                    window.showToast('最多 ' + 上限 + ' 个，已取前 ' + 已加 + ' 个');
                }
                渲染媒体();
                同步发表键();
            }

            /* ---------- 媒体来源：拍摄 / 相册 ---------- */
            function 选文件(类型, 要拍摄) {
                const input = document.createElement('input');
                input.type = 'file';
                input.className = '视觉隐藏文件输入';
                input.accept = 类型 === '视频' ? 'video/*' : 'image/*';
                if (要拍摄) input.setAttribute('capture', 'environment');
                if (!要拍摄 && 类型 === '图片') input.multiple = true;
                document.body.appendChild(input);

                let 已处理 = false;
                input.addEventListener('change', () => {
                    if (已处理) return;
                    已处理 = true;
                    const 文件们 = input.files;
                    setTimeout(() => input.remove(), 0);
                    if (!文件们 || !文件们.length) return;   // 用户取消
                    加入媒体(类型, 文件们);
                });

                input.click();
            }

            // ★ 一律先弹来源面板（与 1 / 2 / 8 / 9 / 10 / 11 页同款）：
            //   类型是「图片 / 视频」由入口 ?type= 决定，面板只负责让用户选来源，
            //   所以主文案不再随类型变化，保持全站三行一致。
            function 打开媒体面板(类型) {
                媒体遮罩.dataset.类型 = 类型;
                媒体遮罩.classList.add('显示');
            }

            function 关闭媒体面板() {
                媒体遮罩.classList.remove('显示');
            }

            媒体遮罩.addEventListener('click', e => {
                if (e.target === 媒体遮罩) 关闭媒体面板();
            });
            Array.from(媒体遮罩.querySelectorAll('.来源项')).forEach(项 => {
                项.addEventListener('click', () => {
                    const 动作 = 项.dataset.动作;
                    const 类型 = 媒体遮罩.dataset.类型 || 当前类型;
                    关闭媒体面板();
                    if (动作 === '取消') {
                        // 从入口进来的首次选择被取消 → 退回 5 页，避免停在空页
                        if (!媒体表.length) 返回上一页();
                        return;
                    }
                    setTimeout(() => 选文件(类型, 动作 === '拍摄'), 220);
                });
            });

            // 「+」继续添加
            添加格.addEventListener('click', () => {
                if (!当前类型) return;
                打开媒体面板(当前类型);
            });

            /* ---------- 谁可以看 ---------- */
            let 待定模式 = '';
            let 待定名单 = [];
            let 全部联系人 = [];

            function 渲染选人列表() {

                    头像.alt = c.名;

            /* ---------- 返回 ---------- */
            function 返回上一页() {

            window.返回上一页 = 返回上一页;

                const 表 = 读我的();
                表.unshift({

                    分: 0,                       // 0 分 → 显示「刚刚」
                    来源: 当前类型 || '动态',      // 元信息里体现「来自 视频 / 图片」
                    正文: 内容,
                    可见性: {
                        模式: 可见性.模式,
                        名单: 可见性.名单.slice(),
                    },
                    赞: 0, 评: 0, 转: 0,
                });
                写我的(表);
                // ★ 记住这次的可见范围，下次打开发布页直接沿用
                写可见性({ 模式: 可见性.模式, 名单: 可见性.名单.slice() });

                window.showToast('已发表');
                清空媒体();
                // 稍等一下让 toast 可见，再回 5 页
                setTimeout(() => { location.href = '5_dongtai.html'; }, 420);
            });

            // ★ 输入文字只影响「发表」是否可点，不影响已选媒体
            输入.addEventListener('input', 同步发表键);

            /* ---------- 初始化 ---------- */
            // 恢复上次选的可见范围（并把名单 id 换成现通讯录里的名字；
            // 若某人已被删除则自动从名单剔除，避免留下幽灵条目）
            const 上次 = 读上次可见性();
            if (上次.名单.length) {
                const 现有 = 读联系人();
                可见性.名单 = 上次.名单.filter(id => 现有.some(c => c.id === id));
                可见性名字 = 现有
                    .filter(c => 可见性.名单.indexOf(c.id) >= 0)
                    .map(c => c.名);
                // 过滤后若一个不剩就退回公开，否则会显示「（0人）」
                可见性.模式 = 可见性.名单.length ? 上次.模式 : '公开';
            } else {
                可见性.模式 = 上次.模式 === '公开' ? '公开' : 上次.模式;
            }

            渲染媒体();
            同步发表键();
            同步可见性显示();

            // 视频 / 图片：进入即弹出来源选择（说说不弹，直接可写）
            if (当前类型) {
                setTimeout(() => 打开媒体面板(当前类型), 320);
            } else {
                // 说说：自动聚焦，软键盘直接弹起
                setTimeout(() => 输入.focus(), 260);
            }
        })();

    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时
 *     把仍在通话中的音乐放出来。全部原因解除才恢复。
 *   ★ 会记住「占用前是否在播」，本来没放音乐就不会凭空启动。
 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);
        })).catch(() => null);
    }

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */
    function 读状态() {
        try { return JSON.parse(localStorage.getItem(状态键) || 'null'); } catch (e) { return null; }
    }

    function 写状态(存) {
        try { localStorage.setItem(状态键, JSON.stringify(存)); } catch (e) {}

    /* ---------------------------------------------------------------
     * 主体
     * ------------------------------------------------------------- */
    const 元素id = '全局音乐播放器';

    /* =========================================================================
     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位
     *
     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */

    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {
        return document.getElementById('音乐播放器') || document.getElementById(元素id);
    }

    const 全局音频 = {
        /** 暂停背景音乐（可重入；同一原因重复调用无害） */

            const 键 = 原因 || '未命名';
            if (占用.size === 0) {
                const a = 取音频();
                占用前在播 = !!a && !a.paused;
            }
            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */
        恢复(原因) {
            const 键 = 原因 || '未命名';
            if (!占用.has(键)) return;
            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）
            if (!占用前在播) return;                 // 本来就没在播 → 不凭空启动
            const a = 取音频();

                const 试 = a.play();
                if (试 && typeof 试.catch === 'function') 试.catch(() => {});
            }
        },

        /** 强制清掉所有占用（异常路径兜底用） */
        清除() { 占用.clear(); },

        占用中() { return 占用.size > 0; },
        占用表() { return Array.from(占用); },
        是否在播() { const a = 取音频(); return !!a && !a.paused; },
    };
    /* ★ 无论让不让位都挂上：让位时它操作的是 4 页自己的播放器，
       调用方（语音条 / 通话）不必关心自己在哪个页面。 */
    window.全局音频 = 全局音频;

    function 启动() {
        /* ★★ 让位：4 页有完整播放器（#音乐播放器），这里绝不能再建第二个 audio。
              注意 7 页那个是 #语音播放器（点语音消息用的），与本脚本无关，
              各播各的，所以【只】认 #音乐播放器 这一个 id。 */

        const 目标 = Math.max(0, Number(存.时间) || 0);

        音频.addEventListener('ended', () => {

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */
        function 存一次(播放中) {
            写状态({

         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。

            收提示();

            条.setAttribute('style', [
                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
