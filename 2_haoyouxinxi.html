<!DOCTYPE html>
<!--
    2_haoyouxinxi —— 好友信息填写 / 编辑页（ID 分桶版）。
    入口：
      ① 4_tongxun 通讯录「好友信息」→ 带 ?id=<联系人id>&mode=edit，载入已有数据
      ② 首页/通讯录加号「添加好友」→ 带 ?mode=new，空白草稿
      ③ 直接打开（无参数）→ 兼容旧行为，等同 mode=new

    数据架构（与 1 / 3 / 4 协同）：
      • 全局索引表「联系人索引」= [{ id, 名称, 备注, 头像, 消息, 时间 }, ...]
        —— 1 页会话列表、4 页通讯录均读此表（缺省时用旧「会话列表」迁移一次）
      • 详情按 id 分桶：
          「好友信息_<id>」  → 完整表单对象（含 音色 字段）
          「好友头像_<id>」  → 头像 dataURL
      • 音色配置按 id 分桶：「音色配置_<id>」（键名兼容旧全局键「音色配置」）
      • 保存时：若 mode=new → 生成 id、追加进「联系人索引」；edit → 就地更新索引
      • 昵称/头像/备注 的改动「以详情为准」同步回写索引表，1/4 页自动跟上

    返回：★ 从哪进来就回哪去 —— ?from=<页号> 优先，其次 document.referrer，
          都没有才退回 4_tongxun.html（通讯录）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>好友信息</title>
    <style>
        /* ===== 统一色板（与 1_shouyeyulan.html 完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;

            /* ★ rgb 伴生变量：hex 变量【不能】直接进 rgba()（整条声明会被静默丢弃），
               要带透明度时必须用这批数值三元组。与 1 / 4 / 7 / 8 / 9 页同一套。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; touch-action: pan-y; }
        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100dvh; overflow-x: hidden; touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%; max-width: 430px; height: 100dvh; min-height: 100dvh;
            position: relative; background-color: transparent; overflow: hidden; overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex; flex-direction: column; touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            -webkit-overflow-scrolling: touch;
        }
        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; pointer-events: none;
        }
        .全局白色遮罩 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--panel), 0.4); z-index: 1; pointer-events: none;
        }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative; z-index: 10; background: rgba(var(--panel), 0.5);
            flex-shrink: 0; padding-bottom: clamp(8px, 2.5vw, 12px);
        }
        .顶部导航栏 {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px); color: var(--ink-2); position: relative;
        }
        .返回按钮 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
        }
        .返回按钮 svg {
            width: clamp(18px, 5vw, 22px); height: clamp(18px, 5vw, 22px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;
        }
        .中间标题 { font-size: clamp(16px, 4.5vw, 18px); font-weight: 600; color: var(--ink); }
        .保存按钮 {
            cursor: pointer; padding: clamp(4px, 1.5vw, 6px) clamp(10px, 3vw, 14px);
            border-radius: 20px; background: rgba(var(--panel), 0.5);
            border: 1px solid rgba(var(--panel), 0.2);
            font-size: clamp(12px, 3.5vw, 14px); font-weight: 500; color: var(--ink-2);
        }

        /* ===== 中间滚动区 ===== */
        .手机界面内容 {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            overscroll-behavior-x: none; overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: clamp(16px, 5vw, 20px);
            position: relative; z-index: 2; background: rgba(var(--panel), 0.04); touch-action: pan-y;
        }

        /* ===== 头像 + 信息 合并行 ===== */
        .头像信息行 {
            display: flex; align-items: stretch; gap: clamp(12px, 3.5vw, 16px);
            padding: clamp(14px, 4vw, 18px) clamp(14px, 4.5vw, 18px) clamp(10px, 3vw, 14px);
            margin: clamp(8px, 2.5vw, 12px) clamp(14px, 4.5vw, 18px);
            background: rgba(var(--panel), 0.5); border-radius: 18px;
            box-shadow: 0 8px 32px rgba(var(--shade), 0.04), inset 0 0 0 1px rgba(var(--panel), 0.12);
            overflow-x: hidden;
        }
        .头像左侧 {
            flex-shrink: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .头像上传框 {
            position: relative; width: clamp(64px, 18vw, 80px); height: clamp(64px, 18vw, 80px);
            border-radius: 50%; background: rgba(var(--panel), 0.5);
            border: 2px dashed rgba(var(--panel), 0.2);
            box-shadow: 0 8px 32px rgba(var(--shade), 0.06), inset 0 0 0 1px rgba(var(--panel), 0.12);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden;
        }
        .头像上传框 img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: none; }
        .头像上传框.has-image img { display: block; }
        .头像上传框.has-image .头像占位内容 { display: none; }
        .头像占位内容 {
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-3);
        }
        .头像相机图标 {
            width: clamp(18px, 5vw, 24px); height: clamp(18px, 5vw, 24px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5;
        }
        .头像提示文字 { font-size: clamp(8px, 2vw, 9px); color: var(--ink-4); margin-top: 2px; }

        .信息右侧 { flex: 1; min-width: 0; width: 100%; display: flex; flex-direction: column; gap: clamp(6px, 1.8vw, 10px); justify-content: center; }
        .昵称行 { display: flex; align-items: center; gap: clamp(6px, 2vw, 10px); }
        .昵称行 .表单标签 { flex-shrink: 0; font-size: clamp(12px, 3.2vw, 13px); font-weight: 500; color: var(--ink-2); }
        .昵称行 .表单输入 {
            flex: 1; padding: clamp(4px, 1.2vw, 6px) clamp(8px, 2.5vw, 10px);
            border-radius: 10px; border: 1px solid rgba(var(--panel), 0.15);
            background: rgba(var(--panel), 0.5); font-size: clamp(13px, 3.5vw, 14px);
            color: var(--ink-2); outline: none; font-family: inherit;
        }
        .昵称行 .表单输入:focus { border-color: rgba(var(--line), 0.6); background: rgba(var(--panel), 0.1); box-shadow: 0 0 0 3px rgba(var(--line), 0.1); }
        .昵称行 .表单输入::placeholder { color: var(--ink-4); }

        .基础信息迷你网格 { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(4px, 1.2vw, 8px); width: 100%; }
        .迷你信息项 { display: flex; align-items: center; gap: clamp(4px, 1.2vw, 8px); min-width: 0; overflow-x: hidden; }
        .迷你信息项.性别项 { grid-column: 1 / -1; }
        .迷你信息项 .迷你标签 { font-size: clamp(9px, 2.5vw, 10px); font-weight: 500; color: var(--ink-3); flex-shrink: 0; letter-spacing: 0.5px; }
        .迷你信息项 .迷你输入 {
            flex: 1; min-width: 0; width: 0; padding: clamp(3px, 1vw, 5px) clamp(6px, 1.8vw, 8px);
            border-radius: 8px; border: 1px solid rgba(var(--panel), 0.15);
            background: rgba(var(--panel), 0.5); font-size: clamp(11px, 3vw, 12px);
            color: var(--ink-2); outline: none; font-family: inherit;
        }
        .迷你信息项 .迷你输入:focus { border-color: rgba(var(--line), 0.5); background: rgba(var(--panel), 0.1); box-shadow: 0 0 0 3px rgba(var(--line), 0.08); }
        .迷你信息项 .迷你输入::placeholder { color: var(--ink-4); }

        .迷你信息项 .迷你输入[type="date"] { padding-right: 6px; cursor: pointer; }
        .迷你信息项 .迷你输入[type="date"]::-webkit-calendar-picker-indicator { opacity: 0; width: 20px; height: 20px; cursor: pointer; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
        .迷你信息项:has(> input[type="date"]) { position: relative; }
        .迷你信息项:has(> input[type="date"]) .迷你标签 { font-size: clamp(10px, 2.8vw, 12px); }
        .迷你信息项:has(> input[type="date"]) .迷你输入 { font-size: clamp(11px, 3vw, 13px); padding-right: 28px; }
        .生日日历图标 {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; fill: none; stroke: rgba(var(--line), 0.5);
            stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; pointer-events: none;
        }
        .迷你信息项:has(> input[type="date"]:focus) .生日日历图标 { stroke: rgba(var(--line), 0.8); }
        .迷你信息项.生日项 { grid-column: 1 / -1; }
        .迷你信息项 .生日输入显示 { cursor: pointer; }

        /* ===== 自定义日历弹窗 ===== */
        .日历弹窗遮罩 {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 16, 24, 0.5); z-index: 9999;
            display: none; justify-content: center; align-items: center; opacity: 0; padding: 20px;
        }
        .日历弹窗遮罩.显示 { display: flex; opacity: 1; }
        .日历弹窗 {
            background: rgba(var(--panel), 0.9); border-radius: 24px;
            padding: clamp(16px, 4vw, 22px); width: clamp(280px, 90vw, 340px);
            box-shadow: 0 20px 60px rgba(var(--shade), 0.2), inset 0 0 0 1px rgba(var(--panel), 0.3);
            border: 1px solid rgba(var(--panel), 0.4); transform: scale(0.9) translateY(10px);
        }
        .日历弹窗遮罩.显示 .日历弹窗 { transform: scale(1) translateY(0); }
        .日历头部 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .日历导航按钮 {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.5); color: var(--ink-2);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .日历年月 { font-size: clamp(15px, 4vw, 17px); font-weight: 600; color: var(--ink); letter-spacing: 0.5px; }
        .日历星期头 { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
        .日历星期 { text-align: center; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 4px 0; }
        .日历网格 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
        .日历日期 {
            width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: clamp(13px, 3.5vw, 14px); color: var(--ink);
            cursor: pointer; border: none; background: transparent; font-family: inherit; font-weight: 400;
        }
        .日历日期.今天 { color: var(--accent); font-weight: 500; }
        .日历日期.选中 { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(var(--shade), 0.16); }
        .日历日期.其他月 { color: var(--ink-4); }
        .日历日期.其他月.选中 { color: #fff; }
        .日历底部 { display: flex; justify-content: space-between; gap: 10px; }
        .日历今日按钮 {
            flex: 1; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.5); color: var(--ink-2); font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: inherit;
        }
        .日历确定按钮 {
            flex: 1; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--accent);
            background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: inherit;
        }
        .日历确定按钮:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 性别迷你选择器 */
        .性别迷你选择器 {
            display: flex; gap: clamp(1px, 0.3vw, 3px); background: rgba(var(--panel), 0.5);
            border-radius: 8px; border: 1px solid rgba(var(--panel), 0.1); padding: 2px;
            width: 100%; max-width: 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .性别迷你选项 {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: clamp(1px, 0.3vw, 3px);
            padding: clamp(1px, 0.4vw, 3px) clamp(2px, 0.6vw, 5px); border-radius: 6px;
            font-size: clamp(9px, 2.2vw, 10px); color: var(--ink-3); cursor: pointer;
            position: relative; overflow: hidden; white-space: nowrap; min-width: 0; flex-shrink: 1; width: 0;
        }
        .性别迷你选项::before { content: ''; position: absolute; inset: 0; background: rgba(var(--panel), 0.08); border-radius: 6px; opacity: 0; }
        .性别迷你选项 input[type="radio"] { display: none; }
        .性别迷你标记 { width: clamp(8px, 2.2vw, 10px); height: clamp(8px, 2.2vw, 10px); border-radius: 50%; border: 2px solid rgba(var(--line), 0.4); background: transparent; flex-shrink: 0; }
        .性别迷你选项 input[type="radio"]:checked + .性别迷你标记 { background: rgba(var(--line), 0.6); border-color: rgba(var(--line), 0.6); }
        .性别迷你选项:has(input[type="radio"]:checked) { color: var(--ink-2); font-weight: 500; }
        .性别迷你文字 { white-space: nowrap; }

        /* ===== 表单卡片 ===== */
        .表单卡片 {
            margin: clamp(8px, 2.5vw, 12px) clamp(14px, 4.5vw, 18px);
            background: rgba(var(--panel), 0.5); border-radius: 18px;
            padding: clamp(14px, 4vw, 18px);
            box-shadow: 0 8px 32px rgba(var(--shade), 0.04), inset 0 0 0 1px rgba(var(--panel), 0.12);
        }
        .表单组 { margin-bottom: clamp(12px, 3.5vw, 16px); }
        .表单组:last-child { margin-bottom: 0; }
        .表单标签 { display: flex; align-items: center; gap: 6px; font-size: clamp(13px, 3.5vw, 14px); font-weight: 500; color: var(--ink-2); margin-bottom: clamp(6px, 2vw, 8px); }
        .表单标签 svg { width: clamp(14px, 4vw, 16px); height: clamp(14px, 4vw, 16px); fill: none; stroke: var(--ink-3); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
        .表单输入 {
            width: 100%; padding: clamp(8px, 2.5vw, 10px) clamp(12px, 3.5vw, 14px);
            border-radius: 12px; border: 1px solid rgba(var(--panel), 0.15);
            background: rgba(var(--panel), 0.5); font-size: clamp(13px, 3.5vw, 14px);
            color: var(--ink-2); outline: none; font-family: inherit;
        }
        .表单输入:focus { border-color: rgba(var(--line), 0.6); background: rgba(var(--panel), 0.1); box-shadow: 0 0 0 3px rgba(var(--line), 0.1); }
        .表单输入::placeholder { color: var(--ink-4); }
        .表单文本域 { resize: vertical; min-height: clamp(60px, 18vw, 80px); line-height: 1.6; }
        .分割线 { height: 1px; background: rgba(var(--panel), 0.5); margin: clamp(10px, 3vw, 14px) 0; }

        /* ===== 性格标签 ===== */
        .标签输入区 { display: flex; flex-wrap: wrap; gap: clamp(4px, 1.5vw, 6px); align-items: center; }
        .标签 {
            background: rgba(var(--panel), 0.5); padding: clamp(3px, 1vw, 4px) clamp(8px, 2.5vw, 10px);
            border-radius: 999px; font-size: clamp(11px, 3vw, 12px); color: var(--ink-2);
            display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(var(--panel), 0.1);
        }
        .标签删除 { width: clamp(14px, 4vw, 16px); height: clamp(14px, 4vw, 16px); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-4); cursor: pointer; }
        .标签删除 svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
        .标签添加按钮 {
            padding: clamp(3px, 1vw, 4px) clamp(8px, 2.5vw, 10px); border-radius: 999px;
            border: 1.5px dashed rgba(var(--line), 0.5); background: rgba(var(--panel), 0.5);
            color: var(--ink-4); font-size: clamp(11px, 3vw, 12px); cursor: pointer;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .标签添加按钮 svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
        .标签输入框 { flex: 1; min-width: 80px; padding: clamp(4px, 1.2vw, 5px) clamp(8px, 2.5vw, 10px); border-radius: 999px; border: 1px solid rgba(var(--panel), 0.15); background: rgba(var(--panel), 0.5); font-size: clamp(12px, 3.2vw, 13px); outline: none; color: var(--ink-2); }
        .标签输入框:focus { border-color: rgba(var(--line), 0.6); background: rgba(var(--panel), 0.1); box-shadow: 0 0 0 3px rgba(var(--line), 0.1); }
        .标签输入框::placeholder { color: var(--ink-4); }

        /* ===== 人物属性 ===== */
        .属性标签组 { display: flex; flex-wrap: nowrap; align-items: center; gap: clamp(3px, 0.8vw, 4px); overflow-x: auto; scrollbar-width: none; }
        .属性标签组::-webkit-scrollbar { display: none; }
        .属性标签 {
            font-size: clamp(10px, 2.6vw, 12px); padding: clamp(3px, 0.8vw, 4px) clamp(5px, 1.4vw, 8px);
            border-radius: 999px; color: var(--ink-3); background: rgba(var(--panel), 0.5);
            border: 1px solid rgba(var(--panel), 0.15); cursor: pointer; user-select: none;
            white-space: nowrap; flex-shrink: 1; line-height: 1.4;
        }
        .属性标签.选中 { background: rgba(var(--line), 0.25); border-color: rgba(var(--line), 0.5); color: var(--ink); font-weight: 500; box-shadow: 0 2px 8px rgba(var(--line), 0.12); }

        /* ===== 音色配置 ===== */
        .音色配置组 { cursor: pointer; }
        .音色配置行 {
            display: flex; align-items: center; justify-content: space-between;
            gap: clamp(8px, 2.5vw, 12px); padding: clamp(10px, 3vw, 14px) clamp(12px, 3.5vw, 16px);
            border-radius: 14px; background: rgba(var(--panel), 0.5); border: 1px solid rgba(var(--panel), 0.15); min-width: 0;
        }
        .音色配置信息 { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
        .音色配置状态 { font-size: clamp(9px, 2.4vw, 10px); letter-spacing: 0.5px; color: var(--ink-4); font-weight: 500; }
        .音色配置状态.已启用 { color: var(--accent); font-weight: 600; }
        .音色配置名称 { font-size: clamp(12px, 3.4vw, 14px); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .音色配置箭头 { flex-shrink: 0; width: clamp(18px, 5vw, 22px); height: clamp(18px, 5vw, 22px); color: var(--ink-4); }
        .音色配置箭头 svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ===== 裁剪弹窗 ===== */
        .裁剪弹窗遮罩 {
            position: fixed; inset: 0; z-index: 200; background: rgba(20, 20, 26, 0.92);

        /* transform-origin 必须是左上角：tx/ty 的居中公式按「左上角固定」推导，
           若用默认的中心原点，大图会被推到取景框外 → 裁剪预览一片空白 */
        .裁剪视口 img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; pointer-events: none; }

           调用 .click() 无效 —— 元素已从渲染树移除，无法接收用户手势。
           改用「仍在渲染树中但不可见」的标准写法，保证 click() 在所有浏览器都能唤起。 */
        .视觉隐藏文件输入 {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
            opacity: 0; pointer-events: none;

        .来源遮罩 {

  <script>
    'use strict';

    /* ============================================================
     *  全局工具
     * ============================================================ */
    const 索引键 = '联系人索引';
    const 占位头像 = '2【图片】/圆形头像1.png';

    function 读(键) { try { return localStorage.getItem(键); } catch (e) { return null; } }
    function 写(键, 值) { try { localStorage.setItem(键, 值); return true; } catch (e) { return false; } }
    function 删(键) { try { localStorage.removeItem(键); } catch (e) {} }

    // 生成短唯一 id（时间戳 + 随机）
    function 生成ID() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    let toastTimer = null;
    function showToast(消息) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = 消息; el.classList.add('显示');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('显示'), 1600);
    }

    /* ============================================================
     *  索引表管理（1 / 4 页共用）
     *  { id, 名称, 备注, 头像, 消息, 时间 }
     * ============================================================ */
    function 读索引() {
      try { const v = JSON.parse(读(索引键)); if (Array.isArray(v)) return v; } catch (e) {}
      return null;
    }
    function 写索引(列表) { 写(索引键, JSON.stringify(列表)); }

    // 迁移：若没有索引表，但有旧「会话列表」，则迁移一次
    function 迁移旧数据() {
      // 注意：必须判 length 而不只是「索引存在」——
      //   索引为空数组 [] 同样需要迁移，否则永远无法从旧「会话列表」恢复。
      //   （此逻辑与 4_tongxun 的 迁移索引() 保持一致，改动请两处同步）
      const 已有 = 读索引();
      if (Array.isArray(已有) && 已有.length) return;
      try {
        const 旧 = JSON.parse(读('会话列表') || '[]');
        if (Array.isArray(旧) && 旧.length) {
          const 列表 = 旧.map((项, i) => ({
            id: 项.id || ('c_legacy_' + i),
            名称: 项.名称 || '',
            备注: 项.备注 || '',
            头像: 项.头像 || 占位头像,
            消息: 项.消息 || '',
            时间: 项.时间 || ''
          })).filter(项 => 项.名称);
          写索引(列表);
        }
      } catch (e) {}
    }

    function 查找索引项(id) {
      const 列表 = 读索引() || [];
      return 列表.find(项 => 项.id === id) || null;
    }

    /* ============================================================
     *  移动端图片处理（相册 / 拍照 → 规范化 → 送裁剪）
     *  ------------------------------------------------------------
     *  手机原图有三个坑，不处理就会在真机上翻车：
     *    ① iOS 拍照默认 HEIC 格式 —— 除 Safari 外浏览器普遍无法解码，
     *       直接表现为选完图没反应。只能提前识别并给出可操作的引导。
     *    ② EXIF orientation —— 竖拍照片在 <img> 里显示正常，但一旦
     *       drawImage 到 canvas 就会躺倒，裁剪产物是歪的。
     *    ③ 超大图（4000×3000 起）转 base64 会撑爆移动端内存，
     *       iOS Safari 也有约 1600 万像素的解码上限，必须先降采样。
     * ============================================================ */

    // iOS 安全解码上限（像素数），超过先降采样
    const 解码像素上限 = 16000000;

    // HEIC / HEIF：iOS 相机默认格式，浏览器基本解不了
    const HEIC正则 = /^image\/hei(c|f)$/i;
    const HEIC扩展名正则 = /\.hei(c|f)$/i;
    function 是HEIC(文件) {
      return HEIC正则.test(文件.type || '') || HEIC扩展名正则.test(文件.name || '');
    }

    // 读 EXIF orientation（1–8）。只读前 128KB —— EXIF 必定落在文件头部，
    // 不必把十几 MB 的原图整个读进内存。
    function 读方向(文件) {
      return new Promise(解决 => {
        if (!/^image\/(jpeg|jpg)/i.test(文件.type || '')) return 解决(1);
        const 读 = new FileReader();
        读.onload = (e) => {
          try {
            const 视 = new DataView(e.target.result);
            if (视.getUint16(0, false) !== 0xFFD8) return 解决(1);   // 不是 JPEG
            let 偏 = 2;
            const 长 = 视.byteLength;
            while (偏 + 4 <= 长) {
              if (视.getUint8(偏) !== 0xFF) { 偏++; continue; }
              const 标记 = 视.getUint8(偏 + 1);
              // 无长度字段的标记
              if (标记 === 0xD8 || 标记 === 0x01 || (标记 >= 0xD0 && 标记 <= 0xD7)) { 偏 += 2; continue; }
              if (标记 === 0xD9 || 标记 === 0xDA) break;              // 进入压缩数据，后面没有 EXIF
              const 段长 = 视.getUint16(偏 + 2, false);

        源宽 = Math.min(原宽 - sx, 源宽);
        源高 = Math.min(原高 - sy, 源高);

        // 头像输出圆形透明 PNG（480，省存储）
        const 尺寸 = 480;
        const 画布 = document.createElement('canvas');
        画布.width = 尺寸;
        画布.height = 尺寸;
        const 笔 = 画布.getContext('2d');
        笔.save();
        笔.beginPath();
        笔.arc(尺寸 / 2, 尺寸 / 2, 尺寸 / 2, 0, Math.PI * 2);
        笔.closePath();
        笔.clip();
        笔.drawImage(裁剪图, sx, sy, 源宽, 源高, 0, 0, 尺寸, 尺寸);
        笔.restore();

        const dataURL = 画布.toDataURL('image/png');
        当前头像DataURL = dataURL;
        图片.src = dataURL;
        图片.style.display = 'block';
        框.classList.add('has-image');
        关闭弹窗();
      });
    })();

    /* ============================================================
     *  2. 自定义日历
     * ============================================================ */
    (function () {
      const 遮罩 = document.getElementById('日历遮罩');
      const 年月 = document.getElementById('日历年月');
      const 网格 = document.getElementById('日历网格');
      const 显示框 = document.getElementById('生日显示框');
      const 隐藏框 = document.getElementById('生日隐藏框');
      const 确定 = document.getElementById('日历确定');
      let 视图年, 视图月, 选中日期 = null;

      function 打开() {
        遮罩.classList.add('显示');
        const 初始 = (隐藏框.value && 解析日期(隐藏框.value)) || new Date();
        视图年 = 初始.getFullYear(); 视图月 = 初始.getMonth();
        渲染();
      }
      window.打开日历 = 打开;

      // 日期比较统一走 YYYY-MM-DD 键：
      //   直接用 getTime() 会被时分秒干扰 —— 点「今日」时 new Date() 带当前时刻，
      //   而格子里的日期是当天零点，两者永远不相等，选中态就不会高亮。
      function 日期键(日期) {
        if (!日期) return '';
        return 日期.getFullYear() + '-' +
               String(日期.getMonth() + 1).padStart(2, '0') + '-' +
               String(日期.getDate()).padStart(2, '0');
      }

      // 按【本地时区】解析 YYYY-MM-DD。
      //   不能直接 new Date('2000-01-01') —— ISO 字符串会被当成 UTC 午夜，
      //   在 UTC-x 的时区里会退回到前一天（1999-12-31），生日凭空差一天。
      function 解析日期(值) {
        const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(值 == null ? '' : 值).trim());
        if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
        const d = new Date(值);
        return isNaN(d.getTime()) ? null : d;
      }

      function 渲染() {
        年月.textContent = 视图年 + ' 年 ' + (视图月 + 1) + ' 月';
        网格.innerHTML = '';
        const 首日 = new Date(视图年, 视图月, 1).getDay();
        const 天数 = new Date(视图年, 视图月 + 1, 0).getDate();
        const 上月天数 = new Date(视图年, 视图月, 0).getDate();
        const 今天键 = 日期键(new Date());
        const 单元格 = [];
        for (let i = 首日 - 1; i >= 0; i--) {
          单元格.push({ 日: 上月天数 - i, 其他月: true });
        }
        for (let d = 1; d <= 天数; d++) {
          单元格.push({ 日: d, 其他月: false });
        }
        const 余 = (7 - 单元格.length % 7) % 7;
        for (let i = 1; i <= 余; i++) {
          单元格.push({ 日: i, 其他月: true });
        }
        单元格.forEach(格 => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = '日历日期' + (格.其他月 ? ' 其他月' : '');
          btn.textContent = 格.日;
          const 该日期 = new Date(视图年, 视图月, 格.日);
          if (!格.其他月) {
            if (日期键(该日期) === 今天键) {
              btn.classList.add('今天');
            }
            if (选中日期 && 日期键(选中日期) === 日期键(该日期)) btn.classList.add('选中');
            btn.addEventListener('click', () => {
              选中日期 = 该日期;
              确定.disabled = false;
              渲染();
            });
          }
          if (格.其他月) {
            btn.addEventListener('click', () => {
              视图月 += 格.日 > 15 ? 1 : -1;
              if (视图月 > 11) { 视图月 = 0; 视图年++; }
              if (视图月 < 0) { 视图月 = 11; 视图年--; }
              渲染();
            });
          }
          网格.appendChild(btn);
        });
      }

      document.getElementById('日历上一月').addEventListener('click', () => { 视图月--; if (视图月 < 0) { 视图月 = 11; 视图年--; } 渲染(); });
      document.getElementById('日历下一月').addEventListener('click', () => { 视图月++; if (视图月 > 11) { 视图月 = 0; 视图年++; } 渲染(); });
      // 「今日」：跳回当月并选中当天。选中日期归一到当天零点，保证与格子的日期键一致、能高亮。
      document.getElementById('日历今日').addEventListener('click', () => {
        const 此刻 = new Date();
        视图年 = 此刻.getFullYear();
        视图月 = 此刻.getMonth();
        选中日期 = new Date(此刻.getFullYear(), 此刻.getMonth(), 此刻.getDate());
        确定.disabled = false;
        渲染();
      });

      确定.addEventListener('click', () => {
        if (!选中日期) return;
        const y = 选中日期.getFullYear();
        const m = String(选中日期.getMonth() + 1).padStart(2, '0');
        const d = String(选中日期.getDate()).padStart(2, '0');
        const 值 = y + '-' + m + '-' + d;
        隐藏框.value = 值;
        显示框.value = 值;
        关闭();
      });

      function 关闭() { 遮罩.classList.remove('显示'); }
      遮罩.addEventListener('click', (e) => { if (e.target === 遮罩) 关闭(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && 遮罩.classList.contains('显示')) 关闭(); });

      // 对外接口
      window.设生日 = function (值) {
        隐藏框.value = 值 || '';
        显示框.value = 值 || '';
        选中日期 = 值 ? 解析日期(值) : null;
      };
      window.取生日 = function () { return 隐藏框.value; };

      // 绑定点击
      显示框.addEventListener('click', 打开);
      document.querySelector('.生日日历图标').addEventListener('click', (e) => { e.stopPropagation(); 打开(); });
    })();

          添加按钮.addEventListener('click', () => { 添加(输入.value); 输入.value = ''; });

    (function () {

      window.读音色配置 = function (id) {

        }

      window.取音色配置 = function () {
        // 优先读当前 id 的分桶（新建时为「音色配置_临时」，与 3 页一致）
        const 分桶 = window.读音色配置(当前ID);
        if (分桶) return 分桶;
        // 兜底读旧全局键 —— 但新建模式不能兜底：
        //   全局键里存的是上一位联系人的配置，兜底会让新联系人白白继承别人的音色。
        if (当前模式 !== 'new') {

      window.打开音色配置 = function () {

    (function () {

            列表.push({ id, 名称: 数据.昵称, 备注: '', 头像: 当前头像DataURL || 占位头像, 消息: '', 时间: '' });

        if (当前头像DataURL) {

        // 音色配置：3 页可能写的是分桶键 音色配置_<id>，这里确保 gender 同步
        const 音色 = 数据.音色;

        if (当前模式 === 'new' && !读('好友信息')) 写('好友信息', JSON.stringify(数据));

      function 载入详情(id, 索引项) {

        // 已存的是空壳（无昵称/无世界观/无人物信息/无标签）→ 允许内置档案接管

    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时
 *     把仍在通话中的音乐放出来。全部原因解除才恢复。
 *   ★ 会记住「占用前是否在播」，本来没放音乐就不会凭空启动。
 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);
        })).catch(() => null);
    }

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */
    function 读状态() {
        try { return JSON.parse(localStorage.getItem(状态键) || 'null'); } catch (e) { return null; }
    }

    function 写状态(存) {
        try { localStorage.setItem(状态键, JSON.stringify(存)); } catch (e) {}
    }

    /* ---------------------------------------------------------------
     * 主体
     * ------------------------------------------------------------- */
    const 元素id = '全局音乐播放器';

    /* =========================================================================
     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位
     *
     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */
    const 占用 = new Set();
    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {
        return document.getElementById('音乐播放器') || document.getElementById(元素id);
    }

    const 全局音频 = {
        /** 暂停背景音乐（可重入；同一原因重复调用无害） */
        暂停(原因) {
            const 键 = 原因 || '未命名';
            if (占用.size === 0) {
                const a = 取音频();
                占用前在播 = !!a && !a.paused;
            }
            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */
        恢复(原因) {
            const 键 = 原因 || '未命名';
            if (!占用.has(键)) return;
            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）
            if (!占用前在播) return;                 // 本来就没在播 → 不凭空启动
            const a = 取音频();
            if (a && a.paused) {
                const 试 = a.play();
                if (试 && typeof 试.catch === 'function') 试.catch(() => {});
            }
        },

        /** 强制清掉所有占用（异常路径兜底用） */
        清除() { 占用.clear(); },

        占用中() { return 占用.size > 0; },
        占用表() { return Array.from(占用); },
        是否在播() { const a = 取音频(); return !!a && !a.paused; },
    };
    /* ★ 无论让不让位都挂上：让位时它操作的是 4 页自己的播放器，
       调用方（语音条 / 通话）不必关心自己在哪个页面。 */
    window.全局音频 = 全局音频;

    function 启动() {
        /* ★★ 让位：4 页有完整播放器（#音乐播放器），这里绝不能再建第二个 audio。
              注意 7 页那个是 #语音播放器（点语音消息用的），与本脚本无关，
              各播各的，所以【只】认 #音乐播放器 这一个 id。 */
        if (document.getElementById('音乐播放器')) return;
        /* 防重：脚本万一被引了两次，也只建一个 audio */
        if (document.getElementById(元素id)) return;

        const 存 = 读状态();
        // 没在播（或压根没播过）→ 安静退出，不建元素、不占资源
        if (!存 || !存.播放中 || !存.名) return;

        const 音频 = document.createElement('audio');
        音频.id = 元素id;
        音频.dataset.全局音乐 = '1';        // 便于排查 / 测试定位
        音频.preload = 'metadata';
        document.body.appendChild(音频);

        const 目标 = Math.max(0, Number(存.时间) || 0);
        let 已定位 = false;      // loadedmetadata 只处理一次（切目录会重复触发）
        let 目录序 = 0;
        let 上传链接 = '';

        /* 跳回上次的秒数再播。★ 先 seek 后 play：
           否则会从 0 开始，听感上像换了一首。 */
        音频.addEventListener('loadedmetadata', () => {
            if (已定位) return;
            已定位 = true;
            const 长 = isFinite(音频.duration) ? 音频.duration : 0;
            try {
                音频.currentTime = 长 > 0
                    ? Math.min(目标, Math.max(0, 长 - 0.3))
                    : 目标;
            } catch (e) {}
            续播();
        });

        /* 目录逐个试：与 4 页 载入当前目录() 同款（文件缺失 / 解码失败都能兜住） */
        音频.addEventListener('error', () => {
            if (目录序 < 目录候选.length) {
                音频.src = encodeURI(目录候选[目录序++] + 存.名);
            }
        });

        /* 播完了：不自动切歌（这里没有播放列表），停住并把状态改成「没在播」，
           免得下一次进任意页面又从头播一遍。 */
        音频.addEventListener('ended', () => {
            写状态({ id: 存.id, 名: 存.名, 类型: 存.类型, 时间: 0, 播放中: false });
        });

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */
        function 存一次(播放中) {
            写状态({
                id: 存.id, 名: 存.名, 类型: 存.类型,
                时间: 音频.currentTime || 0,
                /* ★ 同 4 页那个坑：只认真正的布尔。pagehide / beforeunload
                     的监听器会把 Event 对象当第一个参数传进来，
                     `播放中 === undefined` 拦不住它 → `!!Event` = true。 */
                播放中: typeof 播放中 !== 'boolean' ? !音频.paused : 播放中,
            });
        }
        // 播着的时候每秒存一次，中途崩溃 / 强杀也不会丢太多
        setInterval(() => { if (!音频.paused) 存一次(true); }, 1000);
        // 离开页面再存一次：跳转、切后台、关闭三种情况都覆盖
        const 存一次同步 = () => 存一次();
        window.addEventListener('pagehide', 存一次同步);
        window.addEventListener('beforeunload', 存一次同步);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') 存一次同步();
        });

        /* ------------------------------------------------------------
         * 补播：浏览器会拦「没有用户手势」的自动播放，这是硬限制，绕不过去。
         *   策略：
         *     ① 直接播；
         *     ② 被拒 → 【持续】监听用户交互，直到真的播起来才撤监听；
         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没
         *      ready），失败后就再也没机会了 —— 表现正是「切过去没声音」。
         *      必须【成功才停】，这是这段里最要紧的一句。
         * ---------------------------------------------------------- */
        const 事件名 = ['pointerdown', 'touchstart', 'click', 'keydown'];

        function 撤补播() {
            if (!补播中) return;
            补播中 = false;
            事件名.forEach(n => document.removeEventListener(n, 试补播, true));
            document.removeEventListener('visibilitychange', 见可见);
            收提示();
        }

        function 见可见() {
            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();                     // 老浏览器无 Promise：当成功处理
        }

        /** 被拦 → 挂持续监听 + 显示提示条 */
        function 展提示() {
            if (!补播中) {
                补播中 = true;
                /* ★ 捕获阶段：冒泡阶段可能被页面自己的 stopPropagation 吃掉 */
                事件名.forEach(n => document.addEventListener(n, 试补播, true));
                document.addEventListener('visibilitychange', 见可见);
            }
            亮提示();
        }

        /* ---- 提示条：自建，不依赖各页自己的 toast 实现（各页不统一）---- */
        let 提示元素 = null;
        function 亮提示() {
            if (提示元素) return;
            const 条 = document.createElement('div');
            条.id = '全局音乐提示';
            条.textContent = '♪ 音乐已就绪，点一下继续播放';
            // 样式全内联 + !important：各页 CSS 互不统一，不这样会被盖掉 / 变形
            条.setAttribute('style', [
                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
</body>
</html>
