<!DOCTYPE html>
<!--
    20_tupianAPI —— 图片生成 API 配置（填网址 + 密钥 → 自动读模型 → 选模型 → 全站生效）

    入口：8_wode 设置区「图片API」→ 20_tupianAPI.html?from=8
    出口：保存 / 返回 → 按 ?from= 回 8 页（缺省也回 8 页）

    ★★ 数据契约：localStorage「图片API配置」
        { 网址, 密钥, 模型, 模型列表, 尺寸, 时间 }
        7_liaotian（聊天里角色按场景自主发图）与 5_dongtai（角色发图片朋友圈）都读这个键 ——
        本页是【唯一写入方】，字段结构改了那两处会一起坏，务必同步改。
      ★ 与「文本API配置」是【两个独立的键】：文本归文本、图片归图片，
        可以一个配了一个没配，互不干扰。

    ★ 交互流程（照各家 API 控制台的直觉）：
        ① 填接口地址（如 https://api.openai.com/v1 或自家兼容层域名）
        ② 填密钥 → 防抖后【自动】拉 /models，不用手点
        ③ 读到就列出模型，点一下选中；地址或密钥改了会重新读
        ④ 保存 → 写盘 → 7 页聊天、5 页动态立刻用这个模型

    ★ 地址规范化复用 图片助手.拉模型（内联在页尾，与 5 / 7 页同一份）：
        缺协议补 https://、尾部斜杠去掉、带不带 /v1 都试，两种拼法都 404 才报错。
      ★★ 生图服务常常把几十个【纯文本模型】也一起列出来，全列出来等于没法选 ——
        所以列表做了过滤：像生图的排前面，明确是纯文本的排掉。
        过滤完为空（说明这家命名不按套路）就原样全列，让用户自己挑。

    ★ 安全：密钥只存在【本机 localStorage】，只发给用户自己填的那个地址。
        本页不做任何第三方上传；「断开连接」会把它从本机彻底删掉。

    风格：与 1~18 页统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>图片生成 API</title>
    <style>
        /* ===== 统一色板（与 1~18 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* ★★ hex 变量【不能】进 rgba() —— 会被整条丢弃。
               要带透明度就用下面这批数值形式的伴生变量。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; touch-action: pan-y; }
        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2); display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; overflow: hidden; overflow-x: hidden; touch-action: pan-y;
        }
        .手机主题背景容器 {
            width: 100%; max-width: 430px; height: 100dvh; min-height: 100dvh;
            position: relative; background-color: transparent;
            overflow: hidden; overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex; flex-direction: column; touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }
        .主题背景图片 {
            width: 100%; height: 100dvh; object-fit: cover; object-position: center;
            display: block; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
        }
        .全局白色遮罩 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45); z-index: 1; pointer-events: none;
        }

        /* ===== 顶栏 ===== */
        .顶部固定区 {
            position: relative; z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            flex-shrink: 0; padding-bottom: clamp(6px, 2vw, 10px);
        }
        .顶部导航栏 {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px); color: var(--ink-2); position: relative;
        }
        .返回按钮 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }
        .返回按钮 svg {
            width: clamp(17px, 4.8vw, 20px); height: clamp(17px, 4.8vw, 20px);
            fill: none; stroke: var(--ink); stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .中间标题 {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; color: var(--ink);
            letter-spacing: .5px; white-space: nowrap;
        }
        .右侧占位 { width: clamp(24px, 7vw, 28px); flex-shrink: 0; }

        /* ===== 滚动区 ===== */
        .手机界面内容 {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative; z-index: 5;
            padding-bottom: clamp(96px, 26vw, 120px);
            /* ★ 与扭蛋页同款：藏滚动条但【保留下滑】 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .分区标题 {
            padding: clamp(12px, 3.4vw, 16px) clamp(14px, 4vw, 18px) clamp(6px, 1.8vw, 8px);
            font-size: clamp(11.5px, 3.3vw, 12.5px); color: var(--ink-3);
        }
        .卡片 {
            margin: 0 clamp(12px, 4vw, 16px) clamp(9px, 2.6vw, 12px);
            background: rgba(var(--panel), var(--glass));
            border-radius: 14px; overflow: hidden;
        }
        .行 {
            display: flex; align-items: center; gap: 10px;
            padding: clamp(11px, 3.2vw, 14px) clamp(13px, 3.6vw, 16px);
        }
        .行 + .行 { border-top: 1px solid rgba(var(--line), 0.18); }
        .行标签 {
            font-size: clamp(12.5px, 3.5vw, 14px); color: var(--ink-3);
            flex-shrink: 0; width: clamp(58px, 16vw, 70px);
        }
        .文本输入 {
            flex: 1; min-width: 0; border: none; outline: none; background: transparent;
            font-size: clamp(13px, 3.6vw, 14.5px); color: var(--ink);
            font-family: inherit;
        }
        .文本输入::placeholder { color: var(--ink-4); }

        /* 密钥行：眼睛图标切换明文 */
        .眼睛钮 {
            flex-shrink: 0; cursor: pointer; width: clamp(20px, 5.8vw, 23px);
            height: clamp(20px, 5.8vw, 23px);
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; color: var(--ink-3);
        }
        .眼睛钮 svg {
            width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ===== 状态行：读模型的实时反馈 ===== */
        .状态行 {
            display: flex; align-items: center; gap: 7px;
            padding: clamp(9px, 2.6vw, 12px) clamp(13px, 3.6vw, 16px);
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-3);
        }
        .状态点 {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
            background: rgba(var(--line), 0.6);
        }
        .状态行.成功 .状态点 { background: #4a9c6d; }
        .状态行.失败 .状态点 { background: #c0392b; }
        .状态行.读取中 .状态点 { background: var(--accent); animation: 呼吸 1s ease-in-out infinite; }
        @keyframes 呼吸 { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
        .状态行.成功 { color: #3d7f59; }
        .状态行.失败 { color: #c0392b; }

        .重读钮 {
            margin-left: auto; flex-shrink: 0; cursor: pointer;
            padding: 3px clamp(8px, 2.4vw, 11px); border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.34);
            background: rgba(var(--panel), 0.5);
            font-size: clamp(11px, 3.1vw, 12px); color: var(--ink-2);
            font-family: inherit; -webkit-tap-highlight-color: transparent;
        }
        .重读钮:disabled { opacity: .45; cursor: default; }

        /* ===== 模型列表 ===== */
        .模型行 {
            display: flex; align-items: center; gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(10px, 2.9vw, 13px) clamp(13px, 3.6vw, 16px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .模型行 + .模型行 { border-top: 1px solid rgba(var(--line), 0.18); }
        .模型行:active { background: rgba(var(--line), 0.08); }
        .模型圈 {
            width: clamp(18px, 5.2vw, 21px); height: clamp(18px, 5.2vw, 21px);
            border-radius: 50%; flex-shrink: 0;
            border: 1.6px solid rgba(var(--line), 0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .模型行.选中 .模型圈 {
            background: rgba(var(--accent-rgb), 0.92);
            border-color: rgba(var(--accent-rgb), 0.92);
        }
        .模型圈 svg { width: 66%; height: 66%; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
        .模型行.选中 .模型圈 svg { opacity: 1; }
        .范围说明 {
            font-size: clamp(12.5px, 3.5vw, 14px); color: var(--ink-2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .模型名 {
            font-size: clamp(13px, 3.7vw, 14.5px); color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .空态 {
            padding: clamp(18px, 5vw, 26px) clamp(14px, 4vw, 18px);
            text-align: center; font-size: clamp(12.5px, 3.6vw, 14px); color: var(--ink-3);
            line-height: 1.6;
        }

        .提示文 {
            padding: 0 clamp(14px, 4vw, 18px);
            font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-4); line-height: 1.6;
        }

        /* ===== 已配置横幅 ===== */
        .已配横幅 {
            margin: 0 clamp(12px, 4vw, 16px) clamp(9px, 2.6vw, 12px);
            padding: clamp(9px, 2.6vw, 12px) clamp(13px, 3.6vw, 16px);
            border-radius: 14px;
            background: rgba(74, 156, 109, 0.12);
            font-size: clamp(11.5px, 3.3vw, 13px); color: #3d7f59;
            display: flex; align-items: center; gap: 7px;
        }
        .已配横幅.隐藏 { display: none; }
        .已配横幅 b { font-weight: 600; }

        /* ===== 底部 ===== */
        .底部条 {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
            padding: clamp(9px, 2.6vw, 13px) clamp(12px, 4vw, 16px);
            padding-bottom: calc(clamp(9px, 2.6vw, 13px) + env(safe-area-inset-bottom, 0px));
            background: rgba(var(--panel), 0.86);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
            border-top: 1px solid rgba(var(--line), 0.2);
        }
        .保存钮 {
            width: 100%; padding: clamp(10px, 2.9vw, 13px);
            border: none; border-radius: 999px;
            background: rgba(var(--accent-rgb), 0.92); color: #fff;
            font-size: clamp(13.5px, 3.9vw, 15px); font-weight: 600;
            cursor: pointer; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .保存钮:active { background: rgba(var(--accent-ink-rgb), 0.92); }
        .保存钮:disabled { background: rgba(var(--line), 0.38); cursor: default; }
        .断开钮 {
            width: 100%; margin-top: clamp(7px, 2vw, 9px); padding: clamp(8px, 2.4vw, 11px);
            border: none; border-radius: 999px; background: transparent;
            color: #c0392b; font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer; font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .断开钮.隐藏 { display: none; }

        .toast {
            position: absolute; left: 50%; bottom: clamp(90px, 25vw, 120px);
            transform: translateX(-50%) translateY(8px);
            background: rgba(var(--shade), 0.86); color: #fff;
            padding: clamp(8px, 2.3vw, 10px) clamp(14px, 4vw, 18px);
            border-radius: 999px; font-size: clamp(12px, 3.4vw, 13.5px);
            opacity: 0; pointer-events: none; transition: opacity .24s, transform .24s;
            z-index: 400; white-space: nowrap; max-width: 86%;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
<div class="手机主题背景容器">
    <img class="主题背景图片" id="主题背景图片" src="2【图片】/默认主题背景.png" alt="手机主题背景占位图">
    <div class="全局白色遮罩"></div>

    <div class="顶部固定区">
        <div class="顶部导航栏">
            <div class="返回按钮" id="返回按钮" role="button" aria-label="返回">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </div>
            <div class="中间标题">图片生成 API</div>
            <div class="右侧占位"></div>
        </div>
    </div>

    <div class="手机界面内容">
        <div class="已配横幅 隐藏" id="已配横幅">
            <span>✓</span><span>已启用：<b id="已配模型名"></b></span>
        </div>

        <div class="分区标题">接口</div>
        <div class="卡片">
            <div class="行">
                <span class="行标签">接口地址</span>
                <input class="文本输入" id="网址输入" type="text"
                       placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false" />
            </div>
            <div class="行">
                <span class="行标签">密钥</span>
                <input class="文本输入" id="密钥输入" type="password"
                       placeholder="sk-..." autocomplete="off" spellcheck="false" />
                <span class="眼睛钮" id="眼睛钮" role="button" aria-label="显示密钥">
                    <svg viewBox="0 0 24 24">
                        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="2.6"></circle>
                    </svg>
                </span>
            </div>
        </div>
        <div class="提示文">地址可以带 /v1 也可以不带，会自动补全并试两种拼法。密钥只存在本机，只发给你填的这个地址。</div>

        <div class="分区标题">可用模型</div>
        <div class="卡片">
            <div class="状态行" id="状态行">
                <span class="状态点"></span>
                <span id="状态文">填入密钥后自动读取</span>
                <button class="重读钮" id="重读钮" type="button" disabled>重新读取</button>
            </div>
            <div id="模型卡"></div>
        </div>
        <div class="提示文">列表优先显示像「生图」的模型；如果家服务命名特殊导致全被过滤掉，会原样列出全部，你自己挑一个能出图的。没读到先检查地址与密钥，跨域被拦需要在服务端开 CORS。</div>

        <div class="分区标题">出图尺寸</div>
        <div class="卡片">
            <div class="行">
                <span class="行标签">尺寸</span>
                <select class="文本输入" id="尺寸选择">
                    <option value="1024x1024">方图 1024×1024</option>
                    <option value="1024x1536">竖图 1024×1536</option>
                    <option value="1536x1024">横图 1536×1024</option>
                    <option value="512x512">小方图 512×512</option>
                    <option value="">不传（用服务端默认）</option>
                </select>
            </div>
        </div>
        <div class="提示文">各家支持的尺寸不一样，不支持时接口会报错 —— 换一个试试即可。</div>

        <div class="分区标题">生效范围</div>
        <div class="卡片">
            <div class="行"><span class="行标签">聊天</span><span class="范围说明">角色按对话场景自主发图（用户不用代劳）</span></div>
            <div class="行"><span class="行标签">动态</span><span class="范围说明">角色自主发图片朋友圈</span></div>
        </div>
        <!-- ★ 旧做法「输入框旁「生图」按钮，手动生成后发出」已移除 ——
             那是【用户替角色操作】，图里没有角色自己的主动性。
             现在判定权在角色：按对话场景自己决定发不发图，没接 API 就发占位图。
             别再加回那个按钮。 -->
        <div class="提示文">没配或请求失败时，聊天改发占位图、动态退回纯文字，都不会留空白。</div>
    </div>

    <div class="底部条">
        <button class="保存钮" id="保存钮" type="button" disabled>保存</button>
        <button class="断开钮 隐藏" id="断开钮" type="button">断开连接</button>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
(function () {
    'use strict';

    const 配置键 = '图片API配置';
    const 网址输入 = document.getElementById('网址输入');
    const 密钥输入 = document.getElementById('密钥输入');
    const 尺寸选择 = document.getElementById('尺寸选择');
    const 状态行 = document.getElementById('状态行');
    const 状态文 = document.getElementById('状态文');
    const 重读钮 = document.getElementById('重读钮');
    const 模型卡 = document.getElementById('模型卡');
    const 保存钮 = document.getElementById('保存钮');
    const 断开钮 = document.getElementById('断开钮');
    const 已配横幅 = document.getElementById('已配横幅');
    const 已配模型名 = document.getElementById('已配模型名');
    const toast = document.getElementById('toast');

    let 模型表 = [];        // [{id,名}]
    let 选中模型 = '';
    let 忙碌 = false;       // 正在拉模型 → 忽略重复触发
    let 防抖计时 = null;

    /* ---------- 存档 ---------- */
    function 读JSON(键, 兜) {
        try { const v = JSON.parse(localStorage.getItem(键)); return v == null ? 兜 : v; }
        catch (e) { return 兜; }
    }
    function 写JSON(键, 值) {
        try { localStorage.setItem(键, JSON.stringify(值)); } catch (e) {}
    }

    /* ---------- 轻提示 ---------- */
    let 提示计时 = null;
    function 提示(文) {
        toast.textContent = 文;
        toast.classList.add('显示');
        clearTimeout(提示计时);
        提示计时 = setTimeout(() => toast.classList.remove('显示'), 1900);
    }

    /* ---------- 状态行 ---------- */
    function 置状态(类, 文) {
        状态行.className = '状态行' + (类 ? ' ' + 类 : '');
        状态文.textContent = 文;
    }

    /* ---------- 渲染模型列表 ---------- */
    function 渲染模型() {
        if (!模型表.length) {
            模型卡.innerHTML = '<div class="空态">'
                + (忙碌 ? '正在读取模型…' : '还没有读到生图模型')
                + '</div>';
            return;
        }
        模型卡.innerHTML = 模型表.map(m => {
            const 中 = m.id === 选中模型;
            const 勾 = '<svg viewBox="0 0 24 24" aria-hidden="true">'
                + '<polyline points="4.5 12.5 9.5 17.5 19.5 7"></polyline></svg>';
            return '<div class="模型行' + (中 ? ' 选中' : '') + '" data-模型="' + m.id + '">'
                + '<span class="模型圈">' + 勾 + '</span>'
                + '<span class="模型名">' + m.名 + '</span>'
                + '</div>';
        }).join('');
    }

    /* ---------- 保存按钮可用性 ---------- */
    function 同步按钮() {
        保存钮.disabled = !(网址输入.value.trim() && 密钥输入.value.trim() && 选中模型);
    }

    /* ---------- 拉模型（自动 / 手动共用） ---------- */
    async function 读模型() {
        const 网址 = 网址输入.value.trim();
        const 密钥 = 密钥输入.value.trim();

        if (!网址 || !密钥) {
            置状态('', 密钥 ? '再填一下接口地址' : '填入密钥后自动读取');
            重读钮.disabled = true;
            return;
        }
        /* 还没内联出助手就别硬来（理论上不会发生） */
        const 助手 = window.图片助手;
        if (!助手 || typeof 助手.拉模型 !== 'function') {
            置状态('失败', '调用层没加载');
            return;
        }

        忙碌 = true;
        重读钮.disabled = true;
        置状态('读取中', '正在读取可用模型…');
        渲染模型();

        const 果 = await 助手.拉模型(网址, 密钥, { 超时: 15000 });
        忙碌 = false;
        重读钮.disabled = false;

        if (果 && 果.好 && 果.列表.length) {
            模型表 = 果.列表;
            /* ★ 原来选中的如果还在新列表里就保持，否则清空（不能留一个不存在的模型） */
            if (!模型表.some(m => m.id === 选中模型)) 选中模型 = '';
            渲染模型();
            /* ★ 过滤掉过就说明一声 —— 否则用户看「读到 3 个」会以为这家只有 3 个模型 */
            const 滤 = (果.过滤掉 > 0) ? ('（已滤掉 ' + 果.过滤掉 + ' 个纯文本模型）') : '';
            置状态('成功', '读到 ' + 模型表.length + ' 个生图模型' + 滤 + (选中模型 ? '' : '，选一个吧'));
        } else {
            /* ★ 失败时【不清空已读到的列表】：只是这次没读成，
                 之前选好的模型还能继续用，不至于白选一遍。 */
            置状态('失败', (果 && 果.原因) || '没读到模型');
            渲染模型();
        }
        同步按钮();
    }

    /** 输入后防抖自动读：改网址或改密钥都重新读一遍 */
    function 排一次() {
        clearTimeout(防抖计时);
        同步按钮();
        防抖计时 = setTimeout(() => {
            if (!忙碌) 读模型();
        }, 700);
    }

    网址输入.addEventListener('input', 排一次);
    密钥输入.addEventListener('input', 排一次);
    重读钮.addEventListener('click', () => { if (!忙碌) 读模型(); });

    模型卡.addEventListener('click', e => {
        const 行 = e.target.closest('.模型行');
        if (!行) return;
        选中模型 = 行.dataset.模型;
        渲染模型();
        置状态('成功', '已选「' + 选中模型 + '」，记得保存');
        同步按钮();
    });

    /* ---------- 保存 ---------- */
    保存钮.addEventListener('click', () => {
        const 网址 = 网址输入.value.trim();
        const 密钥 = 密钥输入.value.trim();
        if (!网址 || !密钥) { 提示('地址和密钥都要填'); return; }
        if (!选中模型) { 提示('先选一个模型'); return; }

        写JSON(配置键, {
            网址: 网址,
            密钥: 密钥,
            模型: 选中模型,
            模型列表: 模型表,
            尺寸: 尺寸选择 ? 尺寸选择.value : '1024x1024',
            时间: Date.now(),
        });
        提示('已保存，聊天与动态都会用它');
        刷新已配();
    });

    /* ---------- 断开 ---------- */
    断开钮.addEventListener('click', () => {
        try { localStorage.removeItem(配置键); } catch (e) {}
        模型表 = [];
        选中模型 = '';
        网址输入.value = '';
        密钥输入.value = '';
        if (尺寸选择) 尺寸选择.value = '1024x1024';
        渲染模型();
        置状态('', '填入密钥后自动读取');
        重读钮.disabled = true;
        同步按钮();
        刷新已配();
        提示('已断开，本机不再保存密钥');
    });

    /* ---------- 密钥明文切换 ---------- */
    document.getElementById('眼睛钮').addEventListener('click', () => {
        密钥输入.type = 密钥输入.type === 'password' ? 'text' : 'password';
    });

    /* ---------- 已配置横幅 ---------- */
    function 刷新已配() {
        const c = 读JSON(配置键, null);
        if (c && c.模型) {
            已配横幅.classList.remove('隐藏');
            已配模型名.textContent = String(c.模型);
            断开钮.classList.remove('隐藏');
        } else {
            已配横幅.classList.add('隐藏');
            断开钮.classList.add('隐藏');
        }
    }

    /* ---------- 回填 ---------- */
    (function 初始化() {
        const c = 读JSON(配置键, null);
        if (!c) { 渲染模型(); 刷新已配(); return; }

        网址输入.value = String(c.网址 || '');
        密钥输入.value = String(c.密钥 || '');
        选中模型 = String(c.模型 || '');
        模型表 = Array.isArray(c.模型列表) ? c.模型列表 : [];
        if (尺寸选择 && c.尺寸 !== undefined) 尺寸选择.value = String(c.尺寸);

        渲染模型();
        刷新已配();
        同步按钮();
        if (模型表.length) 置状态('成功', '已选「' + 选中模型 + '」');
    })();

    /* ---------- 返回 ---------- */
    const 参数 = new URLSearchParams(location.search);
    const 来源 = 参数.get('from') || '';
    const 返回表 = { '1': '1_shouyeyulan.html', '4': '4_tongxun.html', '5': '5_dongtai.html' };
    function 推来源页() {
        try {
            const 名 = (document.referrer || '').split('/').pop().split('?')[0];
            return /^\d+_.+\.html$/.test(名) ? 名 : '';
        } catch (e) { return ''; }
    }
    const 返回页 = 返回表[来源] || 推来源页() || '8_wode.html';
    window.取返回页 = () => 返回页;

    function 回上一页() {
        try { window.最后跳转 = 返回页; } catch (e) {}
        location.href = 返回页;
    }
    document.getElementById('返回按钮').addEventListener('click', 回上一页);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') 回上一页(); });

    /* ---------- 观察口（测试与业务方） ---------- */
    window.图片API = {
        取配置: () => 读JSON(配置键, null),
        取模型表: () => 模型表.slice(),
        取选中: () => 选中模型,
        读模型: 读模型,
        选中: id => { 选中模型 = id; 渲染模型(); 同步按钮(); },
        已读成: () => 模型表.length > 0,
    };
})();
</script>

    <script id="图片助手">
/**
 * 图片助手.js —— 图片 API 的统一调用层（7 页聊天生图 / 5 页角色发图片动态共用）
 *
 * ★★ 与 AI助手.js 同一套思路：
 *     7 页（聊天里发图）与 5 页（角色发图片朋友圈）都要调生图接口，
 *     两边各写一遍 fetch 会立刻漂移（地址规范化、超时、返回结构、错误分级）。
 *     这里只写一份，用 同步图片助手.py 内联进几个页面 ——
 *     页面运行时【不依赖】外部文件，单拷 html 也能跑。
 *
 * ★★ 配置从哪来
 *     读 localStorage「图片API配置」（20_tupianAPI 写入）：
 *       { 网址, 密钥, 模型, 模型列表, 尺寸, 时间 }
 *     没配 / 没选模型 → 所有调用返回 { 好:false, 原因:'未配置' }，
 *     由调用方决定降级（7 页提示去配置，5 页退回纯文字动态）。
 *
 * ★★ 地址规范化（各家生图端点不一样，不能让用户自己猜后缀）
 *     https://api.openai.com      → /v1/images/generations
 *     https://api.openai.com/v1   → /images/generations
 *     https://x.com/v1/（多斜杠） → /images/generations
 *     api.openai.com（缺协议）    → 补 https://
 *     主选 404 → 自动试另一种拼法，两次都失败才报错
 *
 * ★★ 模型列表端点
 *     与文本同款：GET /models。但生图服务常常把「聊天模型」也一起列出来
 *     （几十上百个，全是文本模型），全列给用户选等于没法选 ——
 *     所以这里做一次过滤：命中常见生图关键词的优先，命中纯文本关键词的排除。
 *     过滤完如果为空（说明这家命名不按套路），就原样返回，让用户自己挑。
 *
 * ★★ 返回结构各家不一样（OpenAI / 兼容层 / 有的直接给 url）
 *     { data: [{ url }] }                    → 直接是图片链接
 *     { data: [{ b64_json }] }               → base64，自己拼 dataURL
 *     { data: [{ base64 }] } / { images:[..] }
 *     { url } / { image } / { output: [...] }
 *
 * ★★ 错误要说清是哪一步（不能只说「失败」）
 *     401/403 → 密钥不对；404 → 地址不对（已试过两种拼法）
 *     429 → 额度或限流；fetch reject → 多半跨域被拦或网络不通
 *     超时 → 主动 abort
 *
 * ★ 安全：密钥只在本机 localStorage，只发给【用户自己填的那个地址】，
 *     本文件不做任何上传到第三方的事。
 */
(function (global) {
    'use strict';

    const 配置键 = '图片API配置';
    const 默认超时 = 60000;   // ★ 生图比聊天慢得多，超时给到 60 秒

    /* ---------- 存档 ---------- */
    function 读配置() {
        try {
            const v = JSON.parse(global.localStorage.getItem(配置键) || 'null');
            return v && typeof v === 'object' ? v : null;
        } catch (e) { return null; }
    }

    /** 是否可用（没配就别发请求，省得每次都等超时） */
    function 已配置() {
        const c = 读配置();
        return !!(c && c.网址 && c.密钥 && c.模型);
    }

    /* ---------- 地址规范化 ---------- */
    /** 补协议、去尾部斜杠 */
    function 规范化(原) {
        let s = String(原 || '').trim();
        if (!s) return '';
        if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
        return s.replace(/\/+$/, '');
    }

    /** 生图端点的候选地址 */
    function 候选生图地址(基) {
        const b = 规范化(基);
        if (!b) return [];
        return /\/v\d+[a-z]*$/i.test(b)
            ? [b + '/images/generations']                                       // 已带版本
            : [b + '/v1/images/generations', b + '/images/generations'];        // 未带 → 两种都试
    }

    /** 模型列表端点（与 AI助手 同款） */
    function 候选模型地址(基) {
        const b = 规范化(基);
        if (!b) return [];
        return /\/v\d+[a-z]*$/i.test(b)
            ? [b + '/models']
            : [b + '/v1/models', b + '/models'];
    }

    /* ---------- 模型名过滤：把生图模型挑出来 ---------- */
    /* 命中这些的【优先】当生图模型（各家命名不同，只能按关键词） */
    const 生图关键词 = [
        'image', 'dall', 'flux', 'sdxl', 'stable', 'midjourney', 'mj',
        'draw', 'paint', 'art', 'picture', 'pic', 'poster', 'vision-gen',
        'seedream', 'kolors', 'wanx', 'hunyuan-image', 'cogview',
    ];
    /* 命中这些的【排除】—— 它们是纯文本模型，不会生图 */
    const 文本关键词 = [
        'gpt', 'chat', 'claude', 'llama', 'qwen', 'glm', 'deepseek',
        'text', 'instruct', 'embedding', 'rerank', 'whisper', 'tts', 'audio',
        'moderation', 'babbage', 'davinci', 'turbo',
    ];

    /**
     * 从模型表里挑出生图模型。
     * ★ 挑完为空就原样返回 —— 宁可让用户自己挑，也不能把列表清空变成「读不到」。
     */
    function 挑生图模型(表) {
        const 全 = Array.isArray(表) ? 表 : [];
        if (!全.length) return [];

        const 像 = 全.filter(m => {
            const 名 = String((m && (m.id || m.名)) || '').toLowerCase();
            if (!名) return false;
            /* ★★ 生图词优先：像 gpt-image-1 这种【既带 gpt 又带 image】的，
                 一次判断定生死 —— 命中生图词就直接留下，再走到「排文本词」那步
                 会把它误杀（gpt 前缀）。所以两个判断必须合并在一次遍历里。 */
            if (生图关键词.some(k => 名.indexOf(k) >= 0)) return true;
            /* 没命中生图词、但明确是纯文本的 → 排掉 */
            return !文本关键词.some(k => 名.indexOf(k) >= 0);
        });

        return 像.length ? 像 : 全;
    }

    /* ---------- 拉模型列表 ---------- */
    async function 拉模型(网址, 密钥, 选项) {
        const 选 = 选项 || {};
        if (!String(网址 || '').trim()) return { 好: false, 列表: [], 原因: '请先填接口地址' };
        if (!String(密钥 || '').trim()) return { 好: false, 列表: [], 原因: '请先填密钥' };

        const 地址表 = 候选模型地址(网址);
        const 超时 = 选.超时 || 15000;
        let 最后状态 = 0;

        for (const url of 地址表) {
            const 控制器 = new AbortController();
            const 计时 = setTimeout(() => 控制器.abort(), 超时);
            try {
                const 响应 = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + String(密钥 || '').trim(),
                        'Content-Type': 'application/json',
                    },
                    signal: 控制器.signal,
                });
                clearTimeout(计时);

                if (!响应.ok) {
                    最后状态 = 响应.status;
                    if (响应.status === 404) continue;
                    if (响应.status === 401 || 响应.status === 403) {
                        return { 好: false, 列表: [], 原因: '密钥不对或没有权限（' + 响应.status + '）' };
                    }
                    if (响应.status === 429) {
                        return { 好: false, 列表: [], 原因: '额度用完了或触发限流（429）' };
                    }
                    return { 好: false, 列表: [], 原因: '接口返回 ' + 响应.status };
                }

                const 数据 = await 响应.json();
                const 全 = 抽模型(数据);
                if (!全.length) return { 好: false, 列表: [], 原因: '接口没返回可用模型' };
                /* ★ 只把【像生图的】列在前面，全量放在 全部 里备查 */
                const 像 = 挑生图模型(全);
                return {
                    好: true,
                    列表: 像,
                    全部: 全,
                    过滤掉: 全.length - 像.length,
                    原因: '',
                };

            } catch (e) {
                clearTimeout(计时);
                if (e && e.name === 'AbortError') {
                    return { 好: false, 列表: [], 原因: '请求超时（' + Math.round(超时 / 1000) + ' 秒）' };
                }
                最后状态 = 最后状态 || -1;
            }
        }

        if (最后状态 === 404) {
            return { 好: false, 列表: [], 原因: '接口地址不对（已试过两种拼法，都 404）' };
        }
        return { 好: false, 列表: [], 原因: '请求发不出去，多半是跨域被拦或网络不通' };
    }

    /** 各家 /models 返回结构不一样，统一成 [{id,名}] */
    function 抽模型(数据) {
        const 出 = [];
        const 收 = v => {
            if (!v) return;
            if (typeof v === 'string') { if (v.trim()) 出.push({ id: v.trim(), 名: v.trim() }); return; }
            if (typeof v === 'object') {
                const id = String(v.id || v.name || v.model || '').trim();
                if (id) 出.push({ id: id, 名: String(v.名 || v.display_name || v.id || id).trim() });
            }
        };
        try {
            const 原 = Array.isArray(数据) ? 数据
                : Array.isArray(数据 && 数据.data) ? 数据.data
                : Array.isArray(数据 && 数据.models) ? 数据.models
                : [];
            原.forEach(收);
        } catch (e) {}
        const 见 = new Set();
        return 出.filter(m => (见.has(m.id) ? false : (见.add(m.id), true)));
    }

    /* ---------- 核心：生一张图 ---------- */
    /**
     * @param {string} 描述   画面描述（英文一般效果更好，但中文也能用）
     * @param {object} 选项   { 超时, 尺寸, 数量, 反向 }
     * @returns {Promise<{好:boolean, 网址:string, 数据:string, 原因:string}>}
     *          网址 = 接口直接返回的图片链接；数据 = base64（已拼好 dataURL 前缀）
     */
    async function 生图(描述, 选项) {
        const 选 = 选项 || {};
        const 配置 = 读配置();
        if (!配置 || !配置.网址 || !配置.密钥 || !配置.模型) {
            return { 好: false, 网址: '', 数据: '', 原因: '未配置' };
        }

        const 文 = String(描述 || '').trim();
        if (!文) return { 好: false, 网址: '', 数据: '', 原因: '还没写画面描述' };

        const 地址表 = 候选生图地址(配置.网址);
        if (!地址表.length) return { 好: false, 网址: '', 数据: '', 原因: '接口地址为空' };

        const 超时 = 选.超时 || 默认超时;
        let 最后状态 = 0;

        for (const url of 地址表) {
            const 控制器 = new AbortController();
            const 计时 = setTimeout(() => 控制器.abort(), 超时);
            try {
                const 体 = {
                    model: 配置.模型,
                    prompt: 文,
                    n: 选.数量 || 1,
                };
                /* 尺寸各家字段名不同：OpenAI 用 size，有的用 size / aspect_ratio */
                const 尺寸 = 选.尺寸 || 配置.尺寸 || '1024x1024';
                if (尺寸) 体.size = 尺寸;
                if (选.反向) 体.negative_prompt = 选.反向;

                /* 有的服务要 response_format 才给 base64，统一不传：
                   给了 url 就用 url，给了 base64 就用 base64，两种都能接。 */

                const 响应 = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + 配置.密钥,
                    },
                    body: JSON.stringify(体),
                    signal: 控制器.signal,
                });
                clearTimeout(计时);

                if (!响应.ok) {
                    最后状态 = 响应.status;
                    if (响应.status === 404) continue;
                    if (响应.status === 401 || 响应.status === 403) {
                        return { 好: false, 网址: '', 数据: '', 原因: '密钥不对或没有权限（' + 响应.status + '）' };
                    }
                    if (响应.status === 429) {

                const b64 = 项.b64_json || 项.base64 || 项.b64
                    || (项.data && typeof 项.data === 'string' ? 项.data : '');
                if (typeof b64 === 'string' && b64.trim()) {
                    return { 网址: '', 数据: 拼dataURL(b64.trim()) };
                }
            }

            /* 顶层直接给字符串的情况 */
            if (typeof 数据.url === 'string' && 数据.url.trim()) {
                return { 网址: 数据.url.trim(), 数据: '' };
            }
            if (typeof 数据.image === 'string' && 数据.image.trim()) {
                const s = 数据.image.trim();
                return /^https?:\/\//i.test(s) ? { 网址: s, 数据: '' } : { 网址: '', 数据: 拼dataURL(s) };

    function 拼dataURL(b64) {

     * 图片存档：IndexedDB
     *   ★★ 为什么不放 localStorage：它只有约 5MB，几张 base64 图就写满，

     *      这是真会出事的。所以图片走 IndexedDB（与「音乐库」同款做法），
     *      聊天记录里只放一个图片 id 引用。

     * ============================================================ */

    const 表名 = '图片';

    function 打开图片库() {
        return new Promise((完成, 失败) => {
            if (typeof global.indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;

            请求.onupgradeneeded = () => {

            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));

    function 跑图片事务(模式, 处理) {
        return 打开图片库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 模式);
            const 结果 = 处理(事务.objectStore(表名));
            事务.oncomplete = () => 完成(结果 && 结果.result !== undefined ? 结果.result : null);
            事务.onerror = () => 失败(事务.error || new Error('事务失败'));
        }));
    }

    /**
     * 存一张图，返回它的 id。
     * ★ 只有 base64（数据）才需要存 —— 接口直接给链接的不用占库。
     * @returns {Promise<string>} '' 表示没存成（调用方退回直接用 网址）
     */
    function 存图(记录) {
        const id = (记录 && 记录.id) || ('img_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
        return 跑图片事务('readwrite', 表 => 表.put(Object.assign({}, 记录, {
            id: id,
            时间: (记录 && 记录.时间) || Date.now(),
        }))).then(() => id).catch(() => '');
    }

    /** 按 id 读回一张图：{ id, 数据, 网址, 描述, 时间 } */
    function 读图(id) {
        if (!id) return Promise.resolve(null);
        return 跑图片事务('readonly', 表 => 表.get(id)).catch(() => null);
    }

    /** 一次读多张（聊天里可能连着好几张图） */
    function 读图组(id表) {
        const 表 = Array.isArray(id表) ? id表.filter(Boolean) : [];
        if (!表.length) return Promise.resolve([]);
        return Promise.all(表.map(读图)).then(r => r.filter(Boolean)).catch(() => []);
    }

    /* ---------- 对外 ---------- */
    global.图片助手 = {
        读配置: 读配置,
        已配置: 已配置,
        规范化: 规范化,
        候选生图地址: 候选生图地址,
        候选模型地址: 候选模型地址,
        挑生图模型: 挑生图模型,
        拉模型: 拉模型,
        生图: 生图,
        拼dataURL: 拼dataURL,

        存图: 存图,
        读图: 读图,
        读图组: 读图组,

 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')

    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退

    const 表名 = '音频';

     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */

            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {

            };

            请求.onerror = () => 失败(请求.error || new Error('打开失败'));

     * 存档读写

     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */

    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */

        /** 暂停背景音乐（可重入；同一原因重复调用无害） */

            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */

            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）

        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>
    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
