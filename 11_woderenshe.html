<!DOCTYPE html>
<!--
    11_woderenshe —— 我的人设（人设卡列表 + 编辑 / 创建）

    入口：8 页「我的人设」→ 11_woderenshe.html?from=8
    出口：返回来源页（?from= → referrer → 1 页），与本轮其他设置页同规则。

    ★ 两个视图，同页切换，不做页面跳转：
        列表视图：横版人设卡（头像 / 昵称 / 生日 / 性别 / 身份 / 身高），
                  卡片之间只用 1px 分割线分开，点整行进编辑视图
        编辑视图：昵称 / 生日 / 身高 / 性别 / 身份 / 人物信息 / 性格标签 /
                  绑定联系人 / 设为默认 / 头像

    ★ 全页无底框：卡片、表单区、列表项一律 无 background / border /
      box-shadow / border-radius —— 内容直接坐在主题背景上。
      输入框收成下划线，不留方块。
      弹窗例外，共四处：来源面板、生日日历、删除确认、★ 头像裁剪
      —— 裁剪用与 1 / 2 / 8 / 9 / 10 页同款的全屏遮罩（深底 + 居中圆形取景框
         + 底部按钮行），不再内联展开在表单里。

    ★ 草稿机制：编辑的是内存副本，点「保存」才落盘，点「取消」丢弃。
      编辑视图里点返回 = 取消；有未保存改动时第一次点只提示，再点才走。

    ★ 数据契约（三键，互不干扰）：
        人设列表 = [{ id, 昵称, 生日, 性别, 身高, 身份, 人物信息, 性格标签[], 头像 }]
        人设绑定 = { <联系人id>: <人设id> }    一个联系人只能绑一套
        当前人设 = <人设id>                     默认用哪套

    ★ 与 2 页（好友信息）的关系：
        2 页管「对方」的档案，11 页管「我」的多套人设 —— 两套数据完全分开，
        互不读写。这样同一位联系人眼里，「我」可以是完全不同的人。

    风格：与 1~10 页统一（同色板、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>我的人设</title>
    <style>
        /* ===== 统一色板（与 1~10 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* ★★ 上面那批是 hex（#xxxxxx），【不能】直接塞进 rgba() ——
               rgba(var(--accent), .92) 展开成 rgba(#4a4a50, .92)，是无效值，
               整条声明会被浏览器静默丢弃（白底白字就是这么来的）。
               要带透明度时用下面这批【数值形式】的伴生变量：
                 正确：rgba(var(--accent-rgb), 0.92)
                 错误：rgba(var(--accent), 0.92)
            */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;

        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            width: 100%;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .全局白色遮罩 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ================================================================
           ★ 全局约定：本页不使用任何底框。
           卡片、表单区、列表项一律 无 background / border / box-shadow /
           border-radius / backdrop-filter —— 只靠 1px 分割线分次序，
           内容直接坐在主题背景上。输入框也收成下划线，不留方块。
           ★ 例外：四处弹窗可以有底 —— 来源面板 / 生日日历 / 删除确认 /
             头像裁剪（裁剪是 1 / 2 / 8 / 9 / 10 页同款的全屏遮罩）。
           ================================================================ */

        /* ===== 视图切换：列表 / 编辑 同页切换，不做页面跳转 ===== */
        .视图 { display: none; flex: 1; flex-direction: column; min-height: 0; }
        .视图.当前 { display: flex; }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;
            min-height: clamp(38px, 11vw, 46px);
        }

        .返回按钮 {
            cursor: pointer;
            width: clamp(24px, 7vw, 28px);
            height: clamp(24px, 7vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .返回按钮 svg {
            width: clamp(17px, 4.8vw, 20px);
            height: clamp(17px, 4.8vw, 20px);
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.9;
        }

        /* ★ 与 5 / 7 / 8 / 9 页同款：绝对定位脱离 flex 流，真正居中 */
        .中间标题 {
            position: absolute;
            left: 0; right: 0;
            top: clamp(10px, 3vw, 14px);
            text-align: center;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* 列表页：返回键 + 左大标题 + 右加号（APK 常见）
           ★ flex:1 让标题吃掉剩余空间，紧贴在返回键右边 ——
             不加的话 space-between 会把它推到中间，跟「左标题」的设计意图反着来。 */
        .大标题 {
            flex: 1;
            min-width: 0;
            font-size: clamp(17px, 4.9vw, 20px);
            color: var(--ink);
            font-weight: 600;
            letter-spacing: .5px;
        }
        .加号键 {
            cursor: pointer;
            width: clamp(28px, 8vw, 33px);
            height: clamp(28px, 8vw, 33px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .加号键 svg {
            width: clamp(19px, 5.5vw, 23px);
            height: clamp(19px, 5.5vw, 23px);
            fill: none;
            stroke: var(--ink);
            stroke-width: 1.8;
            stroke-linecap: round;
        }
        .加号键:active svg { stroke: var(--ink-3); }

        .顶部说明 {
            padding: 0 clamp(14px, 4vw, 18px) clamp(6px, 1.8vw, 9px);
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
        }

        /* ===== 滚动区 ===== */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 2;
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ================================================================
           ===== 人设卡（横版）：头像 + 信息，行间只用分割线 =====
           ★ 没有底框：整行是一个可点区域，但视觉上看不出「卡片」，
             只靠下方 1px 的线分开。 */
        .卡片列表 {
            padding: 0 clamp(14px, 4vw, 18px);
        }

        .人设卡 {
            display: flex;
            align-items: center;
            gap: clamp(11px, 3.2vw, 15px);
            padding: clamp(12px, 3.5vw, 16px) 0;
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            /* ★ 1px + scaleY(0.5)：比直写 0.5px 稳，1x 屏不会消失 */
            border-bottom: 1px solid rgba(var(--line), 0.22);
            transition: opacity .16s;
        }
        .人设卡:last-child { border-bottom: none; }
        .人设卡:active { opacity: .55; }

        .卡头像 {
            width: clamp(52px, 15vw, 62px);
            height: clamp(52px, 15vw, 62px);
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            display: block;
            background: rgba(var(--line), 0.1);
            /* 只保留一圈细描边把头像从背景里托出来，不算底框 */
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        /* ★ 未上传头像时的占位：虚线圆 + 相机图标。
           人设头像一律由用户自己上传，不填默认素材（圆形头像1 等），
           免得几套人设顶着同一张脸分不清。 */
        .卡头像.空 { display: none; }
        .卡空头像 {
            width: clamp(52px, 15vw, 62px);
            height: clamp(52px, 15vw, 62px);
            border-radius: 50%;
            flex-shrink: 0;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(var(--line), 0.55);
            background: rgba(var(--line), 0.06);
            color: var(--ink-4);
        }
        .卡空头像.显示 { display: flex; }
        .卡空头像 svg {
            width: 42%; height: 42%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .卡信息 { flex: 1; min-width: 0; }

        .卡昵称行 {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: clamp(3px, 1vw, 5px);
        }
        .卡昵称 {
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .默认徽标 {
            flex-shrink: 0;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: clamp(9px, 2.6vw, 10.5px);
            letter-spacing: .3px;
        }

        /* 元信息一行：生日 · 性别 · 身份 · 身高 */
        .卡元信息 {
            font-size: clamp(11px, 3.2vw, 12.5px);
            color: var(--ink-3);
            line-height: 1.55;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .卡元信息 .空位 { color: var(--ink-4); }

        /* 卡片右侧：绑定位数 + 删除图标 */
        .卡右 {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.8vw, 9px);
            flex-shrink: 0;
        }
        .绑定数 {
            font-size: clamp(10px, 2.9vw, 11.5px);
            color: var(--ink-4);
            white-space: nowrap;
        }
        .卡删除 {
            width: clamp(26px, 7.5vw, 30px);
            height: clamp(26px, 7.5vw, 30px);
            border: none;
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .卡删除 svg {
            width: clamp(15px, 4.3vw, 17px);
            height: clamp(15px, 4.3vw, 17px);
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .卡删除:active svg { stroke: #b4453c; }

        /* ===== 空态 ===== */
        .空态 {
            padding: clamp(30px, 9vw, 52px) clamp(20px, 6vw, 30px);
            text-align: center;
            color: var(--ink-3);
            font-size: clamp(12px, 3.4vw, 13.5px);
            line-height: 1.9;
        }
        .空态 svg {
            width: clamp(44px, 12.6vw, 54px);
            height: clamp(44px, 12.6vw, 54px);
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: .8;
            margin-bottom: clamp(10px, 3vw, 14px);
        }

        /* ================================================================
           ===== 编辑视图：同样无底框 ===== */
        .编辑体 {
            padding: clamp(6px, 1.8vw, 10px) clamp(14px, 4vw, 18px) clamp(24px, 7vw, 36px);
        }

        /* 头像行：居中大头像 + 两个内联小按钮 */
        .头像编辑行 {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(10px, 3vw, 16px) 0 clamp(16px, 4.6vw, 22px);
        }
        .头像大钮 {
            position: relative;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .头像大钮:active .头像大 { opacity: .7; }
        .头像大 {
            width: clamp(78px, 22.5vw, 96px);
            height: clamp(78px, 22.5vw, 96px);
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: rgba(var(--line), 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: opacity .16s;
        }
        /* ★ 没上传头像 → 隐藏 img，改显虚线圆占位（含「上传头像」文字） */
        .头像大.空 { display: none; }
        .头像空态 {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1.2vw, 6px);
            width: clamp(78px, 22.5vw, 96px);
            height: clamp(78px, 22.5vw, 96px);
            border-radius: 50%;
            border: 1px dashed rgba(var(--line), 0.55);
            background: rgba(var(--line), 0.06);
            color: var(--ink-4);
        }
        .头像空态.显示 { display: flex; }
        .头像空态 svg {
            width: 30%; height: 30%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .头像空态文字 {
            font-size: clamp(9.5px, 2.7vw, 11px);
            line-height: 1;
            user-select: none;
        }
        /* 右下角相机小角标，暗示「可换」 */
        .头像角标 {
            position: absolute;
            right: -2px;
            bottom: -2px;
            width: clamp(25px, 7.2vw, 30px);
            height: clamp(25px, 7.2vw, 30px);
            border-radius: 50%;
            background: rgba(252, 252, 254, 0.96);
            border: 1px solid rgba(var(--line), 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .头像角标 svg {
            width: 58%; height: 58%;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .头像提示 {
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            margin-top: clamp(9px, 2.6vw, 12px);
        }

        /* ===== 来源面板（拍摄 / 从手机相册选择 / 取消）=====
           ★ 全站统一面板：1 / 2 / 6 / 8 / 9 / 10 / 11 页共用这套结构与文案。
             本页面板挂在编辑视图内，所以用 absolute 而非 fixed。 */
        .来源遮罩 {
            position: absolute; inset: 0; z-index: 360;
            background: rgba(16, 16, 24, 0.45);
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .来源遮罩.显示 { display: flex; }
        .来源面板 {
            width: 100%;
            padding: 0 clamp(8px, 2.4vw, 10px)
                     calc(clamp(8px, 2.4vw, 10px) + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .26s cubic-bezier(.32, .72, 0, 1);
        }
        .来源遮罩.显示 .来源面板 { transform: translateY(0); }

        .来源组 {
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(13px, 3.8vw, 15px);
            overflow: hidden;
        }
        .来源项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 13px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(14px, 4vw, 17px);
            border: none;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .来源项 + .来源项 { border-top: 1px solid rgba(var(--line), 0.15); }
        .来源项:active { background: rgba(var(--line), 0.09); }
        .来源项 svg {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(17px, 4.8vw, 19px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .来源文字 { font-size: clamp(13.5px, 3.9vw, 15px); color: var(--ink); font-weight: 500; }

        .来源项.取消 {
            margin-top: clamp(7px, 2vw, 9px);
            border-radius: clamp(13px, 3.8vw, 15px);
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            justify-content: center;
        }
        .来源项.取消 .来源文字 { font-weight: 600; }

        /* 字段：标签 + 下划线输入框，无方块无底框 */
        .字段组 { margin-bottom: clamp(15px, 4.3vw, 20px); }
        .字段标签 {
            display: flex;
            align-items: center;
            gap: clamp(5px, 1.5vw, 7px);
            font-size: clamp(11px, 3.2vw, 12.5px);
            color: var(--ink-3);
            margin-bottom: clamp(5px, 1.5vw, 7px);
        }
        .字段标签 svg {
            width: clamp(13px, 3.8vw, 15px);
            height: clamp(13px, 3.8vw, 15px);
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .下划线输入 {
            width: 100%;
            height: clamp(34px, 9.8vw, 39px);
            padding: 0 2px;
            border: none;
            border-bottom: 1px solid rgba(var(--line), 0.3);
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: clamp(13px, 3.7vw, 14.5px);
            outline: none;
            border-radius: 0;
            transition: border-color .16s;
        }
        .下划线输入:focus { border-bottom-color: rgba(var(--accent-rgb), 0.55); }
        .下划线输入::placeholder { color: var(--ink-4); }

        .下划线文本域 {
            height: auto;
            min-height: clamp(72px, 21vw, 90px);
            padding: clamp(6px, 1.8vw, 9px) 2px;
            line-height: 1.65;
            resize: none;
        }

        .双列 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(12px, 3.5vw, 18px);
        }
        .生日框 { position: relative; display: flex; align-items: center; }
        .生日框 input {
            width: 100%;
            height: clamp(34px, 9.8vw, 39px);
            padding: 0 clamp(24px, 7vw, 28px) 0 2px;
            border: none;
            border-bottom: 1px solid rgba(var(--line), 0.3);
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: clamp(13px, 3.7vw, 14.5px);
            outline: none;
            border-radius: 0;
        }
        .生日框 input::placeholder { color: var(--ink-4); }
        .日历键 {
            position: absolute;
            right: 0;
            width: clamp(18px, 5.2vw, 21px);
            height: clamp(18px, 5.2vw, 21px);
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
        }
        .日历键 svg {
            width: 100%; height: 100%;
            fill: none;
            stroke: var(--ink-3);
            stroke-width: 1.8;
            stroke-linecap: round;
        }

        /* 性别：文字分段选择，无底框 */
        .性别组 { display: flex; gap: clamp(14px, 4vw, 20px); padding: 4px 0; }
        .性别项 {
            display: flex;
            align-items: center;
            gap: clamp(5px, 1.5vw, 7px);
            border: none;
            background: transparent;
            padding: 2px 0;
            font-family: inherit;
            font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink-3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .性别项 .圈 {
            width: clamp(15px, 4.3vw, 17px);
            height: clamp(15px, 4.3vw, 17px);
            border-radius: 50%;
            border: 1.6px solid rgba(var(--line), 0.4);
            flex-shrink: 0;
            position: relative;
            transition: border-color .16s;
        }
        .性别项.选中 { color: var(--ink); font-weight: 600; }
        .性别项.选中 .圈 { border-color: var(--accent); }
        .性别项.选中 .圈::after {
            content: '';
            position: absolute;
            left: 50%; top: 50%;
            width: 56%; height: 56%;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%);
        }

        /* ================================================================
           ===== 预选头像界面（点「预选头像」进入）=====
           ★ 18 张内置素材，宫格排列，点一张即用（不进裁剪 —— 素材本身就是标准方形）。
             路径 3【人设预选头像】/预选N.png，与 2【图片】 同一层级。
           ★ z-index 420：高于来源面板(360) / 删除确认(380) / 裁剪(400)，
             因为是从来源面板里点进来的，必须盖在它上面。 */
        .预选遮罩 {
            position: absolute; inset: 0; z-index: 420;
            background: rgba(252, 252, 254, 0.99);
            display: none;
            flex-direction: column;
        }
        .预选遮罩.显示 { display: flex; }

        .预选顶栏 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            padding: clamp(12px, 3.4vw, 16px) clamp(12px, 4vw, 16px) clamp(8px, 2.4vw, 12px);
            border-bottom: 1px solid rgba(var(--line), 0.16);
        }
        .预选返回 {
            display: flex;
            align-items: center;
            gap: clamp(3px, 1vw, 5px);
            border: none;
            background: transparent;
            padding: 0;
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .预选返回 svg {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(17px, 4.8vw, 19px);
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .预选标题 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(13px, 3.7vw, 14.5px);
            color: var(--ink);
            pointer-events: none;
        }
        .预选占位 { width: clamp(17px, 4.8vw, 19px); flex-shrink: 0; }

        .预选说明 {
            flex-shrink: 0;
            padding: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 18px) clamp(4px, 1.2vw, 6px);
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
        }

        .预选滚动 {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            padding: clamp(6px, 1.8vw, 10px) clamp(14px, 4vw, 18px) clamp(24px, 7vw, 34px);
        }
        .预选网格 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2.8vw, 14px);
        }
        .预选格 {
            position: relative;
            aspect-ratio: 1 / 1;
            border: none;
            padding: 0;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .预选图 {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: rgba(var(--line), 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform .16s, box-shadow .16s;
        }
        .预选格:active .预选图 { transform: scale(.94); }
        /* 选中态：一圈强调色描边 + 右下角对勾 */
        .预选格.选中 .预选图 {
            box-shadow: 0 0 0 2px var(--accent);
            border-color: transparent;
        }
        .预选勾 {
            position: absolute;
            right: 4%;
            bottom: 4%;
            width: clamp(20px, 5.8vw, 24px);
            height: clamp(20px, 5.8vw, 24px);
            border-radius: 50%;
            background: var(--accent);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .预选格.选中 .预选勾 { display: flex; }
        .预选勾 svg {
            width: 58%; height: 58%;
            fill: none;
            stroke: #fff;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .预选空 {
            grid-column: 1 / -1;
            padding: clamp(28px, 8vw, 40px) 0;
            text-align: center;
            font-size: clamp(11.5px, 3.3vw, 13px);
            color: var(--ink-4);
        }

        /* ================================================================
           ===== 裁剪弹窗（圆形头像 · 全屏遮罩）=====
           ★ 与 1 / 2 / 8 / 9 / 10 页同款：深底全屏遮罩 + 居中取景框 + 底部按钮行。
             本页是「无底框」风格，但弹窗属于例外（必须占一块操作区）——
             连同来源面板、生日日历、删除确认，一共四处弹窗。
           ★ transform-origin 必须是 0 0：图片左上角固定，tx/ty 才与下面的
             平移公式对得上；用默认的中心点会把大图推出视口 → 预览一片空白。 */
        .裁剪遮罩 {
            position: absolute; inset: 0; z-index: 400;   /* ★ 高于来源面板(360) / 删除确认(380) */
            background: rgba(20, 20, 24, 0.86);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 4vw, 20px);
        }
        .裁剪遮罩.显示 { display: flex; }

        .裁剪标题 {
            color: #fff;
            font-size: clamp(12.5px, 3.6vw, 14px);
            margin-bottom: clamp(10px, 3vw, 14px);
            opacity: .9;
        }

        .裁剪视口 {
            position: relative;
            width: min(74vw, 270px);
            aspect-ratio: 1 / 1;               /* ★ 方形取景，导出时按圆形裁 */
            border-radius: 50%;                /* ★ 头像用圆形（与 2 页同） */
            overflow: hidden;
            background: #2a2a30;
            touch-action: none;
            cursor: grab;
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.5);
        }

        .裁剪图片 {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0px 0px;         /* ★ 与 tx/ty 公式匹配 */
            will-change: transform;
            -webkit-user-drag: none;
            user-select: none;
        }

        .裁剪提示 {
            color: #fff;
            font-size: clamp(10.5px, 3vw, 12px);
            opacity: .62;
            margin-top: clamp(10px, 3vw, 14px);
            text-align: center;
            line-height: 1.5;
        }

        .裁剪按钮行 { display: flex; gap: clamp(10px, 3vw, 14px); margin-top: clamp(14px, 4vw, 20px); }
        .裁剪按钮 {
            min-width: clamp(78px, 23vw, 96px);
            height: clamp(34px, 9.6vw, 39px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .裁剪按钮:active { background: rgba(255, 255, 255, 0.14); }
        .裁剪按钮.主 { background: var(--accent); border-color: var(--accent); font-weight: 600; }
        .裁剪按钮.主:active { background: var(--accent-ink); }

        /* 性格标签：细边框小片 */
        .标签区 {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 1.8vw, 9px);
            align-items: center;
            padding: 2px 0;
        }
        .标签片 {
            display: inline-flex;
            align-items: center;
            gap: clamp(3px, 1vw, 5px);
            padding: clamp(4px, 1.3vw, 6px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px;
            background: transparent;
            border: 1px solid rgba(var(--line), 0.3);
            color: var(--ink-2);
            font-size: clamp(11px, 3.2vw, 12.5px);
        }
        .标签删 {
            border: none;
            background: transparent;
            padding: 0;
            width: clamp(12px, 3.4vw, 14px);
            height: clamp(12px, 3.4vw, 14px);
            cursor: pointer;
            flex-shrink: 0;
        }
        .标签删 svg {
            width: 100%; height: 100%;
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 2.2;
            stroke-linecap: round;
        }
        .标签加 {
            display: inline-flex;
            align-items: center;
            padding: clamp(4px, 1.3vw, 6px) clamp(10px, 2.9vw, 13px);
            border: 1px dashed rgba(var(--line), 0.42);
            border-radius: 999px;
            background: transparent;
            color: var(--ink-3);
            font-family: inherit;
            font-size: clamp(11px, 3.2vw, 12.5px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .标签输入 {
            width: clamp(78px, 23vw, 96px);
            height: clamp(26px, 7.5vw, 30px);
            padding: 0 clamp(7px, 2vw, 9px);
            border: none;
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.5);
            background: transparent;
            color: var(--ink);
            font-family: inherit;
            font-size: clamp(11px, 3.2vw, 12.5px);
            outline: none;
        }
        .标签输入::placeholder { color: var(--ink-4); }

        /* 绑定联系人：行间分割线，无底框 */
        .绑定区 { display: flex; flex-direction: column; }
        .绑定行 {
            display: flex;
            align-items: center;
            gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(9px, 2.6vw, 12px) 0;
            border-bottom: 1px solid rgba(var(--line), 0.16);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .绑定行:last-child { border-bottom: none; }
        .绑定勾选 {
            width: clamp(16px, 4.6vw, 18px);
            height: clamp(16px, 4.6vw, 18px);
            border-radius: 50%;
            border: 1.6px solid rgba(var(--line), 0.42);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .16s, border-color .16s;
        }
        .绑定行.选中 .绑定勾选 { background: var(--accent); border-color: var(--accent); }
        .绑定勾选 svg {
            width: 66%; height: 66%;
            fill: none;
            stroke: #fff;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
        }
        .绑定行.选中 .绑定勾选 svg { opacity: 1; }
        .绑定名 {
            flex: 1;
            min-width: 0;
            font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .绑定提示 {
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            line-height: 1.6;
            margin-bottom: clamp(5px, 1.5vw, 8px);
        }

        /* 默认开关行：分割线，无底框 */
        .默认行 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(11px, 3.2vw, 14px) 0;
            border-bottom: 1px solid rgba(var(--line), 0.16);
        }
        .默认文字 { font-size: clamp(12.5px, 3.6vw, 14px); color: var(--ink-2); }
        .默认注 {
            display: block;
            font-size: clamp(10px, 2.9vw, 11.5px);
            color: var(--ink-4);
            margin-top: 2px;
        }
        .开关 { display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
        .开关轨道 {
            width: clamp(38px, 11vw, 44px);
            height: clamp(21px, 6vw, 24px);
            border-radius: 999px;
            background: rgba(var(--line), 0.3);
            position: relative;
            transition: background .2s;
        }
        .开关.开启 .开关轨道 { background: var(--accent); }
        .开关圆点 {
            position: absolute;
            top: 50%; left: 2px;
            width: calc(clamp(21px, 6vw, 24px) - 4px);
            height: calc(clamp(21px, 6vw, 24px) - 4px);
            border-radius: 50%;
            background: #fff;
            transform: translateY(-50%);
            transition: left .2s;
            box-shadow: 0 1px 2px rgba(var(--shade), 0.2);
        }
        .开关.开启 .开关圆点 {
            left: calc(clamp(38px, 11vw, 44px) - (clamp(21px, 6vw, 24px) - 4px) - 2px);
        }

        /* ★ 右上角保存键：纯文字，无底框。
           有未保存改动时前面亮一个红点，未改动时是低调的灰。 */
        .保存键 {
            flex-shrink: 0;
            border: none;
            background: transparent;
            padding: clamp(4px, 1.2vw, 6px) 0 clamp(4px, 1.2vw, 6px) clamp(8px, 2vw, 10px);
            font-family: inherit;
            font-size: clamp(13px, 3.7vw, 14.5px);
            color: var(--ink-4);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color .16s, opacity .16s;
        }
        .保存键:active { opacity: .5; }
        .保存键.脏 { color: var(--accent); font-weight: 600; }
        .保存键.脏::before {
            content: '';
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 5px;
            vertical-align: middle;
        }

        /* 移动端选文件的隐藏输入：★ 必须留在渲染树内 */
        .视觉隐藏文件输入 {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px);
            background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ================================================================
           ===== 日历弹窗 ===== */
        .日历遮罩 {
            position: absolute; inset: 0; z-index: 320;
            background: rgba(0, 0, 0, 0.42);
            display: none;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 6vw, 30px);
        }
        .日历遮罩.显示 { display: flex; }
        .日历框 {
            width: 100%;
            max-width: 320px;
            background: rgba(250, 250, 252, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(14px, 4vw, 17px);
            padding: clamp(12px, 3.5vw, 16px);
            box-shadow: 0 8px 28px rgba(var(--shade), 0.2);
        }
        .日历头 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(9px, 2.6vw, 13px);
        }
        .日历年月 {
            font-size: clamp(13.5px, 3.9vw, 15px);
            color: var(--ink);
            font-weight: 600;
        }
        .日历年月::after {
            content: '';
            display: inline-block;
            width: 0; height: 0;
            margin-left: 5px;
            vertical-align: middle;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid currentColor;
            opacity: .55;
        }
        .日历框.选模式 .日历年月::after { transform: rotate(180deg); }
        .日历框.选模式 .日历翻 { visibility: hidden; }
        .日历翻 {
            width: clamp(26px, 7.5vw, 31px);
            height: clamp(26px, 7.5vw, 31px);
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .日历翻 svg {
            width: 62%; height: 62%;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .日历星期 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: clamp(4px, 1.2vw, 7px);
        }
        .日历星期 span {
            text-align: center;
            font-size: clamp(10px, 2.9vw, 11.5px);
            color: var(--ink-4);
            padding: 3px 0;
        }
        .日历格 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: clamp(1px, 0.5vw, 3px);
        }
        .日历框.选模式 #日历星期,
        .日历框.选模式 #日历格 { display: none; }
        .日历选面板 { display: none; }
        .日历框.选模式 .日历选面板 { display: block; }
        .日历年条 {
            display: flex;
            gap: clamp(5px, 1.5vw, 7px);
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: clamp(6px, 1.8vw, 9px);
            margin-bottom: clamp(9px, 2.6vw, 12px);
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }
        .日历年条::-webkit-scrollbar { display: none; height: 0; }
        .日历年 {
            flex-shrink: 0;
            min-width: clamp(50px, 14vw, 58px);
            height: clamp(31px, 8.8vw, 36px);
            border: none;
            border-radius: clamp(8px, 2.3vw, 10px);
            background: rgba(var(--line), 0.11);
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .日历年.选中 { background: var(--accent); color: #fff; font-weight: 600; }
        .日历月格 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(6px, 1.8vw, 9px);
        }
        .日历月 {
            height: clamp(35px, 10vw, 41px);
            border: none;
            border-radius: clamp(8px, 2.3vw, 10px);
            background: rgba(var(--line), 0.09);
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(11.5px, 3.3vw, 13px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .日历月.选中 { background: var(--accent); color: #fff; font-weight: 600; }
        .日历日 {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: 50%;
            font-family: inherit;
            font-size: clamp(11.5px, 3.3vw, 13px);
            color: var(--ink-2);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .日历日:active { background: rgba(var(--line), 0.16); }
        .日历日.空格 { visibility: hidden; cursor: default; }
        .日历日.今天 {
            color: var(--accent);
            font-weight: 700;

        .日历日.选中 { background: var(--accent); color: #fff; font-weight: 600; }
        .日历日.选中.今天 { box-shadow: none; }
        .日历脚 {
            display: flex;
            gap: clamp(7px, 2vw, 10px);
            margin-top: clamp(11px, 3.2vw, 15px);
        }
        .日历钮 {
            flex: 1;
            height: clamp(33px, 9.5vw, 38px);
            border: 1px solid rgba(var(--line), 0.3);
            border-radius: clamp(9px, 2.6vw, 11px);
            background: transparent;
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .日历钮.主 { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

        /* ================================================================
           ===== 删除确认弹窗 ===== */
        /* ★ 色调与 2 页「日历弹窗 / 来源面板」保持一致：
           遮罩 rgba(16,16,24,0.5)（不是纯黑）、面板用 --panel 变量、
           圆角 20px、双层阴影 + inset 高光、scale 入场动画。 */
        .询问遮罩 {
            position: absolute; inset: 0; z-index: 380;
            background: rgba(16, 16, 24, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            padding: clamp(20px, 6vw, 30px);
            transition: opacity .2s;
        }
        .询问遮罩.显示 { display: flex; opacity: 1; }
        .询问框 {
            width: 100%;
            max-width: 290px;
            background: rgba(252, 252, 254, 0.97);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(18px, 5.2vw, 22px);
            padding: clamp(20px, 5.8vw, 26px) clamp(16px, 4.6vw, 20px) clamp(16px, 4.6vw, 20px);
            text-align: center;
            border: 1px solid rgba(var(--panel), 0.4);
            box-shadow: 0 20px 60px rgba(var(--shade), 0.2),
                        inset 0 0 0 1px rgba(var(--panel), 0.3);
            transform: scale(0.92) translateY(10px);
            transition: transform .22s cubic-bezier(.32, .72, 0, 1);
        }
        .询问遮罩.显示 .询问框 { transform: scale(1) translateY(0); }
        .询问图标 {
            width: clamp(44px, 12.6vw, 52px);
            height: clamp(44px, 12.6vw, 52px);
            margin: 0 auto clamp(12px, 3.4vw, 15px);
            border-radius: 50%;
            background: rgba(180, 69, 60, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .询问图标 svg {
            width: 55%; height: 55%;
            fill: none;
            stroke: #b4453c;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .询问标题 {
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            font-weight: 600;
            margin-bottom: clamp(5px, 1.5vw, 8px);
        }
        .询问说明 {
            font-size: clamp(11.5px, 3.3vw, 13px);
            color: var(--ink-3);
            line-height: 1.6;
            margin-bottom: clamp(14px, 4vw, 18px);
        }
        .询问说明:empty { display: none; }
        .询问按钮行 { display: flex; gap: clamp(9px, 2.6vw, 12px); margin-top: clamp(4px, 1.2vw, 6px); }
        .询问钮 {
            flex: 1;
            height: clamp(38px, 10.9vw, 43px);
            border: 1px solid rgba(var(--line), 0.28);
            border-radius: clamp(11px, 3.2vw, 13px);
            background: rgba(var(--panel), 0.5);
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12.5px, 3.6vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .询问钮:active { background: rgba(var(--line), 0.12); }
        .询问钮.危 {
            background: #b4453c;
            border-color: #b4453c;
            color: #fff;
            font-weight: 600;
        }
        .询问钮.危:active { background: #9b3a32; }

    </style>
</head>

<body>

<div class="手机主题背景容器">

    <div class="全局白色遮罩"></div>

    <!-- ================================================================

    <!-- ================================================================

        <div class="手机界面内容">

                <div class="字段组">

                </div>

                <div class="字段组">
                    <div class="双列">
                        <div>
                            <div class="字段标签">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect>
                                    <line x1="3" y1="9.5" x2="21" y2="9.5"></line>
                                    <line x1="8" y1="2.5" x2="8" y2="6"></line>
                                    <line x1="16" y1="2.5" x2="16" y2="6"></line>
                                </svg>
                                生日

                            <div class="生日框">

                                        <rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect>
                                        <line x1="3" y1="9.5" x2="21" y2="9.5"></line>
                                        <line x1="8" y1="2.5" x2="8" y2="6"></line>

                <div class="默认行">
