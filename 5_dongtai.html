<!DOCTYPE html>
<!--
    5_dongtai —— 动态界面。
    从 1_shouyeyulan.html / 4_tongxun.html 底部导航「动态」点击跳转进入。

    顶部状态栏：左侧系统时间（与 1 / 4 页同款实时刷新）
                中间「动态」★ 绝对定位居中，不受左右两侧宽度影响
                右侧当前天气：温度 + 湿度（自动获取，见下方「天气说明」）

    下方轮播：
      ★ 16:9 —— 视窗与卡片本身都是 16:9
      ★ 从右到左连续匀速滚动（不是一张张切换），无缝循环
      ★ 立体感 —— perspective + rotateY + translateZ + scale，中心正对、
        两侧向后退（coverflow 式 3D）
      ★ 丝滑 —— requestAnimationFrame 驱动，按时间差匀速推进，
        只写 transform / opacity / z-index，不触发重排
      ★ 左右两侧白色透明渐变，边缘图片自然淡出

    图片：同级 2【图片】 文件夹 —— 3D图1 / 3D图2 / 3D图3 / 3D图4
          扩展名自动探测 png → jpg → jpeg → webp
          轨道里放 8 张 = 4 张 × 2 组，第二组用于无缝衔接

    底部导航：默认选中「动态」；★ 选中态只换 png + 文字加粗，图标不放大

    天气说明（重要）：
      浏览器无法直接读取 Android / iOS 的「系统天气」数据，本页的做法是
      「定位 + 联网查询」，这是 Web 能做到的最接近方案：
        ① 已缓存（10 分钟内）→ 先用缓存秒出，再后台刷新
        ② 手机定位成功 → Open-Meteo 按经纬度查（免费、无需 Key）
        ③ 定位被拒/超时 → wttr.in 按 IP 粗略定位
        ④ 仍失败 → 兜底坐标（福州）再试一次 Open-Meteo
        ⑤ 全失败 → 显示 --° / --%，保留上次缓存值，不报错不白屏
      注意：需联网；file:// 直接打开时部分浏览器会禁用定位，此时走 ③④。
            点右上角天气可手动刷新。

    风格：与 1 / 2 / 3 / 4 统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>动态</title>
    <style>
        /* ===== 统一色板（与 1_shouyeyulan.html 完全一致） ===== */
        :root {
            --ink: #333336;            /* 主文字：深灰 */
            --ink-2: #55555a;          /* 次级文字 */
            --ink-3: #7a7a80;          /* 弱文字（时间、提示） */
            --ink-4: #a4a4aa;          /* 占位语 */
            --accent: #4a4a50;         /* 强调：深灰（选中、聚焦） */
            --accent-soft: #d5d5d9;    /* 强调浅底 */
            --accent-hi: #e6e6ea;      /* 高亮底 */
            --accent-ink: #35353b;     /* 深灰字 */
            --panel: 255, 255, 255;    /* 面板基色 */
            --line: 158, 158, 162;     /* 描边基色 */
            --shade: 48, 48, 54;       /* 阴影基色 */
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* 卡片宽度占视窗的比例。视窗高度要按它反推 —— 见 .轮播视窗。
               改这一个值，卡片宽度与视窗高度会同步跟着变，不会脱节。 */
            --卡宽比: 0.68;

            /* ★ rgb 伴生变量：hex 变量【不能】直接进 rgba()（整条声明会被静默丢弃），
               要带透明度时必须用这批数值三元组。与 1 / 4 / 7 / 8 / 9 页同一套。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }

        /* ===== 全局重置 & 容器 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) {
            .手机主题背景容器 { box-shadow: none; }
        }

        .主题背景图片 {
            width: 100%;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* 全局白色遮罩：与 1 / 4 页一致 rgba(255,255,255,0.45) */
        .全局白色遮罩 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;     /* 中间标题绝对居中的参照 */
        }

        .系统时间 {
            font-weight: 500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* ★「动态」二字真正居中：
           用绝对定位脱离 flex 流，相对整条导航栏的中线对齐。
           若留在 space-between 流里，标题会随左右两侧宽度差而偏移 ——
           左边「09:30」窄、右边「26°│60%」宽，视觉上就是偏左的。 */
        .中间标题 {
            position: absolute;
            left: 0;
            right: 0;
            top: clamp(10px, 3vw, 14px);
            text-align: center;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;   /* 不挡左右两侧的点击 */
        }

        /* ===== 右侧天气：温度 + 湿度 ===== */
        .天气区 {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: clamp(3px, 1vw, 5px);
            font-size: clamp(11px, 3.2vw, 13px);
            color: var(--ink-2);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-variant-numeric: tabular-nums;
        }

        .天气图标 {
            width: clamp(12px, 3.4vw, 14px);
            height: clamp(12px, 3.4vw, 14px);
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .天气值 { font-weight: 500; }

        /* 获取中：轻微变淡，避免看起来像卡住 */
        .天气区.获取中 .天气值 { opacity: 0.5; }

        .天气分隔 {
            width: 1px;
            height: clamp(9px, 2.6vw, 11px);
            background: rgba(var(--line), 0.45);
            flex-shrink: 0;
        }

        /* ===== 中间滚动区 ===== */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 clamp(16px, 5vw, 20px);
            position: relative;
            z-index: 2;
            background: rgba(var(--panel), 0.15);
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ===== 轮播 =====
           ★ 与顶部状态栏的间隔固定 8.5px。
             注意：真正的「间隔」= 这里的上边距 + 卡片在视窗内的偏移。
             视窗高度已按卡片高度贴合（见下）、卡片也贴视窗顶（top:0），
             所以图片顶边到状态栏底边就是这 8.5px，不会多出额外留白。 */
        .轮播容器 {
            margin: 8.5px clamp(12px, 4vw, 16px) 0;
            position: relative;
        }

        /* 视窗：★ 16:9，所有图在其中从右向左穿过
           ★ 完全无底框：不设 background / border / box-shadow / backdrop-filter，
             图片直接浮在页面背景上。这里只保留三样「不产生可见框」的东西：
               overflow  —— 裁掉滑出范围的卡片
               mask      —— 让两侧边缘淡出到【真正的透明】
               touch-action —— 手势
           ★ 边缘淡出用 mask 而非覆盖层：
             原先是两层白色 linear-gradient 盖在图片上，那会留下两条白杠。
             mask 压的是图片自身的 alpha，末端是 transparent，
             所以淡出的终点是「露出主题背景」，而不是「变成白色」。 */
        .轮播视窗 {
            position: relative;
            width: 100%;
            /* ★ 高度 = 卡片高度，而不是 16:9。
               卡片宽度是 68%，16:9 的卡片高度只有 0.68 × 9/16 ≈ 38.25% 视窗宽；
               若视窗仍是 16:9（56.25% 宽），图片上下就会各空出约 9% 视窗宽
               （430px 屏约 36px）—— 这才是「离状态栏太远」的真正来源，
               光调 margin 是压不下去的。
               这里反推：16 / (9 × 卡宽比) ≈ 2.6144，即视窗高 = 卡片高。
               JS 会在量尺寸时再补一点底部余量给投影（无 JS 时按此比例兜底）。 */
            aspect-ratio: 2.6144;
            aspect-ratio: calc(16 / (9 * var(--卡宽比)));
            overflow: hidden;
            touch-action: pan-y;
            -webkit-mask-image: linear-gradient(to right,
                transparent 0%,
                #000 16%,
                #000 84%,
                transparent 100%);
            mask-image: linear-gradient(to right,
                transparent 0%,
                #000 16%,
                #000 84%,
                transparent 100%);
        }

        /* 轨道：3D 舞台。
           perspective 放在轨道上，卡片的 rotateY / translateZ 才有纵深感。 */
        .轮播轨道 {
            position: absolute;
            inset: 0;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            -webkit-perspective-origin: 50% 50%;
            perspective-origin: 50% 50%;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        /* 每一张图：绝对定位，位置 / 旋转 / 缩放全部由 JS 每帧写入 transform。
           top:50% + translateY(-50%) 做垂直居中 —— 卡片比视窗矮，
           上下留出的余量正好让 3D 旋转有施展空间。 */
        .轮播页 {
            position: absolute;
            top: 0;                     /* ★ 贴视窗顶：图片顶边 = 视窗顶边，
                                           间隔就只剩下 .轮播容器 的 8.5px 上边距 */
            left: 0;
            width: calc(var(--卡宽比) * 100%);   /* 两侧各露出约 16%，层次才看得出来 */
            aspect-ratio: 16 / 9;       /* ★ 卡片本身是 16:9（图片比例要求） */
            border-radius: clamp(10px, 3vw, 14px);
            overflow: hidden;
            transform-origin: 50% 50%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: transform;     /* 交给合成层，滚动才跟手 */
            box-shadow: 0 8px 22px rgba(var(--shade), 0.16);
        }

        .轮播图 {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* 任何比例都不变形，多余部分裁掉 */
            display: block;
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;       /* 手势交给视窗统一处理 */
        }

        /* 离中心越远，压的白色越多 —— 比 filter 稳，不会打断 3D 渲染上下文 */
        .轮播页::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #ffffff;
            opacity: var(--遮罩, 0);
            pointer-events: none;
        }

        /* 图片还没加载出来时的占位底纹 */
        .轮播页.无图 {
            background: repeating-linear-gradient(
                45deg,
                rgba(var(--line), 0.08) 0 10px,
                rgba(var(--line), 0.03) 10px 20px
            );
        }

        /* ================================================================
           ===== 动态流（轮播下方）—— 参考 QQ 空间，但按本页风格去框化 =====

           ★ 无底框：不给卡片铺白底、不加描边、不加投影、不加圆角。
             条与条之间只用一条细分割线隔开，内容直接落在主题背景上
             （与上方轮播区「悬浮」的观感保持一致）。

           ★ 纯文字：不展示配图九宫格，只有文字内容 —— 按需求精简。 */
        .动态流 {
            margin: clamp(14px, 4vw, 18px) clamp(12px, 4vw, 16px) 0;
            display: flex;
            flex-direction: column;
        }

        /* 每条之间用分割线隔离；第一条不加（上面就是轮播，不必再画一道） */
        .动态卡片 {
            padding: clamp(12px, 3.6vw, 15px) 0 0;
            border-top: 1px solid rgba(var(--line), 0.22);
        }

        .动态卡片 + .动态卡片 {
            margin-top: clamp(12px, 3.6vw, 15px);
        }

        /* ---------- 头部：头像 / 昵称 / 时间·来源 / 更多 ---------- */
        .动态头 {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2.4vw, 10px);
        }

        .动态头像 {
            width: clamp(32px, 9.5vw, 38px);
            height: clamp(32px, 9.5vw, 38px);
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(var(--line), 0.12);
        }

        .动态身份 {
            flex: 1;
            min-width: 0;
        }

        .动态昵称 {
            font-size: clamp(13px, 3.8vw, 15px);
            color: var(--ink);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .动态元信息 {
            font-size: clamp(10px, 2.9vw, 11.5px);
            color: var(--ink-3);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .动态更多 {
            flex-shrink: 0;
            width: clamp(22px, 6.5vw, 26px);
            height: clamp(22px, 6.5vw, 26px);
            border: none;
            background: transparent;
            color: var(--ink-3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- 正文（纯文字，无配图） ---------- */
        .动态正文 {
            margin-top: clamp(7px, 2.2vw, 9px);
            font-size: clamp(12.5px, 3.6vw, 14px);
            line-height: 1.68;
            color: var(--ink-2);
            word-break: break-word;
            /* 超过 4 行收起，避免长文把整页撑爆（QQ 空间同款「全文」折叠思路） */
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ---------- 互动栏：赞 / 评论 / 转发 ---------- */
        .动态互动 {
            margin-top: clamp(8px, 2.4vw, 10px);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(18px, 6vw, 30px);
            padding-bottom: clamp(2px, 1vw, 4px);
        }

        .互动项 {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.2vw, 6px);
            padding: clamp(4px, 1.2vw, 6px) 0;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: clamp(11px, 3.2vw, 12.5px);
            color: var(--ink-3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color .18s;
        }

        .互动项 svg {
            width: clamp(14px, 4.1vw, 16px);
            height: clamp(14px, 4.1vw, 16px);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* 点赞后：变红 + 心形填充 + 轻微弹一下 */
        .互动项.已赞 { color: #e0574a; }
        .互动项.已赞 svg { fill: #e0574a; stroke: #e0574a; }
        .互动项.已赞 svg { animation: 赞动 .32s ease; }

        @keyframes 赞动 {
            0% { transform: scale(1); }
            45% { transform: scale(1.28); }
            100% { transform: scale(1); }
        }

        /* ---------- 空态 ---------- */
        .动态空态 {
            text-align: center;
            color: var(--ink-4);
            font-size: clamp(12px, 3.4vw, 13.5px);
            padding: clamp(26px, 8vw, 36px) 0;
        }

        /* ================================================================
           ===== 评论区（点「评论」展开）=====
           ★ 与全站同款：无底框、只用一条浅分割线与正文隔开，
             不铺底色不加圆角 —— 它是动态卡片的一部分，不是浮层。
           ★ 评论本身也不加气泡：头像 + 名字 + 文字，靠缩进来表达层级。 */
        .评论区 {
            margin-top: clamp(6px, 1.8vw, 9px);
            padding-top: clamp(7px, 2vw, 9px);
            border-top: 1px solid rgba(var(--line), 0.14);
        }

        .评论列表 {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.8vw, 9px);
            max-height: 220px;
            overflow-y: auto;
        }

        .评论条 {
            display: flex;
            align-items: flex-start;
            gap: clamp(6px, 1.8vw, 8px);
        }

        .评论头像 {
            flex-shrink: 0;
            width: clamp(22px, 6.4vw, 26px);
            height: clamp(22px, 6.4vw, 26px);
            border-radius: 50%;
            object-fit: cover;
            background: rgba(var(--accent-rgb), 0.1);
        }

        .评论体 { flex: 1; min-width: 0; }

        .评论名 {
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-3);
            margin-bottom: 1px;
        }

        .评论文 {
            font-size: clamp(12px, 3.4vw, 13.5px);
            line-height: 1.55;
            color: var(--ink);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .评论空 {
            font-size: clamp(11px, 3.2vw, 12.5px);
            color: var(--ink-4);
            padding: clamp(4px, 1.2vw, 7px) 0;
        }

        /* 输入行：下划线输入框 + 胶囊发送键（与 6 页「发布」同款思路） */
        .评论输入行 {
            display: flex;
            align-items: center;
            gap: clamp(7px, 2vw, 9px);
            margin-top: clamp(7px, 2vw, 9px);
        }

        .评论输入 {
            flex: 1;
            min-width: 0;
            border: none;
            border-bottom: 1px solid rgba(var(--line), 0.22);
            background: transparent;
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            color: var(--ink);
            padding: clamp(5px, 1.5vw, 7px) 1px;
            outline: none;
            resize: none;
        }
        .评论输入::placeholder { color: var(--ink-4); }
        .评论输入:focus { border-bottom-color: rgba(var(--accent-rgb), 0.45); }

        .评论发送 {
            flex-shrink: 0;
            border: 1px solid rgba(var(--accent-rgb), 0.32);
            border-radius: 20px;
            background: transparent;
            color: var(--accent-ink);
            font-family: inherit;
            font-size: clamp(11px, 3.2vw, 12.5px);
            padding: clamp(4px, 1.2vw, 6px) clamp(11px, 3.2vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .评论发送:disabled { opacity: .38; cursor: default; }

        /* ================================================================
           ===== 转发面板：选一个联系人 =====
           居中弹层（不是全屏页），遮罩点空白处 / 取消即关。 */
        .转发遮罩 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--shade), 0.34);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }
        .转发遮罩.显示 { opacity: 1; pointer-events: auto; }

        .转发框 {
            width: min(78%, 260px);
            max-height: 68%;
            display: flex;
            flex-direction: column;
            /* ★ --panel 是「255, 255, 255」三元组，能直接进 rgba()；
                 别写成 hex —— hex 进 rgba() 是无效 CSS，整条声明会被静默丢弃。 */
            background: rgba(var(--panel), 0.98);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(var(--shade), 0.2);
        }

        .转发标题 {
            padding: clamp(10px, 3vw, 13px);
            font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink);
            text-align: center;
            border-bottom: 1px solid rgba(var(--line), 0.14);
        }

        .转发列表 {
            flex: 1;
            overflow-y: auto;
            padding: clamp(4px, 1.2vw, 6px) 0;
        }

        .转发人 {
            display: flex;
            align-items: center;
            gap: clamp(7px, 2vw, 9px);
            width: 100%;
            padding: clamp(7px, 2vw, 10px) clamp(12px, 3.4vw, 15px);
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            color: var(--ink);
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .转发人:active { background: rgba(var(--accent-rgb), 0.08); }

        .转发人头像 {
            flex-shrink: 0;
            width: clamp(26px, 7.4vw, 30px);
            height: clamp(26px, 7.4vw, 30px);
            border-radius: 50%;
            object-fit: cover;
            background: rgba(var(--accent-rgb), 0.1);
        }

        /* ★ 分区小标题：联系人 / 群聊 两段各挂一个，别让人以为群是联系人 */
        .转发分区标题 {
            padding: clamp(8px, 2.2vw, 11px) clamp(12px, 3.4vw, 15px) clamp(3px, 1vw, 5px);
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
        }

        /* 群头像用拼图：几张成员头像叠成一方，一眼看出「这是群不是人」 */
        .转发群像 {
            flex-shrink: 0;
            width: clamp(26px, 7.4vw, 30px);
            height: clamp(26px, 7.4vw, 30px);
            border-radius: 8px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: rgba(var(--accent-rgb), 0.1);
        }
        .转发群像 img { width: 100%; height: 100%; object-fit: cover; }

        .转发人数 {
            margin-left: auto;
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            flex-shrink: 0;
        }

        .转发取消 {
            border: none;
            border-top: 1px solid rgba(var(--line), 0.14);
            background: transparent;
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            color: var(--ink-3);
            padding: clamp(9px, 2.6vw, 12px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .转发空 {
            padding: clamp(14px, 4vw, 20px);
            text-align: center;
            font-size: clamp(11.5px, 3.3vw, 13px);
            color: var(--ink-4);
        }

        /* ================================================================
           ===== 发布入口（轮播下方 7px）—— 说说 / 视频 / 图片 =====

           ★ 小尺寸 + 无边框：三个入口只是弱化的文字入口，不抢视觉。
             无 border / 无底色 / 无圆角轮廓，只在按下时轻微加深文字色。 */
        .发布入口栏 {
            margin: 7px clamp(12px, 4vw, 16px) 0;   /* ★ 距轮播 7px */
            display: flex;
            align-items: center;
            justify-content: center;    /* ★ 三个入口整体居中 */
            gap: clamp(18px, 5.5vw, 26px);
        }

        .发布入口 {
            display: flex;
            align-items: center;
            gap: clamp(3px, 1vw, 4px);
            padding: clamp(3px, 1vw, 4px) 0;
            background: transparent;
            border: none;                   /* ★ 无边框 */
            font-family: inherit;
            font-size: clamp(11px, 3.1vw, 12px);
            color: var(--ink-3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color .16s, opacity .16s;
        }

        .发布入口:active { color: var(--ink); }

        .发布入口图标 {
            width: clamp(13px, 3.7vw, 14.5px);
            height: clamp(13px, 3.7vw, 14.5px);
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .发布入口文字 { font-weight: 500; white-space: nowrap; }

        /* ===== 底部导航 =====
           与 1 / 4 页同结构；★ 选中态只换图标 png + 文字加粗，图标不放大 */
        .底部导航栏 {
            flex-shrink: 0;
            z-index: 20;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: clamp(4px, 1.5vw, 6px) 0 calc(clamp(6px, 2vw, 8px) + env(safe-area-inset-bottom, 0px));
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-top: 1px solid rgba(var(--panel), 0.3);
        }

        .导航项 {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink-3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .导航文字 {
            font-size: clamp(9px, 2.5vw, 10px);
            margin-top: 2px;
        }

        .导航项.选中 {
            color: var(--ink);
            font-weight: 600;
        }

        .导航图标 {
            width: clamp(16px, 4.5vw, 18px);
            height: clamp(16px, 4.5vw, 18px);
            object-fit: contain;
            display: block;
            line-height: 1;
        }

        /* ★ 不放大：选中与未选中尺寸完全一致，只靠换图 + 文字加粗区分 */
        .导航项.选中 .导航图标 { transform: none; }

        .导航项:not(.选中) .导航图标 { opacity: 0.72; }

        /* ===== Toast（与 1 / 4 页同款） ===== */
        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px); background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="手机主题背景容器">
        <img class="主题背景图片" src="2【图片】/默认主题背景.png" alt="手机主题背景占位图">
        <div class="全局白色遮罩"></div>

        <!-- ===== 顶部固定区：时间 / 「动态」/ 天气 ===== -->
        <div class="顶部固定区">
            <div class="顶部导航栏">
                <div class="系统时间" id="系统时间">00:00</div>
                <div class="中间标题">动态</div>

                <div class="天气区" id="天气区" title="点击刷新天气">
                    <svg class="天气图标" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 13.5V5a2 2 0 1 1 4 0v8.5a4 4 0 1 1-4 0z"></path>
                    </svg>
                    <span class="天气值" id="天气温度">--°</span>
                    <span class="天气分隔"></span>
                    <svg class="天气图标" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3.2s5.3 5.6 5.3 9.4a5.3 5.3 0 0 1-10.6 0C6.7 8.8 12 3.2 12 3.2z"></path>
                    </svg>
                    <span class="天气值" id="天气湿度">--%</span>
                </div>
            </div>
        </div>

        <!-- ===== 中间滚动区 ===== -->
        <div class="手机界面内容">
            <div class="轮播容器">
                <div class="轮播视窗" id="轮播视窗">
                    <div class="轮播轨道" id="轮播轨道">
                        <!-- 8 张 = 4 张 × 2 组：第二组用于无缝衔接滚动 -->
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图1" data-序="0" alt="3D图1"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图2" data-序="1" alt="3D图2"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图3" data-序="2" alt="3D图3"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图4" data-序="3" alt="3D图4"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图1" data-序="0" alt="3D图1"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图2" data-序="1" alt="3D图2"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图3" data-序="2" alt="3D图3"></div>
                        <div class="轮播页 无图"><img class="轮播图" data-名="3D图4" data-序="3" alt="3D图4"></div>
                    </div>
                </div>
            </div>

            <!-- ===== 发布入口（距轮播 7px，图标 + 文字，参考 QQ 空间） =====
                 说说 → 打开发布面板（文字）；视频 / 图片 → 暂为占位 -->
            <div class="发布入口栏">
                <button class="发布入口" data-入口="说说" type="button" title="说说">
                    <svg class="发布入口图标" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 19.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7.5A2.5 2.5 0 0 1 17.5 16.5H8.5L4 19.5z"/>
                        <line x1="12" y1="8.6" x2="12" y2="13.4"/>
                        <line x1="9.6" y1="11" x2="14.4" y2="11"/>
                    </svg>
                    <span class="发布入口文字">说说</span>
                </button>

                <button class="发布入口" data-入口="视频" type="button" title="视频">
                    <svg class="发布入口图标" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="2.5" y="5.5" width="13" height="13" rx="2.5"/>
                        <path d="M15.5 10.2l6-3.4v10.4l-6-3.4z"/>
                    </svg>
                    <span class="发布入口文字">视频</span>
                </button>

                <button class="发布入口" data-入口="图片" type="button" title="图片">
                    <svg class="发布入口图标" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
                        <circle cx="8.6" cy="9.8" r="1.6"/>
                        <path d="M3.6 17.2l4.6-4.3 3.5 3.2 3.2-2.8 5.5 4.9"/>
                    </svg>
                    <span class="发布入口文字">图片</span>
                </button>
            </div>

            <!-- ===== 动态流（QQ 空间式，分割线隔离，纯文字，由 JS 渲染） ===== -->
            <div class="动态流" id="动态流"></div>
        </div>

        <!-- ===== 底部导航：默认选中「动态」 ===== -->
        <div class="底部导航栏">
            <div class="导航项">
                <img class="导航图标" src="2【图片】/小图标.png" alt=""
                     data-图标="2【图片】/小图标.png" data-图标选中="2【图片】/小图标选中.png">
                <div class="导航文字">聊天</div>
            </div>
            <div class="导航项">
                <img class="导航图标" src="2【图片】/小图标.png" alt=""
                     data-图标="2【图片】/小图标.png" data-图标选中="2【图片】/小图标选中.png">
                <div class="导航文字">通讯录</div>
            </div>
            <div class="导航项 选中">
                <img class="导航图标" src="2【图片】/小图标选中.png" alt=""
                     data-图标="2【图片】/小图标.png" data-图标选中="2【图片】/小图标选中.png">
                <div class="导航文字">动态</div>
            </div>
            <div class="导航项">
                <img class="导航图标" src="2【图片】/小图标.png" alt=""
                     data-图标="2【图片】/小图标.png" data-图标选中="2【图片】/小图标选中.png">
                <div class="导航文字">我的</div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <!-- ===== 转发面板：点动态卡片的「转发」→ 选一位联系人 / 一个群 =====
             内容由脚本运行时填充：先「联系人」后「群聊」两个分区，
             两边都没有时显示空态。 -->
        <div class="转发遮罩" id="转发遮罩">
            <div class="转发框" id="转发框">
                <div class="转发标题">转发给</div>
                <div class="转发列表" id="转发列表"></div>
                <button class="转发取消" id="转发取消" type="button">取消</button>
            </div>
        </div>

    </div>

    <script>
        /* ============================================================
         * 0. 通用：Toast
         * ============================================================ */
        (function () {
            window.showToast = function (消息) {
                const 元素 = document.getElementById('toast');
                if (!元素) return;
                元素.textContent = 消息;
                元素.classList.add('显示');
                clearTimeout(元素._计时);
                元素._计时 = setTimeout(() => 元素.classList.remove('显示'), 1800);
            };
        })();

        /* ============================================================
         * 1. 系统时间（与 1 / 4 页一致）
         * ============================================================ */
        (function () {
            const 时间元素 = document.getElementById('系统时间');
            function 更新时间() {
                const 现在 = new Date();
                const 小时 = String(现在.getHours()).padStart(2, '0');
                const 分钟 = String(现在.getMinutes()).padStart(2, '0');
                时间元素.textContent = 小时 + ':' + 分钟;
            }
            更新时间();
            setInterval(更新时间, 1000 * 30);
        })();

        /* ============================================================
         * 2. 天气：温度 + 湿度
         *    降级链：缓存(10分钟) → 定位+Open-Meteo → wttr.in(IP) → 兜底坐标 → --
         *    任何一步失败都不抛错，保留上一次结果。
         * ============================================================ */
        (function () {
            const 区域 = document.getElementById('天气区');
            const 温度元素 = document.getElementById('天气温度');
            const 湿度元素 = document.getElementById('天气湿度');

            const 缓存键 = '天气缓存';
            const 有效时长 = 10 * 60 * 1000;
            const 定位超时 = 6000;
            const 兜底坐标 = { 纬度: 26.0745, 经度: 119.2965, 名: '福州' };

            /* ========================================================
             *  权限记忆：只在第一次真正申请，之后默认放行
             *  ★ 用户点过一次「允许」后系统就记住了，代码再调
             *    getCurrentPosition 只会白白触发定位请求（状态栏转圈、
             *    偶发再次询问），体验很差。所以这里把「已授权过」连同
             *    首次拿到的坐标一起记下来，后续直接用，不再读权限。
             *  ★ 失效兜底：若坐标缓存被清 / 用户改了主意，删掉
             *    「已授权位置」这一项就会重新走一次真实定位。
             *  ★ 本段在 1 / 2 / 5 / 7 页各有一份，改动请四处同步。
             * ======================================================== */
            const 权限前缀 = '已授权_';

            function 权限已授权(名) {
                try { return localStorage.getItem(权限前缀 + 名) === '1'; } catch (e) { return false; }
            }
            function 记住权限(名) { try { localStorage.setItem(权限前缀 + 名, '1'); } catch (e) {} }

            // 首次定位拿到的坐标缓存（长期有效，不随天气缓存 10 分钟过期）
            const 位置键 = '已授权位置';

            function 读位置() {
                try {
                    const 原 = JSON.parse(localStorage.getItem(位置键));
                    if (原 && typeof 原.纬度 === 'number' && typeof 原.经度 === 'number') return 原;
                } catch (e) {}
                return null;
            }

            function 写位置(纬度, 经度) {
                try {
                    localStorage.setItem(位置键, JSON.stringify({ 纬度: 纬度, 经度: 经度, 时间: Date.now() }));
                } catch (e) {}
            }

            function 显示(温度, 湿度) {
                if (温度 !== null && 温度 !== undefined && !isNaN(温度)) {
                    温度元素.textContent = Math.round(温度) + '°';
                }
                if (湿度 !== null && 湿度 !== undefined && !isNaN(湿度)) {
                    湿度元素.textContent = Math.round(湿度) + '%';
                }
            }

            function 读缓存() {
                try {
                    const 原 = JSON.parse(localStorage.getItem(缓存键));
                    if (原 && typeof 原.温度 === 'number' && Date.now() - 原.时间 < 有效时长) return 原;
                } catch (e) {}
                return null;
            }

            function 写缓存(温度, 湿度) {
                try {
                    localStorage.setItem(缓存键, JSON.stringify({ 温度, 湿度, 时间: Date.now() }));
                } catch (e) {}
            }

            function 查OpenMeteo(纬度, 经度) {
                const 地址 = 'https://api.open-meteo.com/v1/forecast'
                    + '?latitude=' + encodeURIComponent(纬度)
                    + '&longitude=' + encodeURIComponent(经度)
                    + '&current=temperature_2m,relative_humidity_2m'
                    + '&timezone=auto';
                return fetch(地址).then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                }).then(d => {
                    const c = d && d.current;
                    if (!c || typeof c.temperature_2m !== 'number') throw new Error('无数据');
                    return { 温度: c.temperature_2m, 湿度: c.relative_humidity_2m };
                });
            }

            function 查Wttr() {
                return fetch('https://wttr.in/?format=j1').then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                }).then(d => {
                    const c = d && d.current_condition && d.current_condition[0];
                    if (!c) throw new Error('无数据');
                    return { 温度: parseFloat(c.temp_C), 湿度: parseFloat(c.humidity) };
                });
            }

            /** 真正向系统申请定位（会触发权限询问，只在第一次走） */
            function 真取定位() {
                return new Promise((完成, 失败) => {
                    if (!navigator.geolocation) return 失败(new Error('无定位模块'));
                    navigator.geolocation.getCurrentPosition(
                        p => 完成({ 纬度: p.coords.latitude, 经度: p.coords.longitude }),
                        e => 失败(e),
                        { timeout: 定位超时, maximumAge: 10 * 60 * 1000, enableHighAccuracy: false }
                    );
                });
            }

            /**
             * 取定位：★ 已授权过就直接用缓存坐标，不再读权限、不再触发定位请求。
             * 只有第一次（没有任何记录时）才真的去申请。
             */
            function 取定位() {
                const 缓存 = 读位置();
                if (缓存 && 权限已授权('位置')) return Promise.resolve(缓存);

                return 真取定位().then(位 => {
                    写位置(位.纬度, 位.经度);

        /* ============================================================
         * 3. 轮播：从右到左连续滚动 + coverflow 立体感
         *
         *    位移每帧递减（匀速），卡片位置 = i × 步进 + 位移。
         *    当位移越过一组的宽度就 +组宽 跳回，因为是第二组接上，视觉无缝。
         *    立体感：按卡片中心与视窗中心的偏移 d 算 rotateY / translateZ /
         *    scale / 白色蒙版 —— 中心正对，两侧向后退。
         * ============================================================ */
        (function () {
            const 视窗 = document.getElementById('轮播视窗');
            const 轨道 = document.getElementById('轮播轨道');
            const 卡片列表 = Array.from(轨道.querySelectorAll('.轮播页'));

            const 最大蒙 = 0.5;             // 最外侧压的白

            let 视窗宽 = 1, 卡宽 = 1, 步进 = 1, 组宽 = 1, 速度 = 40;
            let 位移 = 0;
            let 暂停 = false;
            let 上次 = 0;

            /* ---------- 图片：扩展名自动探测 ---------- */
            const 扩展候选 = ['png', 'jpg', 'jpeg', 'webp'];
            function 载入图片(img) {
                const 名 = img.dataset.名;

                function 去无图() {
                    const 页 = img.closest('.轮播页');
                    页 && 页.classList.remove('无图');
                }

                let 序 = 0;
                function 试下一个() {
                    if (序 >= 扩展候选.length) return;   // 全都没有 → 保留占位底纹
                    img.src = '2【图片】/' + 名 + '.' + 扩展候选[序++];
                }

                // ★ 用户在 10_lunbotu 换过图 → 优先用「轮播图_<序>」里的 dataURL
                const 序位 = img.dataset.序;
                if (序位 !== undefined) {
                    let 自定义 = '';
                    try { 自定义 = localStorage.getItem('轮播图_' + 序位) || ''; } catch (e) {}
                    if (自定义) {
                        // 自定义图坏了（dataURL 失效等）→ 自动退回默认图继续扩展名探测
                        img.addEventListener('error', 试下一个);
                        img.src = 自定义;
                        return;
                    }
                }
                img.addEventListener('error', 试下一个);
                试下一个();

                const img = 页.querySelector('.轮播图');
                if (img) 载入图片(img);
            });

            /* ---------- 量尺寸（只在尺寸变化时读一次，避免每帧重排） ---------- */
            function 量尺寸() {
                视窗宽 = 视窗.clientWidth || 1;
                卡宽 = 卡片列表[0].offsetWidth || (视窗宽 * 0.68);
                const 间距 = Math.max(10, 视窗宽 * 0.045);
                步进 = 卡宽 + 间距;
                组宽 = 步进 * 张数;
                速度 = 步进 / 每张秒;

                // 视窗高度 = 卡片高度 + 底部余量（给卡片的投影留地方，否则会被裁掉）。
                // 卡片已 top:0 贴顶，所以顶部间隔不受这里影响，仍是 8.5px。
                // CSS 里的 aspect-ratio 是无 JS 时的兜底；这里显式设 height 会覆盖它。
                const 卡高 = 卡宽 * 9 / 16;

            }

            /* ---------- 每帧摆放 ---------- */
            function 应用() {
                const 中心 = 视窗宽 / 2;
                for (let i = 0; i < 卡片列表.length; i++) {
                    const 卡 = 卡片列表[i];
                    const 左 = i * 步进 + 位移;
                    const 卡中心 = 左 + 卡宽 / 2;

                    // 完全在视窗外的卡片直接跳过，省掉无谓的样式写入
                    if (卡中心 < -卡宽 || 卡中心 > 视窗宽 + 卡宽) {
                        if (卡._可见 !== false) { 卡.style.visibility = 'hidden'; 卡._可见 = false; }
                        continue;
                    }
                    if (卡._可见 !== true) { 卡.style.visibility = 'visible'; 卡._可见 = true; }

                    // d：卡片中心相对视窗中心的归一化偏移，中心 0、右缘 1、左缘 -1
                    let t = (卡中心 - 中心) / 中心;

                    const 绝 = Math.abs(t);

                    const 缩 = 1 - 绝 * 最大缩;

                    const 蒙 = 绝 * 最大蒙;

                        + ' rotateY(' + 角.toFixed(2) + 'deg)'
                        + ' scale(' + 缩.toFixed(4) + ')';
                    卡.style.zIndex = String(Math.round(100 - 绝 * 50));
                    卡.style.setProperty('--遮罩', 蒙.toFixed(3));
                }

            function 帧(现在) {

                if (间隔 > 0.1) 间隔 = 0.1;

            function 复位() {

            /* ---------- 按住暂停，松手继续；★ 轻点 → 进轮播图设置（10_lunbotu）----------
               轮播是连续滚动的，press 与 drag 共用一套指针事件：
               只有「位移够小 + 时间够短」才算轻点，否则视为拖动，不跳转。
               点哪张就进哪张（按卡片上的 data-序 0~3）。 */
            const 轻点阈值 = 8;      // px：位移小于此值算轻点
            const 轻点时限 = 600;    // ms：按太久算长按，不跳
            let 按下点 = null;

            function 按下(e) {
                暂停 = true;
                按下点 = { x: e.clientX, y: e.clientY, t: Date.now() };
            }
            function 松开(e) {
                暂停 = false;
                const 起点 = 按下点;
                按下点 = null;
                if (!起点 || !e || typeof e.clientX !== 'number') return;
                const 移动 = Math.hypot(e.clientX - 起点.x, e.clientY - 起点.y);
                if (移动 > 轻点阈值 || Date.now() - 起点.t > 轻点时限) return;

                // 用落点反查卡片，避免拖动过程中 target 变了导致跳错张
                let 页 = null;
                if (typeof document.elementFromPoint === 'function') {
                    const 元 = document.elementFromPoint(e.clientX, e.clientY);
                    页 = 元 && 元.closest ? 元.closest('.轮播页') : null;
                }
                if (!页) 页 = e.target && e.target.closest ? e.target.closest('.轮播页') : null;
                if (!页) return;
                const 图 = 页.querySelector('.轮播图');
                const 序 = 图 && 图.dataset ? 图.dataset.序 : null;
                if (序 === null || 序 === undefined) return;
                window.打开轮播设置(序);
            }
            视窗.addEventListener('pointerdown', 按下);
            视窗.addEventListener('pointerup', 松开);
            视窗.addEventListener('pointercancel', 松开);
            视窗.addEventListener('pointerleave', 松开);
            视窗.style.cursor = 'pointer';

            /** 点哪张进哪张。挂 window 上，业务方可直接接管（与 4 页 window.联系人操作 同思路） */
            window.打开轮播设置 = function (序) {
                location.href = '10_lunbotu.html?序=' + encodeURIComponent(序);
            };

            document.addEventListener('visibilitychange', () => {
                // 回到前台时重置时间基准，防止一帧跳很远
                if (!document.hidden) 上次 = 0;
            });

            let 尺寸计时 = null;
            function 延迟重算() {
                clearTimeout(尺寸计时);
                尺寸计时 = setTimeout(复位, 150);
            }
            window.addEventListener('resize', 延迟重算);
            window.addEventListener('orientationchange', 延迟重算);
            window.addEventListener('load', 复位);

            复位();
            requestAnimationFrame(帧);
        })();
