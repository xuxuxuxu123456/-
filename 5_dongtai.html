                const 列表 = document.createElement('div');
                列表.className = '评论列表';
                元素.appendChild(列表);

                const 行 = document.createElement('div');
                行.className = '评论输入行';

                const 输入 = document.createElement('textarea');
                输入.className = '评论输入';
                输入.rows = 1;
                输入.placeholder = '说点什么…';
                输入.maxLength = 200;
                行.appendChild(输入);

                const 发送 = document.createElement('button');
                发送.className = '评论发送';
                发送.type = 'button';
                发送.textContent = '发送';
                发送.disabled = true;
                行.appendChild(发送);

                元素.appendChild(行);

                const 区 = {
                    元素: 元素,
                    开着: () => 元素.style.display !== 'none',
                    切换: () => {
                        元素.style.display = 区.开着() ? 'none' : '';
                        if (区.开着()) 输入.focus();
                    },
                    重画: () => 画列表(),
                };

                function 画列表() {
                    列表.innerHTML = '';
                    const 表 = 读评论(项.id);
                    if (!表.length) {
                        const 空 = document.createElement('div');
                        空.className = '评论空';
                        空.textContent = '还没有评论，来说第一句';
                        列表.appendChild(空);
                        return;
                    }
                    表.forEach(条 => {
                        const 行元 = document.createElement('div');
                        行元.className = '评论条';

                        const 头 = document.createElement('img');
                        头.className = '评论头像';
                        头.alt = '';
                        头.src = 建头像路径(条.人物);
                        行元.appendChild(头);

                        const 体 = document.createElement('div');
                        体.className = '评论体';
                        const 名 = document.createElement('div');
                        名.className = '评论名';
                        名.textContent = 条.人物 || '我';
                        const 文 = document.createElement('div');
                        文.className = '评论文';
                        文.textContent = 条.正文;
                        体.appendChild(名);
                        体.appendChild(文);
                        行元.appendChild(体);

                        列表.appendChild(行元);
                    });
                    /* 新评论在最下面，滚到底才看得见（微信/QQ 空间都是这个顺序） */
                    列表.scrollTop = 列表.scrollHeight;
                }

                输入.addEventListener('input', () => {
                    发送.disabled = !输入.value.trim();
                });
                输入.addEventListener('keydown', e => {
                    // 回车发送，Shift+回车换行（与 7 页输入框一致的手感）
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); 提交(); }
                });
                发送.addEventListener('click', 提交);

                function 提交() {
                    if (发评论(项, 输入.value, 评数元素, 区)) {
                        输入.value = '';
                        发送.disabled = true;
                    }
                }

                画列表();
                return 区;
            }

            /** 头像路径：通讯录里有就用通讯录的，没有退回内置映射 */
            function 建头像路径(人物) {
                const 名 = 取头像(人物);
                return '2【图片】/' + 名 + '.png';
            }

            /* ============================================================
             * 转发：选一位联系人 → 落一条消息进他的聊天记录
             *   ★ 落到「聊天记录_<id>」是 7 页的存档键，去 7 页就能看到，
             *     不用给 7 页加新的卡片类型（那要同时改渲染与卡片文案）。
             *   ★ 同时 +1 本页计数，并同步「联系人索引」的消息/时间 ——
             *     否则 1 页会话列表里看不出刚转发过。
             * ============================================================ */
            function 开转发(项, 转数元素) {
                const 遮罩 = document.getElementById('转发遮罩');
                const 列表 = document.getElementById('转发列表');
                if (!遮罩 || !列表) return;

                let 索引 = [];
                try {
                    const 原 = JSON.parse(localStorage.getItem('联系人索引'));
                    if (Array.isArray(原)) 索引 = 原;
                } catch (e) {}

                /* ★ 群聊单独一个键（群【不在】联系人索引里，否则会混进 4 页 A–Z 分组），
                     所以必须自己读一遍 —— 少了这段就是「建了群却转发不了」。 */
                let 群表 = [];
                try {
                    const 原 = JSON.parse(localStorage.getItem('群聊列表'));
                    if (Array.isArray(原)) 群表 = 原;
                } catch (e) {}

                列表.innerHTML = '';

                if (!索引.length && !群表.length) {
                    const 空 = document.createElement('div');
                    空.className = '转发空';
                    空.textContent = '还没有联系人或群聊，先去添加一位';
                    列表.appendChild(空);
                    遮罩.classList.add('显示');
                    return;
                }

                /** 分区小标题（有内容才挂，避免空分区留一块空白） */
                function 加标题(文) {
                    const 标题 = document.createElement('div');
                    标题.className = '转发分区标题';
                    标题.textContent = 文;
                    列表.appendChild(标题);
                }

                /* ---------- 联系人 ---------- */
                if (索引.length) {
                    加标题('联系人');
                    索引.forEach(人 => {
                        const 钮 = document.createElement('button');
                        钮.className = '转发人';
                        钮.type = 'button';
                        钮.dataset.id = String(人.id || '');

                        const 头 = document.createElement('img');
                        头.className = '转发人头像';
                        头.alt = '';
                        /* 通讯里存的可能是完整路径，也可能是裸文件名，两种都兜住 */
                        const 像 = String(人.头像 || '');
                        头.src = /^(data:|https?:|2【图片】\/)/.test(像)
                            ? 像 : 建头像路径(人.名称);
                        钮.appendChild(头);

                        const 名 = document.createElement('span');
                        名.textContent = 人.备注 || 人.名称 || '未命名';
                        钮.appendChild(名);

                        钮.addEventListener('click', () => {
                            关转发();
                            转发给(项, { id: 人.id, 名: 人.备注 || 人.名称 || '对方', 是群: false }, 转数元素);
                        });

                        列表.appendChild(钮);
                    });
                }

                /* ---------- 群聊 ---------- */
                if (群表.length) {
                    加标题('群聊');
                    群表.forEach(群 => {
                        const 钮 = document.createElement('button');
                        钮.className = '转发人';
                        钮.type = 'button';
                        钮.dataset.id = String(群.id || '');

                        /* ★ 群头像用成员拼图：一眼看出这是群不是人 */
                        const 拼 = document.createElement('div');
                        拼.className = '转发群像';
                        const 成员 = Array.isArray(群.成员) ? 群.成员 : [];
                        成员.slice(0, 4).forEach(m => {
                            const 图 = document.createElement('img');
                            图.alt = '';
                            图.src = 建头像路径(m.名);
                            拼.appendChild(图);
                        });
                        钮.appendChild(拼);

                        const 名 = document.createElement('span');
                        名.textContent = 群.名称 || '群聊';
                        钮.appendChild(名);

                        /* 人数 = 成员 + 我（与 18 页群资料的算法一致） */
                        const 人数 = document.createElement('span');
                        人数.className = '转发人数';
                        人数.textContent = (成员.length + 1) + ' 人';
                        钮.appendChild(人数);

                        钮.addEventListener('click', () => {
                            关转发();
                            转发给(项, { id: 群.id, 名: 群.名称 || '群聊', 是群: true }, 转数元素);
                        });

                        列表.appendChild(钮);
                    });
                }

                遮罩.classList.add('显示');
            }

            function 关转发() {
                const 遮罩 = document.getElementById('转发遮罩');
                if (遮罩) 遮罩.classList.remove('显示');
            }

            /**
             * 真转发：写聊天记录 + 计数 +1 + 同步会话列表
             * @param 目标 { id, 名, 是群 }  —— 群与联系人走【不同的表】存预览
             * @param 转数元素 可选的计数 span；给了就局部刷新，不整页重绘
             */
            function 转发给(项, 目标, 转数元素) {
                const id = String(目标.id || '');
                if (!id) return;

                const 摘要 = String(项.正文 || '').replace(/\s+/g, ' ').trim().slice(0, 40);
                const 文 = '[转发的动态] ' + (项.人物 || '') + '：' + 摘要;
                const d = new Date();
                const 时刻 = String(d.getHours()).padStart(2, '0') + ':'
                    + String(d.getMinutes()).padStart(2, '0');

                /* ① 进他的聊天记录（7 页的存档键，群聊也是同一个键） */
                const 键 = '聊天记录_' + id;
                let 表 = [];
                try {
                    const 原 = JSON.parse(localStorage.getItem(键));
                    if (Array.isArray(原)) 表 = 原;
                } catch (e) {}
                表.push({ 谁: '我', 文: 文, 时间戳: Date.now() });
                try { localStorage.setItem(键, JSON.stringify(表)); } catch (e) {}

                /* ② 本页计数 +1（存增量，基数在动态常量里） */
                转发表[项.id] = (转发表[项.id] || 0) + 1;
                写转发(转发表);

                /* ③ 同步会话列表 —— ★ 群在「群聊列表」里，不在「联系人索引」里，
                     写错表的话 1 页会话列表会完全看不出刚转发过。 */
                const 表键 = 目标.是群 ? '群聊列表' : '联系人索引';
                try {
                    const 表2 = JSON.parse(localStorage.getItem(表键));
                    if (Array.isArray(表2)) {
                        const 命中 = 表2.find(i => i && String(i.id) === id);
                        if (命中) {
                            命中.消息 = 文;
                            命中.时间 = 时刻;
                            localStorage.setItem(表键, JSON.stringify(表2));
                        }
                    }
                } catch (e) {}

                /* ④ 只刷这一条动态的转数，不整页重绘
                     ★★ 原先用 渲染() 全量重建：正在展开的评论区会被收起、
                        输入框里没发出去的字也一起没了 —— 转发一下把人写的评论弄丢，
                        这是最难被发现的那种 bug（没有报错，只是内容不见了）。 */
                if (转数元素) 转数元素.textContent = String(项.转 + (转发表[项.id] || 0));
                else 渲染();

                window.showToast && window.showToast('已转发给 ' + (目标.名 || '对方'));
            }

            function 建卡片(项) {
                const 卡 = document.createElement('article');
                卡.className = '动态卡片';
                卡.dataset.id = 项.id;

                // 头部
                const 头 = document.createElement('div');
                头.className = '动态头';

                const 头像 = document.createElement('img');
                头像.className = '动态头像';
                头像.alt = 项.人物;
                const 头像名 = 取头像(项.人物);
                let 头序 = 0;
                const 头像试 = () => {
                    if (头序 >= 扩展候选.length) { 头像.style.visibility = 'hidden'; return; }
                    头像.src = '2【图片】/' + 头像名 + '.' + 扩展候选[头序++];
                };
                头像.addEventListener('error', 头像试);
                头像试();

                const 身份 = document.createElement('div');
                身份.className = '动态身份';
                const 昵称 = document.createElement('div');
                昵称.className = '动态昵称';
                昵称.textContent = 项.人物;
                const 元 = document.createElement('div');
                元.className = '动态元信息';
                元.textContent = 相对时间(项.分) + ' · 来自 ' + 项.来源
                    + (项.可见性 && 项.可见性.模式 && 项.可见性.模式 !== '公开'
                        ? (' · ' + 项.可见性.模式) : '');
                身份.appendChild(昵称);
                身份.appendChild(元);

                const 更多 = document.createElement('button');
                更多.className = '动态更多';
                更多.type = 'button';
                更多.title = '更多';
                更多.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
                更多.addEventListener('click', () => window.showToast && window.showToast('更多操作开发中'));

                头.appendChild(头像);
                头.appendChild(身份);
                头.appendChild(更多);
                卡.appendChild(头);

                // 正文
                if (项.正文) {
                    const 正文 = document.createElement('div');
                    正文.className = '动态正文';
                    正文.textContent = 项.正文;
                    卡.appendChild(正文);
                }

                // 互动栏
                const 互动 = document.createElement('div');
                互动.className = '动态互动';

                const 赞按钮 = document.createElement('button');
                赞按钮.className = '互动项 赞按钮' + (已赞表[项.id] ? ' 已赞' : '');
                赞按钮.type = 'button';
                赞按钮.appendChild(建SVG('赞'));
                const 赞数 = document.createElement('span');
                赞数.textContent = String(项.赞 + (已赞表[项.id] ? 1 : 0));
                赞按钮.appendChild(赞数);
                赞按钮.addEventListener('click', () => {
                    const 现在 = !已赞表[项.id];
                    已赞表[项.id] = 现在;
                    写赞(已赞表);
                    赞按钮.classList.toggle('已赞', 现在);
                    赞数.textContent = String(项.赞 + (现在 ? 1 : 0));
                });

                const 评论按钮 = document.createElement('button');
                评论按钮.className = '互动项';
                评论按钮.type = 'button';
                评论按钮.appendChild(建SVG('评论'));
                const 评数 = document.createElement('span');
                评数.textContent = String(项.评 + 读评论(项.id).length);
                评论按钮.appendChild(评数);

                const 转发按钮 = document.createElement('button');
                转发按钮.className = '互动项';
                转发按钮.type = 'button';
                转发按钮.appendChild(建SVG('转发'));
                const 转数 = document.createElement('span');
                转数.textContent = String(项.转 + (转发表[项.id] || 0));
                转发按钮.appendChild(转数);
                转发按钮.addEventListener('click', () => 开转发(项, 转数));

                互动.appendChild(赞按钮);
                互动.appendChild(评论按钮);
                互动.appendChild(转发按钮);
                卡.appendChild(互动);

                /* ===== 评论区：点「评论」展开 / 收起 =====
                   ★ 一次建好、反复显隐，不做「每次点都重建」——
                     重建会把输入框里还没发出去的字弄丢。 */
                const 区 = 建评论区(项, 评数);
                卡.appendChild(区.元素);
                评论按钮.addEventListener('click', () => 区.切换());

                return 卡;
            }

            /* ---------- 我发布的动态：读 / 写 localStorage「我的动态」 ---------- */
            const 我的键 = '我的动态';
            const 读我的 = () => {
                try {
                    const 原 = JSON.parse(localStorage.getItem(我的键));
                    return Array.isArray(原) ? 原 : [];
                } catch (e) { return []; }
            };
            const 写我的 = 表 => {
                try { localStorage.setItem(我的键, JSON.stringify(表)); } catch (e) {}
            };

            // 发布者身份：昵称取首页设的「用户昵称」，没有就显示「我」
            function 我的昵称() {
                try {
                    const n = (localStorage.getItem('用户昵称') || '').trim();
                    if (n) return n;
                } catch (e) {}
                return '我';
            }

            function 渲染() {
                // 我发的排在最前（QQ 空间也是自己的动态在最上面）
                const 全部 = 读我的().concat(动态数据);
                if (!全部.length) {
                    容器.innerHTML = '<div class="动态空态">还没有动态</div>';
                    return;
                }
                容器.innerHTML = '';
                全部.forEach(项 => 容器.appendChild(建卡片(项)));
            }

            window.动态流渲染 = 渲染;

            /* 转发面板：点遮罩空白处 / 点「取消」→ 关掉（不转发） */
            (function 绑转发面板() {
                const 遮罩 = document.getElementById('转发遮罩');
                const 框 = document.getElementById('转发框');
                const 取消 = document.getElementById('转发取消');
                if (!遮罩) return;
                遮罩.addEventListener('click', e => {
                    /* 点在框内部不算（框里是选人按钮，冒泡上来会误关） */
                    if (框 && 框.contains(e.target)) return;
                    关转发();
                });
                if (取消) 取消.addEventListener('click', 关转发);
                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape' && 遮罩.classList.contains('显示')) 关转发();
                });
            })();

            /* ★ 对外留口子：与 window.动态流渲染 同思路，
                 给测试与其它页面接管用（不然只能靠点 DOM 才测得动）。 */
            window.动态互动 = {
                读评论: 读评论,
                写评论: 写评论,
                发评论: 发评论,
                开转发: 开转发,
                关转发: 关转发,
                转发给: 转发给,
                读转发: () => 转发表,
            };

            渲染();
        })();

        /* ============================================================
         * 3.6 发布入口：说说 / 视频 / 图片
         *     ★ 发布已独立成 6_fabudongtai.html，这里只负责带类型跳转：
         *         说说 → 6_fabudongtai.html?type=说说
         *         视频 → 6_fabudongtai.html?type=视频
         *         图片 → 6_fabudongtai.html?type=图片
         *     6 页发表后写 localStorage「我的动态」并返回本页，本页自动渲染。
         * ============================================================ */
        (function () {
            const 入口列表 = Array.from(document.querySelectorAll('.发布入口'));

            入口列表.forEach(按 => {
                按.addEventListener('click', () => {
                    const 类型 = 按.dataset.入口 || '说说';
                    location.href = '6_fabudongtai.html?type=' + encodeURIComponent(类型);
                });
            });
        })();

        /* ============================================================
         * 4. 底部导航
         *    ★ 点击即跳转，不做任何放大；选中态只换 png + 文字加粗。
         * ============================================================ */
        (function () {
            const 导航列表 = Array.from(document.querySelectorAll('.底部导航栏 .导航项'));

            const 跳转页面 = {
                聊天: '1_shouyeyulan.html',
                通讯录: '4_tongxun.html',
                我的: '8_wode.html'
            };

            导航列表.forEach(项 => {
                项.addEventListener('click', () => {
                    const 文字 = 项.querySelector('.导航文字')?.textContent?.trim();

                    if (文字 && 跳转页面[文字]) {
                        location.href = 跳转页面[文字];
                        return;
                    }

                    // 点的是当前页（动态）：不提示、不切换、不放大
                    if (项.classList.contains('选中')) return;

                    if (文字) window.showToast(文字 + ' 页面开发中');
                });
            });
        })();
    </script>


<script>
/* ===== 主题背景：读全局设置（由 9_zhutishezhi.html 写入，全站共用）=====
   ① 自定义：直接用 dataURL
   ② 内置：按索引取 2【图片】 下的主题（0 = 默认主题背景，1~5 = 背景1~背景5）
      扩展名自动探测 png → jpg → jpeg → webp，素材不是 png 也显示得出来
   ③ 没设置 / 索引为 0：保持页面里写死的默认图，不动 */
(function () {
    var 图 = document.querySelector('.主题背景图片');
    if (!图) return;
    var 存 = null;
    try { 存 = JSON.parse(localStorage.getItem('主题背景') || 'null'); } catch (e) {}
    if (!存) return;

    if (存.源 === '自定义' && 存.数据) { 图.src = 存.数据; return; }

    if (存.源 === '默认' && typeof 存.索引 === 'number' && 存.索引 > 0) {
        var 名 = '背景' + 存.索引;
        var 候选 = ['png', 'jpg', 'jpeg', 'webp'], 序 = 0;
        图.addEventListener('error', function () {
            if (序 < 候选.length) 图.src = '2【图片】/' + 名 + '.' + 候选[序++];
        });
        图.src = '2【图片】/' + 名 + '.' + 候选[序++];
    }
})();
</script>
    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时
 *     把仍在通话中的音乐放出来。全部原因解除才恢复。
 *   ★ 会记住「占用前是否在播」，本来没放音乐就不会凭空启动。
 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);
        })).catch(() => null);
    }

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */
    function 读状态() {
        try { return JSON.parse(localStorage.getItem(状态键) || 'null'); } catch (e) { return null; }
    }

    function 写状态(存) {
        try { localStorage.setItem(状态键, JSON.stringify(存)); } catch (e) {}
    }

    /* ---------------------------------------------------------------
     * 主体
     * ------------------------------------------------------------- */
    const 元素id = '全局音乐播放器';

    /* =========================================================================
     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位
     *
     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */
    const 占用 = new Set();
    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {
        return document.getElementById('音乐播放器') || document.getElementById(元素id);
    }

    const 全局音频 = {
        /** 暂停背景音乐（可重入；同一原因重复调用无害） */
        暂停(原因) {
            const 键 = 原因 || '未命名';
            if (占用.size === 0) {
                const a = 取音频();
                占用前在播 = !!a && !a.paused;
            }
            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */
        恢复(原因) {
            const 键 = 原因 || '未命名';
            if (!占用.has(键)) return;
            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）
            if (!占用前在播) return;                 // 本来就没在播 → 不凭空启动
            const a = 取音频();
            if (a && a.paused) {
                const 试 = a.play();
                if (试 && typeof 试.catch === 'function') 试.catch(() => {});
            }
        },

        /** 强制清掉所有占用（异常路径兜底用） */
        清除() { 占用.clear(); },

        占用中() { return 占用.size > 0; },
        占用表() { return Array.from(占用); },
        是否在播() { const a = 取音频(); return !!a && !a.paused; },
    };
    /* ★ 无论让不让位都挂上：让位时它操作的是 4 页自己的播放器，
       调用方（语音条 / 通话）不必关心自己在哪个页面。 */
    window.全局音频 = 全局音频;

    function 启动() {
        /* ★★ 让位：4 页有完整播放器（#音乐播放器），这里绝不能再建第二个 audio。
              注意 7 页那个是 #语音播放器（点语音消息用的），与本脚本无关，
              各播各的，所以【只】认 #音乐播放器 这一个 id。 */
        if (document.getElementById('音乐播放器')) return;
        /* 防重：脚本万一被引了两次，也只建一个 audio */
        if (document.getElementById(元素id)) return;

        const 存 = 读状态();
        // 没在播（或压根没播过）→ 安静退出，不建元素、不占资源
        if (!存 || !存.播放中 || !存.名) return;

        const 音频 = document.createElement('audio');
        音频.id = 元素id;
        音频.dataset.全局音乐 = '1';        // 便于排查 / 测试定位
        音频.preload = 'metadata';
        document.body.appendChild(音频);

        const 目标 = Math.max(0, Number(存.时间) || 0);
        let 已定位 = false;      // loadedmetadata 只处理一次（切目录会重复触发）
        let 目录序 = 0;
        let 上传链接 = '';

        /* 跳回上次的秒数再播。★ 先 seek 后 play：
           否则会从 0 开始，听感上像换了一首。 */
        音频.addEventListener('loadedmetadata', () => {
            if (已定位) return;
            已定位 = true;
            const 长 = isFinite(音频.duration) ? 音频.duration : 0;
            try {
                音频.currentTime = 长 > 0
                    ? Math.min(目标, Math.max(0, 长 - 0.3))
                    : 目标;
            } catch (e) {}
            续播();
        });

        /* 目录逐个试：与 4 页 载入当前目录() 同款（文件缺失 / 解码失败都能兜住） */
        音频.addEventListener('error', () => {
            if (目录序 < 目录候选.length) {
                音频.src = encodeURI(目录候选[目录序++] + 存.名);
            }
        });

        /* 播完了：不自动切歌（这里没有播放列表），停住并把状态改成「没在播」，
           免得下一次进任意页面又从头播一遍。 */
        音频.addEventListener('ended', () => {
            写状态({ id: 存.id, 名: 存.名, 类型: 存.类型, 时间: 0, 播放中: false });
        });

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */
        function 存一次(播放中) {
            写状态({
                id: 存.id, 名: 存.名, 类型: 存.类型,
                时间: 音频.currentTime || 0,
                /* ★ 同 4 页那个坑：只认真正的布尔。pagehide / beforeunload
                     的监听器会把 Event 对象当第一个参数传进来，
                     `播放中 === undefined` 拦不住它 → `!!Event` = true。 */
                播放中: typeof 播放中 !== 'boolean' ? !音频.paused : 播放中,
            });
        }
        // 播着的时候每秒存一次，中途崩溃 / 强杀也不会丢太多
        setInterval(() => { if (!音频.paused) 存一次(true); }, 1000);
        // 离开页面再存一次：跳转、切后台、关闭三种情况都覆盖
        const 存一次同步 = () => 存一次();
        window.addEventListener('pagehide', 存一次同步);
        window.addEventListener('beforeunload', 存一次同步);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') 存一次同步();
        });

        /* ------------------------------------------------------------
         * 补播：浏览器会拦「没有用户手势」的自动播放，这是硬限制，绕不过去。
         *   策略：
         *     ① 直接播；
         *     ② 被拒 → 【持续】监听用户交互，直到真的播起来才撤监听；
         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没
         *      ready），失败后就再也没机会了 —— 表现正是「切过去没声音」。
         *      必须【成功才停】，这是这段里最要紧的一句。
         * ---------------------------------------------------------- */
        const 事件名 = ['pointerdown', 'touchstart', 'click', 'keydown'];

        function 撤补播() {
            if (!补播中) return;
            补播中 = false;
            事件名.forEach(n => document.removeEventListener(n, 试补播, true));
            document.removeEventListener('visibilitychange', 见可见);
            收提示();
        }

        function 见可见() {
            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();                     // 老浏览器无 Promise：当成功处理
        }

        /** 被拦 → 挂持续监听 + 显示提示条 */
        function 展提示() {
            if (!补播中) {
                补播中 = true;
                /* ★ 捕获阶段：冒泡阶段可能被页面自己的 stopPropagation 吃掉 */
                事件名.forEach(n => document.addEventListener(n, 试补播, true));
                document.addEventListener('visibilitychange', 见可见);
            }
            亮提示();
        }

        /* ---- 提示条：自建，不依赖各页自己的 toast 实现（各页不统一）---- */
        let 提示元素 = null;
        function 亮提示() {
            if (提示元素) return;
            const 条 = document.createElement('div');
            条.id = '全局音乐提示';
            条.textContent = '♪ 音乐已就绪，点一下继续播放';
            // 样式全内联 + !important：各页 CSS 互不统一，不这样会被盖掉 / 变形
            条.setAttribute('style', [
                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
</body>
</html>
