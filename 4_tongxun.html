                渲染索引条(分组表.map(g => g.字母));
                无结果.classList.remove('显示');
                /* ★ 每次重绘都要重新绑：列表是重建的，旧的监听跟着 DOM 一起没了 */
                绑长按删除();
            }

            /**
             * ★ 长按联系人 → 删除联系人（【连带】清掉他的会话与聊天记录）
             *
             *   ★★ 与「1 页长按会话框」是【两个功能】，别混：
             *     这里删的是【联系人本身】，所以会话框和聊天记录一起没；
             *     1 页长按会话框只删会话，联系人还留在通讯录里。
             *
             *   ★ 清理动作走 window.联系人删除（唯一源：联系人删除.js），
             *     这里只负责取身份 + 弹确认 + 删完重绘。
             *   ★ 删完必须重绘：4 页是按 A–Z 分组渲染的，
             *     只删 DOM 会留下一个空的分组字母（比如「L」下面没人了）。
             */
            function 绑长按删除() {
                const 助手 = window.联系人删除;
                if (!助手 || typeof 助手.绑长按 !== 'function') return;
                Array.from(列表区.querySelectorAll('.联系人项')).forEach(行 => {
                    助手.绑长按(行, async () => {
                        const id = String(行.dataset.id || '');
                        const 名 = String(行.dataset.名称 || '').trim();
                        const 备注 = String(行.dataset.备注 || '').trim();
                        if (!id && !名) return;
                        const 显示 = 备注 || 名;
                        const 好 = await 助手.确认(
                            '删除联系人',
                            /* ★ 说清连带关系：会话框和聊天记录会一起没 */
                            '将删除「' + 显示 + '」及其会话框、聊天记录、'
                              + '角色档案、头像与音色设置，无法恢复。',
                            '删除');
                        if (!好) return;
                        助手.清联系人(id, 名);
                        /* ★ 重绘：分组字母可能变空 */
                        渲染();
                    });
                });
            }

            function 渲染索引条(字母表) {
                索引条.innerHTML = '';
                if (!字母表.length) { 索引条.classList.add('隐藏'); return; }
                索引条.classList.remove('隐藏');

                字母表.forEach(字母 => {
                    const 格 = document.createElement('div');
                    格.className = '索引字母';
                    格.dataset.字母 = 字母;
                    格.textContent = 字母;
                    索引条.appendChild(格);
                });
            }

            // ===== 索引条：点 / 滑到哪个字母就滚到哪个分组 =====
            const 滚动容器 = document.querySelector('.手机界面内容');

            function 字母按位置(客户Y) {
                const 格列表 = Array.from(索引条.querySelectorAll('.索引字母'));
                if (!格列表.length) return null;
                const 框 = 索引条.getBoundingClientRect();
                let 命中 = 格列表[0];
                格列表.forEach(格 => {
                    const r = 格.getBoundingClientRect();
                    if (客户Y >= r.top) 命中 = 格;
                });
                return 命中.dataset.字母;
            }

            function 定位到(字母) {
                const 目标 = 分组元素表.find(g => g.字母 === 字母);
                if (!目标 || !滚动容器) return;
                // 分组顶部对齐滚动容器顶部，减去一点余量更自然
                const 顶 = 目标.元素.offsetTop - 滚动容器.offsetTop;
                滚动容器.scrollTo ? 滚动容器.scrollTo({ top: 顶, behavior: 'smooth' })
                                  : (滚动容器.scrollTop = 顶);

                索引条.querySelectorAll('.索引字母').forEach(格 => {
                    格.classList.toggle('高亮', 格.dataset.字母 === 字母);
                });
            }

            function 显示气泡(字母) {
                索引气泡.textContent = 字母;
                索引气泡.classList.add('显示');
            }

            function 隐藏气泡() {
                索引气泡.classList.remove('显示');
                索引条.querySelectorAll('.索引字母').forEach(格 => 格.classList.remove('高亮'));
            }

            let 索引拖动 = false;

            function 索引开始(e) {
                索引拖动 = true;
                索引条.setPointerCapture && 索引条.setPointerCapture(e.pointerId);
                const 字母 = 字母按位置(e.clientY);
                if (字母) { 定位到(字母); 显示气泡(字母); }
            }

            function 索引移动(e) {
                if (!索引拖动) return;
                const 字母 = 字母按位置(e.clientY);
                if (字母) { 定位到(字母); 显示气泡(字母); }
            }

            function 索引结束() {
                if (!索引拖动) return;
                索引拖动 = false;
                // 气泡稍等一下再收，手指离开太快会看不见
                setTimeout(隐藏气泡, 320);
            }

            索引条.addEventListener('pointerdown', 索引开始);
            索引条.addEventListener('pointermove', 索引移动);
            索引条.addEventListener('pointerup', 索引结束);
            索引条.addEventListener('pointercancel', 索引结束);

            // ===== 搜索：命中名称 / 备注 / 消息，高亮；空分组自动隐藏 =====
            function 执行搜索(关键字) {
                关键字 = String(关键字 || '').trim();
                const 所有项 = Array.from(列表区.querySelectorAll('.联系人项'));
                const 所有组 = Array.from(列表区.querySelectorAll('.联系人分组'));
                /* ★ 群聊也参与搜索（按群名匹配） */
                const 所有群 = Array.from(列表区.querySelectorAll('.群聊项'));
                const 群组 = 列表区.querySelector('.群聊分组');

                if (!关键字) {
                    所有项.forEach(行 => {
                        行.classList.remove('隐藏');
                        写回名称(行, '');
                    });
                    所有组.forEach(组 => 组.classList.remove('隐藏'));
                    所有群.forEach(行 => 行.classList.remove('隐藏'));
                    if (群组) 群组.classList.remove('隐藏');
                    无结果.classList.remove('显示');
                    return;
                }

                无结果.textContent = '未找到相关联系人';

                const 小写 = 关键字.toLowerCase();
                let 有结果 = false;

                // 群聊：整组一起显隐
                if (群组 && 所有群.length) {
                    let 群命中 = 0;
                    所有群.forEach(行 => {
                        const 命中 = String(行.dataset.名称 || '').toLowerCase().includes(小写);
                        行.classList.toggle('隐藏', !命中);
                        if (命中) { 群命中++; 有结果 = true; }
                    });
                    群组.classList.toggle('隐藏', 群命中 === 0);
                }

                所有组.forEach(组 => {
                    let 组内命中 = 0;
                    组.querySelectorAll('.联系人项').forEach(行 => {
                        const 名称 = 行.dataset.名称 || '';
                        const 备注 = 行.dataset.备注 || '';
                        // 消息不在界面上显示了，但仍参与匹配：按最近消息内容也能搜到人
                        const 消息 = 行.dataset.消息 || '';
                        const 命中 = (名称 + ' ' + 备注 + ' ' + 消息).toLowerCase().includes(小写);

                        if (命中) {
                            组内命中++;
                            有结果 = true;
                            行.classList.remove('隐藏');
                            写回名称(行, 关键字);
                        } else {
                            行.classList.add('隐藏');
                        }
                    });
                    // 整组都没命中 → 连同分组字母一起藏起来
                    组.classList.toggle('隐藏', 组内命中 === 0);
                });

                无结果.classList.toggle('显示', !有结果);
            }

            // 名称行：按有无备注渲染成「备注（原名）」或「昵称」，并高亮关键字
            function 写回名称(行, 关键字) {
                const 名称行 = 行.querySelector('.联系人名称');
                if (!名称行) return;

                const 名称 = 行.dataset.名称 || '';
                const 备注 = 行.dataset.备注 || '';

                if (备注) {
                    名称行.innerHTML = 高亮(备注, 关键字)
                        + '<span class="联系人原名">（' + 高亮(名称, 关键字) + '）</span>';
                } else {
                    名称行.innerHTML = 高亮(名称, 关键字);
                }
            }

            输入框.addEventListener('input', (e) => 执行搜索(e.target.value));
            // 手机键盘「搜索 / 回车」：收起键盘
            输入框.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') 输入框.blur();
            });

            // 别的页面改了会话 → 回到本页时重渲染（首页跳转过来不派发 storage）
            function 需要重渲染() { 渲染(); }
            window.addEventListener('pageshow', 需要重渲染);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') 需要重渲染();
            });
            window.addEventListener('storage', (e) => {
                // 2 页保存联系人（新增/编辑）会更新「联系人索引」→ 此处自动刷新列表
                if (e.key === '联系人索引' || e.key === '会话列表') 需要重渲染();
            });

            渲染();
        })();

        // ===== 3. 音乐播放器：三首默认曲目 + 上传曲目 + 常驻播放列表 =====
        (function () {
            const 音频 = document.getElementById('音乐播放器');
            const 按钮 = document.getElementById('播放按钮');
            const 上一首按钮 = document.getElementById('上一首按钮');
            const 下一首按钮 = document.getElementById('下一首按钮');
            const 上传按钮 = document.getElementById('上传按钮');
            const 文件输入 = document.getElementById('音频文件输入');
            const 轨道 = document.getElementById('进度条轨道');
            const 填充 = document.getElementById('进度条填充');
            const 当前时间文本 = document.getElementById('当前时间');
            const 总时长文本 = document.getElementById('总时长');
            const 曲名文本 = document.getElementById('曲名');
            const 歌曲列表 = document.getElementById('歌曲列表');
            const 头像容器 = document.getElementById('旋转头像容器');

            // 目录候选：html 与 1【音乐】同级时第一条命中；html 挪进子文件夹时自动回退
            const 目录候选 = ['1【音乐】/', '../1【音乐】/'];
            const 默认曲目名 = ['草莓奶油.mp3', '春日约会.mp3', '夏日气泡.mp3'];

            // 曲目：{ id, 名, 类型:'默认'|'上传', 链接 }
            //   默认 → 按「名」去 1【音乐】 里找；上传 → 「链接」是 blob URL，可直接播
            let 曲目表 = [];
            let 当前索引 = 0;
            let 时长 = 0;          // 当前曲目总秒数；0 = 还没读到
            let 拖动中 = false;
            let 目录索引 = 0;
            /* ★★ 进页面时要接着播的进度：{ 索引, 时间, 播放中 }
               ★ 关键：它【不是】用一次就丢的一次性标记。
                 目录候选是逐个试的（1【音乐】/ 找不到就换 ../1【音乐】/），
                 每次换目录都会 音频.load() —— 而 load() 会把 currentTime 归零
                 并【再次】触发 loadedmetadata。
                 原来在这里 `待恢复 = null` 一次性消费掉，第二次就没人再把进度
                 拉回来了 → 表现正是「切个页面回来从头播」。
                 现在只在【用户主动换歌】（索引对不上）时才清。 */
            let 恢复目标 = null;
            /* 是否已真的播起来（由 timeupdate 置位）—— 用来区分
               「刚 load 完、进度还是 0」与「正常播到一半」，避免误 seek。 */
            let 已起播 = false;
            const 时长缓存 = {};   // id → 秒，播过一次就记住，列表里直接显示

            // ===== 跨页续播：把「哪首 + 播到几秒 + 在不在播」记进 localStorage =====
            //     切到别的界面再回来，从原进度接着播，不从头开始、也不中断。
            const 状态键 = '音乐播放状态';

            // 显式传入 播放中 更可靠：事件触发时音频.paused 可能还没翻转
            function 保存状态(播放中) {
                const 项 = 曲目表[当前索引];
                if (!项) return;
                /* ★★ 只认真正的布尔 —— 不能写 `播放中 === undefined`：
                     pagehide / beforeunload 的监听器会把【Event 对象】当第一个参数
                     传进来，它不是 undefined，于是 `!!Event` = true ——
                     结果「在 4 页暂停了音乐再跳走」，存档却记成「播放中」，
                     下一个页面会自己响起来。 */
                if (typeof 播放中 !== 'boolean') 播放中 = !音频.paused;
                try {
                    localStorage.setItem(状态键, JSON.stringify({
                        id: 项.id,
                        名: 项.名,
                        类型: 项.类型,
                        时间: 音频.currentTime || 0,
                        播放中: !!播放中
                    }));
                } catch (e) {}
            }

            function 读状态() {
                try { return JSON.parse(localStorage.getItem(状态键)); } catch (e) { return null; }
            }

            // 按 id 优先、文件名兜底，在曲目表里找回上次那一首
            function 定位已存(存) {
                if (!存) return -1;
                let i = 曲目表.findIndex(项 => 项.id === 存.id);
                if (i === -1 && 存.名) i = 曲目表.findIndex(项 => 项.名 === 存.名);
                return i;
            }

            function 生成id() {
                return 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function 去扩展(名) {
                return String(名 || '').replace(/\.[^.]+$/, '') || '未命名';
            }

            function 建(标签, 类名, 文本) {
                const el = document.createElement(标签);
                if (类名) el.className = 类名;
                if (文本 != null) el.textContent = 文本;
                return el;
            }

            function 格式化(秒) {
                if (!isFinite(秒) || 秒 < 0) return '0:00';
                const 分 = Math.floor(秒 / 60);
                const 秒位 = Math.floor(秒 % 60);
                return `${分}:${String(秒位).padStart(2, '0')}`;
            }

            // ===== 上传曲目持久化：IndexedDB（浏览器不支持就只在本会话有效） =====
            const 库名 = '音乐库';
            const 表名 = '音频';

            function 打开库() {
                return new Promise((完成, 失败) => {
                    if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
                    let 请求;
                    try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
                    请求.onupgradeneeded = () => {
                        const db = 请求.result;
                        if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
                    };
                    请求.onsuccess = () => 完成(请求.result);
                    请求.onerror = () => 失败(请求.error || new Error('打开失败'));
                });
            }

            function 跑事务(模式, 处理) {
                return 打开库().then(db => new Promise((完成, 失败) => {
                    const 事务 = db.transaction(表名, 模式);
                    const 结果 = 处理(事务.objectStore(表名));
                    事务.oncomplete = () => 完成(结果 && 结果.result !== undefined ? 结果.result : null);
                    事务.onerror = () => 失败(事务.error || new Error('事务失败'));
                }));
            }

            function 读上传() {
                return 跑事务('readonly', 表 => 表.getAll()).catch(() => []);
            }

            function 写上传(记录) {
                return 跑事务('readwrite', 表 => 表.put(记录)).catch(() => null);
            }

            function 删上传(id) {
                return 跑事务('readwrite', 表 => 表.delete(id)).catch(() => null);
            }

            // ===== 曲目表组装：三首默认 → localStorage 追加 → 上传 =====
            function 组装(上传记录) {
                const 表 = 默认曲目名.map(名 => ({ id: '默认_' + 名, 名, 类型: '默认', 链接: '' }));

                // 可选：往 localStorage「音乐列表」写文件名数组，可追加 1【音乐】 里的其它歌
                let 存的 = null;
                try { 存的 = JSON.parse(localStorage.getItem('音乐列表')); } catch (e) {}
                if (Array.isArray(存的)) {
                    存的.forEach(项 => {
                        const 名 = typeof 项 === 'string' ? 项 : String((项 && 项.名) || '');
                        /* ★★ id 必须【稳定】：原来用 生成id() 每次刷新都是新的随机值，
                             那存档里的 id 跨页面永远匹配不上，只能靠「名」兜底；
                             一旦文件名有个空格 / 大小写差异，定位就失败 →
                             退回第 0 首从头播。按名生成 id，跨会话恒定。
                             （旧的随机 id 存档仍能被「名」兜底匹配，不影响兼容。） */
                        if (名) 表.push({ id: '列表_' + 名, 名, 类型: '默认', 链接: '' });
                    });
                }

                (上传记录 || []).forEach(项 => {
                    if (!项 || !项.id) return;
                    let 链接 = '';
                    try { 链接 = URL.createObjectURL(项.数据); } catch (e) {}
                    if (链接) 表.push({ id: 项.id, 名: 项.名 || '本地音频', 类型: '上传', 链接 });
                });

                return 表;
            }

            function 刷新列表显示() {
                if (!歌曲列表) return;
                歌曲列表.innerHTML = '';

                曲目表.forEach((项, i) => {
                    const 行 = 建('div', '歌曲项' + (i === 当前索引 ? ' 当前' : ''));
                    行.dataset.索引 = String(i);

                    // 左侧小音符：固定字符串，可安全走 innerHTML
                    const 标记 = 建('span', '歌曲标记');
                    标记.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
                        + '<path d="M9.5 17.5V6.8l8-1.8v10"></path>'
                        + '<circle cx="7" cy="17.5" r="2.2"></circle>'
                        + '<circle cx="15" cy="15" r="2.2"></circle></svg>';
                    行.appendChild(标记);

                    行.appendChild(建('span', '歌曲名', 去扩展(项.名)));
                    行.appendChild(建('span', '歌曲时长',
                        时长缓存[项.id] ? 格式化(时长缓存[项.id]) : '--:--'));

                    // 只有上传的才能删，默认曲目删不掉
                    if (项.类型 === '上传') {
                        const 删 = 建('button', '歌曲删除', '×');
                        删.title = '移除这首';
                        删.setAttribute('aria-label', '移除这首');
                        删.dataset.id = 项.id;
                        行.appendChild(删);
                    }

                    行.addEventListener('click', (e) => {
                        if (e.target.closest('.歌曲删除')) return;
                        选曲(i);
                    });

                    歌曲列表.appendChild(行);
                });

                校准列表高度();
            }

            // 量出真实行高后精确卡住三首：加了新的就在这三首的高度里下滑
            function 校准列表高度() {
                if (!歌曲列表) return;
                const 行 = 歌曲列表.querySelector('.歌曲项');
                if (!行 || !行.offsetHeight) return;        // 无布局时（如测试环境）保持 CSS 兜底值
                const 间距 = parseFloat(getComputedStyle(歌曲列表).rowGap) || 0;
                歌曲列表.style.maxHeight = (行.offsetHeight * 3 + 间距 * 2 + 2) + 'px';
            }

            // ===== 载入与播放 =====
            function 重置显示() {
                时长 = 0;
                填充.style.width = '0%';
                当前时间文本.textContent = '0:00';
                总时长文本.textContent = '0:00';
                曲名文本.textContent = 去扩展(曲目表[当前索引] && 曲目表[当前索引].名);
            }

            function 载入(索引) {
                if (!曲目表.length) return;
                当前索引 = (索引 + 曲目表.length) % 曲目表.length;
                /* ★ 换歌（用户切歌 / 点列表 / 自动接下一首）→ 恢复目标作废。
                     同一首（含换目录重试）则保留，靠它把进度拉回来。 */
                if (恢复目标 && 恢复目标.索引 !== 当前索引) 恢复目标 = null;
                已起播 = false;
                目录索引 = 0;
                重置显示();
                刷新列表显示();
                载入当前目录();
            }

            function 载入当前目录() {
                const 项 = 曲目表[当前索引];
                if (!项) return;

                // 上传来的：链接可直接播，不再拼目录
                if (项.链接) {
                    音频.src = 项.链接;
                    音频.load();
                    return;
                }

                if (目录索引 >= 目录候选.length) {
                    // 全部候选都不可用（文件缺失 / 空文件 / 解码失败）：静默降级，不抛错
                    总时长文本.textContent = '音频未就绪';
                    return;
                }
                音频.src = encodeURI(目录候选[目录索引++] + 项.名);
                音频.load();
            }

            /* ★★ 幂等的进度恢复：loadedmetadata / durationchange 都会调。
                 换目录重试时 音频.load() 会把 currentTime 归零并再次触发
                 loadedmetadata —— 靠这里把进度重新拉回目标秒数。
                 ★ 只在「还没播起来」或「进度被 load() 清零（< 1 秒）」时才 seek，
                   正常播放到一半绝不干扰，也不会把用户手动拖的进度抢回去。 */
            function 尝试恢复() {
                if (!恢复目标 || 恢复目标.索引 !== 当前索引) return;
                const 目标 = 时长 > 0
                    ? Math.min(恢复目标.时间, Math.max(0, 时长 - 0.3))
                    : 恢复目标.时间;
                const 现 = 音频.currentTime || 0;
                const 需要 = !已起播 || 现 < 1;
                if (需要 && 目标 > 0 && Math.abs(现 - 目标) > 0.5) {
                    try { 音频.currentTime = Math.max(0, 目标); } catch (e) {}
                }
                if (恢复目标.播放中 && !已起播) 尝试续播();
            }

            function 刷新进度() {
                const 当前 = 音频.currentTime || 0;
                填充.style.width = (时长 > 0 ? Math.min(100, (当前 / 时长) * 100) : 0) + '%';
                当前时间文本.textContent = 格式化(当前);
            }

            音频.addEventListener('loadedmetadata', () => {
                const 项 = 曲目表[当前索引];
                if (isFinite(音频.duration) && 音频.duration > 0) {
                    时长 = 音频.duration;
                    总时长文本.textContent = 格式化(时长);
                    if (项) { 时长缓存[项.id] = 时长; 刷新列表显示(); }
                } else {
                    总时长文本.textContent = '--:--';
                }

                // 进页面时的续播：跳回上次的秒数，该播的接着播
                尝试恢复();

                刷新进度();
            });

            // 部分环境下 duration 要等 durationchange 才拿得到，这里补一道
            音频.addEventListener('durationchange', () => {
                const 项 = 曲目表[当前索引];
                if (isFinite(音频.duration) && 音频.duration > 0) {
                    时长 = 音频.duration;
                    总时长文本.textContent = 格式化(时长);
                    if (项) { 时长缓存[项.id] = 时长; 刷新列表显示(); }
                }
                尝试恢复();      // ★ 同样补一道，保证进度不被 load() 吞掉
            });

            音频.addEventListener('timeupdate', () => {
                已起播 = true;   // ★ 真的播起来了，后续不再强行 seek
                if (!拖动中) 刷新进度();
            });

            音频.addEventListener('play', () => {
                按钮.classList.add('播放中');
                按钮.setAttribute('aria-label', '暂停');
                头像容器.classList.add('转动');                 // 播了才转
                document.body.classList.add('播放中');
                保存状态(true);
            });

            音频.addEventListener('pause', () => {
                按钮.classList.remove('播放中');
                按钮.setAttribute('aria-label', '播放');
                头像容器.classList.remove('转动');              // 暂停即定格在当前角度
                document.body.classList.remove('播放中');
                保存状态(false);
            });

            音频.addEventListener('ended', () => {
                按钮.classList.remove('播放中');
                按钮.setAttribute('aria-label', '播放');
                头像容器.classList.remove('转动');
                document.body.classList.remove('播放中');
                保存状态(false);
                if (曲目表.length > 1) 切歌(1, true);   // 多首时自动接下一首
            });

            // 当前目录加载失败 → 试下一个候选目录
            音频.addEventListener('error', 载入当前目录);

            function 尝试播放() {
                const 尝试 = 音频.play();
                // 浏览器可能拒绝自动播放；被拒就保持暂停态，不抛未捕获异常
                if (尝试 && typeof 尝试.catch === 'function') 尝试.catch(() => {});
            }

            // 续播：没有用户手势时浏览器多半会拦，拦了就等第一次触摸/点击再补一次
            function 尝试续播() {
                const 尝试 = 音频.play();
                if (尝试 && typeof 尝试.catch === 'function') {
                    尝试.catch(() => {
                        const 补播 = () => {
                            document.removeEventListener('pointerdown', 补播);
                            document.removeEventListener('touchstart', 补播);
                            音频.play().catch(() => {});
                        };
                        document.addEventListener('pointerdown', 补播, { once: true });
                        document.addEventListener('touchstart', 补播, { once: true });
                    });
                }
            }

            function 切换播放() {
                if (音频.paused) 尝试播放();
                else 音频.pause();
            }

            // 切歌：播放中的话切完接着播；暂停状态只换歌不自动播
            function 切歌(步长, 自动播) {
                const 正在播 = !音频.paused;
                载入(当前索引 + 步长);
                if (正在播 || 自动播) 尝试播放();
            }

            // 点播放列表里的曲目：切过去并立即播
            function 选曲(索引) {
                if (索引 === 当前索引) { 切换播放(); return; }   // 点当前这首 = 播放 / 暂停
                载入(索引);
                尝试播放();
            }

            按钮.addEventListener('click', 切换播放);
            上一首按钮.addEventListener('click', () => 切歌(-1, false));
            下一首按钮.addEventListener('click', () => 切歌(1, false));

            // ===== 上传本地音频：存进 IndexedDB → 进列表 → 立即试听 =====
            上传按钮.addEventListener('click', () => 文件输入.click());

            文件输入.addEventListener('change', () => {
                const 文件 = 文件输入.files && 文件输入.files[0];
                文件输入.value = '';                      // 清空，同一个文件可以连续选两次
                if (!文件) return;

                const 记录 = { id: 生成id(), 名: 文件.name || '本地音频', 数据: 文件 };
                写上传(记录).then(() => {
                    曲目表.push({ id: 记录.id, 名: 记录.名, 类型: '上传', 链接: URL.createObjectURL(文件) });
                    刷新列表显示();
                    载入(曲目表.length - 1);
                    尝试播放();                           // 上传即试听；被浏览器拦下就停在暂停态
                });
            });

            // ===== 移除上传的曲目 =====
            if (歌曲列表) {
                歌曲列表.addEventListener('click', (e) => {
                    const 删 = e.target.closest('.歌曲删除');
                    if (!删) return;
                    const id = 删.dataset.id;
                    const 位置 = 曲目表.findIndex(项 => 项.id === id);
                    if (位置 === -1) return;

                    const 是当前 = 位置 === 当前索引;
                    const 项 = 曲目表[位置];
                    if (项.链接) { try { URL.revokeObjectURL(项.链接); } catch (err) {} }
                    曲目表.splice(位置, 1);
                    delete 时长缓存[id];
                    删上传(id);

                    if (是当前) {
                        音频.pause();
                        载入(Math.min(位置, 曲目表.length - 1));
                    } else {
                        if (位置 < 当前索引) 当前索引--;
                        刷新列表显示();
                    }
                });
            }

            // ===== 进度条：按下 / 拖动定位，松手才真正 seek =====
            function 按位置跳转(客户X) {
                if (时长 <= 0) return;
                const 框 = 轨道.getBoundingClientRect();
                const 比例 = Math.min(1, Math.max(0, (客户X - 框.left) / 框.width));
                填充.style.width = (比例 * 100) + '%';
                当前时间文本.textContent = 格式化(比例 * 时长);
                return 比例 * 时长;
            }

            轨道.addEventListener('pointerdown', (e) => {
                拖动中 = true;
                轨道.setPointerCapture && 轨道.setPointerCapture(e.pointerId);
                const 目标 = 按位置跳转(e.clientX);
                if (目标 != null) 音频.currentTime = 目标;
            });

            轨道.addEventListener('pointermove', (e) => {
                if (!拖动中) return;
                按位置跳转(e.clientX);
            });

            轨道.addEventListener('pointerup', (e) => {
                if (!拖动中) return;
                拖动中 = false;
                const 目标 = 按位置跳转(e.clientX);
                if (目标 != null) 音频.currentTime = 目标;
            });

            轨道.addEventListener('pointercancel', () => { 拖动中 = false; });

            // ===== 启动：先读上传记录，再组装列表，最后接着上次的进度播 =====
            读上传().then(记录 => {
                曲目表 = 组装(记录);

                const 存 = 读状态();
                const 起始 = 定位已存(存);
                if (起始 !== -1) {
                    恢复目标 = { 索引: 起始, 时间: Number(存.时间) || 0, 播放中: !!存.播放中 };
                }

                刷新列表显示();
                载入(起始 !== -1 ? 起始 : 0);
            });

            // 播着的时候每秒存一次进度，切页面 / 关页面时也能接上
            setInterval(() => { if (!音频.paused) 保存状态(); }, 1000);

            // 离开页面前再存一次：跳转、切后台、关闭都覆盖到
            window.addEventListener('pagehide', 保存状态);
            window.addEventListener('beforeunload', 保存状态);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') 保存状态();
            });
        })();

        // ===== 3.5 旋转头像 = 用户头像：进入时回填 + 首页改完实时同步 =====
        //     首页裁剪确认后写入 localStorage「用户头像」，这里靠三件事跟上：
        //     ① 进入页面时读一次；② 别的页面写入触发的 storage 事件；
        //     ③ 从首页跳转过来（storage 事件可能不派发）→ 回到前台时再读一次。
        (function () {
            const 头像 = document.getElementById('旋转头像');
            const 键 = '用户头像';
            const 默认头像 = 头像.getAttribute('src');   // 占位图 2【图片】/圆形头像1.png
            let 上次值 = null;

            function 应用(值) {
                if (值 === 上次值) return;         // 没变化就不动，避免无谓重绘打断旋转动画
                上次值 = 值;
                头像.src = (值 && String(值).trim()) ? 值 : 默认头像;
            }

            function 读取() {
                let 值 = null;
                try { 值 = localStorage.getItem(键); } catch (e) {}
                应用(值);
            }

            读取();

            // 首页与本页同标签页跳转时不派发 storage，用页面可见性变化兜底
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') 读取();
            });
            window.addEventListener('pageshow', 读取);
            window.addEventListener('focus', 读取);

            // 另一标签页 / 另一页面改了头像 → 实时跟上
            window.addEventListener('storage', (e) => {
                if (e.key === 键) 应用(e.newValue && String(e.newValue).trim() ? e.newValue : 默认头像);
            });
        })();

        // ===== 4. 加号菜单：点右上角「+」在按钮下方展开（照搬首页） =====
        (function () {
            const 遮罩 = document.getElementById('添加菜单遮罩');
            const 加号 = document.getElementById('添加图标');
            const 菜单框 = 遮罩.querySelector('.添加菜单框');

            function 定位() {
                const 位置 = 加号.getBoundingClientRect();
                菜单框.style.top = (位置.bottom + 6) + 'px';
                菜单框.style.right = Math.max(10, window.innerWidth - 位置.right) + 'px';
            }

            function 打开() {
                定位();
                遮罩.classList.add('显示');
                加号.classList.add('选中态');
            }

            function 关闭() {
                遮罩.classList.remove('显示');
                加号.classList.remove('选中态');
            }

            function 已开() {
                return 遮罩.classList.contains('显示');
            }

            加号.addEventListener('click', (e) => {
                e.stopPropagation();
                已开() ? 关闭() : 打开();
            });

            遮罩.addEventListener('click', (e) => {
                if (e.target === 遮罩) 关闭();
            });

            const 页面 = {
                添加好友: '2_haoyouxinxi.html?mode=new',
                /* ★ 一起聊天（= 发起群聊）：与 1 页同一个入口页，from=4 让它返回本页。
                     ★ 两个动作名都留着：1 页叫「一起聊天」，旧的「发起群聊」也能命中，
                       免得以后改回来忘了加映射。 */
                一起聊天: '17_faqiqunliao.html?from=4',
                发起群聊: '17_faqiqunliao.html?from=4',
                一起阅读: '22_yuedu.html?from=4',   // 一起阅读（书城 / 书架 / 作者中心）
            };
            // 尚未接入的菜单项：给一句明确反馈，避免点了像没点一样
            const 待接入 = {};

            document.querySelectorAll('.添加菜单项').forEach(项 => {
                项.addEventListener('click', () => {
                    const 动作 = 项.dataset.动作;
                    关闭();
                    if (页面[动作]) {
                        /* ★ jsdom 里 location.href 不可写，先记观察口便于测试 */
                        window.最后跳转 = 页面[动作];
                        location.href = 页面[动作];
                        return;
                    }
                    if (待接入[动作]) showToast(待接入[动作] + ' 功能开发中');
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && 已开()) 关闭();
            });
        })();

        // ===== 5. 底部导航：切换选中态；选中项图标不变大 =====
        //    「聊天」回首页，其余仅切外观（离开本页 / 未实现的页面不做跳转）。
        (function () {

    <script id="全局音乐">

 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）

 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }

 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')

    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {

            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;

     * 存档读写

     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *

                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');

            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着

            const 条 = 提示元素;

            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);

            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }

            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();

 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
</body>
</html>
