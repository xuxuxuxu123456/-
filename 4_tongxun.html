<!DOCTYPE html>
<!--
    4_tongxun —— 通讯录界面。
    从 1_shouyeyulan.html 底部导航「通讯录」点击跳转进入。

    布局：顶部固定区（系统时间 / 中间标题「通讯录」/ 右上角「+」，照搬首页）
          搜索框（功能照搬首页：命中高亮 + 无结果提示）
          搜索栏下方 8.5px：左侧圆形循环转动头像（白色描边）
                           右侧音乐播放器（无底框，进度条时长随音频自动读取）
          底部导航（默认选中「通讯录」；选中态图标不放大）

    音乐：默认三首 —— 草莓奶油.mp3 / 春日约会.mp3 / 夏日气泡.mp3，
          均放在 1【音乐】 文件夹（与当前 html 同级；挪进子文件夹时自动回退 ../1【音乐】/）。
          可点曲名行右侧的「+」上传本地音频，上传的曲子存进 IndexedDB，刷新后仍在。
          播放区下方是常驻播放列表：默认露出三首，加了新的可下滑查看，点哪首播哪首。
    续播：当前曲目与进度存进 localStorage「音乐播放状态」，
          切到别的界面再回来，自动回到那一首并从原进度接着播。
    背景遮罩：rgba(255,255,255,0.45)，与首页完全一致。
    风格：与 1 / 2 / 3 统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
    联系人：数据来自首页会话框「会话列表」（首页 6.5 段导出，读不到时用内置兜底快照）。
            分割线上下各 20px；下方按「备注 || 昵称」首字母分组（A–Z，其余归 #，置底）。
            汉字拼音首字母查内嵌全表（CJK 基本区 20902 字，按码点 O(1) 索引，零依赖）。
            右侧 A-Z 索引条可点可滑，拖动时中间浮大字母气泡；搜索命中高亮且空分组自动隐藏。
            每行昵称下方是「发送消息 / 好友信息」两个文字按钮，分别跳首页会话页与好友资料页；
            跳转前把该联系人写入 localStorage「当前联系人」，并预留 window.联系人操作(动作, 项) 供业务接管。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>通讯录</title>
    <style>
        /* ===== 统一色板（与 1_shouyeyulan.html 完全一致） ===== */
        :root {
            --ink: #333336;            /* 主文字：深灰 */
            --ink-2: #55555a;          /* 次级文字 */
            --ink-3: #7a7a80;          /* 弱文字（时间、提示） */
            --ink-4: #a4a4aa;          /* 占位语 */
            --accent: #4a4a50;         /* 强调：深灰（选中、聚焦） */
            --accent-soft: #d5d5d9;    /* 强调浅底 */
            --accent-hi: #e6e6ea;      /* 高亮底 */
            --accent-ink: #35353b;     /* 深灰字 */
            --panel: 255, 255, 255;    /* 面板基色 */
            --line: 158, 158, 162;     /* 描边基色 */
            --shade: 48, 48, 54;       /* 阴影基色 */
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* ★★ 上面那批是 hex（#xxxxxx），【不能】直接塞进 rgba() ——
               rgba(var(--accent), .92) 展开成 rgba(#4a4a50, .92)，是无效值，
               整条声明会被浏览器静默丢弃（白底白字就是这么来的）。
               要带透明度时用下面这批【数值形式】的伴生变量：
                 正确：rgba(var(--accent-rgb), 0.92)
                 错误：rgba(var(--accent), 0.92)
            */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;

        }

        /* ===== 全局重置 & 容器 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) {
            .手机主题背景容器 {
                box-shadow: none;
            }
        }

        .主题背景图片 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            height: 100dvh;
        }

        /* 全局白色遮罩：与首页完全一致 rgba(255,255,255,0.45) */
        .全局白色遮罩 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 顶部固定区（照搬首页） ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            background: rgba(var(--panel), var(--glass));
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;
        }

        .系统时间 {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .中间标题 {
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            letter-spacing: 1px;
        }

        /* 右上角加号：菜单入口（照搬首页） */
        .添加图标 {
            font-size: clamp(17px, 5vw, 20px);
            line-height: 1;
            color: var(--ink-2);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .添加图标.选中态 {
            color: var(--accent);
        }

        /* ===== 加号菜单弹窗（照搬首页） ===== */
        .添加菜单遮罩 {
            position: fixed;
            inset: 0;
            z-index: 115;
            background: rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            display: none;
            touch-action: none;
            overscroll-behavior: contain;
        }
        .添加菜单遮罩.显示 {
            display: block;
        }

        .添加菜单框 {
            position: absolute;
            top: clamp(46px, 13vw, 58px);
            right: clamp(12px, 4vw, 16px);
            width: min(52vw, 178px);
            background: rgba(255, 255, 255, 0.65);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(var(--line), 0.8);
            border-radius: 16px;
            padding: clamp(10px, 3vw, 12px) clamp(12px, 3.5vw, 14px);
            box-shadow: 0 10px 30px rgba(var(--shade), 0.16),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .添加菜单列表 {
            display: flex;
            flex-direction: column;
            gap: clamp(2px, 1vw, 4px);
        }

        .添加菜单项 {
            display: flex;
            align-items: center;
            gap: clamp(9px, 3vw, 11px);
            padding: clamp(9px, 3vw, 11px) clamp(8px, 2.5vw, 10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .添加菜单图标 {
            width: clamp(19px, 5.5vw, 22px);
            height: clamp(19px, 5.5vw, 22px);
            flex-shrink: 0;
            color: var(--accent-ink);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .添加菜单文字 {
            font-size: clamp(13px, 3.8vw, 14px);
            color: var(--ink);
            line-height: 1.3;
        }

        /* ===== 搜索框（照搬首页） ===== */
        .搜索框容器 {
            margin: 0 clamp(12px, 4vw, 16px);
            background: rgba(var(--panel), var(--glass));
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: clamp(6px, 2vw, 8px) clamp(10px, 3.5vw, 14px);
        }

        .图标 {
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            overflow: visible;
        }

        .放大镜图标 {
            width: clamp(14px, 4vw, 16px);
            height: clamp(14px, 4vw, 16px);
            stroke-width: 2;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink-3);
            margin-right: 8px;
        }

        .搜索输入框 {
            border: none;
            background: transparent;
            outline: none;
            font-size: clamp(13px, 3.5vw, 14px);
            color: var(--ink-2);
            width: 100%;
        }

        .搜索输入框::placeholder {
            color: var(--ink-3);
        }

        /* ===== 中间滚动区 ===== */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-x: none;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 clamp(16px, 5vw, 20px);   /* 顶部不设 padding，保证与搜索框的 8.5px 距离精确 */
            position: relative;
            z-index: 2;
            background: rgba(var(--panel), 0.15);
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .手机界面内容::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* ===== 音乐播放区：搜索栏下方 8.5px，再整体下移 8.8px → 17.3px，无底框 ===== */
        .音乐播放区 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 14px);
            margin: 17.3px clamp(12px, 4vw, 16px) 0;   /* 8.5 + 8.8 */
            /* 无底框：不设 background / border / border-radius / box-shadow */
        }

        /* 左侧：圆形循环转动头像，白色描边 */
        .旋转头像容器 {
            flex-shrink: 0;
            width: clamp(48px, 13vw, 56px);
            height: clamp(48px, 13vw, 56px);
            border-radius: 50%;
            overflow: hidden;
            /* 白色描边用 box-shadow 模拟，不占布局、不影响圆形裁切 */
            box-shadow: 0 0 0 2.5px #ffffff, 0 2px 8px rgba(var(--shade), 0.14);
            animation: 循环旋转 8s linear infinite;
            /* 默认停转：只有音频真的在播时才转，暂停即定格在当前角度 */
            animation-play-state: paused;
            will-change: transform;
        }

        /* 播放中才转动；暂停 / 播完就停在当前角度，不回零 */
        .旋转头像容器.转动 {
            animation-play-state: running;
        }

        .旋转头像容器 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes 循环旋转 {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* 右侧：播放控制（无底框） */
        .播放控制区 {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 1.2vw, 6px);
        }

        .曲名行 {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        /* 歌名前的镂空小爱心：照搬 1_shouyeyulan 的 .标签爱心
           —— 同款 path、同款描边色 #b9b9be、同款 1.8 描边，只把尺寸放大到曲名行需要 */
        .曲名爱心 {
            flex-shrink: 0;
            width: clamp(13px, 3.6vw, 15px);
            height: clamp(13px, 3.6vw, 15px);
            fill: none;
            stroke: #b9b9be;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .曲名 {
            flex: 1;
            min-width: 0;
            font-size: clamp(12px, 3.4vw, 13px);
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 控制按钮组：上一首 / 播放·暂停 / 下一首 / 添加，全部纯图标、无底框 */
        .播放控制组 {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            /* 间距再拉开一档，四个键之间留足呼吸感 */
            gap: clamp(10px, 3vw, 15px);
        }

        /* 按钮本体保证好点，里面的 svg 缩得更小 —— 视觉变小、热区不变小 */
        .播放按钮 {
            flex-shrink: 0;
            width: clamp(27px, 7.6vw, 32px);
            height: clamp(27px, 7.6vw, 32px);
            border: none;
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 上一首 / 下一首 / 添加：比播放键再小一号，弱一档，主次分明 */
        .播放按钮.次按钮 {
            width: clamp(25px, 7vw, 29px);
            height: clamp(25px, 7vw, 29px);
            color: var(--ink-3);
        }

        /* 图标统一：纯描边细线，fill 关掉，线头线角全圆，走 currentColor。
           注意：这里不设 stroke-width —— CSS 会盖掉 svg 上的同名属性，
           线宽统一交给各图标自己写在标签上，便于按缩放比单独补偿。 */
        .播放按钮 svg {
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 图标缩到按钮的 48%（播放）/ 40%（次按钮），视觉上明显更小巧 */
        .播放按钮 svg { width: 48%; height: 48%; }
        .播放按钮.次按钮 svg { width: 40%; height: 40%; }

        /* 默认显示播放图标，播放中切成暂停图标 */
        .播放按钮 .暂停图标 { display: none; }
        .播放按钮 .播放图标 { display: block; }
        .播放按钮.播放中 .播放图标 { display: none; }
        .播放按钮.播放中 .暂停图标 { display: block; }

        /* 进度条：纤细灰轨 + 深灰填充，可点可拖 */
        .进度条轨道 {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: rgba(var(--line), 0.3);
            position: relative;
            cursor: pointer;
            touch-action: none;
        }

        .进度条填充 {
            height: 100%;
            border-radius: 999px;
            background: var(--accent);
            width: 0%;
            pointer-events: none;
        }

        .时间行 {
            display: flex;
            justify-content: space-between;
            font-size: clamp(9px, 2.5vw, 10px);
            color: var(--ink-4);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        /* ===== 播放列表：常驻在播放区下方，无底框 ===== */
        .歌曲栏 {
            margin: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) 0;
            /* 无底框：不设 background / border / border-radius / box-shadow */
        }

        /* 默认正好露出三首；加了新的就在这三首的高度内往下滚。
           这里给的是兜底值，JS 会按实际行高再精确校准一次 */
        .歌曲列表 {
            display: flex;
            flex-direction: column;
            gap: clamp(5px, 1.5vw, 7px);
            max-height: clamp(108px, 31vw, 128px);
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .歌曲列表::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* 曲目行：无底框，纯文字一行，只靠字色区分选中 */
        .歌曲项 {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2.5vw, 10px);
            padding: clamp(6px, 1.8vw, 8px) clamp(2px, 1vw, 4px);
            background: transparent;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 选中：歌名转深灰；未选中保持浅灰 */
        .歌曲项.当前 .歌曲名 {
            color: var(--ink);
        }

        .歌曲项.当前 .歌曲标记 {
            color: var(--ink-3);
        }

        .歌曲项.当前 .歌曲时长 {
            color: var(--ink-3);
        }

        /* 音符跳动只在真正在播时跳，暂停时和头像一起静下来 */
        body.播放中 .歌曲项.当前 .歌曲标记 svg {
            animation: 音符跳动 1.1s ease-in-out infinite;
        }

        @keyframes 音符跳动 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-1.5px); }
        }

        .歌曲标记 {
            flex-shrink: 0;
            width: clamp(14px, 4vw, 16px);
            height: clamp(14px, 4vw, 16px);
            color: var(--ink-4);
            display: block;
        }

        .歌曲标记 svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 未选中 = 浅灰；选中由上面的 .当前 覆盖为深灰 */
        .歌曲名 {
            flex: 1;
            min-width: 0;
            font-size: clamp(12px, 3.4vw, 13px);
            color: var(--ink-4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .歌曲时长 {
            flex-shrink: 0;
            font-size: clamp(10px, 2.8vw, 11px);
            color: var(--ink-4);
            font-variant-numeric: tabular-nums;
        }

        /* 移除按钮：只有上传的曲目才有，默认曲目不显示 */
        .歌曲删除 {
            flex-shrink: 0;
            width: clamp(18px, 5vw, 20px);
            height: clamp(18px, 5vw, 20px);
            margin-left: clamp(2px, 1vw, 4px);
            border: none;
            background: transparent;
            color: var(--ink-4);
            font-size: clamp(14px, 4vw, 16px);
            line-height: 1;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 分割线：播放列表与联系人区之间，上下各 20px =====
           视觉压到 0.5px：布局高度仍占 1px，所以上下 20px 间距一点不受影响。
           比直接写 height: 0.5px 稳 —— 后者在部分 1x 屏上会直接渲染没了。
           变细后颜色会显淡，不透明度同步从 0.55 提到 0.62 补偿。 */
        .联系人分割线 {
            height: 1px;
            background: rgba(var(--line), 0.62);
            transform: scaleY(0.5);
            transform-origin: 50% 50%;
            margin: 20px clamp(12px, 4vw, 16px);
        }

        /* ===== 联系人区（微信风格：分组字母 + 圆形头像 + 单行资料） ===== */
        .联系人列表区 {
            /* 右侧留出索引条的宽度，避免最后一行被压住 */
            padding: 0 clamp(26px, 7vw, 30px) clamp(16px, 5vw, 20px) clamp(12px, 4vw, 16px);
        }

        /* ★ 群聊分区：放在 A–Z 分组【之前】，标题写「群聊」 */
        .群聊分组 { margin: 0; }
        .群聊分组.隐藏 { display: none; }

        .群聊项 {
            display: flex; align-items: center; gap: clamp(10px, 3vw, 12px);
            padding: clamp(6px, 1.8vw, 8px) clamp(2px, 0.8vw, 4px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .群聊项.隐藏 { display: none; }

        .群头像 {
            width: clamp(38px, 10.6vw, 44px); height: clamp(38px, 10.6vw, 44px);
            border-radius: clamp(9px, 2.6vw, 11px); overflow: hidden;
            display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
            background: rgba(var(--line), 0.28); flex-shrink: 0;
        }
        .群头像 img { width: 100%; height: 100%; object-fit: cover; display: block; background: rgba(var(--panel), 0.7); }
        .群头像.单张 { grid-template-columns: 1fr; }

        .群聊名 {
            font-size: clamp(13.5px, 3.8vw, 15px); color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .群聊人数 { font-size: clamp(11px, 3vw, 12px); color: var(--ink-3); margin-top: 1px; }

        /* 分组标题：A / B / C …，或 # */
        .联系人分组 {
            margin: 0;
        }

        .联系人分组.隐藏 {
            display: none;
        }

        .分组字母 {
            padding: clamp(7px, 2vw, 9px) 0 clamp(4px, 1.2vw, 6px) clamp(2px, 0.8vw, 4px);
            font-size: clamp(11px, 3vw, 12px);
            font-weight: 600;
            color: var(--ink-3);
            letter-spacing: 0.5px;
            user-select: none;
        }

        /* 联系人行：无底框，头像 + 文字一行 */
        .联系人项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 12px);
            padding: clamp(6px, 1.8vw, 8px) clamp(2px, 0.8vw, 4px);
            background: transparent;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .联系人项.隐藏 {
            display: none;
        }

        .联系人头像 {
            width: clamp(38px, 10.5vw, 42px);
            height: clamp(38px, 10.5vw, 42px);
            /* 圆角正方形：约边长的 22%，跟 iOS / 微信头像观感一致 */
            border-radius: clamp(8px, 2.2vw, 10px);
            object-fit: cover;
            flex-shrink: 0;
            background: #dedee4;
            display: block;
        }

        .联系人信息 {
            flex: 1;
            min-width: 0;
        }

        /* 主行：有备注就显示「备注（原名）」—— 微信同款 */
        .联系人名称 {
            font-size: clamp(14px, 4vw, 15px);
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .联系人原名 {
            font-size: clamp(11px, 3vw, 12px);
            color: var(--ink-3);
            margin-left: 4px;
        }

        /* 副行：两个小巧的文字按钮 —— 发送消息 / 好友信息 */
        .联系人操作区 {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.8vw, 8px);
            margin-top: clamp(4px, 1.2vw, 5px);
        }

        .联系人操作按钮 {
            border: none;
            background: rgba(var(--line), 0.14);
            color: var(--ink-3);
            font-family: inherit;
            font-size: clamp(10px, 2.8vw, 11px);
            line-height: 1;
            padding: clamp(4px, 1.2vw, 5px) clamp(8px, 2.2vw, 10px);
            border-radius: 999px;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .联系人名称 mark,
        .联系人原名 mark {
            background: var(--accent-hi);
            color: var(--accent-ink);
            border-radius: 3px;
            padding: 0 1px;
        }

        /* ===== 右侧 A-Z 索引条 ===== */
        .字母索引条 {
            position: absolute;
            right: 3px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            padding: clamp(4px, 1.2vw, 6px) 2px;
            border-radius: 12px;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .字母索引条.隐藏 {
            display: none;
        }

        .索引字母 {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(14px, 4vw, 15px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(8px, 2.2vw, 9px);
            line-height: 1;
            color: var(--ink-3);
            cursor: pointer;
        }

        /* 按下 / 滑过时的当前字母：加深加粗 */
        .索引字母.高亮 {
            color: var(--accent);
            font-weight: 700;
        }

        /* 拖动时浮在中间的大字母气泡 */
        .索引气泡 {
            position: absolute;
            right: clamp(26px, 7vw, 30px);
            top: 50%;
            transform: translateY(-50%);
            width: clamp(38px, 11vw, 44px);
            height: clamp(38px, 11vw, 44px);
            border-radius: 50%;
            background: rgba(var(--shade), 0.62);
            color: #fff;
            font-size: clamp(15px, 4.5vw, 18px);
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 7;
            pointer-events: none;
            user-select: none;
        }

        .索引气泡.显示 {
            display: flex;
        }

        .搜索无结果 {
            display: none;
            text-align: center;
            padding: clamp(24px, 8vw, 36px) 0;
            color: var(--ink-3);
            font-size: clamp(12px, 3.5vw, 13px);
        }

        .搜索无结果.显示 {
            display: block;
        }

        /* ===== 底部导航 =====
           与首页同结构；选中态只换图标 png + 文字加粗，不做 scale 放大 */
        .底部导航栏 {
            flex-shrink: 0;
            z-index: 20;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: clamp(4px, 1.5vw, 6px) 0 calc(clamp(6px, 2vw, 8px) + env(safe-area-inset-bottom, 0px));
            background: rgba(var(--panel), var(--glass));
            border-top: 1px solid rgba(var(--panel), 0.3);
        }

        .导航项 {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink-3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .导航文字 {
            font-size: clamp(9px, 2.5vw, 10px);
            margin-top: 2px;
        }

        .导航项.选中 {
            color: var(--ink);
            font-weight: 600;
        }

        .导航图标 {
            width: clamp(16px, 4.5vw, 18px);
            height: clamp(16px, 4.5vw, 18px);
            object-fit: contain;
            display: block;
            line-height: 1;
        }

        /* 选中项不放大：只靠 png 换图 + 文字加粗区分 */
        .导航项.选中 .导航图标 {
            transform: none;
        }

        .导航项:not(.选中) .导航图标 {
            opacity: 0.72;
        }

        /* ===== 视觉隐藏的文件输入 =====
           移动端（尤其 Android WebView / 部分 iOS）对 display:none 的 <input type=file>
           调用 .click() 无效 —— 元素已从渲染树移除，无法接收用户手势。
           改用「仍在渲染树中但不可见」的标准写法，保证 click() 在所有浏览器都能唤起选择。 */
        /* ===== Toast（与 1_shouyeyulan 同款）===== */
        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px); background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }

        .视觉隐藏文件输入 {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
            opacity: 0; pointer-events: none;
        }
    </style>
</head>

            <div class="音乐播放区">

            <!-- ===== 播放列表：常驻在播放区下方，默认露出三首，多了可下滑 ===== -->

            <!-- 分割线：播放列表与联系人区之间，上下各 20px -->

            <!-- 联系人区：按昵称 / 备注首字母分组，数据来自首页会话框 -->

            <div class="搜索无结果" id="搜索无结果">未找到相关联系人</div>

    <script id="联系人删除">
/**
 * 联系人删除.js —— 删除联系人 / 群聊、以及随之清理的全部存档
 *
 * ★★ 为什么抽成一份
 *   1 页（长按会话框）与 4 页（长按联系人）都要做同一件事：
 *     「删掉这个联系人，并且把他的会话、聊天记录、档案、头像、音色一起清掉」。
 *   两页各写一遍，只要有一处漏清一个键，就会出现
 *     「联系人没了，但聊天记录还在 / 会话框还挂着那一行」这种鬼影。
 *   这里只写一份，用 同步联系人删除.py 内联进 1 / 4 页 ——
 *   页面运行时【不依赖】外部文件，单拷 html 也能跑。
 *
 * ★★ 删一个联系人要清哪些键（漏一个就留垃圾）
 *   联系人索引      —— 列表本体（1 / 4 / 5 / 6 / 7 页都在读）
 *   聊天记录_<id>   —— 聊天存档（7 页）
 *   好友信息_<id>   —— 角色档案（7 页读它抽口头禅）
 *   好友头像_<id>   —— 头像 dataURL（2 页）
 *   音色配置_<id>   —— 3 页 per-contact 的音色 / 音速 / 语调
 *   当前联系人      —— 跳转前暂存；若正指向他就一起清，否则下次进来会跳到一个不存在的人
 *   会话列表        —— 旧键（兼容未升级的读取方），也要移除对应项
 *   人设列表        —— 若这条人设绑的是这个联系人，一起删
 *
 * ★★ 删一个群要清哪些键
 *   群聊列表        —— 群本体（★ 群不进「联系人索引」）
 *   聊天记录_g_xxx  —— 群的聊天存档（键名同样是「聊天记录_」前缀）
 *
 * ★★ 为什么还要记「已删会话」
 *   1 页的会话列表是 HTML 里【写死】的（4 个默认角色），不是从「联系人索引」渲染的。
 *   所以只清索引 + 清聊天记录是不够的：
 *     删完刷新 → 写死的那一行又回来了 → 6.5 导出还会把它重新写进索引。
 *   用户看到的就是「删了又复活」。
 *   这里记一份「已删会话」名单，1 页加载时先把这些行抹掉，删除才算真的生效。
 *   ★ 名单里存的是【名字】，因为 1 页写死的行只有名字、没有 id。
 *
 * ★★ 关于「扫键」
 *   不能用 Object.keys(localStorage) —— Storage 是代理对象，
 *   在部分实现（含 jsdom）下枚举不到任何键，会静默什么都删不掉。
 *   length + key(i) 是规范里唯一保证可用的遍历方式。
 */
(function (全局) {
    'use strict';

    /* ============================================================
     * 1. 存储工具
     * ============================================================ */
    function 读(键, 兜底) {
        try {
            const v = 全局.localStorage.getItem(键);
            return v === null || v === undefined ? 兜底 : v;
        } catch (e) { return 兜底; }
    }
    function 读表(键) {
        try {
            const v = JSON.parse(读(键, '[]'));
            return Array.isArray(v) ? v : [];
        } catch (e) { return []; }
    }
    function 写(键, 值) {
        try { 全局.localStorage.setItem(键, 值); return true; } catch (e) { return false; }
    }
    function 删键(键) {
        try { 全局.localStorage.removeItem(键); } catch (e) {}
    }
    /* ============================================================
     * 1.5 「已删会话」名单
     *   1 页会话列表写死在 HTML 里，删完刷新会复活，所以必须记一份名单。
     *   ★ 存名字不存 id：写死的会话行只有名字。
     * ============================================================ */
    const 已删键 = '已删会话';

    function 读已删() {
        const 表 = 读表(已删键);
        return 表.filter(x => typeof x === 'string' && x.trim())
            .map(x => String(x).trim());
    }

    /** ★ 传入名字（可多个）；返回名单长度 */
    function 记已删(名们) {
        const 加 = (Array.isArray(名们) ? 名们 : [名们])
            .map(x => String(x == null ? '' : x).trim()).filter(Boolean);
        if (!加.length) return 读已删().length;
        const 表 = 读已删();
        加.forEach(n => { if (表.indexOf(n) < 0) 表.push(n); });
        /* ★ 只留最近 200 条：名单会一直涨，没必要无限存 */
        写(已删键, JSON.stringify(表.slice(-200)));
        return 表.length;
    }

    /** 名字（或群名，含「（N）」后缀）是否在已删名单里 */
    function 是已删(名) {
        const 净 = String(名 == null ? '' : 名).trim();
        if (!净) return false;
        /* ★ 群名带人数后缀，两边都要去掉再比 */
        const 裸 = 净.replace(/（\d+）\s*$/, '').trim();
        return 读已删().some(x => x === 净 || x === 裸);
    }

    function 扫键(前缀) {
        const 出 = [];
        try {
            const 库 = 全局.localStorage;
            for (let i = 0; i < 库.length; i++) {
                const k = 库.key(i);
                if (k && k.indexOf(前缀) === 0) 出.push(k);
            }
        } catch (e) {}
        return 出;
    }

    /* ============================================================
     * 2. 删联系人：连带全部存档
     *
     *   ★ id 与名都要传：老数据里存在「有 id 没名字」「有名字没 id」两种，
     *     只按一个匹配会漏删，留下鬼影。
     * ============================================================ */
    /* ============================================================
     * 2.5 ★★ 只删会话（不动联系人）
     *
     *   ★★ 与「删联系人」是【两个功能】，别混：
     *     删会话   —— 会话框那一行没了 + 聊天记录清掉；
     *                但【通讯录里的联系人还在】，档案 / 头像 / 音色都保留。
     *                之后从通讯录再发起聊天，会话会重新出现。
     *     删联系人 —— 联系人本身没了，并【连带】清掉他的会话与聊天记录
     *                （4 页长按就是这个，所以它会调 清会话 + 清档案…）。
     *
     *   只删会话要清哪些键：
     *     聊天记录_<id>   —— 聊天存档
     *     当前联系人      —— 若正指向他就一起清（否则会跳到一个已删会话的人）
     *     会话列表        —— 旧键（兼容未升级的读取方）
     *     已删会话        —— 记名字（1 页会话行写死在 HTML 里，靠这份名单抹掉）
     *   ★ 【不清】联系人索引 / 好友信息 / 好友头像 / 音色配置 / 人设
     *     —— 那是删联系人才该动的东西。
     * ============================================================ */
    function 清会话(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];

        /* ① 聊天记录 */
        if (编号) {
            const 键 = '聊天记录_' + 编号;
            if (读(键, null) !== null) { 删键(键); 清了.push(键); }
        }

        /* ② 当前联系人指向他就是脏数据 */
        try {
            const 原 = 读('当前联系人', '');
            if (原) {
                const 项 = JSON.parse(原);
                const 同id = 编号 && 项 && String(项.id || '').trim() === 编号;
                const 同名 = 称呼 && 项 && (String(项.名称 || '').trim() === 称呼
                    || String(项.备注 || '').trim() === 称呼);
                if (同id || 同名) { 删键('当前联系人'); 清了.push('当前联系人'); }
            }
        } catch (e) {}

        /* ③ 旧键「会话列表」 */
        if (称呼) {
            const 会话 = 读表('会话列表');
            const 剩 = 会话.filter(项 =>
                !(项 && String(项.名称 || '').trim() === 称呼));
            if (剩.length !== 会话.length) {
                写('会话列表', JSON.stringify(剩));
                清了.push('会话列表');
            }
        }

        /* ④ 记进「已删会话」：1 页写死的会话行靠这份名单抹掉 */
        if (称呼) 记已删([称呼]);

        return 清了;
    }

    /* ============================================================
     * 2.6 ★ 会话「复活」
     *   只删会话后，联系人还在通讯录里。用户再从通讯录发起聊天时，
     *   会话应该【重新出现】—— 否则「人还在，却永远聊不了」就成死局了。
     *   所以 7 页落地新消息时要把名字从已删名单里移除。
     * ============================================================ */
    function 复活会话(名) {
        const 称呼 = String(名 == null ? '' : 名).trim();
        if (!称呼) return 读已删().length;
        const 裸 = 称呼.replace(/（\d+）\s*$/, '').trim();
        const 剩 = 读已删().filter(x => x !== 称呼 && x !== 裸);
        写(已删键, JSON.stringify(剩));
        return 剩.length;
    }

    function 清联系人(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];

        /* ① 联系人索引（本体） */
        const 索引 = 读表('联系人索引');
        const 剩 = 索引.filter(项 => {
            if (!项 || typeof 项 !== 'object') return true;
            const 同id = 编号 && String(项.id || '').trim() === 编号;
            const 同名 = 称呼 && (String(项.名称 || '').trim() === 称呼
                || String(项.备注 || '').trim() === 称呼);
            return !(同id || 同名);
        });
        if (剩.length !== 索引.length) {
            写('联系人索引', JSON.stringify(剩));
            清了.push('联系人索引');
        }

        /* ② 按 id 的四个分桶键 */
        if (编号) {
            ['聊天记录_', '好友信息_', '好友头像_', '音色配置_'].forEach(前缀 => {
                const 键 = 前缀 + 编号;
                if (读(键, null) !== null) { 删键(键); 清了.push(键); }
            });
        }

        /* ③ 当前联系人（跳转前暂存）指向他就是脏数据 */
        try {
            const 原 = 读('当前联系人', '');
            if (原) {
                const 项 = JSON.parse(原);
                const 同id = 编号 && 项 && String(项.id || '').trim() === 编号;
                const 同名 = 称呼 && 项 && (String(项.名称 || '').trim() === 称呼
                    || String(项.备注 || '').trim() === 称呼);
                if (同id || 同名) { 删键('当前联系人'); 清了.push('当前联系人'); }
            }
        } catch (e) {}

        /* ④ 旧键「会话列表」（兼容未升级的读取方） */
        const 会话 = 读表('会话列表');
        const 会话剩 = 会话.filter(项 =>
            !(项 && 称呼 && String(项.名称 || '').trim() === 称呼));
        if (会话剩.length !== 会话.length) {
            写('会话列表', JSON.stringify(会话剩));
            清了.push('会话列表');
        }

        /* ★ 记进「已删会话」：1 页写死的行就靠这份名单抹掉，否则刷新会复活 */
        if (称呼) 记已删([称呼]);

        /* ⑤ 人设：绑在这个联系人身上的一起删 */
        try {
            const 人设 = 读表('人设列表');
            const 人设剩 = 人设.filter(p =>
                !(p && 编号 && String(p.id || '').trim() === 编号));
            if (人设剩.length !== 人设.length) {
                写('人设列表', JSON.stringify(人设剩));
                清了.push('人设列表');
            }
        } catch (e) {}

        return 清了;
    }

    /* ============================================================
     * 3. 删群聊
     *   ★ 群只存在「群聊列表」，绝不进「联系人索引」——
     *     否则会混进 4 页 A–Z 分组，也会被 1 页导出当成普通联系人。
     * ============================================================ */
    /** ★ 第二参数 名：群名（1 页写死的行只有名字，删群也要能抹掉那一行） */
    function 清群(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        if (!编号) return [];
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];
        const 群表 = 读表('群聊列表');
        const 剩 = 群表.filter(g => !(g && String(g.id || '').trim() === 编号));
        if (剩.length !== 群表.length) {
            写('群聊列表', JSON.stringify(剩));
            清了.push('群聊列表');
        }
        /* 群的聊天存档同样是「聊天记录_」前缀 */
        const 键 = '聊天记录_' + 编号;
        if (读(键, null) !== null) { 删键(键); 清了.push(键); }
        /* ★ 群名也记进已删名单（1 页群会话行写死时靠它抹掉） */
        if (称呼) 记已删([称呼]);
        return 清了;
    }

    /* ============================================================
     * 4. 确认弹窗
     *   ★ 用 fixed 覆盖全屏，不受各页容器（.手机界面内容 / .手机主题背景容器）
     *     position / z-index 差异的影响 —— 这两页的容器结构并不一样。
     *   ★ 不引入任何新颜色：全部走全站色板。
     * ============================================================ */
    let 弹窗 = null;

    function 建弹窗() {
        if (弹窗) return 弹窗;
        const 遮 = 全局.document.createElement('div');
        遮.id = '删人遮罩';
        遮.className = '删人遮罩';

        const 卡 = 全局.document.createElement('div');
        卡.className = '删人卡';

        const 标 = 全局.document.createElement('div');
        标.className = '删人标题';
        标.id = '删人标题';
        卡.appendChild(标);

        const 说 = 全局.document.createElement('div');
        说.className = '删人说明';
        说.id = '删人说明';
        卡.appendChild(说);

        const 底 = 全局.document.createElement('div');
        底.className = '删人底';
        const 取消 = 全局.document.createElement('button');
        取消.className = '删人钮'; 取消.type = 'button';
        取消.textContent = '取消';
        取消.id = '删人取消';
        const 确定 = 全局.document.createElement('button');
        确定.className = '删人钮 危'; 确定.type = 'button';
        确定.id = '删人确定';
        底.appendChild(取消); 底.appendChild(确定);
        卡.appendChild(底);

        遮.appendChild(卡);
        /* ★ 点遮罩空白处 = 取消（不误删） */
        遮.addEventListener('click', e => { if (e.target === 遮) 收(弹窗, false); });
        全局.document.body.appendChild(遮);
        弹窗 = { 遮: 遮, 标: 标, 说: 说, 确定: 确定, 取消: 取消 };
        return 弹窗;
    }

    function 收(盒, 结果) {
        盒.遮.classList.remove('显示');
        if (盒.待) { const f = 盒.待; 盒.待 = null; f(结果); }
    }

    /**
     * 确认框：返回 Promise<boolean>（点了「删除」才为真）
     * ★ 不用原生 confirm —— 移动端样式不可控，且部分环境被拦。
     */
    function 确认(标题, 说明, 确认文案) {
        return new Promise(完成 => {
            const 盒 = 建弹窗();
            盒.标.textContent = 标题 || '确认删除';
            盒.说.textContent = 说明 || '';
            盒.确定.textContent = 确认文案 || '删除';
            盒.遮.classList.add('显示');
            盒.待 = 完成;
        });
    }

    /* 按钮只绑一次（建弹窗时元素是新造的，这里在建完立刻绑） */
    function 初始化() {
        const 盒 = 建弹窗();
        盒.确定.addEventListener('click', () => 收(盒, true));
        盒.取消.addEventListener('click', () => 收(盒, false));
    }

    /* ============================================================
     * 5. 长按手势
     *   ★ 移动超过 12px 取消 —— 否则滑动列表会误触
     *   ★ 触发后吞掉那次 click —— 松手不该还进聊天
     *   ★ 桌面端右键也当长按，方便鼠标操作与调试
     * ============================================================ */
    const 长按阈值 = 480;

    function 绑长按(元素, 回调) {
        if (!元素) return;
        let 计时 = null, 起x = 0, 起y = 0, 触发 = false;
        const 清 = () => { if (计时) { 全局.clearTimeout(计时); 计时 = null; } };

        元素.addEventListener('touchstart', e => {
            触发 = false;
            const t = e.touches && e.touches[0];
            起x = t ? t.clientX : 0; 起y = t ? t.clientY : 0;
            计时 = 全局.setTimeout(() => { 触发 = true; 回调(); }, 长按阈值);
        }, { passive: true });

        元素.addEventListener('touchmove', e => {
            const t = e.touches && e.touches[0];
            if (!t) return;
            if (Math.abs(t.clientX - 起x) > 12 || Math.abs(t.clientY - 起y) > 12) 清();
        }, { passive: true });

        元素.addEventListener('touchend', 清);
        元素.addEventListener('touchcancel', 清);

        /* 鼠标长按（桌面端 / 调试） */
        元素.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            触发 = false;
            计时 = 全局.setTimeout(() => { 触发 = true; 回调(); }, 长按阈值);
        });
        元素.addEventListener('mouseup', 清);
        元素.addEventListener('mouseleave', 清);

        元素.addEventListener('contextmenu', e => { e.preventDefault(); 回调(); });
        /* ★ 长按触发后，这次抬手不要再当点击 */
        元素.addEventListener('click', e => {
            if (触发) { 触发 = false; e.stopPropagation(); e.preventDefault(); }
        }, true);
    }

    /* ============================================================
     * 6. 样式（注入一次；不引入新颜色）
     * ============================================================ */
    function 注入样式() {
        if (全局.document.getElementById('删人样式')) return;
        const 样 = 全局.document.createElement('style');
        样.id = '删人样式';
        样.textContent = [
            '.删人遮罩{position:fixed;inset:0;z-index:9000;display:none;',
            'align-items:center;justify-content:center;background:rgba(var(--shade),.32);}',
            '.删人遮罩.显示{display:flex;}',
            '.删人卡{width:min(78vw,300px);padding:clamp(16px,4.6vw,20px);',
            'border-radius:clamp(14px,4vw,17px);background:rgba(var(--panel),.98);',
            '-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);',
            'backdrop-filter:blur(var(--blur)) saturate(150%);',
            'box-shadow:0 8px 30px rgba(var(--shade),.26);animation:删人弹 .18s ease-out;}',
            '@keyframes 删人弹{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}',
            '.删人标题{font-size:clamp(14px,4vw,16px);font-weight:600;color:var(--ink);}',
            '.删人说明{margin-top:clamp(5px,1.5vw,7px);font-size:clamp(11.5px,3.3vw,13px);',
            'line-height:1.65;color:var(--ink-3);}',
            '.删人底{display:flex;gap:clamp(7px,2vw,10px);margin-top:clamp(13px,3.7vw,17px);}',
            '.删人钮{flex:1;padding:clamp(8px,2.3vw,11px) 0;border-radius:999px;',
            'border:1px solid rgba(var(--line),.3);background:transparent;',
            'font-family:inherit;font-size:clamp(12px,3.4vw,13.5px);color:var(--ink-2);',
            'cursor:pointer;-webkit-tap-highlight-color:transparent;',
            'transition:transform .16s ease-out,background-color .18s ease-out;}',
            '.删人钮:active{transform:scale(.96);}',
            '.删人钮.危{border-color:rgba(var(--accent-rgb),.5);',
            'background:rgba(var(--accent-rgb),.14);color:var(--accent-ink);font-weight:600;}',
        ].join('');
        全局.document.head.appendChild(样);
    }

    /* ============================================================
     * 7. 对外：挂 window + 自举
     * ============================================================ */
    const 接口 = {
        扫键: 扫键,
        /* ★ 删会话 与 删联系人 是两个功能 */
        清会话: 清会话,
        复活会话: 复活会话,
        /* 「已删会话」名单：1 页靠它抹掉写死的会话行 */
        已删键: 已删键,
        读已删: 读已删,
        记已删: 记已删,
        是已删: 是已删,
        清联系人: 清联系人,
        清群: 清群,
        确认: 确认,
        绑长按: 绑长按,
        长按阈值: 长按阈值,
        读表: 读表,
        写: 写,
        删键: 删键,
    };
    全局.联系人删除 = 接口;

    function 起() {
        注入样式();
        初始化();
    }
    if (全局.document.readyState === 'loading') {
        全局.document.addEventListener('DOMContentLoaded', 起);
    } else {
        起();
    }
})(typeof window !== 'undefined' ? window : this);
    </script>
    <script>
        // ===== 0. 轻提示（与首页同款）=====
        let toast计时器 = null;
        function showToast(消息) {
            const 元素 = document.getElementById('toast');
            if (!元素) return;
            元素.textContent = 消息;
            元素.classList.add('显示');
            clearTimeout(toast计时器);
            toast计时器 = setTimeout(() => 元素.classList.remove('显示'), 1800);
        }

            const 时间元素 = document.getElementById('系统时间');
            function 更新时间() {
                const 现在 = new Date();
                const 小时 = String(现在.getHours()).padStart(2, '0');
                const 分钟 = String(现在.getMinutes()).padStart(2, '0');
                时间元素.textContent = `${小时}:${分钟}`;
            }
            更新时间();
            setInterval(更新时间, 1000 * 10);
        })();

            const 汉字起 = 0x4E00;
            const 汉字止 = 0x9FA5;

            function 取首字母(文本) {
                const 串 = String(文本 == null ? '' : 文本).trim();
                if (!串) return '#';
                const 首 = 串[0];
                const 码 = 首.codePointAt(0);

                // 英文字母：直接大写
                if ((码 >= 65 && 码 <= 90)) return 首;
                if ((码 >= 97 && 码 <= 122)) return 首.toUpperCase();

                // CJK 基本区汉字：查表
                if (码 >= 汉字起 && 码 <= 汉字止) {
                    const 字 = 首字母表[码 - 汉字起];
                    return (字 && 字 !== '?') ? 字 : '#';
                }

                // 数字、符号、假名、特殊字符（如 ෆ）等统统归入 #
                return '#';
            }

            // ===== 数据源：「联系人索引」（ID 分桶架构的统一数据源）

            // 迁移：旧「会话列表」→ 新「联系人索引」（仅首次）
            function 迁移索引() {

                if (Array.isArray(索引) && 索引.length) return;   // 已有索引，跳过

                try { 旧 = JSON.parse(localStorage.getItem('会话列表')); } catch (e) {}

                        名称: 项.名称 || '',

                        头像: 项.头像 || 占位头像,
                        消息: 项.消息 || '',
                        时间: 项.时间 || ''
                    })).filter(项 => 项.名称);
                    try { localStorage.setItem(索引键, JSON.stringify(索引)); } catch (e) {}

                let 索引 = 读索引();
                if (!Array.isArray(索引) || !索引.length) return;
                let 变动 = false;
                索引.forEach(项 => {
                    if (项 && 旧名映射[项.名称]) { 项.名称 = 旧名映射[项.名称]; 变动 = true; }

            修正旧名();

            function 读索引() {
                try { const v = JSON.parse(localStorage.getItem(索引键)); if (Array.isArray(v)) return v; } catch (e) {}
                return null;
            }

            function 读联系人() {
                const 索引 = 读索引();
                if (Array.isArray(索引) && 索引.length) {
                    // 统一字段，缺头像给占位图；保留 id 供跳转携带
                    return 索引.map(项 => ({

                        备注: String(项.备注 || '').trim(),
                        消息: String(项.消息 || '').trim(),

                return 默认联系人.slice();

            // ===== 群聊：独立键「群聊列表」（17_faqiqunliao 创建） =====
            //   ★ 群【不在】「联系人索引」里 —— 否则会混进 A–Z 分组，1 页导出也会把它当联系人。
            const 群键 = '群聊列表';
            function 读群聊() {
                try {
                    const 表 = JSON.parse(localStorage.getItem(群键));
                    if (!Array.isArray(表)) return [];
                    return 表.filter(g => g && g.id);
                } catch (e) { return []; }
            }

            // ===== 排序：键 = 备注 || 昵称（与微信一致：有备注用备注，没备注用昵称） =====
            function 排序键(项) {
                return 项.备注 || 项.名称 || '';
            }

            const 分组顺序 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');

            function 分组(联系人) {
                const 桶 = {};
                联系人.forEach(项 => {
                    const 字母 = 取首字母(排序键(项));
                    (桶[字母] = 桶[字母] || []).push(项);
                });

                return 分组顺序
                    .filter(字母 => 桶[字母] && 桶[字母].length)
                    .map(字母 => ({
                        字母,
                        成员: 桶[字母].sort((a, b) => 排序键(a).localeCompare(排序键(b), 'zh-Hans-CN'))

            }

            // ===== 文本工具（搜索高亮用；所有插入 innerHTML 的文本都先转义） =====
            function 转义正则(串) {
                return 串.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function 转义HTML(值) {
                return String(值 == null ? '' : 值)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function 高亮(文本, 关键字) {
                const 安全 = 转义HTML(文本);
                if (!关键字) return 安全;
                const 正则 = new RegExp(`(${转义正则(转义HTML(关键字))})`, 'gi');
                return 安全.replace(正则, '<mark>$1</mark>');
            }

            //   跳转前把这位联系人写进 localStorage「当前联系人」，目标页直接读
            const 跳转页 = {
                消息: '7_liaotian.html',
                信息: '2_haoyouxinxi.html'
            };

            function 联系人URL(页, 项) {
                // 优先用稳定 id；旧数据（无 id）用名称兜底生成临时 id 并补录索引
                let id = 项 && 项.id;
                if (!id && 项) {
                    id = 'c_legacy_' + encodeURIComponent(项.名称 || 'x');
                }
                // 发消息多带一个 from=4：7 页据此决定返回键回通讯录而非首页
                return 页 + '?id=' + encodeURIComponent(id) +
                    (页 === 跳转页.信息 ? '&mode=edit' : '') +
                    (页 === 跳转页.消息 ? '&from=4' : '');
            }

            function 处理操作(动作, 项) {
                try { localStorage.setItem('当前联系人', JSON.stringify(项)); } catch (e) {}
                if (typeof window.联系人操作 === 'function') {
                    window.联系人操作(动作, 项);        // 预留：业务方接管后可不跳转
                    return;

                const 基础 = 跳转页[动作];

            function 渲染() {

                     放在 A–Z 分组之前，也不参与右侧字母索引条。 */
                const 群表 = 读群聊();
                const 群命中 = 群表;      /* ★ 搜索过滤在 执行搜索() 里做（局部隐藏，不重渲染） */

                if (群命中.length) {
                    const 块 = document.createElement('div');
                    块.className = '群聊分组';  /* 搜索时由 执行搜索() 统一隐藏 */
                    块.dataset.字母 = '群聊';

                    const 标题 = document.createElement('div');
                    标题.className = '分组字母';
                    标题.textContent = '群聊';
                    块.appendChild(标题);

                    群命中.forEach(群 => {
                        const 行 = document.createElement('div');
                        行.className = '群聊项';
                        行.dataset.群 = String(群.id);
                        行.dataset.名称 = 群.名称 || '';

                        const 头 = document.createElement('div');
                        头.className = '群头像';
                        const 成员 = Array.isArray(群.成员) ? 群.成员.slice(0, 4) : [];
                        if (成员.length <= 1) 头.classList.add('单张');
                        成员.forEach(m => {
                            const img = document.createElement('img');
                            img.src = (m && m.头像) || 占位头像;
                            img.alt = '';
                            /* ★ onerror 用赋值：addEventListener 会叠加监听器 */
                            img.onerror = () => { img.onerror = null; img.src = 占位头像; };
                            头.appendChild(img);
                        });
                        if (!成员.length) {
                            const img = document.createElement('img');
                            img.src = 占位头像; img.alt = '';
                            头.appendChild(img);
                        }
                        行.appendChild(头);

                        const 信息 = document.createElement('div');
                        const 名 = document.createElement('div');
                        名.className = '群聊名';
                        名.textContent = 群.名称 || '群聊';
                        const 人 = document.createElement('div');
                        人.className = '群聊人数';
                        /* 人数含「我」 */
                        人.textContent = (成员.length + 1) + ' 人';
                        信息.appendChild(名); 信息.appendChild(人);
                        行.appendChild(信息);

                        行.addEventListener('click', () => {
                            /* ★ 同上：先写观察口再跳，否则测试读不到目标 */
                            window.最后跳转 = '7_liaotian.html?id=' + encodeURIComponent(群.id)
                                + '&type=group&from=4';
                            location.href = window.最后跳转;
                        });

                        块.appendChild(行);
                        分组元素表.push({ 字母: '群聊', 元素: 块 });
                    });

                    列表区.appendChild(块);
                }

                if (!联系人.length) {
                    /* ★ 有群但没联系人时，别把群也一起藏了 */
                    if (!群命中.length) {
                        索引条.classList.add('隐藏');
                        无结果.textContent = '暂无联系人';
                        无结果.classList.add('显示');
                        return;
                    }
                    索引条.classList.add('隐藏');
                    无结果.classList.remove('显示');
                    return;
                }

                分组表.forEach(组 => {
                    // 分组块
                    const 块 = document.createElement('div');
                    块.className = '联系人分组';
                    块.dataset.字母 = 组.字母;

                    const 标题 = document.createElement('div');
                    标题.className = '分组字母';
                    标题.textContent = 组.字母;
                    块.appendChild(标题);

                    组.成员.forEach(项 => {
                        const 行 = document.createElement('div');
                        行.className = '联系人项';
                        // 原文存 dataset，搜索还原时用它，避免高亮叠加
                        行.dataset.名称 = 项.名称;
                        行.dataset.备注 = 项.备注 || '';
                        行.dataset.消息 = 项.消息 || '';
                        /* ★ 存 id：长按删除要靠它定位 聊天记录_<id> / 好友信息_<id> 等分桶键。
                             原来只有名称，删了联系人却清不掉聊天记录，会留下鬼影。 */
                        行.dataset.id = String(项.id || '');

                        const 头像 = document.createElement('img');
                        头像.className = '联系人头像';
                        头像.src = 项.头像;
                        头像.alt = '';
                        // 头像加载失败就退回占位图，避免出现破图
                        头像.addEventListener('error', () => { 头像.src = '2【图片】/圆形头像1.png'; });
                        行.appendChild(头像);

                        const 信息 = document.createElement('div');
                        信息.className = '联系人信息';

                        const 名称行 = document.createElement('div');
                        名称行.className = '联系人名称';
                        if (项.备注) {
                            // 有备注：备注（原名），微信同款
                            名称行.textContent = 项.备注;
                            const 原名 = document.createElement('span');
                            原名.className = '联系人原名';
                            原名.textContent = '（' + 项.名称 + '）';
                            名称行.appendChild(原名);
                        } else {
                            名称行.textContent = 项.名称;
                        }
                        信息.appendChild(名称行);

                        // 副行：发送消息 / 好友信息，两个文字按钮
                        const 操作区 = document.createElement('div');
                        操作区.className = '联系人操作区';

                        [['发送消息', '消息'], ['好友信息', '信息']].forEach(([文案, 动作]) => {
                            const 钮 = document.createElement('button');
                            钮.className = '联系人操作按钮';
                            钮.type = 'button';
                            钮.textContent = 文案;
                            钮.dataset.动作 = 动作;
                            钮.addEventListener('click', (e) => {

                            操作区.appendChild(钮);
                        });

                        信息.appendChild(操作区);

                        行.appendChild(信息);

                        // 点击行空白处：暂不跳转。数据写入 localStorage 并预留回调，接业务时改这里即可
                        行.addEventListener('click', () => {
                            try { localStorage.setItem('当前联系人', JSON.stringify(项)); } catch (e) {}

                    列表区.appendChild(块);
