<!DOCTYPE html>
<!--
    15_tuku —— 图库扭蛋机

    入口：1 页加号菜单「扭蛋机」 → 15_tuku.html?from=1
    出口：★ 从哪进来就回哪去 —— ?from=<页号> 优先，其次 document.referrer，都没有才回 1 页。

    ★ 四个分类（目录名 ≠ 显示名，别搞混）：
        显示「男头」→ 4【男头】/1~6.png    单张扭蛋
        显示「女头」→ 4【女头】/1~50.png   单张扭蛋
        显示「双女」→ 4【双女】/1~42.png   两张一对（1、2 一对，3、4 一对…）→ 21 对
        显示「情侣」→ 4【情头】/1~34.png   两张一对                        → 17 对
      ★ 一对的编号规则：(2k-1, 2k) 为第 k 对。

    ★ 扭蛋：0.5 虚拟货币一次，【随机可重复】。点哪个分类就扭哪个分类。
      余额不足 → 提示并自动打开充值弹窗。

    ★ 虚拟货币：键「图库货币」，右上角胶囊显示 + 点击充值。
      充值弹窗可自行输入任意金额（另给 1/5/10/50 快捷档）。

    ★ 已获记录：键「图库已获」= { 男头:[1,3], 女头:[…], 双女:[…], 情头:[…] }
      存的是【已解锁的单元号】：单张类存图片编号，成対类存【对号】。

    ★ 两块区域，职责严格分开：
        【本页·预览】一行两列、清晰不模糊、无水印条、★ 不能点击放大
                     （只是给人看，想拿图去背包）
        【16_beibao 背包】已扭到的战利品，可保存。顶栏背包小图标进。

    风格：与 1~9 页统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>扭蛋机</title>
    <style>
        /* ===== 统一色板（与 1~9 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* ★★ hex 变量【不能】进 rgba() —— 会被整条丢弃。
               要带透明度就用下面这批数值形式的伴生变量。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
            /* 扭蛋机彩球用的低饱和色（不跳，跟灰白底协调） */
            --球1: #b98d8d;
            --球2: #8d9bb9;
            --球3: #a9b58d;
            --球4: #b9a98d;
            --球5: #9d8db9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            width: 100%; height: 100dvh; object-fit: cover; object-position: center;
            display: block; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;
        }

        .全局白色遮罩 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1; pointer-events: none;
        }

        /* ===== 顶部固定区：返回 /「图库」/ 右侧虚拟货币 ===== */
        .顶部固定区 {
            position: relative; z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            flex-shrink: 0;
            padding-bottom: clamp(6px, 2vw, 10px);
        }

        .顶部导航栏 {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px); color: var(--ink-2);
            position: relative;
        }

        .返回按钮 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }
        .返回按钮 svg { width: clamp(17px, 4.8vw, 20px); height: clamp(17px, 4.8vw, 20px); fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .中间标题 {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; color: var(--ink);
            letter-spacing: .5px; white-space: nowrap;
        }

        /* 顶栏右侧：背包图标 + 货币胶囊 并排 */
        .右侧组 { display: flex; align-items: center; gap: clamp(5px, 1.5vw, 8px); flex-shrink: 0; }

        /* ★ 背包小图标：点进 16_beibao 看往期扭蛋 */
        .背包钮 {
            width: clamp(26px, 7.4vw, 30px); height: clamp(26px, 7.4vw, 30px);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; flex-shrink: 0;
            background: rgba(var(--panel), 0.72);
            border: 1px solid rgba(var(--line), 0.3);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: transform .12s, border-color .18s;
        }
        .背包钮:active { transform: scale(.92); border-color: rgba(var(--accent-rgb), .5); }
        .背包钮 svg {
            width: clamp(16px, 4.5vw, 18px); height: clamp(16px, 4.5vw, 18px);
            fill: none; stroke: var(--ink); stroke-width: 1.7;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ★ 右侧：虚拟货币胶囊（点它充值） */
        .货币胶囊 {
            display: flex; align-items: center; gap: 5px;
            padding: clamp(4px, 1.2vw, 6px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px;
            background: rgba(var(--panel), 0.72);
            border: 1px solid rgba(var(--line), 0.3);
            color: var(--ink); font-size: clamp(11.5px, 3.3vw, 13px); font-weight: 600;
            cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
            transition: transform .12s, border-color .18s;
        }
        .货币胶囊:active { transform: scale(.94); border-color: rgba(var(--accent-rgb), .5); }
        .货币胶囊 svg { width: clamp(13px, 3.7vw, 15px); height: clamp(13px, 3.7vw, 15px); flex-shrink: 0; }
        .货币加号 { color: var(--ink-3); font-weight: 400; font-size: 1.05em; line-height: 1; }

        /* ===== 分类切换 ===== */
        .分类栏 {
            display: flex; gap: clamp(6px, 1.8vw, 9px);
            padding: 0 clamp(12px, 4vw, 16px) clamp(8px, 2.4vw, 11px);
            overflow-x: auto; scrollbar-width: none;
        }
        .分类栏::-webkit-scrollbar { display: none; }

        .分类钮 {
            flex: 1 1 0; min-width: fit-content;
            padding: clamp(7px, 2vw, 9px) clamp(10px, 3vw, 14px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.28);
            background: rgba(var(--panel), 0.5);
            color: var(--ink-3);
            font-size: clamp(12px, 3.4vw, 13.5px);
            text-align: center; cursor: pointer; white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: all .18s;
        }
        .分类钮.选中 {
            background: rgba(var(--accent-rgb), 0.92);
            border-color: rgba(var(--accent-rgb), 0.92);
            color: #fff; font-weight: 600;
        }

        /* ===== 可滚动内容 =====
           ★ overflow-y: auto 必须留着 —— 它就是「下滑」本身；
             下面三行只是把滚动条【藏起来】，滑动一点不受影响。
             三行缺一不可：scrollbar-width 管 Firefox、
             -ms-overflow-style 管旧版 Edge、::-webkit-scrollbar 管 Chrome / Safari。 */
        .手机界面内容 {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative; z-index: 5;
            padding-bottom: clamp(20px, 6vw, 32px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ===== 扭蛋机（页面主体） ===== */
        .扭蛋区 {
            display: flex; flex-direction: column; align-items: center;
            padding: clamp(6px, 2vw, 12px) clamp(12px, 4vw, 16px) 0;
        }

        .扭蛋机 {
            width: clamp(150px, 44vw, 186px);
            position: relative;
            transform-origin: 50% 100%;
        }
        .扭蛋机 svg { width: 100%; display: block; }

        /* ★ 摇动动画：扭蛋时机身左右晃 + 内部彩球跳 */
        @keyframes 摇机 {
            0%,100% { transform: rotate(0deg) translateX(0); }
            15%  { transform: rotate(-3.2deg) translateX(-2px); }
            30%  { transform: rotate(3.2deg) translateX(2px); }
            45%  { transform: rotate(-2.4deg) translateX(-1.5px); }
            60%  { transform: rotate(2.4deg) translateX(1.5px); }
            80%  { transform: rotate(-1.2deg) translateX(-.6px); }
        }
        .扭蛋机.摇动 { animation: 摇机 .62s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes 球跳 {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-5px); }
        }
        .扭蛋机.摇动 .彩球 { animation: 球跳 .3s ease-in-out infinite; }
        .扭蛋机.摇动 .彩球.延1 { animation-delay: .08s; }
        .扭蛋机.摇动 .彩球.延2 { animation-delay: .16s; }
        .扭蛋机.摇动 .彩球.延3 { animation-delay: .24s; }
        .彩球 { transform-box: fill-box; transform-origin: center; }

        /* 分类说明 + 收集进度 */
        .扭蛋说明 {
            margin-top: clamp(8px, 2.4vw, 12px);
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-3); text-align: center;
            line-height: 1.6;
        }
        .扭蛋说明 b { color: var(--ink); font-weight: 600; }

        .扭一次钮 {
            margin-top: clamp(10px, 3vw, 14px);
            width: min(100%, 260px);
            padding: clamp(11px, 3.2vw, 14px);
            border: none; border-radius: 999px;
            background: rgba(var(--accent-rgb), 0.92); color: #fff;
            font-size: clamp(14px, 4vw, 16px); font-weight: 600; letter-spacing: .5px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 14px rgba(var(--shade), 0.16);
            transition: transform .12s, opacity .18s;
        }
        .扭一次钮:active { transform: scale(.96); }
        .扭一次钮:disabled { opacity: .5; cursor: not-allowed; }

        /* ===== 结果展示 ===== */
        .结果区 {
            margin-top: clamp(12px, 3.4vw, 16px);
            width: 100%;
            display: none;
            flex-direction: column; align-items: center;
        }
        .结果区.显示 { display: flex; }

        .结果标题 {
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-3); margin-bottom: clamp(8px, 2.2vw, 10px);
        }

        /* ★ 单张：一张大方图；一对：两张并排 */
        .结果图组 {
            display: flex; gap: clamp(8px, 2.4vw, 12px); justify-content: center;
        }
        .结果图 {
            width: clamp(96px, 28vw, 124px);
            /* ★ 同样不裁切：按原图比例完整显示 */
            height: auto;
            border-radius: clamp(12px, 3.4vw, 16px);
            object-fit: contain;
            background: rgba(var(--panel), 0.6);
            border: 1px solid rgba(var(--line), 0.22);
            box-shadow: 0 4px 16px rgba(var(--shade), 0.12);
        }

        /* 淡入 */
        @keyframes 结果浮现 {
            from { opacity: 0; transform: translateY(10px) scale(.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .结果区.显示 .结果图组 { animation: 结果浮现 .34s cubic-bezier(.2,.8,.3,1) both; }

        .结果名 {
            margin-top: clamp(8px, 2.2vw, 10px);
            font-size: clamp(12px, 3.4vw, 13.5px); color: var(--ink); font-weight: 600;
        }

        .保存钮 {
            margin-top: clamp(10px, 2.8vw, 13px);
            display: flex; align-items: center; gap: 6px;
            padding: clamp(8px, 2.3vw, 10px) clamp(16px, 4.6vw, 22px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.34);
            background: rgba(var(--panel), 0.66);
            color: var(--ink); font-size: clamp(12px, 3.4vw, 13.5px); font-weight: 600;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .保存钮:active { transform: scale(.96); }
        .保存钮 svg { width: clamp(14px, 4vw, 16px); height: clamp(14px, 4vw, 16px); fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        /* ===== 图鉴网格 ===== */
        .图鉴标题 {
            display: flex; align-items: baseline; gap: 8px;
            padding: clamp(16px, 4.6vw, 22px) clamp(14px, 4vw, 18px) clamp(8px, 2.4vw, 11px);
            font-size: clamp(13px, 3.7vw, 15px); font-weight: 600; color: var(--ink);
        }
        .图鉴进度 { font-size: clamp(11px, 3.1vw, 12.5px); font-weight: 400; color: var(--ink-3); }

        /* ★ 预览：一行两列（图要大一点才看得清） */
        .图鉴网格 {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: clamp(9px, 2.6vw, 13px);
            padding: 0 clamp(12px, 4vw, 16px);
        }

        .图鉴格 {
            border-radius: clamp(11px, 3.2vw, 14px);
            overflow: hidden;
            background: rgba(var(--panel), 0.55);
            border: 1px solid rgba(var(--line), 0.22);
        }

        /* ★★★ 预览图【完整显示、不裁切】：
             ★ 为什么不用 aspect-ratio:1/1 + object-fit:cover ——
               那样非正方形的图会被裁掉上下，人物头像看着就「缺一块」。
               改成按原图比例自适应（height:auto），任何比例都完整可见。
             ★ 整个格子【没有任何点击行为】—— 需求明确「不能点击放大」。 */
        .图鉴图 {
            width: 100%; height: auto; object-fit: contain; display: block;
            background: rgba(var(--line), 0.08);   /* 留白处给个浅底，不是黑块 */
        }
        /* 图还没加载出来时先撑出个位置，避免网格跳动 */
        .图鉴图 { min-height: clamp(80px, 24vw, 120px); }
        /* ★★★ 成対类（双女 / 情头）：【一对占满整行】，左一张右一张。
             不加 span 的话，一对会被塞进半行里，两张各只有 1/4 屏宽 —— 既看不清，
             也看不出「这两张是一对」。占满整行后每张接近半屏，是真正的一对并排。 */
        .图鉴格.成対 { grid-column: 1 / -1; }

        .图鉴对 {
            display: flex; flex-direction: row; flex-wrap: nowrap;
            gap: clamp(4px, 1.2vw, 6px);
            align-items: stretch;
        }
        /* ★★ flex item 的 min-width 默认 auto，对 <img> 会解析成【原始宽度】→
             无法收缩 → 第二张被挤出容器被 overflow:hidden 裁掉（只显示一张）。
             min-width:0 + flex:1 1 0 才能两张各占一半。 */
        .图鉴对 .图鉴图 {
            flex: 1 1 0; min-width: 0; width: auto;
            min-height: clamp(110px, 32vw, 160px);
            border-radius: clamp(8px, 2.3vw, 11px);
        }

        /* 底部极小的获得状态标签（不压在图上，不影响看清） */
        .图鉴标 {
            padding: clamp(4px, 1.2vw, 6px) clamp(7px, 2vw, 9px);
            font-size: clamp(9.5px, 2.7vw, 11px);
            letter-spacing: .2px;
        }
        .图鉴标.未获得 { color: var(--ink-4); }
        .图鉴标.已获得 { color: var(--ink-2); font-weight: 600; }

        /* ===== 充值弹窗 ===== */
        .弹窗遮罩 {
            position: absolute; inset: 0; z-index: 300;
            background: rgba(var(--shade), 0.42);
            display: none; align-items: center; justify-content: center;
            padding: 0 clamp(20px, 6vw, 32px);
        }
        .弹窗遮罩.显示 { display: flex; }

        .弹窗框 {
            width: 100%; max-width: 320px;
            background: rgba(var(--panel), 0.94);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);
            border-radius: clamp(16px, 4.6vw, 20px);
            padding: clamp(18px, 5.2vw, 24px);
            box-shadow: 0 12px 40px rgba(var(--shade), 0.22);
        }

        .弹窗标题 { font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; color: var(--ink); text-align: center; }
        .弹窗副 { margin-top: clamp(6px, 1.8vw, 8px); font-size: clamp(11.5px, 3.3vw, 12.5px); color: var(--ink-3); text-align: center; line-height: 1.6; }

        .快捷档 {
            display: flex; gap: clamp(6px, 1.8vw, 8px);
            margin-top: clamp(12px, 3.4vw, 16px);
        }
        .档钮 {
            flex: 1; padding: clamp(7px, 2vw, 9px) 0;
            border-radius: 999px; border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.6); color: var(--ink-2);
            font-size: clamp(12px, 3.4vw, 13.5px); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .档钮.选中 { background: rgba(var(--accent-rgb), 0.92); border-color: rgba(var(--accent-rgb), 0.92); color: #fff; font-weight: 600; }

        .金额行 {
            display: flex; align-items: center; gap: 8px;
            margin-top: clamp(10px, 2.8vw, 13px);
            padding: clamp(9px, 2.6vw, 12px) clamp(12px, 3.4vw, 15px);
            border-radius: 12px;
            border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.7);
        }
        .金额符 { font-size: clamp(16px, 4.6vw, 19px); font-weight: 600; color: var(--ink-3); }
        .金额输入 {
            flex: 1; min-width: 0; border: none; outline: none; background: transparent;
            font-size: clamp(16px, 4.6vw, 19px); font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .弹窗钮组 { display: flex; gap: clamp(8px, 2.2vw, 10px); margin-top: clamp(14px, 4vw, 18px); }
        .弹窗钮 {
            flex: 1; padding: clamp(10px, 2.8vw, 12px);
            border-radius: 999px; font-size: clamp(13px, 3.7vw, 14.5px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.6); color: var(--ink-2);
        }
        .弹窗钮.主 {
            background: rgba(var(--accent-rgb), 0.92); border-color: rgba(var(--accent-rgb), 0.92);
            color: #fff; font-weight: 600;
        }
        .弹窗钮:active { transform: scale(.97); }

        /* ===== 轻提示 ===== */
        .toast {
            position: absolute; left: 50%; bottom: clamp(60px, 17vw, 84px);
            transform: translateX(-50%) translateY(8px);
            background: rgba(var(--shade), 0.86); color: #fff;
            padding: clamp(8px, 2.3vw, 10px) clamp(14px, 4vw, 18px);
            border-radius: 999px; font-size: clamp(12px, 3.4vw, 13.5px);
            opacity: 0; pointer-events: none; transition: opacity .24s, transform .24s;
            z-index: 400; white-space: nowrap;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }

        .无结果提示 { text-align: center; color: var(--ink-3); font-size: clamp(12px, 3.4vw, 13.5px); padding: clamp(20px, 6vw, 32px); }
    </style>
</head>
<body>
    <div class="手机主题背景容器">
        <img class="主题背景图片" id="主题背景图片" src="2【图片】/默认主题背景.png" alt="手机主题背景占位图">
        <div class="全局白色遮罩"></div>

        <!-- ===== 顶部：返回 /「扭蛋机」/ 背包图标 + 虚拟货币 ===== -->
        <div class="顶部固定区">
            <div class="顶部导航栏">
                <div class="返回按钮" id="返回按钮" role="button" aria-label="返回">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <polyline points="15 6 9 12 15 18"></polyline>
                    </svg>
                </div>
                <div class="中间标题" id="页面标题">扭蛋机</div>

                <!-- 右侧：背包图标 + 虚拟货币 -->
                <div class="右侧组">
                    <!-- ★ 背包：小图标，点进去看往期扭蛋（本页不再内嵌背包区） -->
                    <div class="背包钮" id="背包钮" role="button" aria-label="我的背包" title="我的背包">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 8.2h16l-1.2 11.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"></path>
                            <path d="M8.4 8.2V6.4a3.6 3.6 0 0 1 7.2 0v1.8"></path>
                        </svg>
                    </div>
                    <div class="货币胶囊" id="货币胶囊" role="button" aria-label="充值虚拟货币">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
                            <path d="M9.4 9.2l2.6 3.2 2.6-3.2M12 12.4v3.6M9.9 13.6h4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                        </svg>
                        <span id="货币数">0</span>
                        <span class="货币加号">+</span>
                    </div>
                </div>
            </div>

            <!-- 四个分类 -->
            <div class="分类栏" id="分类栏"></div>
        </div>

        <!-- ===== 内容 ===== -->
        <div class="手机界面内容">
            <!-- 扭蛋机 -->
            <div class="扭蛋区">
                <div class="扭蛋机" id="扭蛋机">
                    <svg viewBox="0 0 200 236" aria-hidden="true">
                        <!-- 顶部小球饰 -->
                        <circle cx="100" cy="14" r="7" fill="#c9c9cf"></circle>
                        <!-- 玻璃球罩 -->
                        <circle cx="100" cy="74" r="56" fill="rgba(255,255,255,.42)" stroke="#9e9ea2" stroke-width="2.2"></circle>
                        <path d="M62 52a44 44 0 0 1 62-16" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3.4" stroke-linecap="round"></path>
                        <!-- 内部彩球 -->
                        <circle class="彩球"     cx="80"  cy="90" r="13" fill="var(--球1)"></circle>
                        <circle class="彩球 延1" cx="112" cy="96" r="13" fill="var(--球2)"></circle>
                        <circle class="彩球 延2" cx="96"  cy="66" r="12" fill="var(--球3)"></circle>
                        <circle class="彩球 延3" cx="122" cy="70" r="11" fill="var(--球4)"></circle>
                        <circle class="彩球 延1" cx="70"  cy="70" r="10" fill="var(--球5)"></circle>
                        <!-- 机身 -->
                        <path d="M52 118h96l10 62a10 10 0 0 1-10 11H52a10 10 0 0 1-10-11z" fill="#dcdce0" stroke="#9e9ea2" stroke-width="2.2"></path>
                        <rect x="70" y="196" width="60" height="34" rx="6" fill="#c9c9cf" stroke="#9e9ea2" stroke-width="2.2"></rect>
                        <!-- 旋钮 -->
                        <circle cx="100" cy="150" r="17" fill="#efeff2" stroke="#9e9ea2" stroke-width="2.2"></circle>
                        <circle cx="100" cy="150" r="6" fill="#9e9ea2"></circle>
                        <!-- 出口 -->
                        <rect x="78" y="206" width="44" height="16" rx="5" fill="#8e8e94"></rect>
                    </svg>
                </div>

                <div class="扭蛋说明" id="扭蛋说明"></div>

                <button class="扭一次钮" id="扭一次钮" type="button">扭一次 · 0.5 币</button>

                <!-- 结果 -->
                <div class="结果区" id="结果区">
                    <div class="结果标题" id="结果标题">恭喜获得</div>
                    <div class="结果图组" id="结果图组"></div>
                    <div class="结果名" id="结果名"></div>
                    <button class="保存钮" id="保存钮" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3.5v11"></path>
                            <polyline points="7.6 10.4 12 14.8 16.4 10.4"></polyline>
                            <path d="M4.5 17.5v1.6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-1.6"></path>
                        </svg>
                        保存到本地
                    </button>
                </div>
            </div>

            <!-- 预览：一行两列 · 清晰 · 不可点放大（要拿图去背包） -->
            <div class="图鉴标题">
                <span id="图鉴名">图鉴</span>
                <span class="图鉴进度" id="图鉴进度"></span>
            </div>
            <div class="图鉴网格" id="图鉴网格"></div>
        </div>

        <!-- ===== 充值弹窗 ===== -->
        <div class="弹窗遮罩" id="充值遮罩">
            <div class="弹窗框">
                <div class="弹窗标题">虚拟货币充值</div>
                <div class="弹窗副">当前余额 <b id="弹窗余额">0</b> 币 · 扭一次消耗 0.5 币</div>

                <div class="快捷档" id="快捷档">
                    <button class="档钮" type="button" data-额="1">1</button>
                    <button class="档钮" type="button" data-额="5">5</button>
                    <button class="档钮" type="button" data-额="10">10</button>
                    <button class="档钮" type="button" data-额="50">50</button>
                </div>

                <div class="金额行">
                    <span class="金额符">¥</span>
                    <input class="金额输入" id="金额输入" type="text" inputmode="decimal" placeholder="输入充值金额" />
                </div>

                <div class="弹窗钮组">
                    <button class="弹窗钮" id="充值取消" type="button">取消</button>
                    <button class="弹窗钮 主" id="充值确认" type="button">确认充值</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        /* ============================================================
         * 0. 轻提示
         * ============================================================ */
        const toast = document.getElementById('toast');
        let toast计时器 = null;
        function 提示(消息) {
            toast.textContent = 消息;
            toast.classList.add('显示');
            clearTimeout(toast计时器);
            toast计时器 = setTimeout(() => toast.classList.remove('显示'), 1900);
        }

        /* ============================================================
         * 1. 分类配置
         *    ★ 目录名 ≠ 显示名：显示「情侣」但目录是 4【情头】，别写反。
         * ============================================================ */
        const 分类表 = [
            { 键: '男头', 名: '男头', 目录: '4【男头】/', 数量: 6,  每扭: 1 },
            { 键: '女头', 名: '女头', 目录: '4【女头】/', 数量: 50, 每扭: 1 },
            { 键: '双女', 名: '双女', 目录: '4【双女】/', 数量: 42, 每扭: 2 },
            { 键: '情头', 名: '情侣', 目录: '4【情头】/', 数量: 34, 每扭: 2 },
        ];

        /** 该分类一共有多少个「可扭单元」：单张类 = 图片数，成対类 = 对数 */
        function 单元数(类) {
            return 类.每扭 === 2 ? Math.floor(类.数量 / 2) : 类.数量;
        }

        /** 第 k 个单元（k 从 1 起）对应的图片编号数组 */
        function 单元图片号(类, 单元) {
            if (类.每扭 === 2) return [单元 * 2 - 1, 单元 * 2];   // (1,2) (3,4) …
            return [单元];
        }

        /** 图片路径（不含扩展名） */
        function 图片基础(类, 号) { return 类.目录 + 号; }

        const 扩展候选 = ['png', 'jpg', 'jpeg', 'webp'];

        /* ============================================================
         * 2. 存档：虚拟货币 + 已获清单
         * ============================================================ */
        const 货币键 = '图库货币';
        const 已获键 = '图库已获';
        const 单价 = 0.5;

        function 读数(键, 默认) {
            try {
                const v = parseFloat(localStorage.getItem(键));
                return isFinite(v) && v >= 0 ? v : 默认;
            } catch (e) { return 默认; }
        }
        function 写数(键, v) { try { localStorage.setItem(键, String(v)); } catch (e) {} }

        function 读已获() {
            try {
                const o = JSON.parse(localStorage.getItem(已获键) || '{}');
                return (o && typeof o === 'object') ? o : {};
            } catch (e) { return {}; }
        }
        function 写已获(o) { try { localStorage.setItem(已获键, JSON.stringify(o)); } catch (e) {} }

        let 货币 = 读数(货币键, 0);
        let 已获 = 读已获();

        /** 某分类已解锁的单元集合（Set） */
        function 取集合(键) {
            const 表 = 已获[键];
            return new Set(Array.isArray(表) ? 表 : []);
        }
        function 存集合(键, 集) {
            已获[键] = Array.from(集).sort((a, b) => a - b);
            写已获(已获);
        }

        /* ============================================================
         * 3. 状态与渲染
         * ============================================================ */
        let 当前类 = 分类表[0];
        let 本次结果 = [];          // 本次扭到的图片编号数组

        const 分类栏 = document.getElementById('分类栏');
        const 扭蛋说明 = document.getElementById('扭蛋说明');
        const 扭一次钮 = document.getElementById('扭一次钮');
        const 扭蛋机 = document.getElementById('扭蛋机');
        const 结果区 = document.getElementById('结果区');
        const 结果图组 = document.getElementById('结果图组');
        const 结果名 = document.getElementById('结果名');
        const 保存钮 = document.getElementById('保存钮');
        const 图鉴网格 = document.getElementById('图鉴网格');
        const 图鉴名 = document.getElementById('图鉴名');
        const 图鉴进度 = document.getElementById('图鉴进度');
        const 货币数 = document.getElementById('货币数');

        function 刷新货币() {
            /* 整数直接显示，小数保留一位（0.5 这种） */
            货币数.textContent = (Math.round(货币 * 10) % 10 === 0)
                ? String(Math.round(货币))
                : 货币.toFixed(1);
        }

        /* ---- 分类按钮 ---- */
        分类表.forEach(类 => {
            const 钮 = document.createElement('button');
            钮.className = '分类钮' + (类 === 当前类 ? ' 选中' : '');
            钮.type = 'button';
            钮.textContent = 类.名;
            钮.dataset.分类 = 类.键;
            钮.addEventListener('click', () => 切分类(类));
            分类栏.appendChild(钮);
        });

        function 切分类(类) {
            当前类 = 类;
            Array.from(分类栏.children).forEach(钮 =>
                钮.classList.toggle('选中', 钮.dataset.分类 === 类.键));
            结果区.classList.remove('显示');
            本次结果 = [];
            渲染说明();
            渲染图鉴();
        }

        function 渲染说明() {
            const 集 = 取集合(当前类.键);
            const 总 = 单元数(当前类);
            const 单位 = 当前类.每扭 === 2 ? '对' : '张';
            扭蛋说明.innerHTML = '';
            const 行1 = document.createElement('div');
            行1.innerHTML = '当前分类 <b>' + 当前类.名 + '</b>　每扭 <b>'
                + (当前类.每扭 === 2 ? '一对（2 张）' : '1 张') + '</b>';
            const 行2 = document.createElement('div');
            行2.innerHTML = '已收集 <b>' + 集.size + '</b> / ' + 总 + ' ' + 单位;
            扭蛋说明.appendChild(行1);
            扭蛋说明.appendChild(行2);
        }

        /* ============================================================
         * 4. 预览：一行两列、清晰、不可点放大（无水印条、无下载角）
         * ============================================================ */
        /** ★ 预览图：清晰、不模糊、不裁切。
             只是给人看的，【没有绑定任何点击】—— 需求明确「不能点击放大」。 */
        function 建图元素(类, 号) {
            const img = document.createElement('img');
            img.className = '图鉴图';
            img.alt = 类.名 + ' ' + 号;
            img.dataset.号 = String(号);
            探图(img, 图片基础(类, 号));
            return img;
        }

        /** 按 png → jpg → jpeg → webp 逐个试。
            ★ onerror 用【赋值】而非 addEventListener：后者每次重试都会再叠一个
              监听器，第 N 次失败会连着触发 N 个回调（1 / 7 / 11 页踩过同款坑）。 */
        function 探图(img, 基础) {
            let 第几 = 0;
            img.onerror = () => {
                if (第几 < 扩展候选.length) {
                    img.src = 基础 + '.' + 扩展候选[第几++];
                    return;
                }
                img.onerror = null;
                img.removeAttribute('src');
            };
            img.src = 基础 + '.' + 扩展候选[第几++];
        }

        function 渲染图鉴() {
            const 集 = 取集合(当前类.键);
            const 总 = 单元数(当前类);
            图鉴名.textContent = 当前类.名 + '图鉴';
            图鉴进度.textContent = 集.size + ' / ' + 总
                + (当前类.每扭 === 2 ? ' 对' : ' 张');

            图鉴网格.innerHTML = '';

            for (let k = 1; k <= 总; k++) {
                const 解锁 = 集.has(k);
                const 格 = document.createElement('div');
                格.className = '图鉴格';
                格.dataset.单元 = String(k);

                const 号组 = 单元图片号(当前类, k);
                if (当前类.每扭 === 2) {
                    /* ★ 成対：格子横跨整行，一对的两张左右并排 */
                    格.classList.add('成対');
                    const 对 = document.createElement('div');
                    对.className = '图鉴对';
                    号组.forEach(n => 对.appendChild(建图元素(当前类, n)));
                    格.appendChild(对);
                } else {
                    格.appendChild(建图元素(当前类, 号组[0]));
                }

                /* ★ 状态只用一个【底部小标签】，不压在图上、也不再打水印条 */
                const 标 = document.createElement('div');
                标.className = '图鉴标 ' + (解锁 ? '已获得' : '未获得');
                标.textContent = 解锁
                    ? (当前类.每扭 === 2 ? ('第 ' + k + ' 对 · 已获得') : ('No.' + 号组[0] + ' · 已获得'))
                    : '未获得';
                格.appendChild(标);

                图鉴网格.appendChild(格);
            }
        }

        /* ============================================================
         * 5. 保存 / 下载
         *    ★ 用 <a download>：相对路径与页面同源，可直接下载。
         *    ★ 兜底：file:// 下个别浏览器会拦 → 提示用户长按图片保存。
         * ============================================================ */
        function 保存一个(路径, 文件名) {
            const a = document.createElement('a');
            a.href = 路径;
            a.download = 文件名;
            a.rel = 'noopener';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => a.remove(), 100);
        }

        /** 真实扩展名：图片已经探测过了，直接读它最终成功的 src */
        function 当前扩展(img) {
            const m = /\.([a-zA-Z0-9]+)$/.exec(img.getAttribute('src') || '');
            return m ? m[1] : 'png';
        }

        function 保存组(号组) {
            const 类 = 当前类;
            号组.forEach(n => {
                /* 从图鉴里找到那张已探测成功的图，用它的真实 src 下载，
                   避免再猜一次扩展名 */
                const img = 图鉴网格.querySelector('.图鉴图[data-号="' + n + '"]');
                const 路径 = (img && img.getAttribute('src')) || (图片基础(类, n) + '.png');
                保存一个(路径, 类.目录.replace(/\//g, '_') + n + '.' + 当前扩展(img));
            });
            提示(号组.length > 1 ? '已保存 ' + 号组.length + ' 张' : '已保存');
        }

        /* ============================================================
         * 6. 扭蛋
         * ============================================================ */
        let 扭蛋中 = false;

        扭一次钮.addEventListener('click', () => {
            if (扭蛋中) return;

            if (货币 < 单价) {
                提示('余额不足，先充值吧');
                开充值();
                return;
            }

            扭蛋中 = true;
            扭一次钮.disabled = true;
            货币 = +(货币 - 单价).toFixed(2);
            写数(货币键, 货币);
            刷新货币();

            扭蛋机.classList.remove('摇动');
            void 扭蛋机.offsetWidth;            // 强制回流，动画才能重放
            扭蛋机.classList.add('摇动');

            setTimeout(() => {
                扭蛋机.classList.remove('摇动');
                出结果();
                扭蛋中 = false;
                扭一次钮.disabled = false;
            }, 640);
        });

        function 出结果() {
            const 总 = 单元数(当前类);
            /* 随机可重复 —— 这是扭蛋机的常见做法：可能重复抽到同一单元 */
            const 单元 = 1 + Math.floor(Math.random() * 总);
            const 号组 = 单元图片号(当前类, 单元);

            const 集 = 取集合(当前类.键);
            const 是新 = !集.has(单元);
            集.add(单元);
            存集合(当前类.键, 集);

            本次结果 = 号组;

            /* 结果图 */
            结果图组.innerHTML = '';
            号组.forEach(n => {
                const img = document.createElement('img');
                img.className = '结果图';
                img.alt = 当前类.名 + ' ' + n;
                img.dataset.号 = String(n);
                探图(img, 图片基础(当前类, n));
                结果图组.appendChild(img);
            });

            结果名.textContent = 当前类.名 + ' '
                + (当前类.每扭 === 2 ? ('第 ' + 单元 + ' 对（' + 号组.join('、') + '）')
                                     : ('No.' + 号组[0]))
                + (是新 ? '' : ' · 重复');

            结果区.classList.add('显示');
            渲染说明();
            渲染图鉴();
        }

        保存钮.addEventListener('click', () => {
            if (!本次结果.length) return;
            保存组(本次结果);
        });

        /* ============================================================
         * 7. 充值：点右上角胶囊 → 弹窗，可自行输入金额
         * ============================================================ */
        const 充值遮罩 = document.getElementById('充值遮罩');
        const 金额输入 = document.getElementById('金额输入');
        const 弹窗余额 = document.getElementById('弹窗余额');

        function 开充值() {
            弹窗余额.textContent = 货币;
            金额输入.value = '';
            Array.from(快捷档.children).forEach(b => b.classList.remove('选中'));
            充值遮罩.classList.add('显示');
            setTimeout(() => 金额输入.focus(), 60);
        }
        function 关充值() { 充值遮罩.classList.remove('显示'); }

        document.getElementById('货币胶囊').addEventListener('click', 开充值);
        document.getElementById('充值取消').addEventListener('click', 关充值);
        充值遮罩.addEventListener('click', e => { if (e.target === 充值遮罩) 关充值(); });

        const 快捷档 = document.getElementById('快捷档');
        Array.from(快捷档.children).forEach(钮 => {
            钮.addEventListener('click', () => {
                Array.from(快捷档.children).forEach(b => b.classList.remove('选中'));
                钮.classList.add('选中');
                金额输入.value = 钮.dataset.额;
            });
        });

    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时
 *     把仍在通话中的音乐放出来。全部原因解除才恢复。
 *   ★ 会记住「占用前是否在播」，本来没放音乐就不会凭空启动。
 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */

    }

    }

     * 主体
     * ------------------------------------------------------------- */
    const 元素id = '全局音乐播放器';

    /* =========================================================================
     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位
     *
     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */
    const 占用 = new Set();
    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {

    }

    const 全局音频 = {
        /** 暂停背景音乐（可重入；同一原因重复调用无害） */

                const a = 取音频();
                占用前在播 = !!a && !a.paused;
            }
            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */
        恢复(原因) {
            const 键 = 原因 || '未命名';
            if (!占用.has(键)) return;
            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）
            if (!占用前在播) return;                 // 本来就没在播 → 不凭空启动

            if (a && a.paused) {
                const 试 = a.play();
                if (试 && typeof 试.catch === 'function') 试.catch(() => {});

        /** 强制清掉所有占用（异常路径兜底用） */
        清除() { 占用.clear(); },

        占用中() { return 占用.size > 0; },
        占用表() { return Array.from(占用); },
        是否在播() { const a = 取音频(); return !!a && !a.paused; },
    };
    /* ★ 无论让不让位都挂上：让位时它操作的是 4 页自己的播放器，

    function 启动() {
        /* ★★ 让位：4 页有完整播放器（#音乐播放器），这里绝不能再建第二个 audio。
              注意 7 页那个是 #语音播放器（点语音消息用的），与本脚本无关，
              各播各的，所以【只】认 #音乐播放器 这一个 id。 */
        if (document.getElementById('音乐播放器')) return;
        /* 防重：脚本万一被引了两次，也只建一个 audio */
        if (document.getElementById(元素id)) return;

        const 目标 = Math.max(0, Number(存.时间) || 0);

        });

        音频.addEventListener('ended', () => {

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */

                id: 存.id, 名: 存.名, 类型: 存.类型,

         *     ② 被拒 → 【持续】监听用户交互，直到真的播起来才撤监听；
         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没

            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {

            try { 试 = 音频.play(); } catch (e) { return; }

        }

                补播中 = true;

        function 亮提示() {

            条.textContent = '♪ 音乐已就绪，点一下继续播放';

            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);

            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }

            else 撤补播();
        }

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {

                        上传链接 = URL.createObjectURL(记录.数据);

                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件

    } else {

    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>
    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
