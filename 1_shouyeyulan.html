<!DOCTYPE html>
<!--
    静态预览版：仅用于查看首屏外观，不含任何交互逻辑。
    已从原版移除：配图裁剪弹窗、轻提示、下拉刷新、
                  会话跳转与 localStorage 同步。
    保留：主题背景 + 顶部导航 + 搜索框 + 三宫格配图 + 个人信息卡 + 标签 + 会话列表 + 底部导航。
    保留的脚本：① 读取系统时间并实时刷新；② 搜索（昵称 + 聊天记录，命中高亮）；
                ③ 点击编辑标签文字 / 昵称 / 个性签名并本地保存；
                ④ 配图与头像点击调起相册 → 裁剪 → 取消 / 确认上传；
                ⑤ 颜文字弹窗：预选 5 个 + 自建可删，点击后更新显示；
                ⑥ 加号菜单弹窗（三个选项，点击暂只关闭）；
                ⑦ 底部导航点击切换选中态（换用 小图标选中.png，不跳转）。
    底部导航图标：未选中 2【图片】/小图标.png，选中 2【图片】/小图标选中.png，点击可切换。
    占位图统一引用同级子文件夹「2【图片】」下的同名文件：
                  默认主题背景.png / 极简风格1-3.png / 圆形头像1-5.png。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>手机主题背景预览 - 静态预览版</title>
    <style>
        /* ===== 全局重置 & 容器 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            touch-action: pan-y;
        }

        /* ===== 统一色板：冷调灰紫 =====
           全站只用这一套变量，改这里即可整体换色。
           分五档：主文字 → 次级 → 弱 → 占位；强调色取主色加深，不再用暖黄。 */
        :root {
            --ink: #333336;            /* 主文字：深灰 */
            --ink-2: #55555a;          /* 次级文字 */
            --ink-3: #7a7a80;          /* 弱文字（时间、提示） */
            --ink-4: #a4a4aa;          /* 占位语 */
            --accent: #4a4a50;         /* 强调：深灰（选中、聚焦） */
            --accent-soft: #d5d5d9;    /* 强调浅底：选中项背景 */
            --accent-hi: #e6e6ea;      /* 高亮底：搜索命中 */
            --accent-ink: #35353b;     /* 高亮上的文字 */
            --panel: 255, 255, 255;    /* 面板基色（配 rgba 用） */
            --line: 158, 158, 162;     /* 描边基色（加深：浅灰 → 中灰） */
            --shade: 48, 48, 54;       /* 阴影基色 */
            /* ★★ 上面那批是 hex（#xxxxxx），【不能】直接塞进 rgba() ——
               rgba(var(--accent), .92) 展开成 rgba(#4a4a50, .92)，是无效值，
               整条声明会被浏览器静默丢弃（白底白字就是这么来的）。
               要带透明度时用下面这批【数值形式】的伴生变量：
                 正确：rgba(var(--accent-rgb), 0.92)
                 错误：rgba(var(--accent), 0.92)
            */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;

        }

        /* ===== 毛玻璃 =====
           --glass：面板底色不透明度，全站框架统一 50%
           --blur：模糊半径，铺底的大面板厚一点，小控件薄一点 */
        :root {
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
        }

        /* 毛玻璃通用：背景模糊 + 提亮 + 描边，三层叠加出玻璃质感
           注：Safari 需要 -webkit- 前缀；不支持 backdrop-filter 的浏览器自动退回纯半透明 */
        .玻璃 {
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            border: 1px solid rgba(var(--line), 0.42);
            box-shadow: 0 2px 12px rgba(var(--shade), 0.1),
                        inset 0 1px 0 rgba(var(--panel), 0.55);
        }

        .玻璃-薄 {
            -webkit-backdrop-filter: blur(var(--blur-sm)) saturate(140%) brightness(1.04);
            backdrop-filter: blur(var(--blur-sm)) saturate(140%) brightness(1.04);
            border: 1px solid rgba(var(--line), 0.38);
            box-shadow: inset 0 1px 0 rgba(var(--panel), 0.5);
        }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) {
            .手机主题背景容器 {
                box-shadow: none;
            }
        }

        .主题背景图片 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            height: 100dvh;
        }

        /* 全局白色遮罩：覆盖主题背景图（同 z-index 靠 DOM 顺序压在其上），位于所有 UI 内容之下，不拦截交互 */
        .全局白色遮罩 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            background: rgba(var(--panel), var(--glass));
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;
        }

        .系统时间 {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .中间标题 {
            font-size: clamp(14px, 4vw, 16px);
        }

        .颜文字触发器 {
            padding: clamp(2px, 1vw, 4px) clamp(6px, 2vw, 10px);
            border-radius: 12px;
            user-select: none;
        }

        .颜文字触发器.选中态 {
            background: rgba(var(--panel), 0.3);
        }

        /* 右上角加号：菜单入口 */
        .添加图标 {
            font-size: clamp(17px, 5vw, 20px);
            line-height: 1;
            color: var(--ink-2);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .添加图标.选中态 {
            color: var(--accent);
        }

        /* ===== 颜文字预选弹窗 ===== */
        .颜文字遮罩 {
            position: fixed;
            inset: 0;
            z-index: 110;
            /* 不要深色遮罩：改近乎无色的极淡白纱，
               既不压暗背后的页面，又能承接「点空白处关闭」的点击 */
            background: rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            touch-action: none;
            overscroll-behavior: contain;
        }
        .颜文字遮罩.显示 {
            display: flex;
        }

        /* 可爱的小框：圆角 + 顶部两只猫耳
           白底 35% + 背景模糊（backdrop-filter: blur），不加饱和/提亮修饰，
           只把背后画面糊开，保留背景原有色调。
           描边走 --line 灰调，遮罩不压暗。
           可读性靠两件事保证：① 内部卡片加实 ② 文字带白色描边 */
        .颜文字预选框 {
            position: relative;
            width: min(84vw, 320px);
            max-height: 74vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.35);
            /* 纯背景模糊：只 blur，不加 saturate / brightness，不改变背景原有色调 */
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            /* 描边改灰调（与输入框 / 添加按钮同色系） */
            border: 1px solid rgba(var(--line), 0.8);
            border-radius: 22px;
            padding: clamp(18px, 5vw, 24px) clamp(14px, 4vw, 18px) clamp(14px, 4vw, 18px);
            /* 投影用柔和灰调，与灰描边同系 */
            box-shadow: 0 10px 34px rgba(var(--shade), 0.16),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            text-align: center;
        }
        .颜文字预选框::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .猫耳 {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 18px solid rgba(255, 255, 255, 0.35);
        }
        .猫耳::before,
        .猫耳::after {
            content: "";
            position: absolute;
            top: -26px;
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 20px solid rgba(255, 255, 255, 0.35);
        }
        .猫耳::before {
            left: -40px;
            transform: rotate(-16deg);
        }
        .猫耳::after {
            left: 14px;
            transform: rotate(16deg);
        }

        .颜文字标题 {
            font-size: clamp(12px, 3.5vw, 13px);
            color: var(--ink-2);
            letter-spacing: 1px;
            margin-bottom: clamp(10px, 3vw, 14px);
            user-select: none;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.95);
        }

        .颜文字列表 {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 2vw, 8px);
            margin-bottom: clamp(12px, 3.5vw, 16px);
        }

        .颜文字选项 {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(8px, 2.5vw, 11px) clamp(30px, 8vw, 36px);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(var(--line), 0.7);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .颜文字选项.选中 {
            background: rgba(255, 255, 255, 0.92);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.22);
        }

        .颜文字本体 {
            font-size: clamp(13px, 4vw, 15px);
            color: var(--ink);
            line-height: 1.4;
            word-break: break-all;
            /* 白色描边：即使背景透出花纹，字依然立得住 */
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.95),
                         0 0 6px rgba(255, 255, 255, 0.85);
        }

        /* 删除按钮：只有自定义的才有，因此常驻显示、不做 hover 显现 */
        .颜文字删除 {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            line-height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            color: var(--ink-2);
            font-size: 15px;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .颜文字新建 {
            display: flex;
            gap: clamp(6px, 2vw, 8px);
            align-items: center;
        }

        .颜文字输入 {
            flex: 1;
            min-width: 0;
            /* 与右侧「添加」按钮同款灰色描边，两者并排才协调 */
            border: 1px solid rgba(var(--line), 0.8);
            border-radius: 12px;
            padding: clamp(8px, 2.5vw, 10px) clamp(10px, 3vw, 12px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink);
            background: rgba(255, 255, 255, 0.78);
            outline: none;
            font-family: inherit;
        }
        .颜文字输入::placeholder {
            color: var(--ink-4);
        }

        /* 「添加」按钮：白底 + 深灰字 + 灰色描边（与输入框同规格，保持一致） */
        .颜文字确认 {
            flex-shrink: 0;
            border: 1px solid rgba(var(--line), 0.8);
            border-radius: 12px;
            padding: clamp(8px, 2.5vw, 10px) clamp(12px, 3.5vw, 16px);
            font-size: clamp(12px, 3.5vw, 13px);
            background: #fff;
            color: var(--accent-ink);
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .颜文字空提示 {
            font-size: clamp(11px, 3vw, 12px);
            color: var(--ink-3);
            padding: clamp(8px, 2.5vw, 12px) 0;
            user-select: none;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.95);
        }

        /* ===== 加号菜单弹窗 =====
           位置仿微信：从右上角「+」下方展开、右对齐，不居中、无猫耳、无尖角。
           外观沿用颜文字弹窗那套（圆角 + 背景模糊 + 灰描边），底色 65% 更实。
           菜单项不带独立卡片框，就是「图标 + 文字」一行。
           具体 top / right 由 JS 依「+」的实际位置计算，这里的值是无 JS 时的兜底。 */
        .添加菜单遮罩 {
            position: fixed;
            inset: 0;
            z-index: 115;
            background: rgba(255, 255, 255, 0.06);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            display: none;
            touch-action: none;
            overscroll-behavior: contain;
        }
        .添加菜单遮罩.显示 {
            display: block;
        }

        .添加菜单框 {
            position: absolute;
            top: clamp(46px, 13vw, 58px);
            right: clamp(12px, 4vw, 16px);
            width: min(52vw, 178px);
            background: rgba(255, 255, 255, 0.65);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(var(--line), 0.8);
            /* 菜单变小了，圆角相应收到 16px，22px 在窄框上会显得过圆 */
            border-radius: 16px;
            padding: clamp(10px, 3vw, 12px) clamp(12px, 3.5vw, 14px);
            box-shadow: 0 10px 30px rgba(var(--shade), 0.16),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .添加菜单列表 {
            display: flex;
            flex-direction: column;
            gap: clamp(2px, 1vw, 4px);
        }

        /* 菜单项不再各自带小卡片框：直接落在外层框上，
           只有一行「图标 + 文字」，点哪行算哪行（微信同款） */
        .添加菜单项 {
            display: flex;
            align-items: center;
            gap: clamp(9px, 3vw, 11px);
            padding: clamp(9px, 3vw, 11px) clamp(8px, 2.5vw, 10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 图标统一规格：24 格、1.8 描边、圆头圆角、跟随文字色 */
        .添加菜单图标 {
            width: clamp(19px, 5.5vw, 22px);
            height: clamp(19px, 5.5vw, 22px);
            flex-shrink: 0;
            color: var(--accent-ink);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .添加菜单文字 {
            font-size: clamp(13px, 3.8vw, 14px);
            color: var(--ink);
            line-height: 1.3;
        }

        .搜索框容器 {
            margin: 0 clamp(12px, 4vw, 16px);
            background: rgba(var(--panel), var(--glass));
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: clamp(6px, 2vw, 8px) clamp(10px, 3.5vw, 14px);
        }

        .图标 {
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            overflow: visible;
        }

        .放大镜图标 {
            width: clamp(14px, 4vw, 16px);
            height: clamp(14px, 4vw, 16px);
            stroke-width: 2;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink-3);
            margin-right: 8px;
        }

        .搜索输入框 {
            border: none;
            background: transparent;
            outline: none;
            font-size: clamp(13px, 3.5vw, 14px);
            color: var(--ink-2);
            width: 100%;
        }

        .搜索输入框::placeholder {
            color: var(--ink-3);
        }

        /* ===== 中间滚动区 =====
           滚动条只隐藏外观，滚动能力全部保留：
           - Firefox：scrollbar-width: none
           - Chrome / Safari / Edge：::-webkit-scrollbar { display: none }
           - IE / 老 Edge：-ms-overflow-style: none
           注意：不能用 overflow: hidden，那样会连滚动一起禁掉 */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-x: none;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: clamp(16px, 5vw, 20px);
            position: relative;
            z-index: 2;
            background: rgba(var(--panel), 0.15);
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .手机界面内容::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .配图框容器 {
            display: flex;
            gap: clamp(8px, 2.5vw, 10px);
            margin: clamp(10px, 3vw, 12px) clamp(12px, 4vw, 16px) 0;
        }

        .极简配图框 {
            flex: 1;
            aspect-ratio: 1;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            background: rgba(var(--panel), var(--glass));
            box-shadow: inset 0 0 25px 6px rgba(var(--panel), 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .极简配图框 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            inset: 0;
        }

        /* ===== 配图裁剪弹窗 ===== */
        .裁剪遮罩 {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(16, 16, 24, 0.84);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 4vw, 20px);
            padding: 24px;
            /* 弹窗打开时锁住背后页面的手势，避免拖动图片带动列表滚动 */
            touch-action: none;
            overscroll-behavior: contain;
        }
        .裁剪遮罩.显示 {
            display: flex;
        }
        .裁剪标题 {
            color: rgba(var(--panel), 0.85);
            font-size: clamp(12px, 3.5vw, 14px);
            letter-spacing: 1px;
            user-select: none;
        }
        .裁剪视口 {
            position: relative;
            width: min(78vw, 300px);
            height: min(78vw, 300px);
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid rgba(var(--panel), 0.85);
            box-shadow: 0 0 0 9999px rgba(10, 10, 20, 0.4);
            background: #16161c;
            touch-action: none;
            cursor: grab;
        }
        .裁剪视口.拖动中 {
            cursor: grabbing;
        }

        .标签 {

            border-radius: 10px;

        .标签[contenteditable="true"] {

        .群头像 {
            width: clamp(44px, 12vw, 48px);
            height: clamp(44px, 12vw, 48px);

            background: rgba(var(--line), 0.28);
            flex-shrink: 0;

        .会话名称 mark,
        .会话消息 mark {
            background: var(--accent-hi);
            color: var(--accent-ink);
            border-radius: 3px;
            padding: 0 1px;
        }

            text-align: center;
            padding: clamp(24px, 8vw, 36px) 0;

            font-size: clamp(12px, 3.5vw, 13px);

            display: block;
        }

            z-index: 20;

            justify-content: space-around;
            align-items: center;

            border-top: 1px solid rgba(var(--panel), 0.3);
        }

        .导航项 {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--ink-3);
        }

        .导航文字 {
            font-size: clamp(9px, 2.5vw, 10px);
            margin-top: 2px;
        }

        .导航项.选中 {
            color: var(--ink);
            font-weight: 600;
        }

        .导航项.选中 .导航图标 {
            transform: scale(1.12);
        }

        .导航图标 {
            width: clamp(16px, 4.5vw, 18px);
            height: clamp(16px, 4.5vw, 18px);
            object-fit: contain;
            display: block;
            line-height: 1;

        .导航项:not(.选中) .导航图标 {
            opacity: 0.72;
        }

        /* ===== 视觉隐藏的文件输入 =====
           移动端（尤其 Android WebView / 部分 iOS）对 display:none 的 <input type=file>
           调用 .click() 无效 —— 元素已从渲染树移除，无法接收用户手势。
           改用「仍在渲染树中但不可见」的标准写法，保证 click() 在所有浏览器都能唤起相册。 */
        .视觉隐藏文件输入 {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
            opacity: 0; pointer-events: none;
        }

        /* ===== 图片来源选择（拍摄 / 从手机相册选择 / 取消）=====
           ★ 全站统一面板：1 / 2 / 6 / 8 / 9 / 10 / 11 页共用这套结构与文案。
             改了这里，请把改动同步到其余六页（CSS 与 HTML 各一处）。 */
        .来源遮罩 {
            position: fixed; inset: 0; z-index: 300;
            background: rgba(16, 16, 24, 0.45);
            display: none; align-items: flex-end; justify-content: center;
        }
        .来源遮罩.显示 { display: flex; }
        .来源面板 {
            width: 100%; max-width: 430px;
            padding: 0 clamp(8px, 2.4vw, 10px)
                     calc(clamp(8px, 2.4vw, 10px) + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .26s cubic-bezier(.32, .72, 0, 1);
        }
        .来源遮罩.显示 .来源面板 { transform: translateY(0); }

        .来源组 {
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(13px, 3.8vw, 15px);
            overflow: hidden;
        }
        .来源项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 13px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(14px, 4vw, 17px);
            border: none;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .来源项 + .来源项 { border-top: 1px solid rgba(var(--line), 0.15); }
        .来源项:active { background: rgba(var(--line), 0.09); }
        .来源项 svg {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(17px, 4.8vw, 19px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .来源文字 { font-size: clamp(13.5px, 3.9vw, 15px); color: var(--ink); font-weight: 500; }

        .来源项.取消 {
            margin-top: clamp(7px, 2vw, 9px);
            border-radius: clamp(13px, 3.8vw, 15px);
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            justify-content: center;
        }
        .来源项.取消 .来源文字 { font-weight: 600; }

        /* ===== Toast：图片读取/保存失败时给用户明确反馈（移动端不再静默失败） ===== */
        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px); background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

    <script id="联系人删除">
/**
 * 联系人删除.js —— 删除联系人 / 群聊、以及随之清理的全部存档
 *
 * ★★ 为什么抽成一份
 *   1 页（长按会话框）与 4 页（长按联系人）都要做同一件事：
 *     「删掉这个联系人，并且把他的会话、聊天记录、档案、头像、音色一起清掉」。
 *   两页各写一遍，只要有一处漏清一个键，就会出现
 *     「联系人没了，但聊天记录还在 / 会话框还挂着那一行」这种鬼影。
 *   这里只写一份，用 同步联系人删除.py 内联进 1 / 4 页 ——
 *   页面运行时【不依赖】外部文件，单拷 html 也能跑。
 *
 * ★★ 删一个联系人要清哪些键（漏一个就留垃圾）
 *   联系人索引      —— 列表本体（1 / 4 / 5 / 6 / 7 页都在读）
 *   聊天记录_<id>   —— 聊天存档（7 页）
 *   好友信息_<id>   —— 角色档案（7 页读它抽口头禅）
 *   好友头像_<id>   —— 头像 dataURL（2 页）
 *   音色配置_<id>   —— 3 页 per-contact 的音色 / 音速 / 语调
 *   当前联系人      —— 跳转前暂存；若正指向他就一起清，否则下次进来会跳到一个不存在的人
 *   会话列表        —— 旧键（兼容未升级的读取方），也要移除对应项
 *   人设列表        —— 若这条人设绑的是这个联系人，一起删
 *
 * ★★ 删一个群要清哪些键
 *   群聊列表        —— 群本体（★ 群不进「联系人索引」）
 *   聊天记录_g_xxx  —— 群的聊天存档（键名同样是「聊天记录_」前缀）
 *
 * ★★ 为什么还要记「已删会话」
 *   1 页的会话列表是 HTML 里【写死】的（4 个默认角色），不是从「联系人索引」渲染的。
 *   所以只清索引 + 清聊天记录是不够的：
 *     删完刷新 → 写死的那一行又回来了 → 6.5 导出还会把它重新写进索引。
 *   用户看到的就是「删了又复活」。
 *   这里记一份「已删会话」名单，1 页加载时先把这些行抹掉，删除才算真的生效。
 *   ★ 名单里存的是【名字】，因为 1 页写死的行只有名字、没有 id。
 *
 * ★★ 关于「扫键」
 *   不能用 Object.keys(localStorage) —— Storage 是代理对象，
 *   在部分实现（含 jsdom）下枚举不到任何键，会静默什么都删不掉。
 *   length + key(i) 是规范里唯一保证可用的遍历方式。
 */
(function (全局) {
    'use strict';

    /* ============================================================
     * 1. 存储工具
     * ============================================================ */
    function 读(键, 兜底) {
        try {
            const v = 全局.localStorage.getItem(键);
            return v === null || v === undefined ? 兜底 : v;
        } catch (e) { return 兜底; }
    }
    function 读表(键) {
        try {
            const v = JSON.parse(读(键, '[]'));
            return Array.isArray(v) ? v : [];
        } catch (e) { return []; }
    }
    function 写(键, 值) {
        try { 全局.localStorage.setItem(键, 值); return true; } catch (e) { return false; }
    }
    function 删键(键) {
        try { 全局.localStorage.removeItem(键); } catch (e) {}
    }
    /* ============================================================
     * 1.5 「已删会话」名单
     *   1 页会话列表写死在 HTML 里，删完刷新会复活，所以必须记一份名单。
     *   ★ 存名字不存 id：写死的会话行只有名字。
     * ============================================================ */
    const 已删键 = '已删会话';

    function 读已删() {
        const 表 = 读表(已删键);
        return 表.filter(x => typeof x === 'string' && x.trim())
            .map(x => String(x).trim());
    }

    /** ★ 传入名字（可多个）；返回名单长度 */
    function 记已删(名们) {
        const 加 = (Array.isArray(名们) ? 名们 : [名们])
            .map(x => String(x == null ? '' : x).trim()).filter(Boolean);
        if (!加.length) return 读已删().length;
        const 表 = 读已删();
        加.forEach(n => { if (表.indexOf(n) < 0) 表.push(n); });
        /* ★ 只留最近 200 条：名单会一直涨，没必要无限存 */
        写(已删键, JSON.stringify(表.slice(-200)));
        return 表.length;
    }

    /** 名字（或群名，含「（N）」后缀）是否在已删名单里 */
    function 是已删(名) {
        const 净 = String(名 == null ? '' : 名).trim();
        if (!净) return false;
        /* ★ 群名带人数后缀，两边都要去掉再比 */
        const 裸 = 净.replace(/（\d+）\s*$/, '').trim();
        return 读已删().some(x => x === 净 || x === 裸);
    }

    function 扫键(前缀) {
        const 出 = [];
        try {
            const 库 = 全局.localStorage;
            for (let i = 0; i < 库.length; i++) {
                const k = 库.key(i);
                if (k && k.indexOf(前缀) === 0) 出.push(k);
            }
        } catch (e) {}
        return 出;
    }

    /* ============================================================
     * 2. 删联系人：连带全部存档
     *
     *   ★ id 与名都要传：老数据里存在「有 id 没名字」「有名字没 id」两种，
     *     只按一个匹配会漏删，留下鬼影。
     * ============================================================ */
    /* ============================================================
     * 2.5 ★★ 只删会话（不动联系人）
     *
     *   ★★ 与「删联系人」是【两个功能】，别混：
     *     删会话   —— 会话框那一行没了 + 聊天记录清掉；
     *                但【通讯录里的联系人还在】，档案 / 头像 / 音色都保留。
     *                之后从通讯录再发起聊天，会话会重新出现。
     *     删联系人 —— 联系人本身没了，并【连带】清掉他的会话与聊天记录
     *                （4 页长按就是这个，所以它会调 清会话 + 清档案…）。
     *
     *   只删会话要清哪些键：
     *     聊天记录_<id>   —— 聊天存档
     *     当前联系人      —— 若正指向他就一起清（否则会跳到一个已删会话的人）
     *     会话列表        —— 旧键（兼容未升级的读取方）
     *     已删会话        —— 记名字（1 页会话行写死在 HTML 里，靠这份名单抹掉）
     *   ★ 【不清】联系人索引 / 好友信息 / 好友头像 / 音色配置 / 人设
     *     —— 那是删联系人才该动的东西。
     * ============================================================ */
    function 清会话(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];

        /* ① 聊天记录 */
        if (编号) {
            const 键 = '聊天记录_' + 编号;
            if (读(键, null) !== null) { 删键(键); 清了.push(键); }
        }

        /* ② 当前联系人指向他就是脏数据 */
        try {
            const 原 = 读('当前联系人', '');
            if (原) {
                const 项 = JSON.parse(原);
                const 同id = 编号 && 项 && String(项.id || '').trim() === 编号;
                const 同名 = 称呼 && 项 && (String(项.名称 || '').trim() === 称呼
                    || String(项.备注 || '').trim() === 称呼);
                if (同id || 同名) { 删键('当前联系人'); 清了.push('当前联系人'); }
            }
        } catch (e) {}

        /* ③ 旧键「会话列表」 */
        if (称呼) {
            const 会话 = 读表('会话列表');
            const 剩 = 会话.filter(项 =>
                !(项 && String(项.名称 || '').trim() === 称呼));
            if (剩.length !== 会话.length) {
                写('会话列表', JSON.stringify(剩));
                清了.push('会话列表');
            }
        }

        /* ④ 记进「已删会话」：1 页写死的会话行靠这份名单抹掉 */
        if (称呼) 记已删([称呼]);

        return 清了;
    }

    /* ============================================================
     * 2.6 ★ 会话「复活」
     *   只删会话后，联系人还在通讯录里。用户再从通讯录发起聊天时，
     *   会话应该【重新出现】—— 否则「人还在，却永远聊不了」就成死局了。
     *   所以 7 页落地新消息时要把名字从已删名单里移除。
     * ============================================================ */
    function 复活会话(名) {
        const 称呼 = String(名 == null ? '' : 名).trim();
        if (!称呼) return 读已删().length;
        const 裸 = 称呼.replace(/（\d+）\s*$/, '').trim();
        const 剩 = 读已删().filter(x => x !== 称呼 && x !== 裸);
        写(已删键, JSON.stringify(剩));
        return 剩.length;
    }

    function 清联系人(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];

        /* ① 联系人索引（本体） */
        const 索引 = 读表('联系人索引');
        const 剩 = 索引.filter(项 => {
            if (!项 || typeof 项 !== 'object') return true;
            const 同id = 编号 && String(项.id || '').trim() === 编号;
            const 同名 = 称呼 && (String(项.名称 || '').trim() === 称呼
                || String(项.备注 || '').trim() === 称呼);
            return !(同id || 同名);
        });
        if (剩.length !== 索引.length) {
            写('联系人索引', JSON.stringify(剩));
            清了.push('联系人索引');
        }

        /* ② 按 id 的四个分桶键 */
        if (编号) {
            ['聊天记录_', '好友信息_', '好友头像_', '音色配置_'].forEach(前缀 => {
                const 键 = 前缀 + 编号;
                if (读(键, null) !== null) { 删键(键); 清了.push(键); }
            });
        }

        /* ③ 当前联系人（跳转前暂存）指向他就是脏数据 */
        try {
            const 原 = 读('当前联系人', '');
            if (原) {
                const 项 = JSON.parse(原);
                const 同id = 编号 && 项 && String(项.id || '').trim() === 编号;
                const 同名 = 称呼 && 项 && (String(项.名称 || '').trim() === 称呼
                    || String(项.备注 || '').trim() === 称呼);
                if (同id || 同名) { 删键('当前联系人'); 清了.push('当前联系人'); }
            }
        } catch (e) {}

        /* ④ 旧键「会话列表」（兼容未升级的读取方） */
        const 会话 = 读表('会话列表');
        const 会话剩 = 会话.filter(项 =>
            !(项 && 称呼 && String(项.名称 || '').trim() === 称呼));
        if (会话剩.length !== 会话.length) {
            写('会话列表', JSON.stringify(会话剩));
            清了.push('会话列表');
        }

        /* ★ 记进「已删会话」：1 页写死的行就靠这份名单抹掉，否则刷新会复活 */
        if (称呼) 记已删([称呼]);

        /* ⑤ 人设：绑在这个联系人身上的一起删 */
        try {
            const 人设 = 读表('人设列表');
            const 人设剩 = 人设.filter(p =>
                !(p && 编号 && String(p.id || '').trim() === 编号));
            if (人设剩.length !== 人设.length) {
                写('人设列表', JSON.stringify(人设剩));
                清了.push('人设列表');
            }
        } catch (e) {}

        return 清了;
    }

    /* ============================================================
     * 3. 删群聊
     *   ★ 群只存在「群聊列表」，绝不进「联系人索引」——
     *     否则会混进 4 页 A–Z 分组，也会被 1 页导出当成普通联系人。
     * ============================================================ */
    /** ★ 第二参数 名：群名（1 页写死的行只有名字，删群也要能抹掉那一行） */
    function 清群(id, 名) {
        const 编号 = String(id == null ? '' : id).trim();
        if (!编号) return [];
        const 称呼 = String(名 == null ? '' : 名).trim();
        const 清了 = [];
        const 群表 = 读表('群聊列表');
        const 剩 = 群表.filter(g => !(g && String(g.id || '').trim() === 编号));
        if (剩.length !== 群表.length) {
            写('群聊列表', JSON.stringify(剩));
            清了.push('群聊列表');
        }
        /* 群的聊天存档同样是「聊天记录_」前缀 */
        const 键 = '聊天记录_' + 编号;
        if (读(键, null) !== null) { 删键(键); 清了.push(键); }
        /* ★ 群名也记进已删名单（1 页群会话行写死时靠它抹掉） */
        if (称呼) 记已删([称呼]);
        return 清了;
    }

    /* ============================================================
     * 4. 确认弹窗
     *   ★ 用 fixed 覆盖全屏，不受各页容器（.手机界面内容 / .手机主题背景容器）
     *     position / z-index 差异的影响 —— 这两页的容器结构并不一样。
     *   ★ 不引入任何新颜色：全部走全站色板。
     * ============================================================ */
    let 弹窗 = null;

    function 建弹窗() {
        if (弹窗) return 弹窗;

                    document.execCommand('insertText', false, 文本);

                元素.addEventListener('blur', 失焦);
                元素.addEventListener('keydown', 按键);
                元素.addEventListener('paste', 粘贴);
            }

            function 保存全部标签() {
                const 列表 = Array.from(document.querySelectorAll('.标签文字'))
                    .map(el => 清理(el.textContent));
                写(键_标签, JSON.stringify(列表));
            }

            // 五个标签：点标签任意处都能改文字，唯独爱心图标点不动
            const 标签栏 = document.querySelector('.标签栏');
            标签栏.addEventListener('click', (e) => {
                if (e.target.closest('.标签爱心')) return;      // 爱心排除
                const 标签 = e.target.closest('.标签');
                if (!标签) return;
                const 文字 = 标签.querySelector('.标签文字');
                if (文字) 进入编辑(文字, { 键: 键_标签, 多行: false, 保存后: 保存全部标签 });
            });

            const 昵称元素 = document.getElementById('首页昵称');
            const 签名元素 = document.getElementById('首页签名');

            昵称元素.addEventListener('click', () => {
                进入编辑(昵称元素, { 键: 键_昵称, 多行: false });
            });
            签名元素.addEventListener('click', () => {
                进入编辑(签名元素, { 键: 键_签名, 多行: true });
            });

            // ===== 还原上次保存的内容 =====
            (function 还原() {
                let 列表 = null;
                try { 列表 = JSON.parse(读(键_标签)); } catch (e) {}
                if (Array.isArray(列表)) {
                    document.querySelectorAll('.标签文字').forEach((el, i) => {
                        if (列表[i] != null) {
                            el.textContent = 列表[i];
                            el.classList.toggle('空态', 是否空(列表[i]));
                        }
                    });
                }

                const 昵称 = 读(键_昵称);
                if (昵称) {
                    昵称元素.innerHTML = 昵称;
                    昵称元素.classList.toggle('空态', 是否空(昵称));
                }

                const 签名 = 读(键_签名);
                if (签名) {
                    签名元素.innerHTML = 签名;
                    签名元素.classList.toggle('空态', 是否空(签名));
                }
            })();

            // 别的标签页改了资料，这边跟着更新
            window.addEventListener('storage', (e) => {
                if (!e.key || [键_标签, 键_昵称, 键_签名].indexOf(e.key) !== -1) location.reload();
            });
        })();

        // ===== 4. 配图 / 头像：点击调起系统相册 → 裁剪 → 取消 / 确认 =====
        //    流程：点配图框或个人头像 → <input type=file> 唤起相册或拍照 → 选完进裁剪弹窗
        //          → 取消：丢弃本次选择直接退出；确认：按裁剪框输出图并更新
        //    配图走方形取景框输出 1:1 JPEG；头像走圆形取景框输出圆形透明 PNG。
        //    裁好的图存进 localStorage（配图「首页配图」/ 头像「用户头像」），刷新后仍在；
        //    存不下就只在本会话生效。
        (function () {
            const 遮罩 = document.getElementById('裁剪遮罩');
            const 视口 = document.getElementById('裁剪视口');
            const 图片 = document.getElementById('裁剪图片');
            const 文件输入 = document.getElementById('配图文件输入');
            const 界面内容 = document.querySelector('.手机界面内容');
            const 配图框列表 = Array.from(document.querySelectorAll('.极简配图框'));
            const 头像元素 = document.querySelector('.个人信息区 .圆形头像');
            const 配图存储键 = '首页配图';
            const 头像存储键 = '用户头像';      // 沿用原版键名，与「我的」页互通

            // 当前编辑目标：{ img, 索引, 圆形 }
            //   索引 >= 0 → 三宫格配图；索引 === -1 → 个人头像（圆形裁剪）
            let 当前目标 = null;
            let 图片宽 = 0;
            let 图片高 = 0;
            const 状态 = { tx: 0, ty: 0, scale: 1, minScale: 1, maxScale: 6 };

            function 弹窗已开() {
                return 遮罩.classList.contains('显示');
            }

            function 视口尺寸() {
                return 视口.clientWidth;
            }

            function 应用变换() {
                图片.style.transform = `translate(${状态.tx}px, ${状态.ty}px) scale(${状态.scale})`;
            }

            // 约束平移范围：图片任何一边都不许缩进取景框内，避免裁出白边
            function 约束() {
                const vp = 视口尺寸();
                const 宽 = 图片宽 * 状态.scale;
                const 高 = 图片高 * 状态.scale;
                状态.tx = Math.min(0, Math.max(vp - 宽, 状态.tx));
                状态.ty = Math.min(0, Math.max(vp - 高, 状态.ty));
            }

            function 缩放到(新值, 焦点X, 焦点Y) {
                const 旧值 = 状态.scale;
                新值 = Math.min(状态.maxScale, Math.max(状态.minScale, 新值));
                if (新值 === 旧值) return;
                状态.tx = 焦点X - (焦点X - 状态.tx) * (新值 / 旧值);
                状态.ty = 焦点Y - (焦点Y - 状态.ty) * (新值 / 旧值);
                状态.scale = 新值;
                约束();
                应用变换();
            }

            // 初始缩放：让图片恰好铺满取景框（cover），下限即此值，防止缩到露出底色
            function 初始化状态() {
                const vp = 视口尺寸();
                if (vp <= 0 || !图片宽) return;
                const 覆盖 = Math.max(vp / 图片宽, vp / 图片高);
                状态.minScale = 覆盖;
                状态.maxScale = 覆盖 * 4;
                状态.scale = 覆盖;
                状态.tx = (vp - 图片宽 * 覆盖) / 2;
                状态.ty = (vp - 图片高 * 覆盖) / 2;
                应用变换();
            }

            function 打开弹窗() {
                // 头像走圆形取景框，配图走方形
                视口.classList.toggle('圆形', !!(当前目标 && 当前目标.圆形));
                遮罩.classList.add('显示');
                // 锁住背后列表：桌面端滚轮、移动端触摸都不会带着页面一起动
                if (界面内容) 界面内容.style.overflowY = 'hidden';
                requestAnimationFrame(初始化状态);
            }

            function 关闭弹窗() {
                遮罩.classList.remove('显示');
                指针集合.clear();
                上次双指距离 = 0;
                上次双指中点 = null;
                视口.classList.remove('拖动中');
                清空输入值();          // 清掉选中文件，下次选同一张也能触发 change
                释放对象URL();          // 释放 blob 引用，避免移动端反复选图内存累积
                if (界面内容) 界面内容.style.overflowY = '';
            }

            // ---- 点配图框 / 点头像 → 唤起相册 ----
            // 手机给「拍照 / 相册」二选一；桌面端直接选文件，不打断原有习惯
            const 拍照输入 = document.getElementById('配图拍照输入');
            const 来源遮罩 = document.getElementById('来源遮罩');
            function 关闭来源() { 来源遮罩.classList.remove('显示'); }
            // ★ 一律先弹来源面板：桌面端也一样，先让用户选「拍摄 / 从手机相册选择」，
            //   不再直接开系统文件框 —— 全站 1 / 2 / 6 / 8 / 9 / 10 / 11 页行为一致。
            function 来源面板() {
                来源遮罩.classList.add('显示');
            }
            document.getElementById('来源拍照').addEventListener('click', () => {
                关闭来源(); 拍照输入.value = ''; 拍照输入.click();
            });
            document.getElementById('来源相册').addEventListener('click', () => {
                关闭来源(); 文件输入.value = ''; 文件输入.click();
            });
            document.getElementById('来源取消').addEventListener('click', 关闭来源);
            来源遮罩.addEventListener('click', (e) => { if (e.target === 来源遮罩) 关闭来源(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && 来源遮罩.classList.contains('显示')) 关闭来源();
            });

            配图框列表.forEach((框, 序号) => {
                框.addEventListener('click', () => {
                    当前目标 = { img: 框.querySelector('img'), 索引: 序号, 圆形: false };
                    来源面板();
                });
            });

            if (头像元素) {
                头像元素.title = '点击更换头像';
                头像元素.addEventListener('click', () => {
                    当前目标 = { img: 头像元素, 索引: -1, 圆形: true };
                    来源面板();
                });
            }

            // ---- 选完图 → 进裁剪 ----
            //  移动端要点：① objectURL 优先（手机原图转 base64 易内存爆）
            //             ② 失败给 toast 提示，绝不静默
            //             ③ 超大图先降采样，规避 iOS 解码上限
            let 当前对象URL = '';
            function 释放对象URL() {
                if (当前对象URL) {
                    try { URL.revokeObjectURL(当前对象URL); } catch (e) {}
                    当前对象URL = '';
                }
            }
            function 清空输入值() { try { 文件输入.value = ''; } catch (e) {} }

            // 超大图降采样：超过 iOS 安全解码上限先缩尺寸，返回 true 表示已换 src（会重走 onload）
            function 降采样若过大(图) {
                const 宽 = 图.naturalWidth, 高 = 图.naturalHeight;
                const 像素 = 宽 * 高;
                const 上限 = 16000000;                     // iOS Safari 解码安全线
                if (!宽 || !高 || 像素 <= 上限) return false;
                try {
                    const 比例 = Math.sqrt(上限 / 像素);
                    const 新宽 = Math.max(1, Math.round(宽 * 比例));
                    const 新高 = Math.max(1, Math.round(高 * 比例));
                    const 画布 = document.createElement('canvas');
                    画布.width = 新宽; 画布.height = 新高;
                    画布.getContext('2d').drawImage(图, 0, 0, 新宽, 新高);
                    释放对象URL();
                    图.src = 画布.toDataURL('image/jpeg', 0.92);
                    return true;
                } catch (e) {
                    return false;                          // 降采样失败就按原图走，不阻塞用户
                }
            }

            // HEIC 走不到解码那步，必须提前拦 —— 否则移动端表现为「选完没反应」
            function 拦截HEIC(文件) {
                if (!是HEIC(文件)) return false;
                showToast('HEIC 格式无法识别，请改为 JPG 后重试');
                清空输入值();
                return true;
            }

            async function 处理选中文件(文件, 来源输入) {
                const 清空 = () => { try { 来源输入.value = ''; } catch (e) {} };
                if (!文件) return;
                if (!/^image\//.test(文件.type) && !/\.hei(c|f)$/i.test(文件.name || '')) {
                    showToast('请选择图片文件'); 清空(); return;
                }
                if (拦截HEIC(文件)) return;

                // 读 EXIF 方向（只取头部 128KB，不整图入内存）
                const 方向 = await 读方向(文件);

                // ★ 先注册 onload / onerror，再赋 src —— 防止图片秒加载时事件丢失
                图片.onload = () => {
                    const 宽 = 图片.naturalWidth, 高 = 图片.naturalHeight;
                    if (!宽 || !高) { 图片宽 = 宽; 图片高 = 高; 打开弹窗(); return; }
                    const 收尾 = () => { 打开弹窗(); };
                    try {
                        if (方向 !== 1 || 宽 * 高 > 解码像素上限) {
                            // 需要摆正或降采样 → 走一次 canvas 规范化。
                            // ★ 换 src 后必须等新图 load 完再开窗，否则裁剪预览是空白
                            const 结果 = 规范化图片(图片, 方向);
                            图片宽 = 结果.宽; 图片高 = 结果.高;
                            图片.onload = 收尾;
                            图片.src = 结果.dataURL;
                            return;
                        }
                        图片宽 = 宽; 图片高 = 高;
                    } catch (err) {
                        图片宽 = 宽; 图片高 = 高;   // canvas 失败就按原图走，不阻塞用户
                    }
                    收尾();
                };
                图片.onerror = () => {
                    释放对象URL();
                    清空();
                    if (是HEIC(文件)) showToast('HEIC 格式无法识别，请改为 JPG 后重试');
                    else showToast('图片读取失败，请换一张试试');
                };

                // ★ objectURL 优先：零拷贝，避免十几 MB 的 base64 撑爆移动端内存
                if (typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
                    释放对象URL();
                    try {
                        当前对象URL = URL.createObjectURL(文件);
                        图片.src = 当前对象URL;
                        return;
                    } catch (err) { /* 落到 FileReader 回退 */ }
                }
                const 读取器 = new FileReader();
                读取器.onload = (e) => { 图片.src = e.target.result; };
                读取器.onerror = () => { 清空(); showToast('图片读取失败，请重试'); };
                读取器.readAsDataURL(文件);
            }

            /* ========================================================
             *  权限记忆：只在第一次真正申请，之后默认放行
             *  ★ 相册 / 相机走的是系统选择器（input type=file），Web 层
             *    拿不到权限状态，也没有可调用的授权 API。所以这里能做的是
             *    「第一次成功取到图就记下来」，之后不再重复做权限相关的
             *    探测与引导 —— 用户已经给过一次权限，没必要再问。
             *  ★ 本段在 1 / 2 / 5 / 7 页各有一份，改动请四处同步。
             * ======================================================== */
            const 权限前缀 = '已授权_';
            function 权限已授权(名) {
                try { return localStorage.getItem(权限前缀 + 名) === '1'; } catch (e) { return false; }
            }
            function 记住权限(名) { try { localStorage.setItem(权限前缀 + 名, '1'); } catch (e) {} }

            [文件输入, 拍照输入].forEach(输入 => {
                输入.addEventListener('change', () => {
                    const 文件 = 输入.files && 输入.files[0];
                    // ★ 真的取到文件 = 系统已放行，记下来，后续不再重复申请
                    if (文件) 记住权限(输入 === 拍照输入 ? '相机' : '相册');
                    处理选中文件(文件, 输入);
                });
            });

            // ---- 拖动 & 双指缩放（Pointer Events 统一鼠标 / 触摸 / 触控笔）----
            const 指针集合 = new Map();
            let 上次双指距离 = 0;
            let 上次双指中点 = null;

            视口.addEventListener('pointerdown', (e) => {
                if (!弹窗已开()) return;
                e.preventDefault();
                // 防御性判空：兼容不支持 setPointerCapture 的环境（如部分测试容器）
                if (typeof 视口.setPointerCapture === 'function') 视口.setPointerCapture(e.pointerId);
                指针集合.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (指针集合.size === 2) {
                    const 点 = [...指针集合.values()];
                    上次双指距离 = Math.hypot(点[0].x - 点[1].x, 点[0].y - 点[1].y);
                    上次双指中点 = { x: (点[0].x + 点[1].x) / 2, y: (点[0].y + 点[1].y) / 2 };
                }
                视口.classList.add('拖动中');
            });

            视口.addEventListener('pointermove', (e) => {
                if (!指针集合.has(e.pointerId)) return;
                const 旧 = 指针集合.get(e.pointerId);
                指针集合.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (指针集合.size === 1) {
                    状态.tx += e.clientX - 旧.x;
                    状态.ty += e.clientY - 旧.y;
                    约束();
                    应用变换();
                } else if (指针集合.size === 2) {
                    const 点 = [...指针集合.values()];
                    const 距离 = Math.hypot(点[0].x - 点[1].x, 点[0].y - 点[1].y);
                    const 中点 = { x: (点[0].x + 点[1].x) / 2, y: (点[0].y + 点[1].y) / 2 };
                    const 位置 = 视口.getBoundingClientRect();
                    if (上次双指距离 > 0) {
                        缩放到(状态.scale * (距离 / 上次双指距离), 中点.x - 位置.left, 中点.y - 位置.top);
                    }
                    if (上次双指中点) {
                        状态.tx += 中点.x - 上次双指中点.x;
                        状态.ty += 中点.y - 上次双指中点.y;
                        约束();
                        应用变换();
                    }
                    上次双指距离 = 距离;
                    上次双指中点 = 中点;
                }
            });

            function 指针离开(e) {
                指针集合.delete(e.pointerId);
                if (指针集合.size < 2) {
                    上次双指距离 = 0;
                    上次双指中点 = null;
                }
                if (指针集合.size === 0) 视口.classList.remove('拖动中');
            }
            视口.addEventListener('pointerup', 指针离开);
            视口.addEventListener('pointercancel', 指针离开);

            // 滚轮缩放（以鼠标位置为中心，桌面端用）
            视口.addEventListener('wheel', (e) => {
                if (!弹窗已开()) return;
                e.preventDefault();
                const 位置 = 视口.getBoundingClientRect();
                const 系数 = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                缩放到(状态.scale * 系数, e.clientX - 位置.left, e.clientY - 位置.top);
            }, { passive: false });

            // ---- 取消：丢弃本次选择，直接退出 ----
            document.getElementById('裁剪取消').addEventListener('click', 关闭弹窗);

            // ---- 确认：按取景框输出图，更新目标并保存 ----
            document.getElementById('裁剪确认').addEventListener('click', () => {
                const vp = 视口尺寸();
                if (!当前目标 || !当前目标.img || vp <= 0) return;

                // 取景框左上角在原始图片坐标系里的位置
                let sx = -状态.tx / 状态.scale;
                let sy = -状态.ty / 状态.scale;
                let 源宽 = vp / 状态.scale;
                let 源高 = vp / 状态.scale;

                // —— 源矩形边界钳制：因 约束() 保证图片始终覆盖视口，理论上不会越界；
                //   此处再做一次按宽/高分别的硬钳制，确保 drawImage 永远落在图片像素内，
                //   绝不会裁到图片之外（满足「裁剪不可超出边界」）。
                const 原宽 = 图片宽, 原高 = 图片高;
                sx = Math.max(0, Math.min(原宽 - 1, sx));
                sy = Math.max(0, Math.min(原高 - 1, sy));
                源宽 = Math.min(原宽 - sx, 源宽);
                源高 = Math.min(原高 - sy, 源高);

                // 头像输出圆形透明 PNG（480，省存储）；配图输出方形 JPEG（600）
                const 输出 = 当前目标.圆形 ? 480 : 600;
                const 画布 = document.createElement('canvas');
                画布.width = 输出;
                画布.height = 输出;
                const 笔 = 画布.getContext('2d');

                let 结果;
                if (当前目标.圆形) {
                    // 圆形 clip：圆外保持透明，正好贴合头像的 border-radius
                    笔.save();
                    笔.beginPath();
                    笔.arc(输出 / 2, 输出 / 2, 输出 / 2, 0, Math.PI * 2);
                    笔.closePath();
                    笔.clip();
                    笔.drawImage(图片, sx, sy, 源宽, 源高, 0, 0, 输出, 输出);
                    笔.restore();
                    结果 = 画布.toDataURL('image/png');
                } else {
                    // 白底打底：png 透明区转成 jpeg 不会变黑
                    笔.fillStyle = '#fff';
                    笔.fillRect(0, 0, 输出, 输出);
                    笔.drawImage(图片, sx, sy, 源宽, 源高, 0, 0, 输出, 输出);
                    结果 = 画布.toDataURL('image/jpeg', 0.9);
                }

                当前目标.img.src = 结果;
                保存结果(当前目标, 结果);
                关闭弹窗();
            });

            // Esc 也能取消
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && 弹窗已开()) 关闭弹窗();
            });

            // ---- 持久化：只存用户换过的图，没动过的仍走本地占位图 ----
            //    配图 → 「首页配图」数组（按框索引）
            //    头像 → 「用户头像」字符串，与「我的」页共用同一键
            function 读取配图() {
                try {
                    const 值 = JSON.parse(localStorage.getItem(配图存储键));
                    return Array.isArray(值) ? 值 : [];
                } catch (e) { return []; }
            }

            function 写入(键, 值) {
                try {
                    localStorage.setItem(键, 值);
                    return true;
                } catch (e) {
                    // 容量超限（多见于几 MB 上限的浏览器）：放弃持久化，本次会话仍生效。
                    // 移动端必须提示，否则「换完图看着成功、刷新后没了」会让人以为没上传上。
                    console.warn('保存失败（可能是存储超限），本次会话内有效：', e);
                    showToast('存储空间不足，图片本次有效但刷新后会丢失');
                    return false;
                }
            }

            function 保存结果(目标, 数据) {
                if (目标.索引 === -1) {
                    写入(头像存储键, 数据);
                } else {
                    const 列表 = 读取配图();
                    列表[目标.索引] = 数据;
                    写入(配图存储键, JSON.stringify(列表));
                }
            }

            (function 还原() {
                读取配图().forEach((数据, i) => {
                    if (数据 && 配图框列表[i]) {
                        const img = 配图框列表[i].querySelector('img');
                        if (img) img.src = 数据;
                    }
                });
                // 头像清掉过就回落到默认图，而不是留着上一张
                if (头像元素) {
                    let 头像 = null;
                    try { 头像 = localStorage.getItem(头像存储键); } catch (e) {}
                    头像元素.src = 头像 || '2【图片】/圆形头像1.png';
                }
            })();
        })();

        // ===== 5. 颜文字：点顶部颜文字弹出预选框 → 选 / 新建 / 删除 → 更新显示 =====
        //    预选 5 个不可删除；自建的存在 localStorage「自定义颜文字」，可逐个删除；
        //    当前选中的存「当前颜文字」，刷新后沿用。
        (function () {
            const 键_自定义 = '自定义颜文字';
            const 键_当前 = '当前颜文字';

            const 预选 = [
                'o(TAT)o',
                '(๑• . •๑)',
                'ʚ˃ ᵕ ˂ ɞ',
                '໒꒰ྀི∩˃ ᵕ ˂∩꒱ྀི১',
                '՞˶⦁ ༝ ⦁˶՞'
            ];

            const 遮罩 = document.getElementById('颜文字遮罩');
            const 列表 = document.getElementById('颜文字列表');
            const 输入框 = document.getElementById('颜文字输入');
            const 确认钮 = document.getElementById('颜文字确认');
            const 触发器 = document.getElementById('颜文字触发器');

            let 自定义 = [];
            let 当前 = 预选[0];

            function 读(键) {
                try { return localStorage.getItem(键); } catch (e) { return null; }
            }
            function 写(键, 值) {
                try { localStorage.setItem(键, 值); } catch (e) {}
            }

            try {
                const 值 = JSON.parse(读(键_自定义));
                if (Array.isArray(值)) 自定义 = 值.filter(v => typeof v === 'string' && v.trim());
            } catch (e) {}

            const 存的当前 = 读(键_当前);
            if (存的当前) 当前 = 存的当前;

            function 全部() {
                return 预选.concat(自定义);
            }

            function 应用当前() {
                触发器.textContent = 当前;
                写(键_当前, 当前);
            }

            // 自定义项被删光后，若当前正用着自定义项，就回落到第一个预选
            function 校正当前() {
                if (全部().indexOf(当前) === -1) {
                    当前 = 预选[0];
                }
                应用当前();
            }

            function 渲染() {
                列表.innerHTML = '';

                if (!全部().length) {
                    const 空 = document.createElement('div');
                    空.className = '颜文字空提示';
                    空.textContent = '还没有颜文字，下面自己拼一个吧';
                    列表.appendChild(空);
                    return;
                }

                全部().forEach((本体, 序号) => {
                    const 是自定义 = 序号 >= 预选.length;

                    const 项 = document.createElement('div');
                    项.className = '颜文字选项' + (本体 === 当前 ? ' 选中' : '');

                    const 文字 = document.createElement('span');
                    文字.className = '颜文字本体';
                    文字.textContent = 本体;          // textContent，避免把 ( ) 之类当标签解析
                    项.appendChild(文字);

                    if (是自定义) {
                        const 删 = document.createElement('button');
                        删.className = '颜文字删除';
                        删.type = 'button';
                        删.textContent = '×';
                        删.title = '删除这个颜文字';
                        删.addEventListener('click', (e) => {
                            e.stopPropagation();       // 别触发「选中」那一层
                            const 索引 = 序号 - 预选.length;
                            自定义.splice(索引, 1);
                            写(键_自定义, JSON.stringify(自定义));
                            校正当前();
                            渲染();
                        });
                        项.appendChild(删);
                    }

                    项.addEventListener('click', () => {
                        当前 = 本体;
                        应用当前();
                        渲染();
                        关闭();
                    });

                    列表.appendChild(项);
                });
            }

            function 打开() {
                渲染();
                遮罩.classList.add('显示');
                触发器.classList.add('选中态');
            }

            function 关闭() {
                遮罩.classList.remove('显示');
                触发器.classList.remove('选中态');
                输入框.value = '';
            }

            function 添加() {
                const 值 = 输入框.value.replace(/\s+/g, ' ').trim();
                if (!值) return;
                if (全部().indexOf(值) !== -1) {       // 去重，避免和预选或已有自定义重复
                    输入框.value = '';
                    return;
                }
                自定义.push(值);
                写(键_自定义, JSON.stringify(自定义));
                当前 = 值;                             // 新建即选中
                应用当前();
                输入框.value = '';
                渲染();
            }

            触发器.addEventListener('click', 打开);

            // 点遮罩空白处关闭；点框内部不关
            遮罩.addEventListener('click', (e) => {
                if (e.target === 遮罩) 关闭();
            });

            确认钮.addEventListener('click', 添加);

            输入框.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    添加();
                } else if (e.key === 'Escape') {
                    关闭();
                }
            });
            // 输入框在遮罩内，Esc 会冒泡到下面的 document 监听统一关闭

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && 遮罩.classList.contains('显示')) 关闭();
            });

            校正当前();
            渲染();
        })();

        // ===== 6. 加号菜单：点右上角「+」在按钮下方展开下拉菜单 =====
        //    位置仿微信：右上角、右对齐、无猫耳无尖角，不居中。
        //    「添加好友」跳转到同目录的 2_haoyouxinxi.html；另两项仍是 TODO 占位。
        (function () {
            const 遮罩 = document.getElementById('添加菜单遮罩');
            const 加号 = document.getElementById('添加图标');
            const 菜单框 = 遮罩.querySelector('.添加菜单框');

            // 按「+」的实际位置定位，避免不同机型顶部栏高度不同造成错位
            function 定位() {
                const 位置 = 加号.getBoundingClientRect();
                菜单框.style.top = (位置.bottom + 6) + 'px';                              // 紧贴按钮下方
                菜单框.style.right = Math.max(10, window.innerWidth - 位置.right) + 'px';  // 右缘与按钮基本齐平
            }

            function 打开() {
                定位();
                遮罩.classList.add('显示');
                加号.classList.add('选中态');
            }

            function 关闭() {
                遮罩.classList.remove('显示');
                加号.classList.remove('选中态');
            }

            function 已开() {
                return 遮罩.classList.contains('显示');
            }

            加号.addEventListener('click', (e) => {
                e.stopPropagation();     // 别让点击冒泡到遮罩的关闭逻辑
                已开() ? 关闭() : 打开();
            });

            // 点遮罩空白处关闭；点框内部不关
            遮罩.addEventListener('click', (e) => {
                if (e.target === 遮罩) 关闭();
            });

            // 三个菜单项：这里预留接入点
            // 跳转目标集中在这里，改文件名只需改这一处
            const 页面 = {
                添加好友: '2_haoyouxinxi.html?mode=new',   // 新建联系人（空白草稿）
                扭蛋机: '15_tuku.html?from=1',               // 图库扭蛋机（男头/女头/双女/情侣）
                一起聊天: '17_faqiqunliao.html?from=1',      // 发起群聊（选人建群）
                一起阅读: '22_yuedu.html?from=1'             // 一起阅读（书城 / 书架 / 作者中心）
            };

            document.querySelectorAll('.添加菜单项').forEach(项 => {
                项.addEventListener('click', () => {
                    const 动作 = 项.dataset.动作;
                    关闭();

                    switch (动作) {
                        case '添加好友':
                            // 跳转到好友信息页；若实际文件名不同，改上面的「页面」映射即可
                            if (页面.添加好友) location.href = 页面.添加好友;
                            break;
                        case '扭蛋机':
                            // 图库扭蛋机：四个分类抽图，0.5 虚拟币一次，抽到的进背包可保存
                            if (页面.扭蛋机) location.href = 页面.扭蛋机;
                            break;
                        case '一起聊天':
                            // 发起群聊：读取联系人多选建群 → 建完直接进群聊
                            if (页面.一起聊天) location.href = 页面.一起聊天;
                            break;
                        case '一起阅读':
                            // 一起阅读：书城 / 书架（导入 TXT）/ 作者中心（发布）
                            if (页面.一起阅读) location.href = 页面.一起阅读;
                            break;
                    }
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && 已开()) 关闭();
            });
        })();

        // ===== 6.3.5 ★ 群聊会话：读「群聊列表」渲染到会话列表最前面 =====
        //     群由 17_faqiqunliao 创建，存独立键「群聊列表」，【不进】「联系人索引」
        //     —— 否则会出现在 4 页 A–Z 分组里，也会被本页导出当成普通联系人。
        //     ★ 必须排在 6.4（点击绑定）之前：6.4 用 querySelectorAll('.会话项') 一次性绑定，
        //       后插入的项不会绑定上点击事件。
        (function 渲染群聊会话() {
            const 群键 = '群聊列表';
            let 表 = [];
            try { 表 = JSON.parse(localStorage.getItem(群键)) || []; } catch (e) { 表 = []; }
            if (!Array.isArray(表) || !表.length) return;

            const 区 = document.querySelector('.会话列表区');
            if (!区) return;
            const 占位 = '2【图片】/圆形头像1.png';

            /* ★ 一次性整体插到最前：逐个 insertBefore(首位) 会把表头顺序【反过来】
                 （最后插的排最前）。装进 Fragment 再整体插入就不会乱。 */
            const 片 = document.createDocumentFragment();

            表.forEach(群 => {
                if (!群 || !群.id) return;
                const 项 = document.createElement('div');
                项.className = '会话项';
                项.dataset.群 = String(群.id);          // ★ 导出索引时靠它跳过

                /* 群头像：最多 4 个成员头像拼 2×2 */
                const 头 = document.createElement('div');
                头.className = '群头像';
                const 成员 = Array.isArray(群.成员) ? 群.成员.slice(0, 4) : [];
                if (成员.length <= 1) 头.classList.add('单张');
                成员.forEach(m => {
                    const img = document.createElement('img');
                    img.src = (m && m.头像) || 占位;
                    img.alt = '';
                    /* ★ onerror 用【赋值】：addEventListener 每次重试会多叠一个监听器 */
                    img.onerror = () => { img.onerror = null; img.src = 占位; };
                    头.appendChild(img);
                });
                if (!成员.length) {
                    const img = document.createElement('img');
                    img.src = 占位; img.alt = '';
                    头.appendChild(img);
                }
                项.appendChild(头);

                const 信息 = document.createElement('div');
                信息.className = '会话信息';
                const 名 = document.createElement('div');
                名.className = '会话名称';
                /* 人数含「我」：成员 + 1 */
                名.textContent = (群.名称 || '群聊') + '（' + (成员.length + 1) + '）';
                const 消 = document.createElement('div');
                消.className = '会话消息';
                消.textContent = 群.消息 || '群聊已创建';
                信息.appendChild(名); 信息.appendChild(消);
                项.appendChild(信息);

                const 时 = document.createElement('div');
                时.className = '会话时间';
                时.textContent = 群.时间 || '';
                项.appendChild(时);

                片.appendChild(项);
            });

            区.insertBefore(片, 区.firstChild);
        })();

        // ===== 6.34 ★★ 抹掉【已删掉】的会话行
        //     1 页的会话列表是 HTML 里【写死】的（4 个默认角色），不是从索引渲染的。
        //     所以只清「联系人索引」+「聊天记录」是不够的：
        //       删完刷新 → 写死的那一行又回来了 → 6.5 导出还会把它重新写进索引。
        //     用户看到的就是「删了又复活」。
        //     这里按「已删会话」名单把行抹掉，删除才算真的生效。
        //     ★ 必须排在 6.5（导出索引）之前 —— 否则导出时又被写回去。
        (function 抹掉已删会话() {
            const 助手 = window.联系人删除;
            if (!助手 || typeof 助手.是已删 !== 'function') return;
            Array.from(document.querySelectorAll('.会话项')).forEach(项 => {
                const 名元 = 项.querySelector('.会话名称');
                if (!名元) return;
                if (助手.是已删(名元.textContent)) 项.remove();
            });
        })();

        // ===== 6.35 ★ 会话框显示【最后一条消息】
        //     原来 .会话消息 是 HTML 里写死的固定文案，
        //     于是【会话框那一句】和【点进去的聊天气泡第一句】永远是同一句，
        //     发了新消息也不会变（6.5 还会拿写死的文案反向覆盖「联系人索引」）。
        //     现在改成：读「聊天记录_<id>」的最后一条；读不到才回落索引里的小字文案。
        //     ★ 必须排在 6.4（点击一次性绑定）之前？—— 不需要：这里只改文本、
        //       不新增元素，不影响已绑定的点击；但必须排在【6.5 导出索引】之前，
        //       否则导出去的还是写死的旧文案。
        (function 刷新会话最后一条() {
            /** 与 7 页「会话预览」同口径：语音/图片显示占位，其余显示原文 */
            function 会话预览(条) {
                if (!条) return '';
                const 型 = String(条.类型 || '');
                if (型 === '语音') return '[语音]';
                if (型 === '图片') return '[图片]';
                return String(条.文 || '');
            }
            function 取表(键) {
                try {
                    const v = JSON.parse(localStorage.getItem(键) || 'null');
                    return Array.isArray(v) ? v : null;
                } catch (e) { return null; }
            }
            let 索引 = [];
            try { 索引 = JSON.parse(localStorage.getItem('联系人索引')) || []; } catch (e) {}
            if (!Array.isArray(索引)) 索引 = [];

            Array.from(document.querySelectorAll('.会话项')).forEach(项 => {
                const 名元 = 项.querySelector('.会话名称');
                const 消 = 项.querySelector('.会话消息');
                if (!名元 || !消) return;
                /* 群名带「（N）」人数后缀，匹配时要去掉 */
                const 名净 = String(名元.textContent || '').trim().replace(/（\d+）\s*$/, '').trim();
                if (!名净) return;

                /* ★ 群走 data-群（群不进「联系人索引」，按名字查不到 id） */
                let id = String(项.dataset.群 || '');
                if (!id) {
                    const 那 = 索引.find(i => i && (i.名称 === 名净 || i.备注 === 名净));
                    if (那) id = String(那.id || '');
                }
                if (!id) return;

                const 表 = 取表('聊天记录_' + id);
                if (表 && 表.length) {
                    const 末 = 表[表.length - 1];
                    const 文 = 会话预览(末);
                    if (文) {
                        消.textContent = 文;
                        /* ★ 时间也跟上：消息换了、时间还停在写死的 12:00 会很怪 */
                        const 时 = 项.querySelector('.会话时间');
                        if (时 && 末 && 末.时间戳) {
                            const d = new Date(末.时间戳);
                            if (!isNaN(d.getTime())) {
                                时.textContent =
                                    String(d.getHours()).padStart(2, '0') + ':'
                                    + String(d.getMinutes()).padStart(2, '0');
                            }
                        }
                        return;
                    }
                }
                /* ★ 没聊过：回落索引里的真实文案（2 页/导出写进去的），
                     别拿页面写死的占位文案去覆盖真实数据 */
                if (!项.dataset.群) {
                    const 那 = 索引.find(i => i && (i.名称 === 名净 || i.备注 === 名净));
                    if (那 && String(那.消息 || '').trim()) 消.textContent = String(那.消息).trim();
                }
            });
        })();

        // ===== 6.36 ★ 长按会话框 → 删除这个会话（连带聊天记录）
        //     ★ 依赖 window.联系人删除（唯一源：联系人删除.js + 同步联系人删除.py）
        //
        //     ★★ 删会话 与 删联系人 是【两个功能】：
        //       这里（长按会话框）走 清会话() ——
        //         会话框那一行没了 + 聊天记录清掉，
        //         但【通讯录里的联系人保留】：索引 / 档案 / 头像 / 音色 / 人设都不动。
        //         之后从通讯录再发起聊天，会话会重新出现（7 页落地消息时会「复活」）。
        //       4 页长按联系人走 清联系人() —— 连带把会话与聊天记录一起清。
        //     ★ 排在 6.4（点击绑定）之前也没问题：这里只加手势监听、不新增元素，
        //       两者互不干扰。（长按触发后会吞掉那次 click，不会误进聊天。）
        (function 绑会话长按删除() {
            const 助手 = window.联系人删除;
            if (!助手 || typeof 助手.绑长按 !== 'function') {
                console.warn('缺少 window.联系人删除 —— 长按删除不可用');
                return;
            }

            /** 取这一行的身份：群走 data-群，联系人按名称查「联系人索引」 */
            function 取身份(项) {
                const 名元 = 项.querySelector('.会话名称');
                if (!名元) return null;
                /* ★ 群名带「（N）」人数后缀，匹配索引前要去掉 */
                const 名净 = String(名元.textContent || '').trim().replace(/（\d+）\s*$/, '').trim();
                if (!名净) return null;
                const 群号 = String(项.dataset.群 || '');
                if (群号) return { 是群: true, id: 群号, 名: 名净 };
                let id = '';
                try {
                    const 索引 = JSON.parse(localStorage.getItem('联系人索引') || '[]');
                    if (Array.isArray(索引)) {
                        const 那 = 索引.find(i => i && (i.名称 === 名净 || i.备注 === 名净));
                        if (那) id = String(那.id || '');
                    }
                } catch (e) {}
                /* ★ 索引里查不到也要能删：按名字删（老数据可能没 id） */
                return { 是群: false, id: id, 名: 名净 };
            }

            Array.from(document.querySelectorAll('.会话项')).forEach(项 => {

                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',

        音频.addEventListener('play', 撤补播);

            });

        启动();

        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)

 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout

 *
 * 【降级】

 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。

    let 焦点 = null;          // 最近一次聚焦的输入元素

     * 小工具
     * ---------------------------------------------------------------- */

    }

    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */

        const 偏移 = 当前偏移();

                if (已弹出) 排一帧();
            });

            setTimeout(排一帧, 120);
        });

             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，

            焦点 = e.target;

            setTimeout(排一帧, 30);

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */

        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {

            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
