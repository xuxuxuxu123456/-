<!DOCTYPE html>
<!--
    7_liaotian —— 聊天信息流界面。
    入口（都带 ?id=<联系人id>）：
      ① 1_shouyeyulan 点击会话框 → ?id=xxx&from=1
      ② 4_tongxun 点「发送消息」 → ?id=xxx&from=4
      ③ 直接打开（无 id）→ 读 localStorage「当前联系人」兜底；再没有则用占位昵称

    顶部固定区：左侧返回 / 中间对应联系人昵称 / 右侧搜索键
    中间滚动区：时间戳 + 对话气泡（白色玻璃质感，透明度 40%）
    底部输入区：可发消息，写入 localStorage「聊天记录_<id>」，刷新后仍在

    对话内容：
      ★ 对方的消息读「对应联系人的小字文案」—— 即索引项里的 消息 字段（如
        「我们不是能谈论眼泪的关系，我也不太了解你。」），再续上该角色档案
        里的口头禅（读 好友信息_<id>.人物信息，取「口头禅」段落里的引号句）。
        这样每位角色进来看到的都是自己的那套话，不会串台。
      存档优先：若「聊天记录_<id>」已有记录（用户发过言），以存档为准。

    返回：按 from 回 1 / 4 页，缺省回首页。
    风格：与 1~6 页统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>聊天</title>
    <style>
        /* ===== 统一色板（与 1~6 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
            /* 气泡白玻璃不透明度：需求指定 40% */
            --泡: 0.4;
            /* ★ 收付状态色：红包走暖（砖）、转账走冷（青灰）。
               饱和度压得很低，是「有色彩倾向的灰」，放进灰白玻璃流里不跳。
               ★★ 注意都是数值三元组 —— 要进 rgba() 的必须是这种形式
               （hex 变量塞进 rgba 会被整条丢弃，见文件末尾的踩坑说明）。 */
            --hb: 178, 96, 88;        /* 红包：低饱和砖红 */
            --hb-ink: 138, 62, 55;   /* 红包文字：再压深一档保证可读 */
            --zz: 82, 112, 146;      /* 转账：低饱和青蓝 */
            --zz-ink: 55, 82, 116;   /* 转账文字 */
            --done: 122, 122, 128;   /* 已完成（已收）：中性灰 */
            /* ★★ 上面那批是 hex（#xxxxxx），【不能】直接塞进 rgba() ——
               rgba(var(--accent), .92) 展开成 rgba(#4a4a50, .92)，是无效值，
               整条声明会被浏览器静默丢弃（白底白字就是这么来的）。
               要带透明度时用下面这批【数值形式】的伴生变量：
                 正确：rgba(var(--accent-rgb), 0.92)
                 错误：rgba(var(--accent), 0.92)
            */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;

        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; overflow: hidden; overflow-x: hidden; touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%; max-width: 430px; height: 100dvh; min-height: 100dvh;
            position: relative; background-color: transparent; overflow: hidden; overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex; flex-direction: column; touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100dvh;
            object-fit: cover; object-position: center; display: block; z-index: 0; pointer-events: none;
        }

        .全局白色遮罩 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45); z-index: 1; pointer-events: none;
        }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative; z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            border-bottom: 1px solid rgba(var(--line), 0.28);
            flex-shrink: 0;
        }

        .顶部导航栏 {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(8px, 2.4vw, 11px);
            font-size: clamp(12px, 3.5vw, 14px); color: var(--ink-2); position: relative;
        }

        .返回按钮 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }

        .返回按钮 svg {
            width: clamp(18px, 5vw, 22px); height: clamp(18px, 5vw, 22px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;
        }

        /* ★ 昵称绝对居中：左右留等距空间，两侧按钮再多也不会把标题挤偏。
           ★ ★ 留白必须 ≥ 右侧图标区的实际宽度，否则按钮会压到标题上
                 （现在是 4 枚图标，约 113~124px，所以留白取到 106~132px）。
                 改图标数量时这个 clamp 要跟着调，不然群名会被吃掉尾巴。 */
        .中间标题 {
            position: absolute; left: clamp(106px, 29.5vw, 132px); right: clamp(106px, 29.5vw, 132px);
            top: clamp(10px, 3vw, 14px);
            text-align: center; font-size: clamp(15px, 4.2vw, 17px); font-weight: 600; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
        }

        .搜索键 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }

        .搜索键 svg {
            width: clamp(17px, 4.8vw, 20px); height: clamp(17px, 4.8vw, 20px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;
        }

        .搜索键.选中态 { color: var(--accent); }

        /* 搜索条：点搜索键展开，再点收起 */
        .聊天搜索条 {
            display: none; padding: 0 clamp(12px, 4vw, 16px) clamp(8px, 2.4vw, 11px);
        }

        .聊天搜索条.展开 { display: block; }

        .聊天搜索框 {
            display: flex; align-items: center; gap: 8px;
            background: rgba(var(--panel), 0.5); border-radius: 20px;
            padding: clamp(5px, 1.6vw, 8px) clamp(10px, 3.5vw, 14px);
            border: 1px solid rgba(var(--line), 0.38);
        }

        .聊天搜索框 svg {
            width: clamp(14px, 4vw, 16px); height: clamp(14px, 4vw, 16px);
            fill: none; stroke: var(--ink-3); stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
        }

        .聊天搜索输入 {
            flex: 1; min-width: 0; border: none; background: transparent; outline: none;
            font-family: inherit; font-size: clamp(13px, 3.5vw, 14px); color: var(--ink-2);
        }

        .聊天搜索输入::placeholder { color: var(--ink-3); }

        /* ===== 中间滚动区：消息流 ===== */
        .手机界面内容 {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(12px, 3.5vw, 16px);
            position: relative; z-index: 2; touch-action: pan-y;
            scrollbar-width: none; -ms-overflow-style: none;
            display: flex; flex-direction: column; gap: clamp(8px, 2.4vw, 11px);
        }

        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* 时间戳：居中弱文字，只在需要时出现（相邻消息间隔过久 / 跨天）
           ★ 无底框：不设 background / border / border-radius，就是一行裸文字 */
        .时间戳 {
            align-self: center; font-size: clamp(10px, 2.8vw, 11.5px); color: var(--ink-3);
            padding: clamp(3px, 1vw, 5px) 0;
            user-select: none; letter-spacing: 0.3px;
        }

        /* 一行消息：靠左（对方）/ 靠右（我） */
        .消息行 {
            display: flex; align-items: flex-end; gap: clamp(6px, 1.8vw, 9px);
            max-width: 100%;
        }

        .消息行.我方 { flex-direction: row-reverse; }

        .消息头像 {
            width: clamp(28px, 8vw, 34px); height: clamp(28px, 8vw, 34px);
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
            background: rgba(var(--panel), 0.5);
            box-shadow: 0 1px 4px rgba(var(--shade), 0.12);
        }

        /* ★ 对话气泡：白色玻璃质感，不透明度 40%
           三层叠加：40% 白底 + 背景模糊 + 内侧高光描边，避免纯 40% 白在浅色背景上糊成一片
           ★ 形状：横版长方形 —— 四角同圆角（4px）、无小尖角，靠左右对齐区分收发方。
             原先的圆角 + 底部收角 + 三角尖是标准聊天气泡造型，这里按需求改成矩形。 */
        .气泡 {
            position: relative; max-width: min(74%, 276px);
            padding: clamp(8px, 2.3vw, 10px) clamp(11px, 3.2vw, 14px);
            border-radius: 4px;
            background: rgba(var(--panel), var(--泡));
            -webkit-backdrop-filter: blur(var(--blur-sm)) saturate(140%) brightness(1.04);
            backdrop-filter: blur(var(--blur-sm)) saturate(140%) brightness(1.04);
            border: 1px solid rgba(var(--panel), 0.5);
            box-shadow: 0 2px 10px rgba(var(--shade), 0.07),
                        inset 0 1px 0 rgba(var(--panel), 0.55);
            font-size: clamp(13px, 3.6vw, 14.5px); line-height: 1.62; color: var(--ink);
            word-break: break-word; white-space: pre-wrap;
        }

        /* 语音条气泡：横版长方形里的「播放键 + 声波条 + 时长」 */
        .语音泡 {
            display: flex; align-items: center; gap: clamp(7px, 2vw, 9px);
            min-width: clamp(112px, 32vw, 142px);
            padding: clamp(7px, 2vw, 9px) clamp(10px, 3vw, 12px);
        }

        .语音播放 {
            flex-shrink: 0; width: clamp(20px, 5.8vw, 23px); height: clamp(20px, 5.8vw, 23px);
            border: none; border-radius: 50%; cursor: pointer; padding: 0;
            background: rgba(var(--panel), 0.7); color: var(--accent-ink);
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .语音播放 svg { width: 11px; height: 11px; fill: currentColor; }

        .语音条 {
            flex: 1; min-width: 0; height: clamp(13px, 3.6vw, 15px);
            display: flex; align-items: center; gap: 1.5px; overflow: hidden;
        }

        /* 声波：一排竖条，播过的部分变深（模拟进度） */
        .语音条 i {
            flex: 1; min-width: 1.5px; border-radius: 1px;
            background: rgba(var(--accent-rgb), 0.28); height: 40%;
        }
        .语音条 i.已播 { background: rgba(var(--accent-rgb), 0.72); }

        .语音时长 {
            flex-shrink: 0; font-size: clamp(10px, 2.8vw, 11.5px); color: var(--ink-3);
            font-variant-numeric: tabular-nums;
        }

        /* 刷新后 blob 已失效：语音条还在，但明确告知不可播放 */
        .语音泡.失效 .语音播放 { opacity: .4; cursor: default; }
        .语音泡.失效 .语音条 { opacity: .45; }

        /* ★ 整条语音气泡都可点击播放：给个手型 + 轻反馈，用户才知道点哪都行 */
        .语音泡 { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .语音泡:active { background: rgba(var(--panel), 0.58); }

        /* 播放中：播放键转深 + 气泡轻微高亮，明确「正在放」 */
        .语音泡.播放中 .语音播放 { background: var(--accent); color: #fff; }

        .气泡 mark { background: var(--accent-hi); color: var(--accent-ink); border-radius: 3px; padding: 0 1px; }

        /* ===== 图片气泡：角色按对话场景自主发来的图 =====
           ★ 真图与占位图共用同一套外框 —— 接没接 API 视觉上不跳，
             换了图只是内容变，不会忽然多/少一块。
           ★ 不写死高度：图片没读到时先撑一个 16:10 的灰底，
             真图到了按自身比例顶开，避免「先矮后高」的抖动。 */
        .图泡 {
            padding: 3px; line-height: 0; overflow: hidden;
            max-width: min(74%, 276px);
        }

        .图泡 img {
            display: block; width: 100%; height: auto;
            max-height: 300px; object-fit: cover;
            border-radius: 2px;
            background: rgba(var(--accent-rgb), 0.1);
            aspect-ratio: 16 / 10;
        }

        .消息行.隐藏, .时间戳.隐藏 { display: none; }

        .无结果提示 {
            align-self: center; margin-top: clamp(20px, 6vw, 30px);
            font-size: clamp(11px, 3.2vw, 13px); color: var(--ink-4); user-select: none;
        }

        /* ===== 底部输入区 ===== */
        .底部输入区 {
            position: relative; z-index: 10; flex-shrink: 0;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            border-top: 1px solid rgba(var(--line), 0.28);
            padding: clamp(8px, 2.4vw, 11px) clamp(12px, 4vw, 16px);
            padding-bottom: calc(clamp(8px, 2.4vw, 11px) + env(safe-area-inset-bottom, 0px));
            display: flex; align-items: flex-end; gap: clamp(7px, 2vw, 10px);
        }

        /* 输入框：长文本可下滑，但隐藏滚动条
           —— 必须显式写 overflow-y: auto（textarea 默认行为在各浏览器不一致），
              再用三件套把滚动条藏掉：标准属性 + IE 属性 + WebKit 伪元素。 */
        .消息输入 {
            flex: 1; min-width: 0; max-height: 88px;
            border: 1px solid rgba(var(--line), 0.38); border-radius: 16px;
            background: rgba(var(--panel), 0.5);
            padding: clamp(7px, 2.2vw, 9px) clamp(11px, 3.2vw, 14px);
            font-family: inherit; font-size: clamp(13px, 3.6vw, 14.5px); line-height: 1.5;
            color: var(--ink); outline: none; resize: none;
            -webkit-appearance: none;
            overflow-y: auto; overflow-x: hidden;
            overscroll-behavior-y: contain;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .消息输入::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .消息输入:focus { border-color: rgba(var(--line), 0.6); box-shadow: 0 0 0 3px rgba(var(--line), 0.1); }
        .消息输入::placeholder { color: var(--ink-4); }

        .发送按钮 {
            flex-shrink: 0; height: clamp(34px, 9.6vw, 40px);
            padding: 0 clamp(13px, 3.8vw, 17px);
            border: 1px solid rgba(var(--line), 0.42); border-radius: 16px;
            background: rgba(var(--panel), 0.55); color: var(--accent-ink);
            font-family: inherit; font-size: clamp(12.5px, 3.5vw, 14px); font-weight: 600;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: opacity .18s, background .18s;
        }

        .发送按钮:disabled { opacity: .38; cursor: default; }
        .发送按钮:not(:disabled):active { background: rgba(var(--panel), 0.8); }

        /* 输入框右侧的圆形图标按钮：麦克风 / 表情
           顺序：输入框 → 麦克风 → 表情 → 发送（麦克风紧邻输入框，表情紧邻发送） */
        .圆钮 {
            flex-shrink: 0; width: clamp(34px, 9.6vw, 40px); height: clamp(34px, 9.6vw, 40px);
            border: 1px solid rgba(var(--line), 0.42); border-radius: 50%;
            background: rgba(var(--panel), 0.5); color: var(--ink-2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent;
            transition: background .18s, color .18s, border-color .18s;
        }

        .圆钮 svg {
            width: clamp(17px, 4.8vw, 19px); height: clamp(17px, 4.8vw, 19px);
            fill: none; stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .圆钮:active { background: rgba(var(--panel), 0.8); }
        .圆钮.选中态 { color: var(--accent); border-color: rgba(var(--line), 0.7); background: rgba(var(--panel), 0.78); }

        /* 录音中：按钮转深 + 外圈脉冲，让用户明确知道在录 */
        .圆钮.录音中 {
            color: #fff; background: var(--accent); border-color: var(--accent);
            animation: 录音脉冲 1.1s ease-in-out infinite;
        }

        @keyframes 录音脉冲 {
            0%, 100% { box-shadow: 0 0 0 0 rgba(var(--shade), 0.28); }
            50%      { box-shadow: 0 0 0 6px rgba(var(--shade), 0); }
        }

        /* ===== Emoji 弹窗 =====
           ★ 在输入框「上方」弹出：面板底边贴着输入区顶边，输入框不被遮住。
             遮罩是全屏透明层（只用来点空白关闭），面板另外绝对定位，
             bottom 由 JS 写成当前输入区高度 —— 输入框随长文本长高时面板跟着抬。 */
        .表情遮罩 {
            position: absolute; inset: 0; z-index: 20;
            display: none;
        }
        .表情遮罩.显示 { display: block; }

        .表情面板 {
            position: absolute; left: 0; right: 0; z-index: 21;
            bottom: var(--输入区高, 56px);
            background: rgba(var(--panel), 0.72);
            -webkit-backdrop-filter: blur(22px) saturate(150%) brightness(1.05);
            backdrop-filter: blur(22px) saturate(150%) brightness(1.05);
            border-top: 1px solid rgba(var(--line), 0.42);
            border-radius: 14px 14px 0 0;
            box-shadow: 0 -6px 22px rgba(var(--shade), 0.1);
            padding: clamp(8px, 2.4vw, 11px) clamp(10px, 3vw, 13px) clamp(9px, 2.6vw, 12px);
        }

        /* 分类 tab：横排可横滑，同样隐藏滚动条 */
        .表情分类栏 {
            display: flex; gap: clamp(2px, 0.8vw, 4px);
            overflow-x: auto; overscroll-behavior-x: contain;
            margin: 0 calc(-1 * clamp(4px, 1.2vw, 6px)) clamp(7px, 2vw, 9px);
            padding: 0 clamp(4px, 1.2vw, 6px);
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .表情分类栏::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .表情分类 {
            flex-shrink: 0; border: none; background: transparent;
            padding: clamp(4px, 1.2vw, 6px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px; font-family: inherit;
            font-size: clamp(11px, 3.2vw, 12.5px); color: var(--ink-3);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            white-space: nowrap; transition: background .16s, color .16s;
        }

        .表情分类.选中 {
            background: rgba(var(--line), 0.26); color: var(--ink); font-weight: 600;
        }

        .表情网格 {
            display: grid; grid-template-columns: repeat(8, 1fr);
            gap: clamp(2px, 0.8vw, 4px);
            max-height: 30vh; overflow-y: auto; overscroll-behavior-y: contain;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .表情网格::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .表情格 {
            aspect-ratio: 1 / 1; border: none; background: transparent;
            border-radius: 8px; font-size: clamp(17px, 5vw, 21px); line-height: 1;
            cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; justify-content: center;
        }

        .表情格:active { background: rgba(var(--line), 0.22); }

        /* ===== 顶部右侧动作区（通话 / 视频 / 群资料 / 清空 / 搜索） =====
           包在一层里，否则 space-between 会把第一个按钮甩到中间去。
           ★ 同一时刻最多亮 4 枚（留白就是按 4 枚算的，多一枚会挤到中间标题）：
             群聊 = 语音·视频·搜索·更多
             单聊 = 语音·视频·清空·搜索
             （群聊的「清空」按微信挪进了群资料页，「更多」补上它空出的位置。）*/
        .右侧动作 {
            display: flex; align-items: center; gap: clamp(1px, 0.8vw, 4px);
            flex-shrink: 0; margin-left: auto;
        }

        .清空键 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }

        .清空键 svg {
            width: clamp(17px, 4.8vw, 20px); height: clamp(17px, 4.8vw, 20px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9;
        }

        /* 更多键（竖排三点 …）—— 排在搜索键右侧，只有群聊才显示。
           样式与清空键一致，只是图标换成竖排三点（微信「更多」同款）。 */
        .群资料键 {
            cursor: pointer; width: clamp(24px, 7vw, 28px); height: clamp(24px, 7vw, 28px);
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            flex-shrink: 0; -webkit-tap-highlight-color: transparent;
        }
        .群资料键 svg {
            width: clamp(17px, 4.8vw, 20px); height: clamp(17px, 4.8vw, 20px);
            fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.9;
        }

        /* ================================================================
           ===== 功能条（常驻在文本输入框上方）=====
           ★ 四项：转账 / 红包 / 语音通话 / 一起阅读
             每一项 = 左镂空爱心 + 右文字。
           ★ ★ 只要爱心，不要别的图标（不套转账/红包/电话符号），爱心本身
             就是识别符号 —— 与 1 页「.标签爱心」同一枚路径、同一支描边色。
           ★ ★ 不画上边线：整条与输入区连成一片（需求：不要分割线）。
           ★ 常驻显示，所以表情面板展开时要抬到「输入区高 + 功能条高」，
             否则会把这四个按钮盖住（见 贴合输入框()）。
           ================================================================ */
        .功能条 {
            position: relative; z-index: 10; flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(4px, 1.2vw, 7px);
            padding: clamp(6px, 1.8vw, 9px) clamp(10px, 3vw, 13px) 0;
            /* ★ 需求：整条与输入区连成一片，不画上边线 */
        }

        /* ★ 左爱心 + 右文字，横排 */
        .功能项 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(3px, 1vw, 5px);
            min-width: 0;
            height: clamp(30px, 8.6vw, 36px);
            border: none;
            background: transparent;
            padding: 0 clamp(2px, 0.8vw, 5px);
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            border-radius: 10px;
            transition: background .16s;
        }
        .功能项:active { background: rgba(var(--line), 0.16); }

        /* ★ 镂空爱心：与 1 页 .标签爱心 同一枚路径（M12 21.35l-1.45-1.32…）、
             同一支描边色 #b9b9be、同样的 fill:none —— 只描边，不填色，内部镂空。 */
        .功能项心 {
            flex-shrink: 0;
            width: clamp(15px, 4.3vw, 18px);
            height: clamp(15px, 4.3vw, 18px);
            fill: none;
            stroke: #b9b9be;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .功能项:active .功能项心 { stroke: var(--accent); }

        .功能项文字 {
            font-size: clamp(11px, 3.1vw, 12.5px);
            color: var(--ink-2);
            letter-spacing: .2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
         * ★ 后台朗读浮窗（一起阅读）
         *   常驻在输入框上方的小卡 —— 边聊边听，不占整屏。
         *   ★ 不引入任何新颜色：全部走全站色板。
         * ============================================================ */
        .朗读浮窗 {
            flex-shrink: 0;
            padding: 0 clamp(10px, 2.9vw, 14px) clamp(5px, 1.5vw, 7px);
        }
        .朗读浮窗[hidden] { display: none; }
        .朗读卡 {
            display: flex; align-items: center; gap: clamp(8px, 2.3vw, 11px);
            padding: clamp(8px, 2.3vw, 11px);
            border-radius: clamp(11px, 3.1vw, 14px);
            background: rgba(var(--panel), 0.72);
            border: 1px solid rgba(var(--line), 0.2);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
            backdrop-filter: blur(var(--blur)) saturate(150%);
            animation: 朗读浮出 .22s ease-out;
        }
        @keyframes 朗读浮出 {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .朗读封面 {
            flex-shrink: 0;
            width: clamp(30px, 8.6vw, 38px); height: clamp(40px, 11.4vw, 50px);
            border-radius: 2px clamp(4px, 1.2vw, 6px) clamp(4px, 1.2vw, 6px) 2px;
            background: rgba(var(--line), 0.22);
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(11px, 3.1vw, 13px); font-weight: 600;
            color: var(--ink-2); overflow: hidden;
        }
        .朗读正文 { flex: 1; min-width: 0; }
        .朗读名 {
            font-size: clamp(11.5px, 3.3vw, 13px); font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .朗读章 {
            margin-top: 1px; font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-3);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .朗读进度条 {
            margin-top: clamp(3px, 1vw, 5px); height: 2.5px; border-radius: 999px;
            background: rgba(var(--line), 0.2); overflow: hidden;
        }
        .朗读进度内 {
            height: 100%; width: 0; border-radius: 999px; background: var(--accent);
            transition: width .3s ease-out;
        }
        .朗读控制 { display: flex; align-items: center; gap: clamp(3px, 1vw, 5px); flex-shrink: 0; }
        .朗读圆钮 {
            width: clamp(26px, 7.4vw, 31px); height: clamp(26px, 7.4vw, 31px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(var(--line), 0.26); background: transparent;
            color: var(--ink-2); cursor: pointer;
            font-family: inherit; font-size: clamp(11px, 3.1vw, 13px);
            -webkit-tap-highlight-color: transparent;
            transition: transform .16s ease-out, background-color .18s ease-out;
        }
        .朗读圆钮 svg { width: clamp(13px, 3.7vw, 16px); height: clamp(13px, 3.7vw, 16px); fill: currentColor; }
        .朗读圆钮:active { transform: scale(.9); }
        .朗读圆钮.主 {
            border-color: rgba(var(--accent-rgb), 0.5);
            background: rgba(var(--accent-rgb), 0.13); color: var(--accent-ink);
        }
        .朗读圆钮:disabled { opacity: .38; cursor: default; }
        .朗读状态 {
            flex-basis: 100%; margin-top: clamp(4px, 1.2vw, 6px);
            font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-4); line-height: 1.5;
        }
        /* ★ 收起态：只剩一条细条，不挡视线 */
        .朗读收起条 {
            display: flex; align-items: center; gap: clamp(5px, 1.5vw, 8px);
            padding: clamp(5px, 1.5vw, 7px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px;
            background: rgba(var(--panel), 0.6);
            border: 1px solid rgba(var(--line), 0.18);
        }
        .朗读收起条[hidden] { display: none; }
        .朗读收起名 {
            flex: 1; min-width: 0; font-size: clamp(10px, 2.9vw, 11.5px); color: var(--ink-3);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .朗读小钮 {
            flex-shrink: 0; padding: clamp(2px, 0.7vw, 4px) clamp(7px, 2vw, 9px);
            border-radius: 999px; border: 1px solid rgba(var(--line), 0.26);
            background: transparent; color: var(--ink-3);
            font-family: inherit; font-size: clamp(9.5px, 2.7vw, 10.5px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .朗读小钮:active { transform: scale(.94); }

        /* ★ 未开放的功能：整项压淡，点了只提示（不是删掉，留着以后开） */
        .功能项.未开 { opacity: .42; }
        .功能项.未开:active { background: transparent; }

        /* ================================================================
           ===== 业务弹窗（转账 / 红包 / 语音通话 / 一起阅读 共用外壳）=====
           ★ 一个壳 + 按功能切换内容，省掉四份几乎一样的弹窗。
             z-index 60：高于确认弹窗(40)，因为它可能唤起二次确认。
           ================================================================ */
        .业务遮罩 {
            position: absolute; inset: 0; z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(var(--shade), 0.34);
            padding: clamp(18px, 5vw, 26px);
        }
        .业务遮罩.显示 { display: flex; }

        .业务框 {
            width: 100%; max-width: 320px;
            max-height: 84%;
            display: flex;
            flex-direction: column;
            background: rgba(var(--panel), 0.93);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
            backdrop-filter: blur(22px) saturate(150%);
            border: 1px solid rgba(var(--panel), 0.6);
            border-radius: 18px;
            box-shadow: 0 14px 40px rgba(var(--shade), 0.2);
            overflow: hidden;
        }

        .业务头 {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(13px, 3.8vw, 17px) clamp(14px, 4vw, 17px) clamp(9px, 2.6vw, 12px);
            font-size: clamp(14px, 4vw, 15.5px);
            font-weight: 600;
            color: var(--ink);
            border-bottom: 1px solid rgba(var(--line), 0.16);
        }

        .业务体 {
            flex: 1; min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding: clamp(13px, 3.8vw, 17px) clamp(14px, 4vw, 17px);
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .业务体::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .业务脚 {
            flex-shrink: 0;
            display: flex;
            gap: clamp(7px, 2vw, 10px);
            padding: clamp(10px, 3vw, 13px) clamp(14px, 4vw, 17px)
                     calc(clamp(10px, 3vw, 13px) + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(var(--line), 0.16);
        }
        .业务钮 {
            flex: 1;
            height: clamp(35px, 10vw, 40px);
            border: 1px solid rgba(var(--line), 0.42);
            border-radius: 12px;
            background: rgba(var(--panel), 0.6);
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .业务钮:active { background: rgba(var(--line), 0.22); }
        .业务钮.主 { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .业务钮.主:active { background: var(--accent-ink); }
        .业务钮:disabled { opacity: .4; cursor: default; }

        /* ---- 弹窗内通用零件 ---- */
        .业务字段 { margin-bottom: clamp(12px, 3.4vw, 16px); }
        .业务字段:last-child { margin-bottom: 0; }
        .业务标签 {
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-3);
            margin-bottom: clamp(5px, 1.5vw, 7px);
        }
        .业务输入 {
            width: 100%;
            box-sizing: border-box;
            height: clamp(38px, 11vw, 44px);
            border: 1px solid rgba(var(--line), 0.38);
            border-radius: 12px;
            background: rgba(var(--panel), 0.55);
            padding: 0 clamp(11px, 3.2vw, 14px);
            font-family: inherit;
            font-size: clamp(13px, 3.6vw, 14.5px);
            color: var(--ink);
            outline: none;
        }
        .业务输入:focus { border-color: rgba(var(--line), 0.62); }
        .业务输入::placeholder { color: var(--ink-4); }

        /* 金额：大号数字 + ¥ 前缀，QQ/微信都是这个重心 */
        .金额行 {
            display: flex; align-items: baseline; gap: clamp(4px, 1.2vw, 6px);
            border-bottom: 1px solid rgba(var(--line), 0.34);
            padding-bottom: clamp(6px, 1.8vw, 8px);
            margin-bottom: clamp(5px, 1.5vw, 7px);
        }
        .金额符 { font-size: clamp(17px, 4.8vw, 20px); color: var(--ink-2); }
        .金额输入 {
            flex: 1; min-width: 0;
            border: none; background: transparent; outline: none;
            font-family: inherit;
            font-size: clamp(26px, 7.4vw, 32px);
            font-weight: 600;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .金额输入::placeholder { color: var(--ink-4); font-weight: 400; }

        .业务提示 {
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-4);
            line-height: 1.55;
        }
        .业务提示.强调 { color: var(--accent-ink); }

        /* 红包类型切换（群聊才有）：拼手气 / 普通 */
        .分段 {
            display: flex;
            gap: clamp(5px, 1.5vw, 8px);
            margin-bottom: clamp(12px, 3.4vw, 16px);
        }
        .分段钮 {
            flex: 1;
            height: clamp(33px, 9.4vw, 38px);
            border: 1px solid rgba(var(--line), 0.34);
            border-radius: 10px;
            background: transparent;
            color: var(--ink-2);
            font-family: inherit;
            font-size: clamp(12px, 3.4vw, 13.5px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s, color .16s, border-color .16s;
        }
        .分段钮.选中 {
            background: var(--accent); border-color: var(--accent);
            color: #fff; font-weight: 600;
        }

        /* 群成员多选（语音通话） */
        .成员列表 {
            display: flex; flex-direction: column;
            gap: clamp(2px, 0.8vw, 4px);
        }
        .成员行 {
            display: flex; align-items: center;
            gap: clamp(8px, 2.4vw, 11px);
            width: 100%;
            padding: clamp(7px, 2vw, 10px) clamp(6px, 1.8vw, 9px);
            border: none;
            border-radius: 10px;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .成员行:active { background: rgba(var(--line), 0.14); }
        .成员勾 {
            flex-shrink: 0;
            width: clamp(19px, 5.4vw, 22px); height: clamp(19px, 5.4vw, 22px);
            border-radius: 50%;
            border: 1.5px solid rgba(var(--line), 0.55);
            display: flex; align-items: center; justify-content: center;
        }
        .成员行.选中 .成员勾 {
            background: var(--accent); border-color: var(--accent);
        }
        .成员勾 svg {
            width: 60%; height: 60%;
            fill: none; stroke: #fff; stroke-width: 2.6;
            stroke-linecap: round; stroke-linejoin: round;
            display: none;
        }
        .成员行.选中 .成员勾 svg { display: block; }
        .成员名 {
            flex: 1; min-width: 0;
            font-size: clamp(12.5px, 3.5vw, 14px);
            color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .成员行.选中 .成员名 { font-weight: 600; }

        /* 通话中：大头像 + 状态 + 挂断 */
        .通话体 {
            display: flex; flex-direction: column;
            align-items: center;
            padding: clamp(12px, 3.4vw, 16px) 0 clamp(4px, 1.2vw, 6px);
        }
        .通话头像 {
            width: clamp(62px, 17.6vw, 74px); height: clamp(62px, 17.6vw, 74px);
            border-radius: 50%; object-fit: cover;
            background: rgba(var(--panel), 0.5);
            margin-bottom: clamp(10px, 2.8vw, 13px);
        }
        .通话名 {
            font-size: clamp(14px, 4vw, 16px); color: var(--ink); font-weight: 600;
            margin-bottom: clamp(4px, 1.2vw, 6px);
        }
        .通话状态 {
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-3);
            min-height: 1.4em;
        }
        .通话计时 {
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-2);
            font-variant-numeric: tabular-nums;
            margin-top: clamp(4px, 1.2vw, 6px);
        }
        .通话头像.呼叫中 { animation: 呼叫脉动 1.4s ease-in-out infinite; }
        @keyframes 呼叫脉动 {
            0%, 100% { box-shadow: 0 0 0 0 rgba(var(--shade), 0.18); }
            50%      { box-shadow: 0 0 0 12px rgba(var(--shade), 0); }
        }

        /* 一起阅读：书目选择 */
        .书列表 { display: flex; flex-direction: column; gap: clamp(6px, 1.8vw, 9px); }
        .书行 {
            display: flex; align-items: center;
            gap: clamp(8px, 2.4vw, 11px);
            width: 100%;
            padding: clamp(9px, 2.6vw, 12px) clamp(10px, 3vw, 13px);
            border: 1px solid rgba(var(--line), 0.3);
            border-radius: 12px;
            background: rgba(var(--panel), 0.5);
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s, border-color .16s;
        }
        .书行:active { background: rgba(var(--line), 0.16); }
        .书行.选中 { border-color: var(--accent); background: rgba(var(--accent-hi-rgb), 0.5); }
        .书图标 {
            flex-shrink: 0; width: clamp(20px, 5.8vw, 23px); height: clamp(20px, 5.8vw, 23px);
            fill: none; stroke: var(--ink-2); stroke-width: 1.7;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .书行.选中 .书图标 { stroke: var(--accent-ink); }
        .书名 { flex: 1; min-width: 0; font-size: clamp(12.5px, 3.5vw, 14px); color: var(--ink); }
        .书行.选中 .书名 { font-weight: 600; }
        .书副 { flex-shrink: 0; font-size: clamp(10px, 2.9vw, 11.5px); color: var(--ink-4); }

        /* ================================================================
           ===== 消息卡片：转账 / 红包 / 一起阅读 =====
           （★ 语音通话不走卡片，见下面「通话小气泡」）
           ★ 【底色】与对话气泡完全同一套白玻璃 —— 不给我方卡片上深色。
             收发方照旧靠【左右对齐】区分，卡片本身不换皮。
           ★ 【横向布局】左侧是类型配图（2【图片】/红包.png、转账.png，上下居中），
             右侧是文案：题（胶囊）/ 额（主行）/ 副（补充），底下一条底栏。
             —— 卡片变长、变矮，更像一条「交易记录」而不是一张方块卡。
           ★ 【收付状态】未收 = 有色彩倾向（红包暖 / 转账冷），已收 = 退回中性灰。
           ★ 【精致度】
               ① 金额拆三段排版（¥ 小 + 整数大 + 小数小）—— 照支付类 UI
               ② 外描边 + 顶部高光，做出「卡片」的体积感
               ③ 类别胶囊压到最小号、加字距，像个正规标签
           ================================================================ */
        .卡片泡 {
            padding: 0;
            overflow: hidden;
            /* ★ 横向更长：比原来的 168~212 加宽，容纳左侧配图 + 右侧文案两栏。 */
            width: clamp(212px, 61vw, 286px);
            max-width: min(80%, 320px);
            /* ★ 继承 .气泡 的 4px 会让卡片看着像文字泡；卡片该有自己的圆角，
               否则 overflow:hidden 裁出来的尾巴栏是个尖角。 */
            border-radius: 14px;
            line-height: 1.45;               /* 卡片是结构化内容，别用正文的 1.62 */
            /* ★ 精致：比普通气泡更明确的一道外描边 + 顶部高光，
               底色仍与对话气泡同一套白玻璃，只是多一层「卡片感」。 */
            border-color: rgba(var(--line), 0.32);
            box-shadow: 0 2px 10px rgba(var(--shade), 0.07),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        /* ★ 横向两栏：配图在左、文案在右。配图 align-items:center 上下居中，
             对着右侧文案这一整块的垂直中点 —— 配图比文案矮时不会吊在顶上。 */
        .卡片头 {
            /* ★ 配图上下居中（对着右侧文案整块的垂直中点） */
            display: flex; align-items: center;
            gap: clamp(10px, 2.9vw, 13px);
            /* ★ 上下对称：原来上多下少是在给顶部胶囊留位，胶囊已删 */
            padding: clamp(12px, 3.4vw, 15px) clamp(13px, 3.6vw, 16px);
        }
        /* ★ 左侧类型配图：圆角方形（不是圆的），与右侧文案拉开层级
           ★ 【无底框】需求：不要背景色 / 描边 / 阴影 —— 图本身直接落在气泡上。 */
        .卡图 {
            flex-shrink: 0;
            width: clamp(44px, 12.4vw, 54px); height: clamp(44px, 12.4vw, 54px);
            border-radius: clamp(10px, 2.9vw, 12px);
            object-fit: cover;
            display: block;
            background: transparent;            /* ★ 不要底框 */
            border: none;
            box-shadow: none;
            transition: opacity .18s, filter .18s;
        }
        /* 图挂了也不能塌出一个白方块：压成很淡的占位，布局保持不变 */
        .卡图.空 { opacity: .18; }
        /* ★ 显式 block：它是 <span>，靠「flex item 会被 blockify」虽然大多数
             浏览器也行，但一旦哪天父级不再 flex，三个 inline span 就会挤成一行。 */
        .卡片文 { display: block; flex: 1 1 auto; min-width: 0; }

        /* ★ 主行：金额类走「数字排版」—— ¥ 小、整数大、小数小（照支付 UI）；
             红包祝福语走「文字排版」（.文：常规字重、稍小），一眼可分。 */
        .卡片额 {
            display: block;
            font-size: clamp(19px, 5.4vw, 23px);
            font-weight: 600;
            color: var(--ink);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
            letter-spacing: -.2px;
        }
        .卡片额.文 {
            font-weight: 400;
            font-size: clamp(15px, 4.3vw, 18px);
            letter-spacing: 0;
            line-height: 1.35;
        }
        /* ★ 金额三段：¥ / 整数 / 小数 —— 层级差靠字号，不是靠颜色 */
        .卡币 { font-size: .56em; font-weight: 500; margin-right: .14em; opacity: .72; }
        .卡整 { font-weight: 600; }
        .卡零 { font-size: .62em; font-weight: 600; }
        .卡缀 { font-size: .56em; font-weight: 500; color: var(--ink-3); margin-left: .22em; }
        .卡片副 {
            display: block;
            font-size: clamp(10.5px, 3vw, 12px);
            color: var(--ink-3);
            margin-top: clamp(4px, 1.1vw, 5px);
            line-height: 1.45;
        }
        /* ★ 底栏：照微信那条「微信转账 / 微信红包」，● + 类别 + 时间 + 状态 */
        .卡片尾 {
            display: flex; align-items: center;
            gap: clamp(5px, 1.4vw, 6px);
            padding: clamp(6px, 1.7vw, 8px) clamp(13px, 3.6vw, 16px);
            border-top: 1px solid rgba(var(--line), 0.16);
            font-size: clamp(9.5px, 2.7vw, 11px);
            color: var(--ink-4);
            letter-spacing: .3px;
        }
        .尾点 {
            flex-shrink: 0;
            width: 3px; height: 3px; border-radius: 50%;
            background: currentColor; opacity: .55;
        }
        /* 状态标签：靠右对齐，是「收没收」最直接的读数 */
        .卡态 { margin-left: auto; flex-shrink: 0; letter-spacing: .2px; }

        /* ================================================================
           ★★ 收付状态：点击卡片领取 / 收款，颜色随之切换
             —— 「未收」= 有色彩倾向（红包暖 / 转账冷），像一封待拆的封
             —— 「已收」= 退回中性灰白玻璃，像拆完的封，视觉上退到背景里
             ★ 只动底色 / 描边 / 小字，不动主行深灰字 —— 始终保证可读。
             ★ 同时这也是红包与转账的【第二重区分】：暖 vs 冷。
           ================================================================ */
        .卡片泡.未收 { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .卡片泡.未收:active { transform: scale(.985); }
        .卡片泡 { transition: background .18s, border-color .18s, transform .12s; }

        /* 红包：暖（砖） */
        .卡片泡.红包泡.未收 {
            background: rgba(var(--hb), 0.1);
            border-color: rgba(var(--hb), 0.38);
            box-shadow: 0 2px 10px rgba(var(--hb), 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.62);
        }
        .卡片泡.红包泡.未收 .卡态 { color: rgb(var(--hb-ink)); font-weight: 600; }
        .卡片泡.红包泡.未收 .尾点 { opacity: .7; }

        /* 转账 / AA：冷（青灰）—— 与红包的暖形成冷暖对位 */
        .卡片泡.转账泡.未收 {
            background: rgba(var(--zz), 0.1);
            border-color: rgba(var(--zz), 0.38);
            box-shadow: 0 2px 10px rgba(var(--zz), 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.62);
        }
        .卡片泡.转账泡.未收 .卡态 { color: rgb(var(--zz-ink)); font-weight: 600; }
        .卡片泡.转账泡.未收 .尾点 { opacity: .7; }

        /* ★ 一起阅读：没有收付概念 → 纯中性，不参与冷暖，也不加「待处理」彩底 */
        .卡片泡.阅读泡 {
            background: rgba(var(--panel), var(--泡));
            border-color: rgba(var(--line), 0.3);
        }

        /* 已收：退回中性 —— 底色与描边都转灰，状态小字也转灰 */
        .卡片泡.已收 {
            background: rgba(var(--panel), var(--泡));
            border-color: rgba(var(--line), 0.3);
            box-shadow: 0 1px 6px rgba(var(--shade), 0.05),
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        .卡片泡.已收 .卡态 { color: rgb(var(--done)); font-weight: 400; }
        /* 主行金额压成中灰，让「待处理」的卡片成为视觉焦点 */
        .卡片泡.已收 .卡片额 { color: var(--ink-2); }
        /* ★ 配图也跟着退：去色 + 压淡，整张卡一起「完成化」 */
        .卡片泡.已收 .卡图 { filter: grayscale(1); opacity: .62; }

        /* ================================================================
           ★ 通话记录 = 【小气泡】（不是卡片）：一个电话图标 + 通话时长。
             微信的通话记录就是这样一行小泡，混在对话里不抢戏。
             ★ 与语音泡同级：都用 .气泡 默认白玻璃底，靠左右对齐分收发方。
           ================================================================ */
        .通话小泡 {
            display: inline-flex; align-items: center;
            gap: clamp(5px, 1.5vw, 7px);
            white-space: nowrap;
            font-size: clamp(12.5px, 3.5vw, 14px);
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            line-height: 1.4;
        }
        .通话小图标 {
            flex-shrink: 0;
            width: clamp(14px, 4vw, 16px); height: clamp(14px, 4vw, 16px);
            fill: none; stroke: var(--ink-2); stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        /* 未接通：整条压淡，跟「打通过」的区分开 */
        .通话小泡.未接通 { color: var(--ink-3); }
        .通话小泡.未接通 .通话小图标 { stroke: var(--ink-4); }

        /* ===== 确认弹窗（是 / 否） ===== */
        .确认遮罩 {
            position: absolute; inset: 0; z-index: 40;
            display: none; align-items: center; justify-content: center;
            background: rgba(var(--shade), 0.22);
        }
        .确认遮罩.显示 { display: flex; }

        .确认框 {
            width: min(78%, 290px);
            background: rgba(var(--panel), 0.86);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(var(--panel), 0.5);
            border-radius: 16px;
            box-shadow: 0 10px 34px rgba(var(--shade), 0.16);
            padding: clamp(15px, 4.4vw, 19px) clamp(14px, 4vw, 17px) clamp(11px, 3.2vw, 14px);
            text-align: center;
        }

        .确认标题 {
            font-size: clamp(13.5px, 3.9vw, 15px); font-weight: 600; color: var(--ink);
            margin-bottom: clamp(5px, 1.6vw, 7px); line-height: 1.45;
        }

        .确认说明 {
            font-size: clamp(11px, 3.2vw, 12.5px); color: var(--ink-3);
            line-height: 1.5; margin-bottom: clamp(12px, 3.6vw, 16px);
            word-break: break-all;
        }

        .确认按钮行 { display: flex; gap: clamp(7px, 2vw, 10px); }

        .确认按钮 {
            flex: 1; height: clamp(33px, 9.4vw, 38px);
            border: 1px solid rgba(var(--line), 0.42); border-radius: 12px;
            background: rgba(var(--panel), 0.6); color: var(--ink-2);
            font-family: inherit; font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }

        .确认按钮:active { background: rgba(var(--line), 0.22); }

        /* 「是」是危险操作，走深色强调 */
        .确认按钮.主 { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .确认按钮.主:active { background: var(--accent-ink); }

        /* ===== Toast ===== */
        .toast {
            position: absolute; left: 50%; bottom: clamp(84px, 24vw, 104px);
            transform: translateX(-50%) translateY(6px); z-index: 60;
            padding: clamp(7px, 2.2vw, 10px) clamp(14px, 4vw, 18px);
            border-radius: 999px; background: rgba(var(--shade), 0.82); color: #fff;
            font-size: clamp(11.5px, 3.4vw, 13px); white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 长按反馈：气泡轻微下沉，让用户知道按住了 */
        .消息行.按住 .气泡 { transform: scale(.97); opacity: .82; }
        .气泡 { transition: transform .14s, opacity .14s; }

        /* ===== 录音弹窗 =====
           录音期间居中弹出：麦克风图标 + 实时音量条 + 计时 + 取消/发送。
           做成居中的「大反馈」而不是输入区上方的小条 —— 录音时用户视线在屏幕中间，
           小条太容易被忽略，会出现「不知道到底录没录上」的焦虑。 */
        .录音弹窗遮罩 {
            position: absolute; inset: 0; z-index: 50;
            display: none; align-items: center; justify-content: center;
            background: rgba(var(--shade), 0.2);
        }
        .录音弹窗遮罩.显示 { display: flex; }

        .录音弹窗 {
            width: min(74%, 268px);
            background: rgba(var(--panel), 0.86);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
            backdrop-filter: blur(22px) saturate(150%);
            border: 1px solid rgba(var(--panel), 0.5);
            border-radius: 18px;
            box-shadow: 0 12px 38px rgba(var(--shade), 0.18);
            padding: clamp(17px, 5vw, 22px) clamp(15px, 4.4vw, 19px) clamp(13px, 3.8vw, 16px);
            text-align: center;
        }

        .录音麦图标 {
            width: clamp(40px, 11.6vw, 48px); height: clamp(40px, 11.6vw, 48px);
            margin: 0 auto clamp(10px, 3vw, 13px);
            border-radius: 50%; background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            animation: 录音脉冲 1.1s ease-in-out infinite;
        }

        .录音麦图标 svg {
            width: clamp(19px, 5.6vw, 22px); height: clamp(19px, 5.6vw, 22px);
            fill: none; stroke: currentColor; stroke-width: 1.9;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .录音弹窗计时 {
            font-size: clamp(21px, 6.2vw, 25px); font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums; letter-spacing: .5px;
            margin-bottom: clamp(9px, 2.6vw, 12px);
        }

        /* 实时音量条：中间高、两端低，随音量起伏 */
        .录音音量 {
            height: clamp(26px, 7.6vw, 32px);
            display: flex; align-items: center; justify-content: center;
            gap: 2px; margin-bottom: clamp(9px, 2.6vw, 12px);
            overflow: hidden;
        }

        .录音音量 i {
            width: 3px; min-height: 3px; border-radius: 2px;
            background: var(--accent); opacity: .34;
            transition: height .08s linear, opacity .08s linear;
        }

        .录音弹窗说明 {
            font-size: clamp(11px, 3.2vw, 12.5px); color: var(--ink-3);
            line-height: 1.5; margin-bottom: clamp(12px, 3.6vw, 15px);
        }

        .录音弹窗按钮行 { display: flex; gap: clamp(7px, 2vw, 10px); }

        .录音弹窗按钮 {
            flex: 1; height: clamp(34px, 9.6vw, 39px);
            border: 1px solid rgba(var(--line), 0.42); border-radius: 12px;
            background: rgba(var(--panel), 0.6); color: var(--ink-2);
            font-family: inherit; font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }

        .录音弹窗按钮:active { background: rgba(var(--line), 0.22); }
        .录音弹窗按钮.主 {
            background: var(--accent); border-color: var(--accent);
            color: #fff; font-weight: 600;
        }
        .录音弹窗按钮.主:active { background: var(--accent-ink); }
    </style>
</head>
<body>
    <div class="手机主题背景容器">
        <img class="主题背景图片" src="2【图片】/默认主题背景.png" alt="">
        <div class="全局白色遮罩"></div>

        <!-- ===== 顶部固定区 ===== -->
        <div class="顶部固定区">
            <div class="顶部导航栏">
                <div class="返回按钮" id="返回按钮" role="button" aria-label="返回">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
                </div>
                <div class="中间标题" id="页面标题">聊天</div>
                <!-- 右侧动作（同一时刻最多亮 3 枚）：
                     群聊 = 清空 → 搜索 → 更多（… 进群资料）
                     单聊 = 清空 → 搜索
                     ★ 顺序不能改：「更多」必须紧贴搜索键右侧（微信同款，
                       竖排三点的「更多」都在顶栏最末），清空键必须在搜索键左侧。
                     ★ 语音 / 视频通话两枚已按需求移除 —— 通话走功能条那颗
                       「语音通话」（同样进 14 页，且不会挤占顶栏留白）。 -->
                <div class="右侧动作">
                    <div class="清空键" id="清空键" role="button" aria-label="清空聊天记录">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 7h16"></path><path d="M10 4h4"></path>
                            <path d="M6 7l1 13h10l1-13"></path>
                            <path d="M10 11v6"></path><path d="M14 11v6"></path>
                        </svg>
                    </div>
                    <div class="搜索键" id="搜索键" role="button" aria-label="搜索聊天记录">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                        </svg>
                    </div>
                    <!-- ★ 更多（竖排三点）：紧贴放大镜右侧，点它进 18 页群资料。
                         只有群聊才显示（单聊没有「群资料」这回事）。 -->
                    <div class="群资料键" id="群资料键" role="button" aria-label="更多（群聊资料）"
                         style="display:none;">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="5.5" r="1.5" fill="currentColor" stroke="none"></circle>
                            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
                            <circle cx="12" cy="18.5" r="1.5" fill="currentColor" stroke="none"></circle>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="聊天搜索条" id="聊天搜索条">
                <div class="聊天搜索框">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                    </svg>
                    <input class="聊天搜索输入" id="聊天搜索输入" type="search"
                           placeholder="搜索聊天记录..." autocomplete="off">
                </div>
            </div>
        </div>

        <!-- ===== 中间滚动区：消息流 ===== -->
        <div class="手机界面内容" id="消息流"></div>

        <!-- ===== 功能条：常驻在输入框上方（转账 / 红包 / 语音通话 / 一起阅读）=====
             左镂空爱心图标 + 右文字，四项横排等分。 -->
        <div class="功能条" id="功能条"></div>

        <!-- ===== 底部输入区 ===== -->
        <div class="底部输入区">
            <textarea class="消息输入" id="消息输入" rows="1" placeholder="发消息..."></textarea>
            <button class="圆钮" id="麦克风按钮" type="button" aria-label="语音消息">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="11" rx="3"></rect>
                    <path d="M5 11a7 7 0 0 0 14 0"></path>
                    <path d="M12 18v3"></path><path d="M8 21h8"></path>
                </svg>
            </button>
            <button class="圆钮" id="表情按钮" type="button" aria-label="表情">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"></path>
                    <path d="M9 9.5h.01"></path><path d="M15 9.5h.01"></path>
                </svg>

 *     https://api.openai.com/v1   → /images/generations

 *     （几十上百个，全是文本模型），全列给用户选等于没法选 ——
 *     所以这里做一次过滤：命中常见生图关键词的优先，命中纯文本关键词的排除。
 *     过滤完如果为空（说明这家命名不按套路），就原样返回，让用户自己挑。

        'draw', 'paint', 'art', 'picture', 'pic', 'poster', 'vision-gen',

    function 挑生图模型(表) {
        const 全 = Array.isArray(表) ? 表 : [];
        if (!全.length) return [];

            if (typeof v === 'object') {

                return { 网址: '', 数据: 拼dataURL(数据.b64_json.trim()) };
            }

    function 拼dataURL(b64) {
        if (/^data:image\//i.test(b64)) return b64;

     * 图片存档：IndexedDB
     *   ★★ 为什么不放 localStorage：它只有约 5MB，几张 base64 图就写满，
     *      写满之后【所有页面】的存档都会失败（连聊天记录都存不进去）——
     *      这是真会出事的。所以图片走 IndexedDB（与「音乐库」同款做法），
     *      聊天记录里只放一个图片 id 引用。

    const 表名 = '图片';

        return new Promise((完成, 失败) => {

            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });

    function 跑图片事务(模式, 处理) {
        return 打开图片库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 模式);
            const 结果 = 处理(事务.objectStore(表名));
            事务.oncomplete = () => 完成(结果 && 结果.result !== undefined ? 结果.result : null);
            事务.onerror = () => 失败(事务.error || new Error('事务失败'));
        }));
    }

     * 存一张图，返回它的 id。
     * ★ 只有 base64（数据）才需要存 —— 接口直接给链接的不用占库。
     * @returns {Promise<string>} '' 表示没存成（调用方退回直接用 网址）
     */
    function 存图(记录) {
        const id = (记录 && 记录.id) || ('img_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
        return 跑图片事务('readwrite', 表 => 表.put(Object.assign({}, 记录, {
            id: id,
            时间: (记录 && 记录.时间) || Date.now(),
        }))).then(() => id).catch(() => '');
    }

    /** 按 id 读回一张图：{ id, 数据, 网址, 描述, 时间 } */
    function 读图(id) {
        if (!id) return Promise.resolve(null);
        return 跑图片事务('readonly', 表 => 表.get(id)).catch(() => null);
    }

    /** 一次读多张（聊天里可能连着好几张图） */
    function 读图组(id表) {
        const 表 = Array.isArray(id表) ? id表.filter(Boolean) : [];
        if (!表.length) return Promise.resolve([]);
        return Promise.all(表.map(读图)).then(r => r.filter(Boolean)).catch(() => []);
    }

    /* ---------- 对外 ---------- */
    global.图片助手 = {
        读配置: 读配置,
        已配置: 已配置,
        规范化: 规范化,
        候选生图地址: 候选生图地址,
        候选模型地址: 候选模型地址,
        挑生图模型: 挑生图模型,
        拉模型: 拉模型,
        生图: 生图,
        拼dataURL: 拼dataURL,
        /* 存档 */
        存图: 存图,
        读图: 读图,
        读图组: 读图组,
    };
})(typeof window !== 'undefined' ? window : this);

    <script id="音频助手">
/**
 * 音频助手.js —— 语音合成（TTS）的统一调用层
 *
 * ★★ 与 AI助手.js / 图片助手.js 同一套思路：

 *        音色（voice）与音速 / 语调 / 语言 / 性别 全部归 3 页 per-contact 管 ——
 *        21 页不再存「音色 / 音色列表」两个字段。

 *     ① 联系人在 3 页填了「自定义音色 ID」→ 用他的（克隆音色，优先级最高）

 *     ③ 都没有（压根没配过）→ 退回内置兜底 'alloy'

 *     https://api.openai.com      → /v1/audio/speech
 *     https://api.openai.com/v1   → /audio/speech

 *     ✗ 401/403 → 密钥不对；404 → 地址不对（已试过两种拼法）

(function (global) {
    'use strict';

    const 配置键 = '音频API配置';
    const 默认超时 = 45000;   // ★ TTS 比聊天慢，但一般比生图快，取 45 秒

    function 读配置() {

        if (!s) return '';
        if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
        return s.replace(/\/+$/, '');
    }

    function 已带版本(基) { return /\/v\d+[a-z]*$/i.test(基); }

    /** 拼出 TTS 端点的候选地址 */
    function 候选合成地址(基) {
        const b = 规范化(基);
        if (!b) return [];
        return 已带版本(b)
            ? [b + '/audio/speech']
            : [b + '/v1/audio/speech', b + '/audio/speech'];
    }

    /** 拼出音色列表端点的候选地址（多家不统一，全都试一遍） */
    function 候选音色地址(基) {
        const b = 规范化(基);
        if (!b) return [];
        const 后缀 = 已带版本(b) ? [''] : ['/v1', ''];

    }

    function 候选模型地址(基) {

    /* ---------- 音色名过滤 ---------- */

    const 非语音关键词 = ['embedding', 'rerank', 'moderation', 'whisper', 'transcribe', 'dall', 'image', 'vision'];

    async function 拉模型(网址, 密钥, 选项) {
        const 选 = 选项 || {};
        if (!String(网址 || '').trim()) return { 好: false, 列表: [], 原因: '请先填接口地址', 来源: '' };
        if (!String(密钥 || '').trim()) return { 好: false, 列表: [], 原因: '请先填密钥', 来源: '' };

        const 超时 = 选.超时 || 默认超时;
        const 记录 = 选.记录;

                if (!r || !r.ok) continue;
                const j = await r.json().catch(() => null);
                const 原始 = (j && j.data) || (Array.isArray(j) ? j : null);
                if (!Array.isArray(原始) || !原始.length) continue;
                /* ★ 先挑像语音的（tts/speech/audio…），挑不出来就原样全列 ——

                const 列 = 用.map(m => ({

                    名: String((m && (m.id || m.名)) || '').trim(),

    /* ---------- 请求小工具 ---------- */
    function 带超时(url, 头, 体, 超时, 记录) {

     *

    async function 拉音色(网址, 密钥, 选项) {

        if (!String(网址 || '').trim()) return { 好: false, 列表: [], 原因: '请先填接口地址', 来源: '' };
        if (!String(密钥 || '').trim()) return { 好: false, 列表: [], 原因: '请先填密钥', 来源: '' };

        const 超时 = 选.超时 || 默认超时;
        const 记录 = 选.记录;
        const 头 = { 'Authorization': 'Bearer ' + 密钥 };

        /* ① 先试各家音色端点 */
        for (const url of 候选音色地址(网址)) {
            try {
                const r = await 带超时(url, 头, null, 超时, 记录);
                if (!r || !r.ok) continue;
                const j = await r.json().catch(() => null);
                const 原始 = (j && (j.voices || j.data || j.models)) || (Array.isArray(j) ? j : null);
                if (!Array.isArray(原始) || !原始.length) continue;
                const 列 = 原始.map(v => ({
                    id: String((v && (v.voice_id || v.id || v.name || v)) || '').trim(),
                    名: String((v && (v.name || v.显示名 || v.id || v)) || '').trim(),
                })).filter(v => v.id);
                if (列.length) return { 好: true, 列表: 列, 原因: '', 来源: '接口' };
            } catch (e) { /* 换下一个端点 */ }
        }

        /* ② 再试 /models，把像语音的挑出来 */
        for (const url of 候选模型地址(网址)) {
            try {
                const r = await 带超时(url, 头, null, 超时, 记录);
                if (!r || !r.ok) continue;
                const j = await r.json().catch(() => null);
                const 原始 = (j && j.data) || (Array.isArray(j) ? j : null);
                if (!Array.isArray(原始)) continue;
                const 列 = 挑语音模型(原始).map(m => ({
                    id: String(m.id || m.名 || ''),
                    名: String(m.id || m.名 || ''),

        return { 好: true, 列表: 兜底音色(), 原因: '没读到音色列表，下面是常见音色名', 来源: '内置' };

    async function 合成(文, 选项) {

        const 密钥 = 选.密钥 || (配置 && 配置.密钥) || '';

        if (!内容) return { 好: false, blob: null, 类型: '', 原因: '没有要念的内容' };
        if (!音色) return { 好: false, blob: null, 类型: '', 原因: '还没选音色' };

        if (!地址表.length) return { 好: false, blob: null, 类型: '', 原因: '接口地址为空' };

            'Authorization': 'Bearer ' + 密钥,
            'Content-Type': 'application/json',

        /* ★★ 3 页的语音参数全部作用到这里（原先只有音速生效，调语调/语言/性别没反应）
             各家字段名不统一，所以同一个语义按常见写法都传一份：
               · 语调 pitch / tone / intonation
               · 语言 language / lang
               · 性别 gender / voice_gender
             ★ 只传【用户真的改过的】（不等于默认值才传）——
               全字段硬塞上去，遇到校验严的服务会直接 400，
