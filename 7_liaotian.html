         *  ★ 只存内存也不行：刷新后语音条全变「已失效」，就听不到内容了。
         *    所以音频本体进 IndexedDB（4_tongxun 存音乐用的就是这套），
         *    内存里只留一个 blob URL 供 <audio> 直接播。
         *    浏览器没有 IndexedDB 时自动降级为「仅本次会话有效」，不报错。
         * ============================================================ */
        const 语音库 = Object.create(null);          // 键 → blob URL（内存）
        const 语音库名 = '聊天语音库';
        const 语音表名 = '语音';

        function 打开语音库() {
            return new Promise((完成, 失败) => {
                if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
                let 请求;
                try { 请求 = indexedDB.open(语音库名, 1); } catch (e) { return 失败(e); }
                请求.onupgradeneeded = () => {
                    const db = 请求.result;
                    if (!db.objectStoreNames.contains(语音表名)) db.createObjectStore(语音表名, { keyPath: 'id' });
                };
                请求.onsuccess = () => 完成(请求.result);
                请求.onerror = () => 失败(请求.error || new Error('打开失败'));
            });
        }

        function 跑语音事务(模式, 处理) {
            return 打开语音库().then(db => new Promise((完成, 失败) => {
                const 事务 = db.transaction(语音表名, 模式);
                const 结果 = 处理(事务.objectStore(语音表名));
                事务.oncomplete = () => 完成(结果 && 结果.result !== undefined ? 结果.result : null);
                事务.onerror = () => 失败(事务.error || new Error('事务失败'));
            }));
        }

        // 记录 id 带上联系人前缀，避免不同联系人的语音互相覆盖
        const 语音记录id = 键 => 存档ID + ':' + 键;

        function 存语音(键, blob) {
            return 跑语音事务('readwrite', 表 => 表.put({ id: 语音记录id(键), blob: blob })).catch(() => null);
        }

        function 删语音(键) {
            return 跑语音事务('readwrite', 表 => 表.delete(语音记录id(键))).catch(() => null);
        }

        /** 清空本联系人的全部语音（清空聊天记录时用） */
        function 清空语音() {
            const 前缀 = 存档ID + ':';
            return 跑语音事务('readwrite', 表 => 表.getAll())
                .then(全部 => Promise.all((全部 || [])
                    .filter(r => String(r.id).indexOf(前缀) === 0)
                    .map(r => 跑语音事务('readwrite', 表 => 表.delete(r.id)))))
                .catch(() => null);
        }

        /** 页面载入时把所有语音读回内存 → 刷新后依然可播 */
        function 载入语音() {
            const 建URL = window.URL && window.URL.createObjectURL
                ? window.URL.createObjectURL.bind(window.URL) : null;
            if (!建URL) return Promise.resolve(null);   // 环境不支持就没法建 URL，安静跳过
            const 前缀 = 存档ID + ':';
            return 跑语音事务('readonly', 表 => 表.getAll())
                .then(全部 => {
                    (全部 || []).forEach(r => {
                        if (String(r.id).indexOf(前缀) !== 0) return;
                        const 键 = String(r.id).slice(前缀.length);
                        if (!语音库[键] && r.blob) {
                            // 单条失败不能连累其余语音，所以逐个 try
                            try { 语音库[键] = 建URL(r.blob); } catch (e) {}
                        }
                    });
                })
                .catch(() => null);
        }

        /** 秒 → 0:03 */
        function 时长文(秒) {
            const s = Math.max(0, Math.round(秒 || 0));
            return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }

        /* ============================================================
         *  语音播放器：全局单例 <audio>，真实挂在 DOM 里
         *  ★ 为什么不用 new Audio()：
         *    用 new Audio() 创建的元素是「游离」的，从未被插入文档。
         *    iOS Safari（以及部分 Android WebView）会静默拒绝播放这类元素 ——
         *    表现就是「点了没声音、也不报错」，是移动端最经典的坑。
         *    必须 appendChild 到 DOM 里才放行。
         *  ★ 单例还顺带解决：同时只有一条语音在放，不会几条声音叠在一起。
         * ============================================================ */
        const 播放器元素 = document.getElementById('语音播放器');
        const 播放器 = 播放器元素;

        /* ★ 背景音乐让位：语音条出声时暂停，播完恢复。
             window.全局音频 由页尾内联的全局音乐脚本提供 ——
             它在本脚本之后执行，但【调用发生在用户点击时】，那时早已就绪。
             这里仍做空值保护，避免脚本顺序变动导致整页报错。 */
        function 占音乐() {
            try { if (window.全局音频) window.全局音频.暂停('语音消息'); } catch (e) {}
        }
        function 让音乐() {
            try { if (window.全局音频) window.全局音频.恢复('语音消息'); } catch (e) {}
        }
        播放器.当前键 = '';
        播放器.当前泡 = null;
        播放器.当前竖条 = null;
        播放器.当前复原 = null;

        /** play() 被拒 / 解码失败时给出可见反馈，绝不静默吞掉 */
        播放器元素.addEventListener('error', () => {
            const 码 = 播放器元素.error && 播放器元素.error.code;
            停播放();
            提示条(码 === 4 ? '音频格式不支持，无法播放' : '音频加载失败');
        });
        播放器元素.addEventListener('ended', () => 停播放());
        播放器元素.addEventListener('timeupdate', () => {
            if (!播放器.当前竖条) return;
            const 比 = 播放器元素.duration ? 播放器元素.currentTime / 播放器元素.duration : 0;
            播放器.当前竖条.forEach((b, i) => b.classList.toggle('已播', i / 播放器.当前竖条.length < 比));
        });

        function 停播放() {
            try { 播放器元素.pause(); } catch (e) {}
            try { 播放器元素.currentTime = 0; } catch (e) {}
            让音乐();                          // ★ 语音播完 / 中止 → 背景音乐恢复
            if (播放器.当前泡) 播放器.当前泡.classList.remove('播放中');
            if (播放器.当前复原) 播放器.当前复原();
            播放器.当前键 = ''; 播放器.当前泡 = null;
            播放器.当前竖条 = null; 播放器.当前复原 = null;
        }

        function 起播放(条, 泡, 竖条, 复原) {
            // 先停掉上一条，保证同时只有一路声音
            if (播放器.当前键 && 播放器.当前键 !== 条.语音键) 停播放();

            const 源 = 语音库[条.语音键];
            if (!源) { 提示条('这段语音已失效，无法播放'); 让音乐(); return; }

            播放器.当前键 = 条.语音键;
            播放器.当前泡 = 泡;
            播放器.当前竖条 = 竖条;
            播放器.当前复原 = 复原;

            播放器元素.src = 源;
            泡.classList.add('播放中');

            /* ★ 语音条出声 → 背景音乐让位（否则两路声音叠在一起）。
               结束后在 停播放() 里释放。 */
            占音乐();

            // 某些环境（含 jsdom）根本没实现 play()，先判存在再调
            if (typeof 播放器元素.play !== 'function') {
                泡.classList.remove('播放中'); 让音乐(); return;
            }
            const p = 播放器元素.play();
            if (p && typeof p.catch === 'function') {
                p.catch(err => {
                    泡.classList.remove('播放中');
                    让音乐();                 // ★ 播放失败也要放背景音乐回来
                    const 名 = err && err.name;
                    // NotAllowedError：浏览器要求先有用户交互才能出声
                    提示条(名 === 'NotAllowedError'
                        ? '浏览器拦截了播放，请再点一次'
                        : (名 === 'NotSupportedError' ? '音频格式不支持，无法播放' : '播放失败，请重试'));
                });
            }
        }

        /** 语音条气泡内部：播放键 + 声波条 + 时长 */
        function 建语音条(泡, 条) {
            const 有音 = !!(条.语音键 && 语音库[条.语音键]);
            if (!有音) 泡.classList.add('失效');

            const 键 = document.createElement('button');
            键.className = '语音播放';
            键.type = 'button';
            键.setAttribute('aria-label', 有音 ? '播放语音' : '语音已失效');
            键.innerHTML = 有音
                ? '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"></path></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"></path></svg>';
            泡.appendChild(键);

            const 条容器 = document.createElement('div');
            条容器.className = '语音条';
            // 条数按时长走，长语音看起来就长一点（5~22 根）
            const 根数 = Math.min(22, Math.max(5, Math.round((条.时长 || 1) * 1.6) + 5));
            const 竖条 = [];
            for (let i = 0; i < 根数; i++) {
                const i元素 = document.createElement('i');
                // 高低错落，像真实声波；用下标做确定性伪随机，避免每次渲染跳动
                i元素.style.height = (35 + ((i * 37) % 60)) + '%';
                条容器.appendChild(i元素);
                竖条.push(i元素);
            }
            泡.appendChild(条容器);

            const 时 = document.createElement('span');
            时.className = '语音时长';
            时.textContent = 有音 ? 时长文(条.时长) : '已失效';
            泡.appendChild(时);

            // ★ 失效的语音（音频已不可读）：点了也要有反馈，不能静默无反应
            if (!有音) {
                泡.addEventListener('click', e => {
                    e.stopPropagation();
                    if (刚长按) { 刚长按 = false; return; }
                    提示条('这段语音已失效，无法播放');
                });
                return;
            }

            /** 播放 / 暂停切换 */
            function 切换播放() {
                if (播放器.当前键 === 条.语音键 && !播放器.paused) {
                    停播放();
                    return false;
                }
                起播放(条, 泡, 竖条, 复原进度);
                return true;
            }

            // ★ 整条语音气泡都能点（不只是那个小播放键）—— 手指点哪都行，
            //   这是微信的既有习惯，播放键太小在手机上很难点中。
            泡.addEventListener('click', e => {
                e.stopPropagation();          // 别冒到消息行，否则会被长按逻辑当成要删除
                if (刚长按) { 刚长按 = false; return; }   // 刚触发过长按删除，这一下 click 不算播放
                切换播放();
            });

            // 播放键本身不单独绑 click：点在它上面时事件会自然冒泡到 泡，
            // 由上面那一个处理器统一播放 —— 绑两次会「点一下播两遍」，
            // 加 stopPropagation 又会把它掐死导致点播放键没反应。

            function 复原进度() { 竖条.forEach(b => b.classList.remove('已播')); }
        }

        /* ---- 图标 SVG（描边式，与全站一致）----
           ★ 红包 / 转账卡片【不用图标】（需求：区分靠文案与排版）；
             但通话记录小气泡【要】一个电话图标（需求明确），所以留着「通话」。 */
        const 图标们 = {
            通话: '<path d="M5.5 6.5h3l1.5 3.5-2 1.4a9.5 9.5 0 0 0 4.6 4.6l1.4-2 3.5 1.5v3a1.6 1.6 0 0 1-1.8 1.6'
                + 'C10.4 18.6 5.4 13.6 3.9 7.3A1.6 1.6 0 0 1 5.5 6.5z"></path>',
            勾: '<polyline points="5 12.5 10 17.5 19 7"></polyline>',
        };
        /* ★ 镂空爱心：只描边不填色，功能图标居中坐在心尖里 */
        /* ★ 与 1 页「.标签爱心」同一枚路径：改这里请同步 1_shouyeyulan.html */
        const 心形 = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3'
            + 'c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5'
            + 'c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';

        /** 金额格式化：两位小数，整钱去掉 .00（¥20 而不是 ¥20.00） */
        function 钱(数) {
            return (Math.round(数 * 100) / 100).toFixed(2).replace(/\.00$/, '');
        }

        /** 秒 → m:ss */
        function 分秒(秒) {
            const m = Math.floor(秒 / 60), s = 秒 % 60;
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        /** 四种卡片消息的类型名；渲染与摘要都靠它判断 */
        const 卡片类型们 = ['转账', '红包', '通话', '阅读'];

        /**
         * 卡片文案：{ 题, 额, 副, 是文 }
         * ★【无图标】—— 需求明确不要图标，所以种类靠文案与排版区分：
         *   题 = 类别小标签；额 = 主行；副 = 补充。
         * ★ 是文 = true 表示主行是【祝福语/书名】这类文字，
         *   排版上不给它加粗等宽（金额与时长才是数字，要加粗等宽）。
         *   这样转账（大号数字）和红包（常规字重文字）一眼就分得开。
         *
         *   转账：题「转账」  额「¥52.50」       副「还你的」
         *   红包：题「红包」  额「新年快乐」       副「5 个 · 共 ¥66」
         *   通话：题「语音通话」额「2:05」         副「已完成 · 3 人」
         */
        function 卡片文案(卡) {
            const c = 卡 || {};
            switch (c.种类) {
                case '转账': {
                    /* ★ 群里转的账要能看出转给谁（微信同款：气泡写「转账给 XXX」） */
                    const 段 = [];
                    if (c.对象) 段.push('转账给 ' + c.对象);
                    if (c.说明) 段.push(c.说明);
                    return { 题: '转账', 额: '¥' + 钱(c.金额 || 0),
                             副: 段.length ? 段.join(' · ') : '转账给对方' };
                }
                case 'AA':
                    return { 题: 'AA 收款', 额: '¥' + 钱(c.每人 || 0) + ' / 人',
                             副: '共 ' + (c.人数 || 0) + ' 人 · 总额 ¥' + 钱(c.金额 || 0)
                                  + (c.说明 ? ' · ' + c.说明 : '') };
                case '红包':
                    return { 题: '红包', 额: c.祝福 || '恭喜发财，大吉大利', 是文: true,
                             副: '¥' + 钱(c.金额 || 0) };
                case '拼手气红包':
                    return { 题: '拼手气红包', 额: c.祝福 || '恭喜发财，大吉大利', 是文: true,
                             副: (c.个数 || 0) + ' 个 · 共 ¥' + 钱(c.金额 || 0) };
                case '普通红包':
                    return { 题: '普通红包', 额: c.祝福 || '恭喜发财，大吉大利', 是文: true,
                             副: (c.个数 || 0) + ' 个 · 每人 ¥'
                                  + 钱((c.金额 || 0) / Math.max(1, c.个数 || 1)) };
                case '通话':
                    /* ★ 挂断后气泡里必须能看到通话时长：
                         接通过 → 主行就是时长（2:05，数字排版：加粗等宽）；
                         没接通 → 「未接通」是文字，走文字排版（不加粗）。 */
                    return { 题: '语音通话',
                             额: c.时长 ? 分秒(c.时长) : (c.结果 === '已取消' ? '未接通' : '0:00'),
                             是文: !c.时长,
                             副: (c.结果 || '已完成')
                                 + ((c.成员 || []).length > 1 ? ' · ' + c.成员.length + ' 人' : '') };
                case '阅读':
                    return { 题: '一起阅读', 额: '《' + (c.书名 || '') + '》', 是文: true,
                             副: (c.副 || '') + (c.人数 ? ' · ' + c.人数 + ' 人共读' : '') };
                default:
                    return { 题: '消息卡片', 额: '', 副: '' };
            }
        }

        /**
         * 金额拆三段：'¥52.50' → ¥(小) 52(大) .50(小)；'¥10 / 人' → ¥ 10 ' / 人'
         * ★ 精致度就来自这个字号层级 —— 照支付类 UI，整数是主角、货币符和小数是配角。
         *   不是金额（比如红包祝福语）返回 null，调用方按普通文本渲染。
         */
        function 金额段(文) {
            const m = /^¥(\d+(?:\.\d+)?)\s*(.*)$/.exec(String(文 || ''));
            if (!m) return null;
            const 位 = m[1].split('.');
            const 段 = [{ 文: '¥', 类: '卡币' }, { 文: 位[0], 类: '卡整' }];
            if (位[1]) 段.push({ 文: '.' + 位[1], 类: '卡零' });
            if (m[2]) 段.push({ 文: ' ' + m[2], 类: '卡缀' });
            return 段;
        }

        /**
         * 收付状态文案。
         * ★ 我方发出 / 对方发来 说法不同（微信也这样）：
         *     我发的红包没人领 → 「等待对方领取」；被领了 → 「对方已领取」
         *     别人发的红包没领 → 「点击领取」；领了   → 「已领取」
         *   转账同理（收款 / 已收款）。
         * ★ 一起阅读没有收付概念 → 返回空串（不显示状态标签）。
         */
        function 卡状态文(类型, 卡, 我方) {
            if (类型 !== '转账' && 类型 !== '红包') return '';
            const 收 = !!(卡 && 卡.已收);
            if (类型 === '红包') {
                return 收 ? (我方 ? '对方已领取' : '已领取')
                          : (我方 ? '等待对方领取' : '点击领取');
            }
            return 收 ? (我方 ? '对方已收款' : '已收款')
                      : (我方 ? '等待对方收款' : '点击收款');
        }

        /** 类型 → 卡片主 class（红包暖 / 转账冷；一起阅读没有收付 → 不给色） */
        function 卡片类名(类型) {
            if (类型 === '红包') return '红包泡';
            if (类型 === '转账') return '转账泡';
            return '阅读泡';                  // ★ 中性：不参与冷暖
        }

        /** 只有转账 / 红包有「收付」概念（一起阅读没有） */
        function 有收付(类型) {
            return 类型 === '转账' || 类型 === '红包';
        }

        /* ★ 卡片左侧的类型配图，放在 2【图片】 下 */
        const 卡图目录 = '2【图片】/';
        const 卡图扩展 = ['png', 'jpg', 'jpeg', 'webp'];
        /** 类型 → 配图文件名（不含扩展名） */
        function 卡图名(类型) {
            switch (类型) {
                case '红包': return '红包';
                case '转账': return '转账';
                case '阅读': return '';       // 一起阅读暂无配图
                default: return '';
            }
        }

        /**
         * 给 <img> 填类型配图，按 png → jpg → jpeg → webp 逐个试。
         * ★ onerror 用【赋值】而不是 addEventListener：后者每次重试都会再叠一个
         *   监听器，第 N 次失败会连着触发 N 次回调（1 / 7 / 11 页踩过同款坑）。
         * ★ 全失败 → 加 .空 压成淡占位，【不】换成别的图（换图等于变相默认图）。
         */
        function 填卡图(图元素, 类型) {
            const 名 = 卡图名(类型);
            if (!名) { 图元素.style.display = 'none'; return; }
            let 第几 = 0;
            图元素.onerror = () => {
                if (第几 < 卡图扩展.length) {
                    图元素.src = 卡图目录 + 名 + '.' + 卡图扩展[第几++];
                    return;
                }
                图元素.onerror = null;
                图元素.classList.add('空');
                图元素.removeAttribute('src');
            };
            图元素.src = 卡图目录 + 名 + '.' + 卡图扩展[第几++];
        }

        /** 把卡片画进气泡：题（类别胶囊）+ 额（主行）+ 副（补充）+ 底栏（照微信） */
        function 建卡片(泡, 条, 序号) {
            const 文 = 卡片文案(条.卡);
            const 已收 = !!(条.卡 && 条.卡.已收);
            const 我方 = 条.谁 === '我';
            const 头 = document.createElement('div');
            头.className = '卡片头';
            /* ★ 需求：删除卡片上方那行「红包 / 转账」类别提示。
                 种类改由【左侧配图 + 主行性质（金额 vs 祝福语）】承担。
               ★ 文.题 这个字段【保留】—— 摘要() 与 匹配搜索() 还要用它
                 （删消息时的确认文案、搜索「转账」能命中），只是不再渲染出来。 */
            头.innerHTML = '<img class="卡图" alt="">'
                + '<span class="卡片文">'
                + '<span class="卡片额"></span>'
                + '<span class="卡片副"></span>'
                + '</span>';
            /* ★ 左侧类型配图：2【图片】/红包.png、转账.png */
            填卡图(头.querySelector('.卡图'), 条.类型);

            const 额元素 = 头.querySelector('.卡片额');
            /* ★ 文字类主行（红包祝福语 / 书名）不加粗、不用等宽数字 —— 与金额区分 */
            if (文.是文) 额元素.classList.add('文');
            const 段 = 金额段(文.额);
            if (段) {
                段.forEach(p => {
                    const sp = document.createElement('span');
                    sp.className = p.类;
                    sp.textContent = p.文;
                    额元素.appendChild(sp);
                });
            } else {
                额元素.textContent = 文.额 || '';
            }
            /* ★ 主行为空（未知卡片）时别留一行空白 */
            if (!文.额) 额元素.style.display = 'none';
            头.querySelector('.卡片副').textContent = 文.副;

            const 尾 = document.createElement('div');
            尾.className = '卡片尾';
            尾.innerHTML = '<span class="尾点"></span><span class="尾文"></span>'
                + '<span class="卡态"></span>';
            /* ★ 底栏照微信那条（● 类别 · 时间），时间让它不只是一个重复标签 */
            const 时刻 = 条.时间戳 ? 时分(条.时间戳) : '';
            尾.querySelector('.尾文').textContent =
                卡片尾巴(条.类型) + (时刻 ? ' · ' + 时刻 : '');
            /* ★ 状态标签：空文案就整条隐藏（一起阅读没有收付状态） */
            const 态 = 卡状态文(条.类型, 条.卡, 我方);
            const 态元素 = 尾.querySelector('.卡态');
            if (态) 态元素.textContent = 态;
            else 态元素.style.display = 'none';

            泡.appendChild(头);
            泡.appendChild(尾);

            /* ★ 点击领取 / 收款：写回存档并重绘。
               只有「有收付状态」的卡片（转账 / 红包）才可点。 */
            if (态) 绑卡片点击(泡, 序号, 条);
        }

        /**
         * 点卡片 → 切换「已收 / 未收」。
         * ★ 与长按删除的冲突：长按触发后 刚长按 = true，这里直接忽略那一次 click。
         * ★ 可来回切换（误点能恢复）；真实场景该由服务端定，这里是本地演示。
         */
        function 绑卡片点击(泡, 序号, 条) {
            泡.addEventListener('click', () => {
                if (刚长按) return;                 // 刚长按过（要删消息），不当作点击
                const 目 = 消息表[序号];
                if (!目 || 目 !== 条) return;        // 过滤/重排后对不上就放弃
                目.卡 = 目.卡 || {};
                目.卡.已收 = !目.卡.已收;
                写(存档键, JSON.stringify(消息表));
                const 我方 = 目.谁 === '我';
                提示条(卡状态文(目.类型, 目.卡, 我方));
                渲染(搜索框 ? 搜索框.value.trim() : '');
            });
        }

        /**
         * ★ 通话记录 = 小气泡（不是卡片）：只要一个电话图标 + 通话时长。
         *   微信的通话记录在对话流里就是这样一行小泡，不抢戏。
         *   ★ 通话时长本身就是「挂断后要看到的东西」，所以直接当主文本。
         */
        function 建通话小泡(泡, 条) {
            const c = 条.卡 || {};
            const 接通过 = !!c.时长;
            const 包 = document.createElement('span');
            包.className = '通话小泡' + (接通过 ? '' : ' 未接通');
            包.innerHTML = '<svg class="通话小图标" viewBox="0 0 24 24" aria-hidden="true">'
                + 图标们.通话 + '</svg><span class="通话时长"></span>';
            包.querySelector('.通话时长').textContent = 接通过 ? 分秒(c.时长) : '未接通';
            泡.appendChild(包);
        }

        function 卡片尾巴(类型) {
            switch (类型) {
                case '转账': return '转账';
                case '红包': return '红包';
                case '通话': return '语音通话';
                case '阅读': return '一起阅读';
                default: return '';
            }
        }

        /**
         * 搜索匹配：除了正文，卡片消息还要能按【题 / 金额 / 说明】搜到。
         * ★ 卡片消息的 条.文 只是个标签（如「[转账]」），只比对它的话
         *   搜「52.5」或「还你的」都会搜不到已发的那笔转账。
         */
        function 匹配搜索(条, 关键字) {
            const 词 = String(关键字 || '').toLowerCase();
            if (!词) return true;
            const 池 = [String(条.文 || '')];
            if (卡片类型们.indexOf(条.类型) >= 0) {
                const 文 = 卡片文案(条.卡);
                池.push(文.题 || '', 文.额 || '', 文.副 || '', 卡片尾巴(条.类型));
            }
            /* 图片消息：描述（文）已在池里，再带上送进模型的画面提示词，
               搜「雨天」能命中，搜「青石巷」这种只出现在提示词里的也能命中。 */
            if (条.类型 === '图片') 池.push(String(条.提示 || ''), '图片');
            return 池.join(' ').toLowerCase().includes(词);
        }

        /**
         * 图片气泡：把「图」画进气泡里
         * ★ 图本体在 IndexedDB（base64 塞 localStorage 会撑爆 5MB），
         *   会话存档里只有一个 图id —— 所以这里必须异步读回来。
         * ★ 读到之前先挂占位图：气泡不会先空一下再冒出来。
         *   接口直接给链接的（条.网址）不用占库，直接当 src。
         */
        function 建图片泡(泡, 条) {
            const 图 = document.createElement('img');
            图.alt = String(条.文 || '图片');

            if (条.网址) {
                图.src = 条.网址;
            } else {
                图.src = 占位图数据(条.文);
                const 助手 = window.图片助手;
                if (条.图id && 助手 && typeof 助手.读图 === 'function') {
                    助手.读图(条.图id).then(记录 => {
                        /* 读到什么算什么：真图就换真图，存的本来就是占位图就维持原样 */
                        if (记录 && 记录.数据) 图.src = 记录.数据;
                    }).catch(() => {});
                }
            }
            泡.appendChild(图);
        }

        function 渲染(关键字) {
            流.innerHTML = '';
            let 上一条戳 = 0;
            let 可见数 = 0;

            消息表.forEach((条, 原下标) => {
                const 命中 = !关键字 || 匹配搜索(条, 关键字);
                /* ★ 不管这一条是否可见，都要先跟上一条比完时间戳再决定去留，
                   否则搜索时「首条」会变成过滤后的第一条，时间戳随关键词变。 */
                const 间隔分 = 上一条戳 ? (条.时间戳 - 上一条戳) / 60000 : 999;
                const 要时间戳 = !上一条戳 || 间隔分 > 5;
                上一条戳 = 条.时间戳;
                if (!命中) return;
                可见数++;

                if (要时间戳) {
                    const 戳元素 = document.createElement('div');
                    戳元素.className = '时间戳';
                    戳元素.dataset.是时间戳 = '1';
                    戳元素.textContent = 日期文案(条.时间戳);
                    流.appendChild(戳元素);
                }

                const 行 = document.createElement('div');
                行.className = '消息行' + (条.谁 === '我' ? ' 我方' : '');
                行.dataset.文 = String(条.文 || '');
                // ★ 存原始下标：搜索过滤后可见顺序 ≠ 消息表顺序，
                //   删除时必须按原下标定位，否则会删错人。
                行.dataset.序号 = String(原下标);
                绑长按(行, 原下标);

                const 头 = document.createElement('img');
                头.className = '消息头像';
                头.src = 条.谁 === '我' ? 占位头像 : 头像;
                头.alt = '';
                行.appendChild(头);

                const 泡 = document.createElement('div');
                if (条.类型 === '语音') {
                    泡.className = '气泡 语音泡';
                    建语音条(泡, 条);
                } else if (条.类型 === '通话') {
                    // ★ 通话记录是【小气泡】：电话图标 + 时长，与语音泡同级
                    泡.className = '气泡';
                    建通话小泡(泡, 条);
                } else if (条.类型 === '图片') {
                    // ★ 角色自主发来的图：气泡里就是一张图（真图 / 占位图同款外框）
                    泡.className = '气泡 图泡';
                    建图片泡(泡, 条);
                } else if (卡片类型们.indexOf(条.类型) >= 0) {
                    // ★ 转账 / 红包 / 一起阅读：气泡里是一张小卡
                    /* ★ 底色仍是白玻璃一套；「未收 / 已收」由 红包泡 / 转账泡
                       + 未收 / 已收 四个 class 组合出【暖 / 冷】与【彩 / 灰】两档：
                         待处理的（未收）有色彩倾向，处理完的退回中性灰。
                       收发方照旧靠左右对齐区分。 */
                    const 已收 = !!(条.卡 && 条.卡.已收);
                    泡.className = '气泡 卡片泡 ' + 卡片类名(条.类型)
                        /* ★ 一起阅读没有收付，不加 未收/已收 ——
                           否则会白拿一套冷色，看着像待收款。 */
                        + (有收付(条.类型) ? (已收 ? ' 已收' : ' 未收') : '');
                    建卡片(泡, 条, 原下标);
                } else {
                    泡.className = '气泡';
                    泡.innerHTML = 渲染文(条.文, 关键字);
                }
                行.appendChild(泡);

                流.appendChild(行);

                /* ★ 时间戳只跟【真实上一条】比（不管它是否可见），
                   这样搜索过滤时同一条消息的时间戳不会变来变去。 */
                上一条戳 = 条.时间戳;
            });

            if (!可见数) {
                const 空 = document.createElement('div');
                空.className = '无结果提示';
                空.textContent = '没有匹配的聊天记录';
                流.appendChild(空);
            }

            滚到底();
        }

        function 滚到底() {
            // 等一帧再滚，保证内容已布局
            requestAnimationFrame(() => { 流.scrollTop = 流.scrollHeight; });
        }

        /* ============================================================
         *  3.5 长按气泡 → 询问「是 / 否」→ 是则删除
         *  ★ 触屏用 touch 事件、桌面用 mouse 事件，两套都绑，才能真机与 PC 都可用。
         *  ★ 移动超过阈值就取消（用户是在滚动而不是长按）。
         * ============================================================ */
        const 长按毫秒 = 500;      // 微信就是这个量级，太短易误触、太长显迟钝
        const 移动容差 = 10;       // px
        let 长按计时 = null, 长按起点 = null, 长按的行 = null;
        // ★ 长按需过后的那一下 click 要丢掉：
        //   长按删除已经完成，松手时浏览器还会补一个 click，
        //   不拦住的话语音条会「删完还播一下」，非常怪。
        let 刚长按 = false;

        function 取点(e) { return (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e; }

        function 开始长按(e, 行, 序号) {
            // 点在语音播放键上不算长按（播放键自己会 stopPropagation，这里再兜一层）
            if (e.target && e.target.closest && e.target.closest('.语音播放')) return;
            取消长按();
            const 点 = 取点(e);
            长按起点 = { x: 点.clientX || 0, y: 点.clientY || 0 };
            长按的行 = 行;
            行.classList.add('按住');
            长按计时 = setTimeout(() => {
                长按计时 = null;
                行.classList.remove('按住');
                刚长按 = true;                       // 让随后的 click 失效（详见声明处注释）
                setTimeout(() => { 刚长按 = false; }, 400);   // 兜底复位，防止状态粘住
                请求删除(序号);
            }, 长按毫秒);
        }

        function 取消长按() {
            if (长按计时) { clearTimeout(长按计时); 长按计时 = null; }
            if (长按的行) { 长按的行.classList.remove('按住'); 长按的行 = null; }
        }

        function 绑长按(行, 序号) {
            行.addEventListener('mousedown', e => 开始长按(e, 行, 序号));
            行.addEventListener('touchstart', e => 开始长按(e, 行, 序号), { passive: true });

            行.addEventListener('mousemove', e => {
                if (!长按计时) return;
                const 点 = 取点(e);
                if (Math.abs((点.clientX || 0) - 长按起点.x) > 移动容差 ||
                    Math.abs((点.clientY || 0) - 长按起点.y) > 移动容差) 取消长按();
            });
            行.addEventListener('touchmove', () => 取消长按(), { passive: true });

            ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(名 =>
                行.addEventListener(名, 取消长按));

            // 长按在移动端会弹出系统菜单 / 选中文字，挡住确认框
            行.addEventListener('contextmenu', e => {
                if (长按的行 === 行) e.preventDefault();
            });
        }

        /**
         * 摘要：删除确认里显示被删内容的前 20 字
         * ★ 卡片消息直接用「题 + 额」，不要再拼一次 卡片尾巴()——
         *   卡片尾巴('转账') 和 文.题 都是「转账」，拼出来是「转账 转账 ¥52.50」。
         */
        function 摘要(条) {
            if (条.类型 === '语音') return '语音 ' + 时长文(条.时长);
            if (条.类型 === '图片') return '图片' + (条.文 ? ' ' + String(条.文).slice(0, 16) : '');
            if (卡片类型们.indexOf(条.类型) >= 0) {
                const 文 = 卡片文案(条.卡);
                return (文.题 || '') + (文.额 ? ' ' + 文.额 : '');
            }
            const 文 = String(条.文 || '').replace(/\s+/g, ' ').trim();
            return 文.length > 20 ? 文.slice(0, 20) + '…' : (文 || '（空消息）');
        }

        async function 请求删除(序号) {
            const 条 = 消息表[序号];
            if (!条) return;
            const 是 = await window.询问('删除这条消息？', '「' + 摘要(条) + '」', '删除');
            if (!是) return;                       // 点「否」→ 直接退出，什么都不做

            消息表.splice(序号, 1);
            写(存档键, JSON.stringify(消息表));
            if (条.类型 === '语音' && 条.语音键) 删语音(条.语音键);

            // 会话预览同步成剩下最后一条，删光了就不留旧文案
            const 末 = 消息表[消息表.length - 1];
            同步会话(末 ? 会话预览(末) : '');

            渲染(搜索框 ? 搜索框.value.trim() : '');
            提示条('已删除');
        }

        /* ============================================================
         *  3.6 清空聊天记录（顶部搜索键左侧）
         * ============================================================ */
        const 清空键 = document.getElementById('清空键');

        清空键.addEventListener('click', async () => {
            if (!消息表.length) { 提示条('聊天记录已经是空的'); return; }
            const 是 = await window.询问('清空聊天记录？',
                '将删除与「' + 昵称 + '」的全部 ' + 消息表.length + ' 条消息，无法恢复', '清空');
            if (!是) return;                       // 点「否」→ 退出，不清空

            消息表 = [];
            // ★ 写空数组而不是删键：键存在即代表「用户主动清空过」，
            //   下次进来才不会把初始对话再造回来。
            写(存档键, JSON.stringify(消息表));
            清空语音();
            同步会话('');

            if (搜索条.classList.contains('显示')) {
                搜索框.value = ''; 搜索键.classList.remove('选中态'); 搜索条.classList.remove('展开');
            }
            渲染('');
            提示条('已清空聊天记录');
        });

        /* ============================================================
         *  4. 发送
         * ============================================================ */
        const 输入框 = document.getElementById('消息输入');
        const 发送钮 = document.getElementById('发送按钮');

        function 刷新发送态() {
            发送钮.disabled = !输入框.value.trim();
        }

        function 自动增高() {
            输入框.style.height = 'auto';
            输入框.style.height = Math.min(输入框.scrollHeight, 88) + 'px';
        }

        输入框.addEventListener('input', () => { 刷新发送态(); 自动增高(); });
        输入框.addEventListener('keydown', e => {
            // 回车发送，Shift+回车换行（桌面端习惯）
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); 发送(); }
        });
        发送钮.addEventListener('click', 发送);

        /** 同步会话列表的最新一条，1 页 / 4 页就能看到刚发的内容 */
        function 同步会话(文) {
            try {
                const 索引 = 读JSON('联系人索引', []);
                if (Array.isArray(索引)) {
                    const 项 = 索引.find(i => i && i.id === 存档ID);
                    if (项) {
                        项.消息 = 文;
                        项.时间 = 时分(Date.now());
                        写('联系人索引', JSON.stringify(索引));
                        /* ★★ 会话「复活」：
                             1 页长按会话框只删会话、联系人还留在通讯录里。
                             如果用户又从通讯录进来聊天，会话应该重新出现在 1 页 ——
                             否则「人还在，却永远聊不了」就成了死局。
                             所以只要这里落地了新消息，就把名字从「已删会话」名单里移除。

                             ★ 7 页【没有】内联 联系人删除.js（只有 1 / 4 页内联了），
                               所以这里不能依赖 window.联系人删除，直接读键自己改。
                               键名与 联系人删除.js 里的 已删键 保持一致：'已删会话'。 */
                        try {
                            const 名 = String(项.名称 || 项.备注 || '').trim();
                            if (名) {
                                const 裸 = 名.replace(/（\d+）\s*$/, '').trim();
                                let 表 = JSON.parse(localStorage.getItem('已删会话') || '[]');
                                if (!Array.isArray(表)) 表 = [];
                                const 剩 = 表.filter(x => x !== 名 && x !== 裸);
                                if (剩.length !== 表.length) {
                                    localStorage.setItem('已删会话', JSON.stringify(剩));
                                }
                            }
                        } catch (e) {}
                    }
                }
            } catch (e) {}
        }

        /** 落地一条消息：入表 → 存档 → 同步会话 → 重绘 */
        /** 会话列表里显示的最后一条摘要 */
        function 会话预览(条) {
            if (条.类型 === '语音') return '[语音]';
            if (条.类型 === '图片') return '[图片]';
            if (卡片类型们.indexOf(条.类型) >= 0) return 条.文 || '[' + 卡片尾巴(条.类型) + ']';
            return String(条.文 || '');
        }

        function 落地(条, 会话文案) {
            消息表.push(条);
            写(存档键, JSON.stringify(消息表));
            同步会话(会话文案);
            渲染(搜索框 ? 搜索框.value.trim() : '');
        }

        /* ============================================================
         *  4.5 ★ 角色按对话场景自主发图（图片 API 的生效范围）
         *
         *  ★★ 这一块取代了原先的设计「输入框旁一个「生图」按钮，用户替联系人
         *      生成后发出」—— 那是【用户替角色操作】，图永远带着用户的意图，
         *      角色自己没有主动性。现在反过来：
         *        · 判断权在角色：按当前对话场景自己决定要不要发图
         *        · 用户只管说话，不用替对方点按钮
         *        · 没接图片 API 时【照样发】，只是发占位图 —— 行为不中断，
         *          接了 API 之后同一段代码自动换成真图，视觉上不跳
         *
         *  ★ 判定完全在本地做（关键词 + 节奏），不依赖任何模型：
         *     没配「文本API配置」也能用，且行为可预期、可测试。
         *
         *  ★ 冷却是必需的：不设的话「聊风景」会变成每条都配一张图，
         *     刷屏比不发更糟。这里取「距上次发图 ≥ 3 条用户消息」。
         * ============================================================ */

        /** 会让人想「给你看张图」的场景词（命中即具备发图动机） */
        const 场景词 = [
            '图', '照片', '拍', '好看', '漂亮', '风景', '景色',
            '天气', '下雨', '雨', '雪', '夕阳', '日落', '日出', '天空', '云', '星星', '星空', '月亮',
            '海', '海边', '山', '湖', '花', '树', '森林', '公园', '街', '巷', '城市', '楼',
            '猫', '狗', '动物', '鸟',
            '吃', '喝', '美食', '饭', '菜', '蛋糕', '咖啡', '茶',
            '衣服', '裙', '妆', '发型', '礼物', '书', '画', '房间', '窗',
            '梦', '春天', '夏天', '秋天', '冬天', '雪夜', '夜里', '晚上',
        ];

        /** 用户发言计数（进出本页重置，够用于节奏判定，不必落盘） */
        let 用户发言数 = 0;
        let 上次发图时 = -99;
        const 发图冷却 = 3;        // 距上次发图至少隔几条用户消息
        const 兜底间隔 = 6;        // 一直没出现场景词时，聊到这个深度也主动分享一张
        const 最短可发 = 4;        // 用户消息太短（"好""嗯"）不值得配图

        /**
         * 占位图：没接图片 API 时角色照样发图，只是发这张灰调 SVG。
         * ★ 内联生成，不依赖 2【图片】 素材 —— 素材不在也绝不会裂图。
         * ★ 把描述写进图里：用户看得到「这张图本来想画什么」，
         *   不至于对着一块说不清的灰板发愣。
         * ★ 尺寸/配色沿用全站冷调灰（--accent-soft / --ink-3 同档）。
         */
        function 占位图数据(描述) {
            const 文 = String(描述 || '')
                .replace(/[<>&"']/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 18);
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">' +
                '<rect width="640" height="400" fill="#dedee2"/>' +
                '<circle cx="248" cy="150" r="34" fill="none" stroke="#a4a4aa" stroke-width="8"/>' +
                '<path d="M92 288l106-118 78 88 54-62 118 132z" fill="none" stroke="#a4a4aa" ' +
                'stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>' +
                '<rect x="34" y="34" width="572" height="332" rx="10" fill="none" ' +
                'stroke="#c9c9ce" stroke-width="6"/>' +
                (文 ? '<text x="320" y="360" text-anchor="middle" font-family="sans-serif" ' +
                     'font-size="26" fill="#7a7a80">' + 文 + '</text>' : '') +
                '</svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        /**
         * 该不该发图：本地规则判定（★ 不联网、不依赖模型，行为可预期）
         *   ① 用户消息太短 → 不发（"好""嗯"配图很怪）
         *   ② 冷却未过     → 不发（防刷屏）
         *   ③ 上一条已是图 → 不发（不连发两张）
         *   ④ 命中场景词   → 发
         *   ⑤ 聊到一定深度（兜底间隔的倍数）→ 也发一次，免得没关键词就永远不见图
         */
        function 该不该发图(用户文) {
            const 文 = String(用户文 || '').trim();
            if (文.length < 最短可发) return false;
            if (用户发言数 - 上次发图时 < 发图冷却) return false;

            const 末 = 消息表[消息表.length - 1];
            if (末 && 末.类型 === '图片') return false;

            const 命中场景 = 场景词.some(词 => 文.includes(词));
            if (命中场景) return true;

            return 用户发言数 > 0 && 用户发言数 % 兜底间隔 === 0;
        }

        /**
         * 画面提示词：用户的话 + 角色自己的世界观。
         * ★ 带上世界观，出的图才像「这个角色」眼里的东西，
         *   而不是一张跟角色无关的通用风景照。
         */
        function 取画面描述(用户文) {
            let 世界 = '';
            try {
                const 详情 = 读JSON('好友信息_' + 存档ID, null);
                世界 = String((详情 && 详情.世界观) || '').trim().slice(0, 40);
            } catch (e) {}
            return (世界 ? 世界 + '。' : '') + String(用户文 || '').trim();
        }

        /**
         * 角色发图：判定 → 生图（或占位）→ 存 IndexedDB → 落地成图片消息
         * ★ 全程 await 之后再落地一条 —— 不先插一条空的再填，
         *   否则刷新会留下一条永远读不出图的空气泡。
         * ★ 生图失败、接口没返回、IndexedDB 不可用 → 一律退到占位图，
         *   用户看到的是「对方发了张图」，而不是一句报错。
         */
        async function 角色发图(用户文) {
            if (!该不该发图(用户文)) return null;

            const 提示 = 取画面描述(用户文);
            const 助手 = window.图片助手;
            let 数据 = '', 网址 = '';

            if (助手 && typeof 助手.已配置 === 'function' && 助手.已配置()
                && typeof 助手.生图 === 'function') {
                try {
                    const 果 = await 助手.生图(提示, {});
                    if (果 && 果.好) { 数据 = 果.数据 || ''; 网址 = 果.网址 || ''; }
                } catch (e) { /* 失败就走占位，不打断对话 */ }
            }

            /* 没配 / 失败 / 接口给空 → 占位图顶上（★ 需求：未接入 API 也发图） */
            if (!数据 && !网址) 数据 = 占位图数据(用户文);

            let 图id = '';
            if (数据 && 助手 && typeof 助手.存图 === 'function') {
                图id = await 助手.存图({ 数据: 数据, 描述: 提示, 时间: Date.now() });
            }

            上次发图时 = 用户发言数;

            const 条 = {
                谁: '对方', 类型: '图片',
                文: String(用户文 || '').trim(),   // 图注：搜索 / 摘要 / 占位图上的文字
                提示: 提示,                        // 送进模型的完整提示词
                图id: 图id || '', 网址: 网址 || '',
                时间戳: Date.now(),
            };
            落地(条, '[图片]');
            return 条;
        }

        /* ============================================================
         *  4.6 ★ 角色按对话场景自主发语音（音频 API 的生效范围）
         *
         *  ★ 与发图同一套思路，但【降级策略不同】：
         *     图片没接 API 可以发占位图；语音【没有占位这回事】——
         *     一段静音只会让人以为手机坏了，比不发更糟。
         *     所以没配音频 API / 合成失败 / 这位联系人关了音色开关 → 干脆不发声，
         *     角色照常用文字回，用户完全察觉不到少了什么。
         *
         *  ★ 音色优先级（由 音频助手.取音色 统一算，不在这边各写一套）：
         *     3 页填的「自定义音色 ID」（克隆） > 21 页选的「默认音色」
         *
         *  ★ 与发图【互斥，语音优先】：同一轮只出一种。
         *     一条消息下面同时挂图又挂语音，太吵，而且两条都在抢用户的注意力。
         * ============================================================ */

        let 上次发语音时 = -99;
        const 语音冷却 = 4;        // 比发图更疏 —— 语音是偶尔的语音消息，不是常态

        /* 适合「发句语音」的场景：情绪化 / 口语化 / 撒娇抱怨这些，
           文字表达不出来的才值得开口。 */
        const 语音场景词 = [
            '想你', '喜欢', '讨厌', '生气', '难过', '委屈', '高兴', '开心', '哭', '笑',
            '晚安', '早安', '睡', '梦', '抱', '亲', '陪', '一起', '要不要', '好不好',
            '真的吗', '骗', '哼', '哎呀', '喂', '算了', '随便你', '你怎么',
            '声音', '听', '说', '讲', '唱', '念',
        ];

        /**
         * 该不该发语音。
         * ★ 前提是【没打算发图】—— 语音优先，两者不同时出现。
         */
        function 该不该发语音(用户文) {
            if (该不该发图(用户文)) return false;          // 这一轮出图，就不出声
            const 文 = String(用户文 || '').trim();
            if (文.length < 最短可发) return false;
            if (用户发言数 - 上次发语音时 < 语音冷却) return false;

            const 末 = 消息表[消息表.length - 1];
            if (末 && (末.类型 === '语音' || 末.类型 === '图片')) return false;

            return 语音场景词.some(词 => 文.includes(词));
        }

        /**
         * 合成一段语音的 blob（走音频 API）。
         * ★ 音色由 音频助手.取音色 决定，调用方不自己拼 —— 避免 7 页与 14 页各写一套优先级。
         * @returns {Promise<{blob:Blob, 时长:number, 型:string}>} 失败返回 null
         */
        async function 合成语音(文) {
            const 助手 = window.音频助手;
            if (!助手 || typeof 助手.合成 !== 'function') return null;

            const 音色 = 助手.取音色(存档ID, {});
            /* 这位联系人没启用音色（3 页开关关着）或都没配 → 不发声 */
            if (!音色 || !音色.有) return null;
            if (!助手.已配置()) return null;

            /* ★ 音速 / 语调 / 语言 / 性别 全部来自 3 页（取音色 一带带出），
                 这里不自己拼 —— 否则又会变成「调了没反应」。 */
            const 果 = await 助手.合成(文, {
                音色: 音色.音色,
                音速: 音色.音速,
                语调: 音色.语调,
                语言: 音色.语言,
                性别: 音色.性别,
            });
            if (!果 || !果.好 || !果.blob) return null;

            return { blob: 果.blob, 时长: await 测时长(果.blob), 型: 果.类型 || 'audio/mpeg' };
        }

        /** 读出音频时长（秒）；读不出来就按体积估一个，总之别显示 0:00 */
        function 测时长(blob) {
            return new Promise(完成 => {
                if (!blob || !blob.size || typeof window.Audio !== 'function') return 完成(1);
                let 网址 = '';
                try { 网址 = (window.URL && window.URL.createObjectURL) ? window.URL.createObjectURL(blob) : ''; } catch (e) {}
                if (!网址) return 完成(Math.max(1, Math.round(blob.size / 16000)));
                const 元 = new window.Audio();
                let 定 = false;
                const 收 = v => {
                    if (定) return; 定 = true;
                    try { window.URL.revokeObjectURL(网址); } catch (e) {}
                    完成(v);
                };
                元.preload = 'metadata';
                元.addEventListener('loadedmetadata', () => 收(
                    (isFinite(元.duration) && 元.duration > 0) ? 元.duration
                        : Math.max(1, Math.round(blob.size / 16000))));
                元.addEventListener('error', () => 收(Math.max(1, Math.round(blob.size / 16000))));
                setTimeout(() => 收(Math.max(1, Math.round(blob.size / 16000))), 3000);
                元.src = 网址;
            });
        }

        /**
         * 角色发一条语音：合成 → 存 IndexedDB（复用录音那套库）→ 落地成语音消息
         * ★ 复用「聊天语音库」与语音条 UI：语音条、播放、长按删除、失效提示
         *   全都白拿，不用为 AI 语音另写一套。
         */
        async function 角色发语音(用户文) {
            if (!该不该发语音(用户文)) return null;

            const 果 = await 合成语音(String(用户文 || '').trim());
            if (!果 || !果.blob) return null;      // 合成不了就安静退回文字，不打扰

            const 键 = 'ai_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            上次发语音时 = 用户发言数;

            try {
                await 存语音(键, 果.blob);
                /* 内存里也放一份，当前这次会话能立刻播 */
                if (window.URL && window.URL.createObjectURL) 语音库[键] = window.URL.createObjectURL(果.blob);
            } catch (e) { return null; }

            const 条 = {
                谁: '对方', 类型: '语音',
                文: String(用户文 || '').trim(),     // 搜索用（匹配搜索只认 文）
                时长: 果.时长,
                语音键: 键,
                时间戳: Date.now(),
            };
            落地(条, '[语音]');
            return 条;
        }

        /* 对外（与 window.角色发图 同思路） */
        window.角色发图 = 角色发图;
        window.该不该发图 = 该不该发图;
        window.占位图数据 = 占位图数据;
        window.角色发语音 = 角色发语音;
        window.该不该发语音 = 该不该发语音;

        function 发送() {
            const 文 = 输入框.value.trim();
            if (!文) return;
            落地({ 谁: '我', 文: 文, 时间戳: Date.now() }, 文);
            用户发言数++;

            输入框.value = '';
            刷新发送态();
            自动增高();

            /* ★ 图晚一步到：先看到自己发出去的话，再看到对方回的图，
                 像对方看了才发的；立刻出图反而像机器人对答。
              ★ 语音优先：这一轮能出声就出声，出不了声再考虑发图 ——
                 同一轮不既发图又发语音，太吵。 */
            setTimeout(async () => {
                const 声 = await 角色发语音(文);
                if (!声) 角色发图(文);
            }, 700);
        }

        /* ============================================================
         *  5. Emoji 弹窗：点表情按钮弹出，点格子插入输入框（可连点多个）
         * ============================================================ */
        // 分类表：每类一个名字 + 一组 emoji。「常用」放高频款，进来就是它。
        const 表情分类 = [
            { 名: '常用', 表: ['😀', '😂', '🥰', '😍', '🤔', '🥺', '😭', '😡',
                              '👍', '👏', '🙏', '❤️', '🔥', '✨', '🎉', '🌸'] },
            { 名: '笑脸', 表: ['😀', '😃', '😄', '😁', '😆', '😅', '🤣', '😂',
                              '🙂', '🙃', '😉', '😊', '😇', '🥰', '😍', '😘',
                              '😗', '😚', '🤗', '🤭', '🤔', '🤐', '😶', '😐',
                              '😑', '😏', '😒', '🙄', '😬', '🤥', '😌', '😔'] },
            { 名: '情绪', 表: ['😪', '🤤', '😴', '😷', '🤒', '🤕', '🤢', '🥵',
                              '🥶', '😵', '🤯', '🤠', '🥳', '🥸', '😎', '🤓',
                              '🧐', '😕', '😟', '🙁', '😯', '😲', '😳', '🥺',
                              '😦', '😧', '😨', '😰', '😥', '😢', '😭', '😱'] },
            { 名: '手势', 表: ['👍', '👎', '👌', '✌️', '🤞', '🤟', '🤘', '👏',
                              '🙏', '💪', '🫶', '🤝', '👋', '🖐️', '✋', '🫰',
                              '☝️', '👆', '👇', '👈', '👉', '🤙', '🤛', '🤜'] },
            { 名: '爱心', 表: ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍',
                              '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💘',

                              '✈️', '🚗', '🏠', '💻', '📱', '⏰', '🌟', '⭐',
                              '🌙', '☀️', '⛅', '🌈', '❄️', '🔥', '🎉', '🎁'] },
        ];

        const 表情按钮 = document.getElementById('表情按钮');
        const 表情遮罩 = document.getElementById('表情遮罩');
        const 表情面板 = document.getElementById('表情面板');
        const 表情分类栏 = document.getElementById('表情分类栏');
        const 表情网格 = document.getElementById('表情网格');
        const 输入区 = document.querySelector('.底部输入区');

        let 当前分类 = 0;

        // 分类 tab
        表情分类.forEach((类, 下标) => {
            const 钮 = document.createElement('button');
