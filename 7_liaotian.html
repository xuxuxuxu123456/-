            钮.textContent = 类.名;
            钮.dataset.分类 = 类.名;
            钮.addEventListener('click', () => 切换分类(下标));
            表情分类栏.appendChild(钮);
        });

        function 切换分类(下标) {
            当前分类 = 下标;
            Array.from(表情分类栏.children).forEach((钮, i) =>
                钮.classList.toggle('选中', i === 下标));
            渲染表情格();
        }

        function 渲染表情格() {
            表情网格.innerHTML = '';
            表情分类[当前分类].表.forEach(e => {
                const 格 = document.createElement('button');
                格.className = '表情格';
                格.type = 'button';
                格.textContent = e;
                格.dataset.表情 = e;
                格.addEventListener('click', () => 插入文本(e));
                表情网格.appendChild(格);
            });
        }

        渲染表情格();

        /** 在光标处插入文本（没有光标就插到末尾），插入后可继续编辑再发送 */
        function 插入文本(文) {
            const 起 = 输入框.selectionStart == null ? 输入框.value.length : 输入框.selectionStart;
            const 止 = 输入框.selectionEnd == null ? 输入框.value.length : 输入框.selectionEnd;
            输入框.value = 输入框.value.slice(0, 起) + 文 + 输入框.value.slice(止);
            const 位 = 起 + 文.length;
            try { 输入框.setSelectionRange(位, 位); } catch (e) {}
            输入框.focus();
            刷新发送态();
            自动增高();
        }

        function 开合表情(开) {
            const 显示 = (开 === undefined) ? !表情遮罩.classList.contains('显示') : 开;
            if (显示) 贴合输入框();
            表情遮罩.classList.toggle('显示', 显示);
            表情按钮.classList.toggle('选中态', 显示);
        }

        /**
         * 把面板底边贴到输入区顶边。
         * 输入框会随长文本长高（最多 88px），所以每次展开都要重测一次，
         * 否则输入区变高后会把面板顶穿 / 留缝。
         */
        function 贴合输入框() {
            const 高 = 输入区 ? 输入区.getBoundingClientRect().height : 0;
            if (!高) return;
            /* ★ 功能条常驻在输入框上方，表情面板必须抬到它上面，
               否则展开后会把那四个按钮盖住。 */
            const 条高 = (typeof 功能条 !== 'undefined' && 功能条)
                ? 功能条.getBoundingClientRect().height : 0;
            表情面板.style.bottom = (高 + 条高) + 'px';
        }

        // 输入框长高时（自动增高），展开中的面板要跟着抬
        window.addEventListener('resize', () => {
            if (表情遮罩.classList.contains('显示')) 贴合输入框();
        });

        表情按钮.addEventListener('click', () => 开合表情());
        表情遮罩.addEventListener('click', e => { if (e.target === 表情遮罩) 开合表情(false); });

        /* ============================================================
         *  5.5 ★ 功能条（常驻输入框上方）：转账 / 红包 / 语音通话 / 一起阅读
         *
         *  ★ 群聊判定：URL 带 ?type=group 即群聊（1/2/4 页的数据契约不动）。
         *    群聊与单聊的差别（照 QQ 的习惯）：
         *      转账  单聊 = 转账给对方     群聊 = 先选一位群成员再转（微信同款，★ 不是 AA）
         *      红包  单聊 = 金额 + 祝福语  群聊 = 拼手气 / 普通 + 个数
         *      通话  单聊 = 直接呼叫       群聊 = 先选成员（最多 9 人）
         *      阅读  单聊 = 二人共读       群聊 = 多人共读（书名后带人数）
         *  ★ 四个功能共用一个弹窗外壳（.业务遮罩），内容按需构建 ——
         *    四份几乎一样的弹窗改一处要同步四处，太容易漏。
         *  ★ 一起阅读已接好但【暂未开放】（.未开）：点了只提示。
         * ============================================================ */
        /** 群成员池：群聊用群的成员表（真实成员）；单聊回退到联系人索引 */
        function 取成员表() {
            /* ★ 群聊：用群里真实的成员，而不是「索引里除自己外的所有人」 */
            if (联系人 && 联系人.是群) {
                return (联系人.成员 || []).map(m => ({
                    id: String((m && m.id) || ''),
                    名: String((m && m.名) || '').trim() || '未命名'
                }));
            }
            try {
                const 索引 = 读JSON('联系人索引', []);
                if (!Array.isArray(索引)) return [];
                return 索引
                    .filter(i => i && i.id && i.id !== 存档ID)
                    .map(i => ({ id: i.id, 名: String(i.备注 || i.名称 || '').trim() || '未命名' }));
            } catch (e) { return []; }
        }


        /* ---- 弹窗外壳 ---- */
        const 业务遮罩 = document.getElementById('业务遮罩');
        const 业务标题 = document.getElementById('业务标题');
        const 业务体 = document.getElementById('业务体');
        const 业务脚 = document.getElementById('业务脚');
        let 业务清理 = null;      // 关弹窗时要跑的收尾（清计时器等）

        function 关业务() {
            if (业务清理) { try { 业务清理(); } catch (e) {} }
            业务清理 = null;
            业务遮罩.classList.remove('显示');
            业务体.innerHTML = '';
            业务脚.innerHTML = '';
        }

        /**
         * @param 标题   顶栏文字
         * @param 建内容 (体元素) => void    往 .业务体 里塞内容
         * @param 按钮表 [{ 文案, 主, 禁, 点: () => (true=关窗) }]
         * @param 清理   可选，关窗时调用
         */
        function 开业务(标题, 建内容, 按钮表, 清理) {
            业务标题.textContent = 标题;
            业务体.innerHTML = '';
            业务脚.innerHTML = '';
            建内容(业务体);
            按钮表.forEach(钮 => {
                const 元素 = document.createElement('button');
                元素.className = '业务钮' + (钮.主 ? ' 主' : '');
                元素.type = 'button';
                元素.textContent = 钮.文案;
                if (钮.禁) 元素.disabled = true;
                元素.addEventListener('click', () => {
                    if (钮.点 && 钮.点() === false) return;
                    关业务();
                });
                业务脚.appendChild(元素);
            });
            业务清理 = 清理 || null;
            业务遮罩.classList.add('显示');
        }
        window.开业务 = 开业务;
        window.关业务 = 关业务;

        业务遮罩.addEventListener('click', e => { if (e.target === 业务遮罩) 关业务(); });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && 业务遮罩.classList.contains('显示')) 关业务();
        });

        /** 建一个输入框字段，返回 input 元素 */
        function 建字段(父, 标签, 占位, 类型) {
            const 组 = document.createElement('div');
            组.className = '业务字段';
            const 标 = document.createElement('div');
            标.className = '业务标签';
            标.textContent = 标签;
            const 入 = document.createElement('input');
            入.className = '业务输入';
            入.type = 类型 || 'text';
            入.placeholder = 占位 || '';
            组.appendChild(标); 组.appendChild(入);
            父.appendChild(组);
            return 入;
        }

        /** 建金额输入行（大号数字 + ¥） */
        function 建金额行(父, 占位) {
            const 行 = document.createElement('div');
            行.className = '金额行';
            const 符 = document.createElement('span');
            符.className = '金额符';
            符.textContent = '¥';
            const 入 = document.createElement('input');
            入.className = '金额输入';
            入.type = 'text';
            入.inputMode = 'decimal';
            入.placeholder = 占位 || '0.00';
            行.appendChild(符); 行.appendChild(入);
            父.appendChild(行);
            return 入;
        }

        /** 只留数字与一个小数点，最多两位小数 */
        function 洗金额(串) {
            let s = String(串 || '').replace(/[^\d.]/g, '');
            const 首点 = s.indexOf('.');
            if (首点 >= 0) s = s.slice(0, 首点 + 1) + s.slice(首点 + 1).replace(/\./g, '');
            if (s.indexOf('.') >= 0) {
                const 段 = s.split('.');
                s = 段[0] + '.' + 段[1].slice(0, 2);
            }
            return s;
        }
        function 取金额(入) {
            const 值 = parseFloat(洗金额(入.value));
            return (isFinite(值) && 值 > 0) ? +值.toFixed(2) : 0;
        }

        /** 落地一张卡片消息 */
        function 落地卡片(种类, 卡, 会话文案) {
            落地({ 谁: '我', 类型: 种类, 文: 会话文案, 卡: 卡, 时间戳: Date.now() }, 会话文案);
        }

        /* ============ ① 转账 ============ */
        function 开转账() {
            /* ★ 群聊【不是】AA 收款 —— 照微信：先选一位群成员，再转账给他 */
            if (是群聊) return 开选收款人();
            开转账给(null);
        }

        /** 群聊：选收款人（单选，微信同款） */
        function 开选收款人() {
            const 成员 = 取成员表();
            if (!成员.length) { 提示条('群里还没有其他成员'); return; }
            开业务('选择收款人', 体 => {
                const 提 = document.createElement('div');
                提.className = '业务标签';
                提.textContent = '转账给哪位群成员？';
                体.appendChild(提);

                const 列 = document.createElement('div');
                列.className = '成员列表';
                成员.forEach(人 => {
                    const 行 = document.createElement('button');
                    行.className = '成员行';
                    行.type = 'button';
                    行.dataset.成员 = 人.名;
                    行.innerHTML = '<span class="成员勾"><svg viewBox="0 0 24 24" aria-hidden="true">'
                        + 图标们.勾 + '</svg></span><span class="成员名"></span>';
                    行.querySelector('.成员名').textContent = 人.名;
                    行.addEventListener('click', () => {
                        /* 先调度再关窗：与通话选人同款，避开关窗动画的时序问题 */
                        window.setTimeout(() => 开转账给(人), 0);
                        关业务();
                    });
                    列.appendChild(行);
                });
                体.appendChild(列);
            }, [{ 文案: '取消' }]);
        }

        /** 转账给某人（对象为空 = 单聊，转给当前会话对象） */
        function 开转账给(对象) {
            const 收款名 = 对象 ? 对象.名 : 昵称;
            let 入 = null, 说明入 = null;
            开业务('转账', 体 => {
                const 提示 = document.createElement('div');
                提示.className = '业务标签';
                提示.textContent = '转账给 ' + 收款名;
                体.appendChild(提示);
                入 = 建金额行(体, '0.00');
                入.addEventListener('input', () => { 入.value = 洗金额(入.value); });
                说明入 = 建字段(体, '转账说明', '选填，20 字以内', 'text');
                说明入.maxLength = 20;
            }, [
                { 文案: '取消' },
                {
                    文案: '确认转账', 主: true, 点: () => {
                        const 额 = 取金额(入);
                        if (!额) { 提示条('请输入转账金额'); return false; }
                        if (额 > 20000) { 提示条('单笔不能超过 ¥20000'); return false; }
                        落地卡片('转账', {
                            种类: '转账', 金额: 额,
                            说明: 说明入.value.trim(),
                            对象: 对象 ? 对象.名 : '',
                        }, '[转账]');
                        提示条('已转账 ¥' + 钱(额) + (对象 ? ' 给 ' + 对象.名 : ''));
                    },
                },
            ]);
        }

        /* ============ ② 红包 ============ */
        function 开红包() {
            const 成员 = 取成员表();
            let 玩法 = '拼手气';                 // 群聊默认拼手气，跟 QQ 一致
            let 入 = null, 祝福入 = null, 个数入 = null, 预览 = null;

            function 刷预览() {
                if (!预览) return;
                if (!是群聊) { 预览.textContent = '红包将直接发给 ' + 昵称; return; }
                const 额 = 取金额(入);
                const 个 = Math.max(1, parseInt(个数入.value, 10) || 1);
                预览.textContent = 额
                    ? (玩法 === '拼手气'
                        ? '拼手气红包：' + 个 + ' 个共 ¥' + 钱(额) + '，金额随机'
                        : '普通红包：' + 个 + ' 个共 ¥' + 钱(额) + '，每人 ¥' + 钱(额 / 个))
                    : '输入金额后显示分配预览';
            }

            开业务('发红包', 体 => {
                // 收红包的人写在正文里，标题统一「发红包」（群聊/单聊都一样好认）
                if (!是群聊) {
                    const 给 = document.createElement('div');
                    给.className = '业务标签';
                    给.textContent = '发给 ' + 昵称;
                    体.appendChild(给);
                }
                if (是群聊) {
                    const 段 = document.createElement('div');
                    段.className = '分段';
                    ['拼手气', '普通'].forEach(名 => {
                        const 钮 = document.createElement('button');
                        钮.className = '分段钮' + (名 === 玩法 ? ' 选中' : '');
                        钮.type = 'button';
                        钮.textContent = 名 + '红包';
                        钮.dataset.玩法 = 名;
                        钮.addEventListener('click', () => {
                            玩法 = 名;
                            Array.from(段.children).forEach(b =>
                                b.classList.toggle('选中', b.dataset.玩法 === 玩法));
                            刷预览();
                        });
                        段.appendChild(钮);
                    });
                    体.appendChild(段);

                    个数入 = 建字段(体, '红包个数', String(Math.min(9, Math.max(1, 成员.length + 1))), 'number');
                    个数入.min = '1'; 个数入.max = '99';
                    个数入.addEventListener('input', () => {
                        个数入.value = String(Math.max(1, Math.min(99,
                            parseInt(个数入.value, 10) || 1)));
                        刷预览();
                    });
                }

                入 = 建金额行(体, '0.00');
                入.addEventListener('input', () => { 入.value = 洗金额(入.value); 刷预览(); });

                祝福入 = 建字段(体, '祝福语', '恭喜发财，大吉大利', 'text');
                祝福入.maxLength = 24;

                预览 = document.createElement('div');
                预览.className = '业务提示 强调';
                体.appendChild(预览);
                刷预览();
            }, [
                { 文案: '取消' },
                {
                    文案: '塞钱进红包', 主: true, 点: () => {
                        const 额 = 取金额(入);
                        if (!额) { 提示条('请输入红包金额'); return false; }
                        if (额 > 20000) { 提示条('单个红包不能超过 ¥20000'); return false; }
                        if (是群聊) {
                            const 个 = Math.max(1, parseInt(个数入.value, 10) || 1);
                            if (个 > 1 && 额 / 个 < 0.01) { 提示条('每个红包至少 ¥0.01'); return false; }
                            落地卡片('红包', {
                                种类: 玩法 === '拼手气' ? '拼手气红包' : '普通红包',
                                金额: 额, 个数: 个, 祝福: 祝福入.value.trim() || '恭喜发财，大吉大利',
                            }, '[红包]');
                            提示条('已发出 ' + 个 + ' 个红包');
                        } else {
                            落地卡片('红包', {
                                种类: '红包', 金额: 额, 个数: 1,
                                祝福: 祝福入.value.trim() || '恭喜发财，大吉大利',
                            }, '[红包]');
                            提示条('红包已发出');
                        }
                    },
                },
            ]);
        }

        /* ============ ③ 语音通话 ============ */
        function 开通话() {
            if (是群聊) return 开通话选人();
            /* 单聊：直接进「呼叫中」，2 秒后自动接通并开始计时，点挂断收尾 */
            let 状态图 = null, 计时文 = null, 秒 = 0, 计时器 = null, 接通 = false;
            const 清理 = () => { if (计时器) clearInterval(计时器); 计时器 = null; };

            开业务('语音通话', 体 => {
                const 包 = document.createElement('div');
                包.className = '通话体';
                const 像 = document.createElement('img');
                像.className = '通话头像 呼叫中';
                像.id = '通话头像';
                像.src = 头像;
                像.alt = '';
                const 名 = document.createElement('div');
                名.className = '通话名';
                名.textContent = 昵称;
                状态图 = document.createElement('div');
                状态图.className = '通话状态';
                状态图.id = '通话状态';
                状态图.textContent = '正在呼叫…';
                计时文 = document.createElement('div');
                计时文.className = '通话计时';
                计时文.id = '通话计时';
                计时文.textContent = '';
                包.appendChild(像); 包.appendChild(名);
                包.appendChild(状态图); 包.appendChild(计时文);
                体.appendChild(包);

                window.setTimeout(() => {
                    if (!业务遮罩.classList.contains('显示')) return;
                    接通 = true;
                    像.classList.remove('呼叫中');
                    状态图.textContent = '通话中';
                    计时器 = window.setInterval(() => {
                        秒++;
                        计时文.textContent = 分秒(秒);
                    }, 1000);
                }, 2000);
            }, [
                {
                    文案: '挂断', 主: true, 点: () => {
                        const 结果 = 接通 ? '已完成' : '已取消';
                        落地卡片('通话', { 种类: '通话', 结果: 结果, 时长: 秒, 成员: [昵称] },
                            '[语音通话]');
                        提示条(接通 ? '通话结束 ' + 分秒(秒) : '已取消通话');
                    },
                },
            ], 清理);
        }

        /** 群聊：先选成员（最多 9 人），再进呼叫界面 */
        function 开通话选人() {
            const 成员 = 取成员表();
            if (!成员.length) {
                提示条('群里还没有其他成员');
                return;
            }
            const 上限 = 9;
            const 选中 = new Set();
            let 计数文 = null;

            function 刷计数() {
                计数文.textContent = '已选 ' + 选中.size + ' / ' + 上限 + ' 人';
            }

            开业务('选择通话成员', 体 => {
                计数文 = document.createElement('div');
                计数文.className = '业务标签';
                体.appendChild(计数文);
                刷计数();

                const 列 = document.createElement('div');
                列.className = '成员列表';
                成员.forEach(人 => {
                    const 行 = document.createElement('button');
                    行.className = '成员行';
                    行.type = 'button';
                    行.dataset.成员 = 人.名;
                    行.innerHTML = '<span class="成员勾"><svg viewBox="0 0 24 24" aria-hidden="true">'
                        + 图标们.勾 + '</svg></span><span class="成员名"></span>';
                    行.querySelector('.成员名').textContent = 人.名;
                    行.addEventListener('click', () => {
                        if (行.classList.contains('选中')) {
                            行.classList.remove('选中');
                            选中.delete(人.名);
                        } else {
                            if (选中.size >= 上限) { 提示条('最多选 ' + 上限 + ' 人'); return; }
                            行.classList.add('选中');
                            选中.add(人.名);
                        }
                        刷计数();
                    });
                    列.appendChild(行);
                });
                体.appendChild(列);
            }, [
                { 文案: '取消' },
                {
                    文案: '发起通话', 主: true, 点: () => {
                        if (!选中.size) { 提示条('请至少选择一位成员'); return false; }
                        const 名单 = Array.from(选中);
                        // 关掉选人窗后立刻进呼叫界面（不等关窗动画）
                        window.setTimeout(() => 开群组通话(名单), 0);
                    },
                },
            ]);
        }

        /** 群组通话：多人头像 + 呼叫 → 通话中 → 挂断 */
        function 开群组通话(名单) {
            let 秒 = 0, 计时器 = null, 接通 = false, 状态图 = null, 计时文 = null;
            const 清理 = () => { if (计时器) clearInterval(计时器); 计时器 = null; };

            开业务('多人语音通话', 体 => {
                const 包 = document.createElement('div');
                包.className = '通话体';
                const 像 = document.createElement('img');
                像.className = '通话头像 呼叫中';
                像.src = 头像;
                像.alt = '';
                const 名 = document.createElement('div');
                名.className = '通话名';
                名.textContent = 名单.slice(0, 3).join('、') + (名单.length > 3 ? ' 等' : '');
                状态图 = document.createElement('div');
                状态图.className = '通话状态';
                状态图.textContent = '正在呼叫 ' + 名单.length + ' 人…';
                计时文 = document.createElement('div');
                计时文.className = '通话计时';
                计时文.textContent = '';
                包.appendChild(像); 包.appendChild(名);
                包.appendChild(状态图); 包.appendChild(计时文);
                体.appendChild(包);

                const 尾 = document.createElement('div');
                尾.className = '业务提示';
                尾.textContent = '成员：' + 名单.join('、');
                体.appendChild(尾);

                window.setTimeout(() => {
                    if (!业务遮罩.classList.contains('显示')) return;
                    接通 = true;
                    像.classList.remove('呼叫中');
                    状态图.textContent = '通话中（' + 名单.length + ' 人）';
                    计时器 = window.setInterval(() => { 秒++; 计时文.textContent = 分秒(秒); }, 1000);
                }, 2000);
            }, [
                {
                    文案: '挂断', 主: true, 点: () => {
                        落地卡片('通话', {
                            种类: '通话', 结果: 接通 ? '已完成' : '已取消',
                            时长: 秒, 成员: 名单,
                        }, '[语音通话]');
                        提示条(接通 ? '通话结束 ' + 分秒(秒) : '已取消通话');
                    },
                },
            ], 清理);
        }


        /* ============ ④ 一起阅读 ============
         * ★★ 书目来自【22 页的书架】，不再是写死的四本。
         *    书架目录在 localStorage「阅读_书架」，正文在 IndexedDB「阅读_书库/书」。
         *    （22 页刻意不把正文塞进 localStorage —— 5MB 上限撑爆后
         *      所有页面的存档都会失败，连聊天记录都存不进去。）
         *
         * ★★ 选完书 → 【后台弹窗读文】：一个小浮窗常驻在输入框上方，
         *    用这位联系人在 3 页设好的音色来念，边聊边听，不占整屏。
         * ========================================================== */

        /** 22 页的书架目录 */
        function 读书架() {
            try {
                const v = JSON.parse(localStorage.getItem('阅读_书架') || '[]');
                return Array.isArray(v) ? v.filter(x => x && x.id && x.书名) : [];
            } catch (e) { return []; }
        }

        /**
         * 取一本书的正文（IndexedDB）。
         * ★ 7 页自己开一次库，不依赖 22 页 —— 两页互不引用。
         * @returns {Promise<{书名:string,作者:string,章节:Array}|null>}
         */
        function 取书正文(id) {
            return new Promise(完成 => {
                let 请;
                try { 请 = indexedDB.open('阅读_书库', 1); }
                catch (e) { 完成(null); return; }
                /* ★ 别在 7 页建表：库已存在时不会触发 upgradeneeded，
                     建表逻辑只在 22 页（真正写入方）才有意义。 */
                请.onsuccess = () => {
                    const db = 请.result;
                    let 果 = null;
                    try {
                        const 事 = db.transaction('书', 'readonly');
                        const 取 = 事.objectStore('书').get(id);
                        取.onsuccess = () => { 果 = 取.result || null; };
                        事.oncomplete = () => 完成(果);
                        事.onerror = () => 完成(null);
                    } catch (e) { 完成(null); }
                };
                请.onerror = () => 完成(null);
            });
        }

        /** 把一章正文切成适合合成的小段（整章一次请求容易被服务端截断） */
        function 切段(正文) {
            const 文 = String(正文 || '').replace(/\r/g, '');
            if (!文.trim()) return [];
            /* 先按空行切段（小说排版），再按句号把过长的段切开 */
            const 粗 = 文.split(/\n\s*\n/).map(x => x.replace(/\n/g, ' ').trim()).filter(Boolean);
            const 出 = [];
            粗.forEach(段 => {
                if (段.length <= 90) { 出.push(段); return; }
                const 句 = 段.split(/(?<=[。！？；!?;])/);
                let 缓 = '';
                句.forEach(j => {
                    缓 += j;
                    if (缓.length >= 60) { 出.push(缓.trim()); 缓 = ''; }
                });
                if (缓.trim()) 出.push(缓.trim());
            });
            return 出.filter(Boolean);
        }

        /* ------------------------------------------------------------
         * ★ 后台朗读器
         *   逐段【合成 → 播放 → 下一段】，串行进行。
         *   ★ 合成是异步且耗时的，所以不能一次性全合成完再播 ——
         *     那样要等很久才出声。串行能让第一段很快响起来。
         * ------------------------------------------------------------ */
        const 朗读 = {
            书: null, 章节: [], 章序: 0, 段们: [], 段序: 0,
            播: false, 停: false, 元素: null, 网址: '',
        };

        const 朗读浮窗 = document.getElementById('朗读浮窗');
        const 朗读卡 = document.getElementById('朗读卡');
        const 朗读收起条 = document.getElementById('朗读收起条');
        const 朗读名元 = document.getElementById('朗读名');
        const 朗读章元 = document.getElementById('朗读章');
        const 朗读进度 = document.getElementById('朗读进度内');
        const 朗读状态元 = document.getElementById('朗读状态');
        const 朗读封面元 = document.getElementById('朗读封面');
        const 朗读播放钮 = document.getElementById('朗读播放');
        const 朗读播放图标 = document.getElementById('朗读播放图标');

        function 朗读态(文) { 朗读状态元.textContent = 文 || ''; }

        function 刷新朗读() {
            const 书 = 朗读.书;
            if (!书) return;
            朗读名元.textContent = 书.书名 || '';
            const 章 = 朗读.章节[朗读.章序];
            朗读章元.textContent = 章
                ? (章.题 || ('第 ' + (朗读.章序 + 1) + ' 章'))
                  + '（' + (朗读.章序 + 1) + '/' + 朗读.章节.length + '）'
                : '';
            朗读封面元.textContent = String(书.书名 || '书').slice(0, 1);
            document.getElementById('朗读收起名').textContent =
                '正在朗读《' + (书.书名 || '') + '》';
            const 总段 = 朗读.段们.length || 1;
            朗读进度.style.width = Math.round((朗读.段序 / 总段) * 100) + '%';
            document.getElementById('朗读上一章').disabled = 朗读.章序 <= 0;
            document.getElementById('朗读下一章').disabled = 朗读.章序 >= 朗读.章节.length - 1;
        }

        /** 暂停背景音乐（与语音消息同一套约定） */
        function 朗读占音乐() {
            try { if (window.全局音频) window.全局音频.暂停('朗读'); } catch (e) {}
        }
        function 朗读让音乐() {
            try { if (window.全局音频) window.全局音频.恢复('朗读'); } catch (e) {}
        }

        /** 建（或复用）一个挂在 DOM 里的 audio —— iOS 不允许播游离元素 */
        function 朗读元素() {
            if (朗读.元素) return 朗读.元素;
            const 元 = document.createElement('audio');
            元.preload = 'auto';
            元.style.display = 'none';
            document.body.appendChild(元);
            朗读.元素 = 元;
            return 元;
        }

        function 朗读释放网址() {
            try {
                if (朗读.网址 && window.URL && window.URL.revokeObjectURL) window.URL.revokeObjectURL(朗读.网址);
            } catch (e) {}
            朗读.网址 = '';
        }

        /** 从头播当前章 */
        async function 念一章() {
            const 章 = 朗读.章节[朗读.章序];
            if (!章) { 停朗读('没有可朗读的章节'); return; }
            朗读.段们 = 切段(章.正文);
            朗读.段序 = 0;
            if (!朗读.段们.length) { 停朗读('这一章没有正文'); return; }
            朗读.播 = true; 朗读.停 = false;
            刷新朗读();
            设播放图标(true);
            await 念下一段();
        }

        /** 合成并播放当前段；播完自动进入下一段 */
        async function 念下一段() {
            if (朗读.停 || !朗读.播) return;
            if (朗读.段序 >= 朗读.段们.length) {
                /* 这一章念完 → 下一章；没下一章就停 */
                if (朗读.章序 < 朗读.章节.length - 1) {
                    朗读.章序++;
                    await 念一章();
                } else {
                    停朗读('已读完《' + (朗读.书 && 朗读.书.书名 || '') + '》');
                }
                return;
            }
            const 文 = 朗读.段们[朗读.段序];
            刷新朗读();
            if (!文) { 朗读.段序++; return 念下一段(); }

            /* ★ 没配音频 API / 这位联系人没启用音色 → 如实说明，不假装是他在念 */
            const 助手 = window.音频助手;
            const 音色 = 助手 && 助手.取音色 ? 助手.取音色(存档ID, {}) : null;
            if (!助手 || !助手.已配置 || !助手.已配置() || !音色 || !音色.有) {
                设播放图标(false);
                朗读态('还没配音频 API（或这位联系人没启用音色），暂时用系统朗读。'
                    + '去 21 页配好 API、3 页开启音色，就能听到他的声音。');
                return 系统念(文);
            }

            朗读态('正在合成…');
            const 果 = await 合成语音(文);
            if (朗读.停 || !朗读.播) return;
            if (!果 || !果.blob) {
                朗读.段序++;
                return 念下一段();
            }

            await new Promise(完成 => {
                const 元 = 朗读元素();
                try {
                    朗读释放网址();
                    朗读.网址 = window.URL && window.URL.createObjectURL
                        ? window.URL.createObjectURL(果.blob) : '';
                } catch (e) { 朗读.网址 = ''; }
                if (!朗读.网址) { 完成(); return; }
                朗读占音乐();
                元.onended = () => { 朗读让音乐(); 完成(); };
                元.onerror = () => { 朗读让音乐(); 完成(); };
                元.src = 朗读.网址;
                朗读态('朗读中…');
                const p = 元.play();
                if (p && typeof p.catch === 'function') p.catch(() => { 朗读让音乐(); 完成(); });
            });

            if (朗读.停 || !朗读.播) return;
            朗读.段序++;
            return 念下一段();
        }

        /** 兜底：系统语音（明确告知不是角色音色） */
        function 系统念(文) {
            if (!window.speechSynthesis) { 朗读态('这个浏览器不支持朗读'); 设播放图标(false); return; }
            const 元 = 朗读元素();
            朗读占音乐();
            try {
                const 话 = new window.SpeechSynthesisUtterance(文);
                话.lang = 'zh-CN';
                话.onend = () => {
                    朗读让音乐();
                    if (朗读.停 || !朗读.播) return;
                    朗读.段序++;
                    念下一段();
                };
                话.onerror = () => { 朗读让音乐(); 设播放图标(false); };
                window.speechSynthesis.speak(话);
            } catch (e) { 朗读让音乐(); 设播放图标(false); }
        }

        function 设播放图标(在播) {
            朗读播放图标.innerHTML = 在播
                ? '<path d="M7 5h4v14H7z"></path><path d="M13 5h4v14h-4z"></path>'
                : '<path d="M8 5v14l11-7z"></path>';
        }

        function 停朗读(说明) {
            朗读.播 = false; 朗读.停 = true;
            try { if (朗读.元素) { 朗读.元素.pause(); 朗读.元素.onended = null; } } catch (e) {}
            try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
            朗读让音乐();
            朗读释放网址();
            设播放图标(false);
            朗读浮窗.hidden = true;
            朗读收起条.hidden = true;
            朗读卡.hidden = false;
            朗读.书 = null; 朗读.章节 = []; 朗读.段们 = [];
            if (说明) 提示条(说明);
        }

        /** 打开后台朗读浮窗并开始念 */
        async function 开始朗读(书) {
            const 整 = await 取书正文(书.id);
            if (!整 || !Array.isArray(整.章节) || !整.章节.length) {
                提示条('《' + (书.书名 || '') + '》还没有可读的章节');
                return false;
            }
            停朗读('');
            朗读.书 = 书;
            朗读.章节 = 整.章节;
            朗读.章序 = 0;
            朗读浮窗.hidden = false;
            朗读卡.hidden = false;
            朗读收起条.hidden = true;
            /* ★ 清掉上一次残留的状态（比如「正在合成…」），
                 否则重新打开时会先闪一下旧文案 */
            朗读态('');
            刷新朗读();
            await 念一章();
            return true;
        }

        function 开一起阅读() {
            const 人数 = 是群聊 ? Math.max(2, 取成员表().length + 1) : 2;
            const 架 = 读书架();

            /* ★ 书架空 → 明确告诉他去哪加书，而不是给一列永远选不到的空列表 */
            if (!架.length) {
                开业务('一起阅读', 体 => {
                    const 提 = document.createElement('div');
                    提.className = '业务提示';
                    提.textContent = '书架里还没有书。先去「一起阅读」的书架导入一本 txt，'
                        + '或者在作者中心写一章，回来就能选来读。';
                    体.appendChild(提);
                }, [{ 文案: '知道了' }]);
                return;
            }

            let 选中 = 0;
            开业务('一起阅读', 体 => {
                const 提 = document.createElement('div');
                提.className = '业务标签';
                提.textContent = 是群聊
                    ? '选一本书共读（' + 人数 + ' 人）'
                    : '选一本，让「' + 昵称 + '」念给你听';
                体.appendChild(提);

                const 列 = document.createElement('div');
                列.className = '书列表';
                架.forEach((书, i) => {
                    const 行 = document.createElement('button');
                    行.className = '书行' + (i === 选中 ? ' 选中' : '');
                    行.type = 'button';
                    行.dataset.书 = String(书.书名 || '');
                    行.innerHTML = '<svg class="书图标" viewBox="0 0 24 24" aria-hidden="true">'
                        + '<path d="M4 5.5h7v13H4z"></path><path d="M13 5.5h7v13h-7z"></path>'
                        + '</svg><span class="书名"></span><span class="书副"></span>';
                    行.querySelector('.书名').textContent = 书.书名 || '未命名';
                    行.querySelector('.书副').textContent =
                        (书.作者 || '佚名') + ' · ' + (书.章数 || 0) + ' 章';
                    行.addEventListener('click', () => {
                        选中 = i;
                        Array.from(列.children).forEach(b => b.classList.toggle('选中', b === 行));
                    });
                    列.appendChild(行);
                });
                体.appendChild(列);

                const 尾 = document.createElement('div');
                尾.className = '业务提示';
                尾.style.marginTop = 'clamp(10px, 2.8vw, 13px)';
                尾.textContent = '选好后用「' + 昵称 + '」的音色在后台念，边聊边听。'
                    + '没配音频 API 时会退成系统语音。';
                体.appendChild(尾);
            }, [
                { 文案: '取消' },
                {
                    /* ★ 主按钮改成「开始朗读」—— 这才是这个功能的落点 */
                    文案: '开始朗读', 主: true, 点: async () => {
                        const 书 = 架[选中];
                        if (!书) return;
                        /* ① 照旧落地一张共读卡片（聊天里能看到在读什么） */
                        落地卡片('阅读', {
                            种类: '阅读', 书名: 书.书名, 副: 书.作者 || '', 人数: 人数, 群: 是群聊,
                        }, '[一起阅读]');
                        /* ② 后台弹窗开始念（异步，不阻塞弹窗关闭） */
                        开始朗读(书).then(好 => {
                            if (好) 提示条('开始朗读《' + 书.书名 + '》');
                        });
                    },
                },
            ]);
        }
        window.开一起阅读 = 开一起阅读;

        /* ---- 朗读浮窗的按钮 ---- */
        (function 绑朗读钮() {
            document.getElementById('朗读播放').addEventListener('click', async () => {
                if (!朗读.书) return;
                if (朗读.播) {
                    /* 暂停：audio.pause() 不触发 ended，
                         所以 念下一段() 里那个 Promise 还挂着 ——
                         再点播放只要让它继续播，播完自然接回链条，
                         ★ 不能重新调 念下一段()，否则会把当前段【重念一遍】。 */
                    朗读.播 = false;
                    try { if (朗读.元素) 朗读.元素.pause(); } catch (e) {}
                    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
                    朗读让音乐();
                    设播放图标(false);
                    朗读.续 = !!(朗读.元素 && 朗读.元素.src && !朗读.元素.ended);
                    朗读态('已暂停');
                    return;
                }
                朗读.播 = true; 朗读.停 = false;
                设播放图标(true);
                /* ★ 有没播完的音频 → 直接继续；没有（比如切章/首次）→ 才重新走合成链 */
                if (朗读.续 && 朗读.元素 && 朗读.元素.src && !朗读.元素.ended) {
                    朗读.续 = false;
                    朗读占音乐();
                    朗读态('朗读中…');
                    const p = 朗读.元素.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                    return;
                }
                朗读态('继续朗读…');
                await 念下一段();
            });
            document.getElementById('朗读上一章').addEventListener('click', async () => {
                if (!朗读.书 || 朗读.章序 <= 0) return;
                朗读.章序--;
                await 念一章();
            });
            document.getElementById('朗读下一章').addEventListener('click', async () => {
                if (!朗读.书 || 朗读.章序 >= 朗读.章节.length - 1) return;
                朗读.章序++;
                await 念一章();
            });
            document.getElementById('朗读关闭').addEventListener('click', () => 停朗读('已停止朗读'));
            document.getElementById('朗读收起关').addEventListener('click', () => 停朗读('已停止朗读'));
            /* ★ 收起：只留一条细条，声音继续 —— 这才是「后台」的意思 */
            document.getElementById('朗读收起').addEventListener('click', () => {
                朗读卡.hidden = true;
                朗读收起条.hidden = false;
            });
            document.getElementById('朗读展开钮').addEventListener('click', () => {
                朗读卡.hidden = false;
                朗读收起条.hidden = true;
            });
        })();

        /* ★ 离开页面就停掉，别让声音在后台一直响 */
        window.addEventListener('pagehide', () => 停朗读(''));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') 停朗读('');
        });

        /* ============ 功能条：四项，左镂空爱心 + 右文字 ============
         * ★ 常驻在输入框上方，不再藏在「＋」里。
         * ★ 未开放：整项压淡 + 点它只提示（.未开），以后开功能只要把
         *   功能表里的 开 换掉、去掉 未开 标记即可，结构不用动。
         * ========================================================== */
        const 功能条 = document.getElementById('功能条');

        /* ★ 目标是【新页面】不是弹窗（照 QQ：转账/红包/通话各自是全屏界面），
             所以这里只负责拼 URL 跳过去；结果由对方写「待发消息_<存档ID>」，
             本页回来时消费它落地成卡片（见 消费待发消息）。 */
        const 功能表 = [
            { 名: '转账', 页: '12_zhuanzhang.html', 未开: false },
            { 名: '红包', 页: '13_hongbao.html', 未开: false },
            { 名: '语音通话', 页: '14_yuyintonghua.html', 未开: false },
            /* ★ 一起阅读【已开放】：它不像转账/红包那样跳全屏页，
                 而是弹窗选书 → 后台浮窗念书，所以没有 页 字段。 */
            { 名: '一起阅读', 未开: false, 弹: 开一起阅读 },
        ];

        /** 回 7 页要用的完整地址（连 type=group 一起，否则群里发的会丢上下文） */
        function 本页地址() {
            return '7_liaotian.html' + (location.search || '');
        }

        function 去功能页(页) {
            const 参 = new URLSearchParams();
            参.set('id', 当前ID || 存档ID);
            参.set('sid', 存档ID);
            if (是群聊) 参.set('type', 'group');
            参.set('name', 昵称);
            参.set('back', 本页地址());
            /* ★ 观察口：jsdom 里 location.href 改不动（Unforgeable）。
                 最后跳转 = 页面名（保持原语义，老断言在用它）；
                 最后跳转URL = 完整地址（带 id / type=group / back，供新断言核对上下文）。 */
            try {
                window.最后跳转 = 页;
                window.最后跳转URL = 页 + '?' + 参.toString();
            } catch (e) {}
            location.href = 页 + '?' + 参.toString();
        }
        window.去功能页 = 去功能页;

        功能表.forEach(项 => {
            const 项元素 = document.createElement('button');
            项元素.className = '功能项' + (项.未开 ? ' 未开' : '');
            项元素.type = 'button';
            项元素.dataset.功能 = 项.名;
            项元素.setAttribute('aria-label', 项.名 + (项.未开 ? '（暂未开放）' : ''));
            // ★ 只有镂空爱心 + 文字，不再套任何功能小图标
            项元素.innerHTML =
                '<svg class="功能项心" viewBox="0 0 24 24" aria-hidden="true"><path d="'
                + 心形 + '"></path></svg>'
                + '<span class="功能项文字"></span>';
            项元素.querySelector('.功能项文字').textContent = 项.名;
            项元素.addEventListener('click', () => {
                if (项.未开) { 提示条('「' + 项.名 + '」暂未开放'); return; }
                /* ★ 弹窗类功能（一起阅读）：不开新页面，直接在本页弹 */
                if (项.弹) { 项.弹(); return; }
                /* 观察口：jsdom 里 location.href 改不动（Unforgeable），
                   测试只能靠这个变量断言「确实要跳去哪」。 */
                try { window.最后跳转 = 项.页; } catch (e) {}
                去功能页(项.页);
            });
            功能条.appendChild(项元素);
        });

        /* ------------------------------------------------------------
         * ★ 从功能页回来：消费「待发消息_<存档ID>」
         *   功能页（12/13/14）不直接写聊天记录 —— 它们只把要发的卡片
         *   丢进这个键，落地（入表 / 写盘 / 同步会话 / 重绘）统一由本页做，
         *   免得三份页面各自实现一遍、格式写歪了互相读不懂。
         * ------------------------------------------------------------ */
        const 待发键 = '待发消息_' + 存档ID;

        function 消费待发消息() {
            const 原 = 读(待发键);
            if (!原) return null;
            let 包 = null;
            try { 包 = JSON.parse(原); } catch (e) { 包 = null; }
            /* ★ 先删键再落地：落地失败也不会反复重放同一条 */
            try { localStorage.removeItem(待发键); } catch (e) {}
            if (!包 || !包.类型) return null;
            落地卡片(包.类型, 包.卡 || {}, 包.文 || '');
            if (包.提示) 提示条(包.提示);
            return 包;
        }
        window.消费待发消息 = 消费待发消息;

        /* ★ 实际调用放在本 IIFE【末尾】（见「10.5 消费待发消息」）——
           落地() 里读的 搜索框 是后面才声明的 const，在这里直接调会 TDZ 崩整页。
           这里只注册监听器。 */
        // ★ 从 bfcache 回来（pageshow persisted）页面脚本不会重跑，要手动消费
        window.addEventListener('pageshow', e => { if (e && e.persisted) 消费待发消息(); });
        // ★ 手机切后台再回来同样要消费（iOS 上很常见）
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) 消费待发消息();
        });

        /* ============================================================
         *  6. 语音：点麦克风申请权限并录音，再点一次结束并发送语音条
         *     ★ 权限：getUserMedia 只在 HTTPS / localhost 下可用，
         *       file:// 直开时浏览器根本不暴露 mediaDevices —— 这里给出明确提示，
         *       而不是静默失败让用户以为按钮坏了。
         *     ★ 音频只活在内存（blob URL）：写进 localStorage 会撑爆 5MB 配额。
         * ============================================================ */
        const 麦克风按钮 = document.getElementById('麦克风按钮');
        const 录音弹窗 = document.getElementById('录音弹窗');
        const 弹窗计时 = document.getElementById('弹窗计时');
        const 录音音量 = document.getElementById('录音音量');
        const 录音取消钮 = document.getElementById('录音取消');
        const 录音发送钮 = document.getElementById('录音发送');
        const 录音说明 = document.querySelector('.录音弹窗说明');
        const 默认录音说明 = '正在录音…说完点「发送」，不想发点「取消」';
        let 无声检查器 = null;

        let 录音器 = null, 录音流 = null, 录音块 = [], 录音起 = 0, 录音计时器 = null, 录音中 = false;
        let 音量上下文 = null, 音量分析 = null, 音量计时 = null;

        /* ---- 实时音量条 ----
           用 AnalyserNode 读麦克风音量，让竖条随说话起伏 —— 用户能一眼确认
           「确实录进去了」，这是录音弹窗最核心的反馈。

           ★★ 这里藏着一个会导致「录不进声音」的致命坑 ★★
           iOS Safari 上，AudioContext.createMediaStreamSource(流) 会把这条
           MediaStream 「接管」过去，导致同一条流上的 MediaRecorder 录出来
           全是静音（有数据、有大小，但播放无声）。这是 iOS 的已知缺陷。
           所以：iOS 上主动放弃真实音量监测，改用模拟起伏 —— 牺牲一点真实感，
           换取「录音一定能录进声音」这个底线。
           拿不到 AudioContext（jsdom / 老浏览器 / 权限受限）时同样降级。 */
        const 音量条数 = 13;
        const 音量竖条 = [];
        for (let i = 0; i < 音量条数; i++) {
            const 竖 = document.createElement('i');
            竖.style.height = '12%';
            录音音量.appendChild(竖);
            音量竖条.push(竖);
        }

        // 录音期间的最大音量峰值。-1 = 未知（没有做真实监测，不能据此判断）
        let 录音峰值 = -1;
        let 音量真实可用 = false;
        let 上次录音字节数 = -1;      // 最近一次录音的数据量，诊断用
        let 上次录音类型 = '';

        const 是iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        function 画音量(峰值) {
            // 中间高、两端低：模拟真实录音软件的波形观感
            音量竖条.forEach((竖, i) => {
                const 中 = (音量条数 - 1) / 2;
                const 权重 = 1 - Math.abs(i - 中) / (中 + 0.6);
                const 高 = Math.max(8, Math.min(100, 12 + 峰值 * 88 * 权重));
                竖.style.height = 高 + '%';
                竖.style.opacity = String(0.3 + Math.min(1, 峰值 * 1.5) * 0.7);
            });
            // 真实监测时记录峰值，用于发送前判断「到底有没有录进声音」
            if (音量真实可用 && 峰值 > 录音峰值) 录音峰值 = 峰值;
        }

        function 起音量监测(流) {
            // iOS 上直接放弃：见上方注释，真实监测会让 MediaRecorder 录到静音
            if (是iOS) return false;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return false;
                音量上下文 = new AC();
                // ★ 必须 resume：未经用户手势创建的 AudioContext 会停在 suspended，
                //   那样 analyser 读出来恒为 0，会被误判成「没录进声音」。
                if (音量上下文.state === 'suspended' && 音量上下文.resume) {
                    音量上下文.resume().catch(() => {});
                }
                音量分析 = 音量上下文.createAnalyser();
                音量分析.fftSize = 256;
                const 源 = 音量上下文.createMediaStreamSource(流);
                源.connect(音量分析);          // 只连 analyser，不连 destination，否则会回声
                const 缓冲 = new Uint8Array(音量分析.frequencyBinCount);
                音量计时 = setInterval(() => {
                    音量分析.getByteFrequencyData(缓冲);
                    let 和 = 0;
                    for (let i = 0; i < 缓冲.length; i++) 和 += 缓冲[i];
                    画音量(和 / 缓冲.length / 128);   // 0~1 左右
                }, 80);
                return true;
            } catch (e) { return false; }
        }

        function 停音量监测() {
            if (音量计时) { clearInterval(音量计时); 音量计时 = null; }
            音量分析 = null;
            try { if (音量上下文 && 音量上下文.close) 音量上下文.close(); } catch (e) {}
            音量上下文 = null;
            // ★ 这里绝不能清 音量真实可用 / 录音峰值：
            //   停止录音() 会先调本函数，紧接着 发出语音() 要用这两个值判断
            //   「到底有没有录进声音」。清了的话校验永远失效，静音流照样发出去。
            //   它们由 开始录音() 在下次开录时统一重置。
        }

        /** 降级：没有 AudioContext（或 iOS）时让条子随时间起伏，保证「在动」 */
        let 模拟相位 = 0;
        function 起模拟音量() {
            模拟相位 = 0;
            音量真实可用 = false;      // 模拟的波形不能用来判断有没有声音
            录音峰值 = -1;             // 标记「未知」，发送时只按字节数判断
            音量计时 = setInterval(() => {
                模拟相位 += 0.35;
                画音量(0.25 + Math.abs(Math.sin(模拟相位)) * 0.45);
            }, 90);
        }

        /** 录音中实时提醒：录了一段时间还是一点声音都没有，多半麦克风有问题 */
        function 检查是否无声() {
            const 说明 = document.querySelector('.录音弹窗说明');
            if (!说明) return;
            if (!音量真实可用) return;                    // 监测不了就别瞎提示
            if (Date.now() - 录音起 < 1800) return;       // 给前 1.8 秒留缓冲
            if (录音峰值 < 0.01) 说明.textContent = '没有检测到声音，请靠近麦克风或检查权限';
        }

        // 错误提示统一走 toast（居中弹窗只用于「正在录音」这一种状态）
        function 提示(文) { 提示条(文); }

        /* ============================================================
         *  权限记忆：只在第一次真正申请，之后默认放行
         *  ★ 用户在系统里点过一次「允许」后，浏览器就记住了，再调
         *    getUserMedia 不会弹框、直接返回流。所以这里用标记区分
         *    「首次申请」与「已授权复用」，只是不再重复引导 / 不再重复
         *    做多余的探测，真正的 stream 仍要取（录音必须要它）。
         *  ★ 失效兜底：已授权却仍失败（多半是用户在系统里关掉了麦克风），
         *    清掉标记并如实提示「已关闭」，不把「假装成功」演下去。
         *  ★ 本段在 1 / 2 / 5 / 7 页各有一份，改动请四处同步。
         * ============================================================ */
        const 权限前缀 = '已授权_';

        function 权限已授权(名) {
            try { return localStorage.getItem(权限前缀 + 名) === '1'; } catch (e) { return false; }
        }
        function 记住权限(名) { try { localStorage.setItem(权限前缀 + 名, '1'); } catch (e) {} }
        function 忘记权限(名) { try { localStorage.removeItem(权限前缀 + 名); } catch (e) {} }

        function 更新计时() {
            弹窗计时.textContent = 时长文((Date.now() - 录音起) / 1000);
        }

        /** 关闭并释放麦克风，否则手机上录音指示灯会一直亮着 */
        function 释放麦克风() {
            try { if (录音流) 录音流.getTracks().forEach(t => t.stop()); } catch (e) {}
            录音流 = null;
            录音器 = null;
        }

        window.开始录音 = async function () {
            if (录音中) return true;
            if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
                提示('无法录音：请用 HTTPS 或 localhost 打开（file:// 浏览器不给麦克风）', true);
                return false;
            }
            if (!window.MediaRecorder) {
                提示('浏览器不支持录音（缺少 MediaRecorder）', true);
                return false;
            }

            // ★ 已授权过：浏览器会静默放行、不再弹框，这里也就不再做任何
            //   额外引导；只有第一次才走「申请」分支。
            const 已授权过 = 权限已授权('麦克风');

            let 流;
            try {
                流 = await navigator.mediaDevices.getUserMedia({ audio: true });
                记住权限('麦克风');        // 第一次成功后记住，后续不再重复申请
            } catch (e) {
                const 名 = e && (e.name || '');
                if (名 === 'NotAllowedError') {
                    // 已经授权过却还被拒 = 用户在系统设置里关掉了，标记作废
                    if (已授权过) 忘记权限('麦克风');
                    提示(已授权过
                        ? '麦克风权限已被关闭，请在系统设置里重新打开'
                        : '麦克风权限被拒绝，请在系统设置里允许后重试');
                } else {
                    提示(名 === 'NotFoundError'
                        ? '没有找到麦克风设备'
                        : '无法开始录音：' + (名 || '未知错误'));
                }
                return false;
            }

            录音流 = 流;
            录音块 = [];
            录音峰值 = -1;
            音量真实可用 = false;

            // 音轨自检：权限给了但轨被禁/被系统静音，录出来也是空的
            const 音轨表 = (流.getAudioTracks && 流.getAudioTracks()) || [];
            if (!音轨表.length) {
                提示('没有拿到麦克风音轨，请检查设备');
                return false;
            }
            if (音轨表.some(t => t.muted || t.readyState === 'ended')) {
                提示('麦克风被静音或已断开，请检查系统设置');
                return false;
            }
            // 防御：确保轨是启用的
            音轨表.forEach(t => { try { t.enabled = true; } catch (e) {} });

            const MR = window.MediaRecorder;
            // 选一个当前环境真支持的格式：iOS Safari 只支持 mp4，
            // 硬传 webm 会直接抛错或产出播不了的垃圾数据。
            const 类型 = 默认音频类型();
            try { 录音器 = 类型 ? new MR(流, { mimeType: 类型 }) : new MR(流); }
            catch (e) { 录音器 = new MR(流); }   // 类型不被接受就退回默认
            录音器.ondataavailable = e => { if (e.data && e.data.size) 录音块.push(e.data); };
            // ★ 传 timeslice：持续输出数据块，长时间录音也不会在内存里堆一大坨。
            //   个别实现不支持带参调用，那就退回不带参（stop 时一次性给完整块）。
            try { 录音器.start(250); }
            catch (e) { try { 录音器.start(); } catch (e2) {} }
            录音起 = Date.now();
            录音中 = true;

            麦克风按钮.classList.add('录音中');
            麦克风按钮.setAttribute('aria-label', '结束录音并发送');

            // 开录前收起表情面板，避免两层浮层叠在一起
            if (表情遮罩.classList.contains('显示')) 开合表情(false);

            // ★ 弹出录音弹窗：居中大反馈（麦克风 + 计时 + 实时音量条）
            弹窗计时.textContent = '0:00';
            录音说明.textContent = 默认录音说明;
            画音量(0.1);
            录音弹窗.classList.add('显示');
            更新计时();
            录音计时器 = setInterval(更新计时, 250);

            // ★ 音量监测必须在 MediaRecorder 起来之后再开：
            //   先让录音链路稳定，避免 AudioContext 抢流影响采集。
            if (起音量监测(流)) { 音量真实可用 = true; 录音峰值 = 0; }
            else 起模拟音量();
            无声检查器 = setInterval(检查是否无声, 600);
            return true;
        };

        window.停止录音 = function () {
            return new Promise(完成 => {
                if (!录音中 || !录音器) return 完成(null);
                const 器 = 录音器;
                器.onstop = () => {
                    const 时长 = (Date.now() - 录音起) / 1000;
                    完成({ 时长: 时长, 块: 录音块.slice() });
                };
                器.stop();
            }).then(结果 => {
                录音中 = false;
                clearInterval(录音计时器);
                if (无声检查器) { clearInterval(无声检查器); 无声检查器 = null; }
                停音量监测();
                麦克风按钮.classList.remove('录音中');
                麦克风按钮.setAttribute('aria-label', '语音消息');
                录音弹窗.classList.remove('显示');
                释放麦克风();
                return 结果;
            });
        };

        /** 把录到的音频变成一条语音消息发出去 */
        window.发出语音 = function (时长) {
            const 块 = 录音块.slice();
            if (!块.length) { 提示('没有录到声音'); return false; }
            if ((时长 || 0) < 1) { 提示('说话时间太短啦'); return false; }

            // ★ 字节数兜底：有块不代表有内容。录到静音/空流时块可能是几字节的
            //   空壳，合成后播起来就是「点了没声音」。这里直接拦掉并提示。
            const 字节数 = 块.reduce((和, b) => 和 + (b.size || 0), 0);
            if (字节数 < 512) { 提示('没有录到声音，请检查麦克风'); return false; }

            // ★ 峰值兜底：字节数够不代表有声音。麦克风被占/被静音时，
            //   编码器照样吐出「有数据」的静音流 —— 大小正常但播起来一片寂静。
            //   只有做过真实音量监测（音量真实可用）才判，没监测就不瞎拦。
            if (音量真实可用 && 录音峰值 >= 0 && 录音峰值 < 0.008) {
                提示('全程没有检测到声音，请检查麦克风');
                return false;
            }

            // ★ MIME 必须兜底：块的 type 可能是空字符串，那样 Blob 没有格式标识，
            //   解码器无从下手，直接放弃播放。这里优先用实际录音类型，
            //   拿不到再退回当前环境的默认类型。
            const 实测 = (录音器 && 录音器.mimeType) || (块[0] && 块[0].type) || '';

         *     ② 被拒 → 【持续】监听用户交互，直到真的播起来才撤监听；
         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没
         *      ready），失败后就再也没机会了 —— 表现正是「切过去没声音」。
         *      必须【成功才停】，这是这段里最要紧的一句。
         * ---------------------------------------------------------- */

        function 撤补播() {
            if (!补播中) return;
            补播中 = false;
            事件名.forEach(n => document.removeEventListener(n, 试补播, true));
            document.removeEventListener('visibilitychange', 见可见);
            收提示();
        }

        function 见可见() {
            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();                     // 老浏览器无 Promise：当成功处理
        }

        /** 被拦 → 挂持续监听 + 显示提示条 */
        function 展提示() {
            if (!补播中) {
                补播中 = true;
                /* ★ 捕获阶段：冒泡阶段可能被页面自己的 stopPropagation 吃掉 */
                事件名.forEach(n => document.addEventListener(n, 试补播, true));
                document.addEventListener('visibilitychange', 见可见);
            }
            亮提示();
        }

        /* ---- 提示条：自建，不依赖各页自己的 toast 实现（各页不统一）---- */
        let 提示元素 = null;
        function 亮提示() {
            if (提示元素) return;
            const 条 = document.createElement('div');
            条.id = '全局音乐提示';
            条.textContent = '♪ 音乐已就绪，点一下继续播放';
            // 样式全内联 + !important：各页 CSS 互不统一，不这样会被盖掉 / 变形

                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool

 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）

(function () {

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */

    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排

    const 样式id = '软键盘适配样式';

     * 状态
     * ---------------------------------------------------------------- */

    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

     * 小工具
     * ---------------------------------------------------------------- */

    function 可视底() {

        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */

        const 样式 = document.createElement('style');
        样式.id = 样式id;

        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        上次偏移 = 偏移;

                if (已弹出) 排一帧();
            });
        }

        window.addEventListener('resize', 排一帧);

        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */

            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局

        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {

                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
