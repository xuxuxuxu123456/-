<!DOCTYPE html>
<!--
    ============================================================
    22_yuedu.html —— 一起阅读（★ 整页重做版）
    ============================================================
    入口：1_shouyeyulan / 4_tongxun 顶栏「＋」菜单里的【一起阅读】

    ★★ 这一版是【推倒重做】，不是在原版上改：
       · 导航：底部 Tab（书架 / 书城 / 作者中心），小说 App 的标准形态
       · 书城：搜索 → 分类宫格 → 精选大卡 → 三榜 → 猜你喜欢
       · 书架：阅读时长 + 累计统计 + 三组筛选 + 封面墙
       · 作者中心：作家工作台

    ★★ 三条硬规矩（改这页前先看）：
       ① 【不定义任何新颜色】—— 全部复用全站色板（--ink / --accent / --panel…）。
          之前自造过暖橙 --read，与全站不统一，已彻底移除，别再加回暖色系。
       ② 【内容不加底框】—— 靠透明露出主题背景。可读性别靠白玻璃卡片，
          靠文字走 --ink 深色 + 一圈极淡白色描边（text-shadow）。
          底框一加就与「主题背景」的要求冲突。
       ③ 【带透明度一律用 rgb 伴生变量】—— hex 不能进 rgba()，
          否则整条声明被浏览器静默丢弃（白底白字就是这么来的）。

    ★ 存储：
       localStorage：阅读_ / 书架 / 平台 / 笔名 / 设置 / 进度 / 热度 / 阅读人数
                     / 最深章 / 时长 / 评论 / 示例版本
       IndexedDB  ：正文（★ 目录里绝不含正文 —— localStorage 只有 5MB，
                    一本小说写满之后所有页面的存档都会失败，连聊天记录都存不进去）
    ★ 平台是本机模拟：接真实服务端时把 取书城源() / 拉分类书() 换成接口即可。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>一起阅读</title>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; touch-action: pan-y; }

        /* ============================================================
           ★ 色板：全站统一，本页【不新增任何颜色】。
             强调 = --accent（深灰），按下 = --accent-ink。
             hex 一律不进 rgba()，带透明度用 -rgb 伴生变量。
           ============================================================ */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }
        :root {
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;
        }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; overflow: hidden; overflow-x: hidden;
            touch-action: pan-y;
        }

        /* ===== 容器 & 主题背景 ===== */
        .手机主题背景容器 {
            width: 100%; max-width: 430px;
            height: 100dvh; min-height: 100dvh;
            position: relative; background-color: transparent;
            overflow: hidden; overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex; flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            width: 100%; height: 100%; object-fit: cover; object-position: center;
            display: block; position: absolute; top: 0; left: 0;
            z-index: 1; height: 100dvh;
        }
        .全局白色遮罩 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1; pointer-events: none;
        }

        /* ★ 滚动条全隐藏：三条都要写，缺一条就有个浏览器露出来。
             滚动照样能用，只是不画那条边。 */
        .内容区, .书城滚动, .架滚动 { scrollbar-width: none; -ms-overflow-style: none; }
        .内容区::-webkit-scrollbar,
        .书城滚动::-webkit-scrollbar,
        .架滚动::-webkit-scrollbar { display: none; }

        /* ===== 顶部导航 ===== */
        .顶部固定区 { position: relative; z-index: 10; flex-shrink: 0; }
        .顶部导航栏 {
            display: flex; justify-content: space-between; align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px); color: var(--ink-2); position: relative;
        }
        .返回按钮 {
            width: clamp(26px, 7.4vw, 32px); height: clamp(26px, 7.4vw, 32px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .返回按钮 svg {
            width: clamp(15px, 4.3vw, 18px); height: clamp(15px, 4.3vw, 18px);
            fill: none; stroke: var(--ink-2); stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .中间标题 {
            font-size: clamp(14px, 4vw, 16px); font-weight: 600; color: var(--ink);
            text-shadow: 0 1px 3px rgba(var(--panel), 0.85);
        }
        .右钮 {
            width: clamp(26px, 7.4vw, 32px); height: clamp(26px, 7.4vw, 32px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .右钮 svg {
            width: clamp(15px, 4.3vw, 18px); height: clamp(15px, 4.3vw, 18px);
            fill: var(--ink-2); stroke: none;
        }
        .右钮.隐藏 { visibility: hidden; }

        /* ===== 内容区 ===== */
        .内容区 {
            position: relative; z-index: 5; flex: 1;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            /* ★ 不加背景、不加底框 —— 让主题背景透出来 */
            background: transparent;
        }
        .面板 { display: none; }
        .面板.显示 { display: block; }

        /* ===== 底部 Tab 栏（小说 App 的标准导航） ===== */
        .底部导航栏 {
            position: relative; z-index: 20; flex-shrink: 0;
            display: flex; justify-content: space-around; align-items: center;
            padding: clamp(5px, 1.5vw, 7px) 0 calc(clamp(5px, 1.6vw, 7px) + env(safe-area-inset-bottom, 0px));
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            border-top: 1px solid rgba(var(--line), 0.28);
        }
        .Tab项 {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: clamp(2px, 0.8vw, 4px) clamp(10px, 2.9vw, 14px);
            color: var(--ink-3); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .Tab项 svg {
            width: clamp(19px, 5.4vw, 22px); height: clamp(19px, 5.4vw, 22px);
            transition: transform .22s cubic-bezier(.34,1.56,.64,1);
            fill: none; stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .Tab项.选中 { color: var(--ink); font-weight: 600; }
        .Tab项.选中 svg { stroke-width: 2.2; }
        .Tab文字 { font-size: clamp(9.5px, 2.7vw, 11px); }

        /* ===== 通用文字描边：压在主题图上也读得清 =====
           ★ 不用底框，靠这圈极淡白描边兜住可读性。 */
        .描边 { text-shadow: 0 1px 3px rgba(var(--panel), 0.9), 0 0 6px rgba(var(--panel), 0.6); }

        /* ★ 空态精致化：加一个柔和的圆形底衬，比孤零零一个图标更像「精心设计过的空」 */
        .空态.架空 .空态画 {
            position: relative;
            border-radius: 50%;
            background: rgba(var(--panel), .42);
            display: flex; align-items: center; justify-content: center;
        }
        .空态.架空 .空态画 svg { width: 58%; height: 58%; }
        .空态.架空 .空态画::before {
            content: ''; position: absolute; inset: -14%;
            border-radius: 50%;
            background: rgba(var(--line), .07);
            z-index: -1;
        }

        /* ★ 通用空态也给个圆形衬底，网感更统一 */
        .空态 .空态标 { letter-spacing: .3px; }


        /* ============================================================
         * 精致化基础层（★ 不引入任何新颜色，全部复用全站色板）
         * ============================================================ */

        /* ① 按压反馈：所有可点元素统一「按下缩一点、松回弹」 */
        .书卡, .榜卡, .架卡, .宫格项, .Tab项, .作品卡, .章卡, .同行钮,
        .继续卡, .小钮, .大钮, .作者钮, .返回按钮, .右钮, .抽屉行 {
            transition: transform .16s ease-out, opacity .16s ease-out,
                        background-color .18s ease-out, border-color .18s ease-out;
        }
        .书卡:active, .作品卡:active, .章卡:active, .继续卡:active, .抽屉行:active {
            transform: scale(.985); opacity: .88;
        }
        .榜卡:active, .架卡:active { transform: scale(.955); opacity: .9; }
        .宫格项:active .宫格圈 { transform: scale(.9); }
        .小钮:active, .大钮:active, .作者钮:active { transform: scale(.96); opacity: .9; }
        .返回按钮:active, .右钮:active { transform: scale(.88); }
        .宫格圈 { transition: transform .18s cubic-bezier(.34,1.56,.64,1); }

        /* ② 封面质感：书脊 + 高光 + 底部渐隐
             ★ 原来只有一条左侧暗边，看着像贴纸；
               加上右侧高光和底部渐隐，才有「立体的书」的感觉。 */
        .书封面::after, .榜封面::after, .架封面::after, .继续封面::after,
        .作品封面::after, .作品页封面::after, .详情封面::after {
            content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
            border-radius: inherit;
            background:
                linear-gradient(100deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 26%),
                linear-gradient(to bottom, rgba(0,0,0,0) 62%, rgba(var(--shade), .22) 100%);
        }
        .书封面, .榜封面, .架封面, .继续封面, .作品封面, .作品页封面, .详情封面 {
            box-shadow: 0 2px 8px rgba(var(--shade), .18), 0 6px 18px rgba(var(--shade), .1);
        }
        /* 书页厚度：右侧一道极细亮边 */
        .书封面::before, .榜封面::before, .架封面::before, .继续封面::before,
        .详情封面::before {
            box-shadow: 1.5px 0 0 rgba(255,255,255,.28);
        }

        /* ③ 数字统一等宽 —— 榜单、统计条里的数字跳动会显得很廉价 */
        .数据数, .作品数, .架统计项 b, .章卡 .字, .榜热, .排名徽 {
            font-variant-numeric: tabular-nums;
        }

        /* ④ 分区标题：左侧小竖条，网文 App 的常见处理 */
        .分区标题 {
            position: relative;
        }
        .分区标题::before {
            content: ''; position: absolute;
            left: clamp(10px, 2.9vw, 13px); top: 50%; transform: translateY(-42%);
            width: 2.5px; height: clamp(11px, 3.1vw, 13px);
            border-radius: 2px;
            background: rgba(var(--accent-rgb), .5);
        }

        /* ⑤ 卡片入场：轻微上浮，别一屏东西「啪」地全出现 */
        @keyframes 淡入上浮 {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .面板.显示 { animation: 淡入上浮 .22s ease-out; }
        .继续卡, .数据面板 { animation: 淡入上浮 .26s ease-out; }

        .书封面, .榜封面, .架封面, .继续封面, .作品封面, .作品页封面, .详情封面 {
            position: relative;
        }


        /* ===== 搜索 ===== */
        .搜索行 { padding: clamp(6px, 1.8vw, 9px) clamp(12px, 3.4vw, 16px) clamp(4px, 1.2vw, 6px); }
        .搜索框 {
            width: 100%;
            padding: clamp(8px, 2.4vw, 11px) clamp(14px, 4vw, 17px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.26);
            background: rgba(var(--panel), 0.6);
            font-family: inherit; font-size: clamp(12.5px, 3.6vw, 14px);
            color: var(--ink); outline: none;
            -webkit-appearance: none; appearance: none;
        }
        .搜索框::placeholder { color: var(--ink-4); }
        /* ★ 聚焦时给一圈柔和光晕（不是硬边框），网感更足 */
        .搜索框 {
            transition: border-color .2s ease-out, box-shadow .2s ease-out,
                        background-color .2s ease-out;
        }
        .搜索框:focus {
            border-color: rgba(var(--accent-rgb), 0.45);
            background: rgba(var(--panel), 0.78);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }
        .搜索框::-webkit-search-cancel-button { -webkit-appearance: none; }

        /* ★ 热搜词 */
        .热搜行 {
            display: flex; align-items: center; gap: clamp(5px, 1.5vw, 7px);
            padding: 0 clamp(12px, 3.4vw, 16px) clamp(6px, 1.8vw, 9px);
            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
        }
        .热搜行::-webkit-scrollbar { display: none; }
        .热搜标 {
            flex-shrink: 0;
            font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-4);
            letter-spacing: .5px;
        }
        .热搜词 {
            flex-shrink: 0;
            padding: clamp(3px, 1vw, 4px) clamp(8px, 2.3vw, 10px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), .22);
            background: rgba(var(--panel), .45);
            font-family: inherit; font-size: clamp(10px, 2.9vw, 11px);
            color: var(--ink-3); cursor: pointer; white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: transform .16s ease-out, background-color .18s ease-out;
        }
        .热搜词:active { transform: scale(.93); background: rgba(var(--accent-rgb), .1); }

        /* ===== 分区标题 ===== */
        .分区标题 {
            display: flex; align-items: baseline; justify-content: space-between;
            padding: clamp(12px, 3.4vw, 15px) clamp(14px, 4vw, 18px) clamp(5px, 1.5vw, 8px);
            font-size: clamp(13px, 3.7vw, 14.5px); font-weight: 600; color: var(--ink);
        }
        .分区标题 .侧字 {
            font-size: clamp(10.5px, 3vw, 11.5px); font-weight: 400; color: var(--ink-3);
        }
        .分区标题 .更多字 {
            font-size: clamp(10.5px, 3vw, 11.5px); font-weight: 400; color: var(--ink-3);
        }

        /* ===== 分类宫格（书城第 2 层） ===== */
        .分类宫 {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: clamp(8px, 2.3vw, 11px) clamp(4px, 1.2vw, 6px);
            padding: clamp(4px, 1.2vw, 7px) clamp(12px, 3.4vw, 16px) clamp(6px, 1.8vw, 9px);
        }
        .宫格项 {
            display: flex; flex-direction: column; align-items: center; gap: clamp(3px, 1vw, 5px);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .宫格圈 {
            width: clamp(36px, 10.3vw, 44px); height: clamp(36px, 10.3vw, 44px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            /* ★ 低饱和灰底：不用彩色 —— 彩色宫格会与全站灰调打架 */
            background: rgba(var(--panel), 0.62);
            border: 1px solid rgba(var(--line), 0.2);
            font-size: clamp(13px, 3.7vw, 15px); font-weight: 600; color: var(--ink-2);
        }
        .宫格项.选中 .宫格圈 {
            background: rgba(var(--accent-rgb), 0.14);
            border-color: rgba(var(--accent-rgb), 0.45);
            color: var(--accent-ink);
        }
        .宫格名 {
            font-size: clamp(10px, 2.9vw, 11.5px); color: var(--ink-3);
            white-space: nowrap;
        }
        .宫格项.选中 .宫格名 { color: var(--accent-ink); font-weight: 600; }

        /* ===== 标签 ===== */
        .标签 {
            display: inline-block;
            padding: clamp(1px, 0.4vw, 3px) clamp(6px, 1.8vw, 8px);
            border-radius: 5px;
            background: rgba(var(--line), 0.14);
            font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-3);
        }
        .标签.连载 { background: rgba(var(--accent-rgb), 0.12); color: var(--accent-ink); }
        .标签.完结 { background: rgba(var(--line), 0.2); }
        .标签行 { display: flex; flex-wrap: wrap; gap: clamp(4px, 1.2vw, 6px); }

        /* ===== 三榜 ===== */
        .榜块 { margin-bottom: clamp(6px, 1.8vw, 9px); }
        /* ★ 榜标题前面加一枚小徽记，比纯文字更像「榜」 */
        .榜块 .分区标题::before { height: clamp(12px, 3.4vw, 14px); width: 3px; }
        .榜网格 {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: clamp(9px, 2.6vw, 12px) clamp(6px, 1.8vw, 8px);
            padding: clamp(2px, 0.8vw, 4px) clamp(12px, 3.4vw, 16px) clamp(6px, 1.8vw, 9px);
        }
        .榜卡 { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .榜封面 {
            position: relative;
            width: 100%; aspect-ratio: 3 / 4;
            border-radius: 3px clamp(5px, 1.4vw, 7px) clamp(5px, 1.4vw, 7px) 3px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
        }
        .榜封面::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3.5px; background: rgba(0, 0, 0, 0.16); z-index: 2;
        }
        .榜封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .排名徽 {
            position: absolute; left: 0; top: 0; z-index: 3;
            min-width: clamp(15px, 4.3vw, 18px); padding: 1px 3px;
            font-size: clamp(9px, 2.6vw, 10.5px); font-weight: 700;
            color: #fff; text-align: center; border-radius: 3px 0 5px 0;
            background: rgba(var(--ink-3-rgb), 0.85);
        }
        /* ★ 前三用灰的深浅区分 —— 不用橙/黄/灰三色（全站没有那个配色） */
        .排名徽.排名1 { background: rgba(var(--accent-rgb), 0.95); }
        .排名徽.排名2 { background: rgba(var(--ink-3-rgb), 0.85); }
        .排名徽.排名3 { background: rgba(var(--ink-4-rgb), 0.85); }
        /* ★ 前三名徽章更大更亮，一眼分得出「榜首」 */
        .排名徽.排名1 {
            min-width: clamp(18px, 5.1vw, 21px);
            padding: clamp(1px, 0.4vw, 2px) 4px;
            font-size: clamp(10px, 2.9vw, 11.5px);
            box-shadow: 0 1px 6px rgba(var(--shade), .24);
        }
        .排名徽.排名2, .排名徽.排名3 { opacity: .92; }
        /* ★ 榜首封面稍微突出一点 */
        .榜卡.榜首 .榜封面 {
            box-shadow: 0 2px 8px rgba(var(--shade), .18),
                        0 6px 16px rgba(var(--shade), .16);
        }
        .榜名 {
            margin-top: clamp(3px, 1vw, 5px);
            font-size: clamp(9.5px, 2.7vw, 11px); color: var(--ink); font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .榜热 {
            margin-top: 1px;
            font-size: clamp(8.5px, 2.4vw, 10px); color: var(--accent-ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ===== 书列表（猜你喜欢 / 搜索结果） ===== */
        .书列表 { padding: 0 clamp(12px, 3.4vw, 16px) clamp(14px, 4vw, 20px); }
        .书卡 {
            display: flex; gap: clamp(8px, 2.3vw, 11px);
            padding: clamp(7px, 2vw, 9px) 0;
            border-bottom: 1px solid rgba(var(--line), 0.14);
            align-items: flex-start; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .书卡:last-child { border-bottom: none; }
        .书封面 {
            position: relative; flex-shrink: 0;
            width: clamp(42px, 12vw, 50px); height: clamp(56px, 16vw, 67px);
            border-radius: 3px clamp(5px, 1.4vw, 7px) clamp(5px, 1.4vw, 7px) 3px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
        }
        .书封面::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3.5px; background: rgba(0, 0, 0, 0.16); z-index: 2;
        }
        .书封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .书信息 { flex: 1; min-width: 0; }
        .书名 {
            font-size: clamp(13px, 3.7vw, 14.5px); font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .书副 { font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-3); margin-top: 1px; }
        .书简 {
            margin-top: clamp(3px, 1vw, 4px);
            font-size: clamp(11px, 3.1vw, 12px); color: var(--ink-2); line-height: 1.6;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* ★★ 标签行与「加入书架」按钮【同一水平线、一样大】：
             标签行 flex:1 占左边剩余空间，按钮贴右边，两者 align-items: center 对齐。
             ★ 大小一致：高度、圆角、字号三处共用同一组值（下面 .同行钮 与 .同行标签）。 */
        .书标行 {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: clamp(3px, 1vw, 5px);
            margin-top: clamp(3px, 1vw, 5px);
        }
        .同行区 {
            display: flex; align-items: center; gap: clamp(4px, 1.2vw, 7px);
            margin-top: clamp(3px, 1vw, 5px);
        }
        .同行区 .书标行 { flex: 1; min-width: 0; margin-top: 0; }
        /* ★ 标签与按钮等高同圆角同字号 */
        .同行标签, .同行钮 {
            height: clamp(20px, 5.7vw, 24px);
            border-radius: clamp(6px, 1.7vw, 8px);
            font-size: clamp(10.5px, 3vw, 11.5px);
            display: inline-flex; align-items: center;
            box-sizing: border-box;
        }
        .同行标签 {
            padding: 0 clamp(7px, 2vw, 9px);
            background: rgba(var(--line), 0.14);
            color: var(--ink-3); white-space: nowrap;
        }
        .同行钮 {
            flex-shrink: 0;
            padding: 0 clamp(11px, 3.1vw, 14px);
            border: 1px solid var(--accent);
            background: var(--accent);
            font-family: inherit; font-weight: 600; color: #fff;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .同行钮.已加 {
            border-color: rgba(var(--line), 0.26);
            background: rgba(var(--panel), 0.6);
            color: var(--ink-3); font-weight: 400; cursor: default;
        }

        /* ===== 空态 ===== */
        .空态 {
            margin: clamp(14px, 4vw, 20px) clamp(12px, 3.4vw, 16px);
            padding: clamp(26px, 7.4vw, 38px) clamp(12px, 3.4vw, 16px);
            text-align: center; color: var(--ink-3);
            font-size: clamp(12px, 3.4vw, 13.5px); line-height: 1.8;
        }
        .空态标 {
            display: block; margin-bottom: clamp(6px, 1.8vw, 9px);
            font-size: clamp(13px, 3.7vw, 14.5px); font-weight: 600; color: var(--ink-2);
        }
        /* ★ 书架空态：书本图标 + 「快去添加书籍吧」（不铺底框） */
        .空态.架空 .空态画 {
            margin: clamp(24px, 6.9vw, 40px) auto clamp(10px, 2.9vw, 14px);
            width: clamp(64px, 18.3vw, 82px); height: clamp(64px, 18.3vw, 82px);
        }
        .空态.架空 .空态画 svg {
            width: 100%; height: 100%;
            fill: none; stroke: var(--ink-4); stroke-width: 1.6;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ===== 书架：时长 / 累计统计 ===== */
        .时长条 {
            display: flex; align-items: baseline; gap: clamp(3px, 1vw, 5px);
            padding: clamp(10px, 2.9vw, 14px) clamp(14px, 4vw, 18px) clamp(2px, 0.8vw, 4px);
        }
        .时长主 { display: flex; align-items: baseline; gap: clamp(2px, 0.6vw, 4px); }
        .时长数 { font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; color: var(--ink); }
        .时长标 { font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-3); }
        .时长隔 { font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-4); }

        .架统计条 {
            display: flex; align-items: center; gap: clamp(5px, 1.5vw, 8px);
            padding: 0 clamp(14px, 4vw, 18px) clamp(6px, 1.8vw, 9px);
        }
        .架统计项 { font-size: clamp(11px, 3.1vw, 12.5px); color: var(--ink-3); }
        .架统计项 b { color: var(--accent-ink); font-weight: 600; font-size: clamp(12px, 3.4vw, 13.5px); }
        /* ★ 时长数字放大一点点，顶部的「今日读了多少」是这类 App 的核心动机反馈 */
        .时长条 .架统计项:first-child b { font-size: clamp(14px, 4vw, 16px); }
        .架统计隔 { font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-4); }

        /* ===== 继续阅读 ===== */
        .继续卡 {
            position: relative; overflow: hidden;
            display: flex; align-items: center; gap: clamp(9px, 2.6vw, 12px);
            margin: clamp(4px, 1.2vw, 7px) clamp(12px, 3.4vw, 16px) clamp(8px, 2.3vw, 11px);
            padding: clamp(9px, 2.6vw, 12px);
            border-radius: clamp(11px, 3.1vw, 14px);
            background: rgba(var(--panel), 0.55);
            border: 1px solid rgba(var(--line), 0.16);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .继续封面 {
            position: relative; flex-shrink: 0;
            width: clamp(38px, 11vw, 48px); height: clamp(51px, 14.7vw, 64px);
            border-radius: 3px clamp(5px, 1.4vw, 7px) clamp(5px, 1.4vw, 7px) 3px;
            overflow: hidden; box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
        }
        .继续封面::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3.5px; background: rgba(0, 0, 0, 0.16); z-index: 2;
        }
        .继续封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .继续文 { flex: 1; min-width: 0; }
        .继续名 {
            font-size: clamp(12.5px, 3.6vw, 14px); font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .继续副 { font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-3); margin-top: 1px; }
        .进度条 {
            margin-top: clamp(4px, 1.2vw, 6px); height: 3px; border-radius: 999px;
            background: rgba(var(--line), 0.2); overflow: hidden;
        }
        .进度内 {
            height: 100%; border-radius: 999px;
            background: var(--accent);
            /* ★ 进度条从 0 长出来，比瞬间跳到某个位置有质感 */
            animation: 进度长 .5s ease-out;
        }
        @keyframes 进度长 { from { width: 0 !important; } }

        /* ===== 三组筛选（书架） ===== */
        .筛选区 { padding: clamp(4px, 1.2vw, 7px) 0 clamp(2px, 0.8vw, 4px); }
        .筛选行2 {
            display: flex; align-items: center;
            padding: 0 clamp(12px, 3.4vw, 16px) clamp(5px, 1.5vw, 7px);
        }
        .筛选标 {
            flex-shrink: 0; width: clamp(30px, 8.6vw, 36px);
            font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-4);
        }
        .chips行2 {
            flex: 1; min-width: 0;
            display: flex; gap: clamp(5px, 1.5vw, 7px);
            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
        }
        .chips行2::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            padding: clamp(4px, 1.2vw, 6px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.26);
            background: rgba(var(--panel), 0.5);
            font-family: inherit; font-size: clamp(10.5px, 3vw, 11.5px);
            color: var(--ink-3); cursor: pointer; white-space: nowrap;
            -webkit-tap-highlight-color: transparent; transition: all .18s;
        }
        .chip:active { transform: scale(.94); }
        .chip.选中 {
            background: rgba(var(--accent-rgb), 0.13);
            border-color: rgba(var(--accent-rgb), 0.45);
            color: var(--accent-ink); font-weight: 600;
            /* ★ 选中时轻微放大，手指点下去有明确回应 */
            transform: scale(1.03);
        }

        /* ===== 书架网格 ===== */
        .书架网格 {
            /* ★ 逐张淡入：一次全出现显得生硬 */
            animation: 淡入上浮 .24s ease-out;
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: clamp(9px, 2.6vw, 12px) clamp(6px, 1.8vw, 8px);
            padding: clamp(4px, 1.2vw, 7px) clamp(12px, 3.4vw, 16px) clamp(14px, 4vw, 20px);
        }
        @media (max-width: 360px) { .书架网格 { grid-template-columns: repeat(3, 1fr); } }
        .架卡 { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .架封面 {
            position: relative; width: 100%; aspect-ratio: 3 / 4;
            border-radius: 3px clamp(5px, 1.4vw, 7px) clamp(5px, 1.4vw, 7px) 3px;
            overflow: hidden; box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
        }
        .架封面::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3.5px; background: rgba(0, 0, 0, 0.16); z-index: 2;
        }
        .架封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .状态角 {
            position: absolute; left: 0; top: 0; z-index: 3;
            padding: 1px clamp(3px, 1vw, 5px);
            font-size: clamp(8px, 2.3vw, 9px); color: #fff;
            border-radius: 3px 0 5px 0;
            background: rgba(var(--ink-3-rgb), 0.85);
        }
        .状态角.连载 { background: rgba(var(--accent-rgb), 0.9); }
        .进度角 {
            position: absolute; right: 0; bottom: 0; z-index: 3;
            padding: 1px clamp(3px, 1vw, 5px);
            font-size: clamp(8px, 2.3vw, 9px); color: #fff;
            border-radius: 4px 0 3px 0;
            background: rgba(var(--shade), 0.62);
        }
        .进度角.读完 { background: rgba(var(--accent-rgb), 0.9); }
        .架名 {
            margin-top: clamp(4px, 1.2vw, 6px);
            font-size: clamp(10.5px, 3vw, 11.5px); font-weight: 600; color: var(--ink);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; line-height: 1.3;
        }
        .架卡态 { margin-top: 1px; font-size: clamp(9px, 2.6vw, 10px); color: var(--ink-4); }
        .架卡态.在读 { color: var(--accent-ink); }
        .架卡态.读完 { color: var(--ink-3); }

        /* ===== 作者中心 ===== */
        .作者头 {
            padding: clamp(10px, 2.9vw, 14px) clamp(14px, 4vw, 18px) clamp(6px, 1.8vw, 9px);
        }
        .笔名行 { display: flex; align-items: center; gap: clamp(7px, 2vw, 10px); }
        .笔名 {
            font-size: clamp(16px, 4.6vw, 18px); font-weight: 600; color: var(--ink);
        }
        .笔名钮 {
            padding: clamp(3px, 1vw, 5px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px; border: 1px solid rgba(var(--line), 0.3);
            background: rgba(var(--panel), 0.5);
            font-family: inherit; font-size: clamp(10.5px, 3vw, 11.5px);
            color: var(--ink-3); cursor: pointer;
        }

        /* ===== 笔名弹窗（底部上滑）=====
           ★ 原来用 prompt()：样式跟着系统走、手机上没有字数反馈，
             部分 WebView 还会拦截并直接返回 null。改成与「书籍详情」
             同一套 .详情层（同样的上滑动画、同样的毛玻璃），
             视觉与页面其余弹层一致，单手也够得到。
           ★ 层级 280 —— 与段评 / 听书同级，高于作者主页(270)、编辑器(260)，
             否则从作者中心点出来会被压住看不见。 */
        #笔名遮罩 { z-index: 280; }
        .笔名体 {
            padding: clamp(12px, 3.4vw, 16px) clamp(14px, 4vw, 18px)
                     calc(clamp(14px, 4vw, 18px) + env(safe-area-inset-bottom, 0px));
            display: flex; flex-direction: column; gap: clamp(10px, 2.8vw, 14px);
        }
        .笔名输入 {
            width: 100%; box-sizing: border-box;
            padding: clamp(10px, 2.8vw, 13px) clamp(12px, 3.4vw, 15px);
            font-family: inherit; font-size: clamp(14px, 4vw, 16px); color: var(--ink);
            background: rgba(var(--panel), 0.6);
            border: 1px solid rgba(var(--line), 0.28);
            border-radius: clamp(10px, 2.8vw, 13px);
            outline: none;
        }
        .笔名输入:focus { border-color: rgba(var(--accent-rgb), 0.5); }
        .笔名输入::placeholder { color: var(--ink-4); }
        .笔名注 {
            display: flex; justify-content: space-between; align-items: center;
            font-size: clamp(11px, 3.1vw, 13px); color: var(--ink-4);
        }
        .笔名警 { color: #c0553f; opacity: 0; transition: opacity .18s; }
        .笔名警.显示 { opacity: 1; }
        .笔名操作 { display: flex; gap: clamp(8px, 2.2vw, 11px); justify-content: flex-end; }
        .笔名操作 .小钮 { min-width: clamp(72px, 21vw, 92px); justify-content: center; }
        .数据面板 {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: clamp(6px, 1.8vw, 9px);
            margin: clamp(8px, 2.3vw, 11px) clamp(12px, 3.4vw, 16px) clamp(4px, 1.2vw, 7px);
            padding: clamp(10px, 2.9vw, 13px) clamp(6px, 1.8vw, 9px);
            border-radius: clamp(11px, 3.1vw, 14px);
            background: rgba(var(--panel), 0.5);
            border: 1px solid rgba(var(--line), 0.16);
        }
        .数据格 {
            text-align: center;
            /* ★ 格与格之间加一道极淡分隔，比挤在一起更像「数据看板」 */
            position: relative;
        }
        .数据格 + .数据格::before {
            content: ''; position: absolute; left: 0; top: 18%; bottom: 18%;
            width: 1px; background: rgba(var(--line), .22);
        }
        .数据数 {
            font-size: clamp(14px, 4vw, 16px); font-weight: 600; color: var(--accent-ink);
        }
        .数据名 { margin-top: 2px; font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-3); }

        .表单区 { padding: 0 clamp(14px, 4vw, 18px); }
        .行输入 {
            width: 100%;
            margin-bottom: clamp(6px, 1.8vw, 9px);
            padding: clamp(8px, 2.3vw, 10px) clamp(10px, 2.9vw, 12px);
            border-radius: 10px;
            border: 1px solid rgba(var(--line), 0.26);
            background: rgba(var(--panel), 0.6);
            font-family: inherit; font-size: clamp(12px, 3.4vw, 13.5px);
            color: var(--ink); outline: none;
        }
        .行输入:focus { border-color: rgba(var(--accent-rgb), 0.5); }
        select.行输入 { -webkit-appearance: none; appearance: none; }
        textarea.行输入 { min-height: clamp(62px, 17.7vw, 78px); resize: none; line-height: 1.6; }

        .大钮 {
            display: block; width: 100%;
            margin: clamp(4px, 1.2vw, 7px) 0;
            padding: clamp(9px, 2.6vw, 12px);
            border: none; border-radius: 10px;
            background: var(--accent);
            font-family: inherit; font-size: clamp(13px, 3.7vw, 14.5px);
            font-weight: 600; color: #fff; cursor: pointer;
            box-shadow: 0 3px 12px rgba(var(--shade), 0.22);
            -webkit-tap-highlight-color: transparent;
        }
        .大钮:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
        .大钮:active:not(:disabled) { background: var(--accent-ink); }
        .大钮.次 {
            background: rgba(var(--panel), 0.6);
            color: var(--ink-2);
            border: 1px solid rgba(var(--line), 0.26);
            box-shadow: none;
        }
        .提示文 {
            font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-4); line-height: 1.7;
            padding: 0 clamp(14px, 4vw, 18px);
        }

        /* 作品管理卡 */
        .作品卡 {
            display: flex; gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(8px, 2.3vw, 11px) 0;
            border-bottom: 1px solid rgba(var(--line), 0.14);
            align-items: flex-start;
        }
        .作品卡:last-child { border-bottom: none; }
        /* ★ 简介可展开 */
        .简介区 { position: relative; }
        .详情简介.收起 {
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .展开钮 {
            display: block; margin: clamp(4px, 1.2vw, 6px) 0 0;
            padding: 0; border: none; background: transparent;
            font-family: inherit; font-size: clamp(10.5px, 3vw, 11.5px);
            color: var(--accent-ink); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .展开钮:active { opacity: .6; }

        .作品数据 {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: clamp(4px, 1.2vw, 6px);
            margin-top: clamp(4px, 1.2vw, 6px);
        }
        .作品数 { font-size: clamp(11px, 3.1vw, 12.5px); font-weight: 600; color: var(--accent-ink); }
        .作品名 { font-size: clamp(9px, 2.6vw, 10px); color: var(--ink-4); }
        .小钮行 { display: flex; gap: clamp(5px, 1.5vw, 8px); margin-top: clamp(5px, 1.5vw, 7px); }
        .小钮 {
            padding: clamp(4px, 1.2vw, 6px) clamp(10px, 2.9vw, 13px);
            border-radius: 8px;
            border: 1px solid rgba(var(--line), 0.26);
            background: rgba(var(--panel), 0.6);
            font-family: inherit; font-size: clamp(10.5px, 3vw, 11.5px);
            color: var(--ink-2); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .小钮.主 {
            background: var(--accent); border-color: var(--accent);
            color: #fff; font-weight: 600;
        }
        .小钮:disabled { opacity: 0.45; cursor: default; }

        /* ===== 详情层 ===== */
        .详情遮罩 {
            position: absolute; inset: 0; z-index: 200; display: none;
            background: rgba(var(--shade), 0.2);
        }
        .详情遮罩.显示 { display: block; }
        /* ★★ 段评 / 听书是在【阅读器里面】弹出来的。
             .阅读遮罩 是 z-index 250，而 .详情遮罩 只有 200 ——
             照原来这么写，在阅读页点出来的弹窗会被阅读器整块压住，根本看不见。
             这两个单独提到 280：高于阅读器(250)、编辑器(260)、作者主页(270)。 */
        #段评遮罩, #听书遮罩 { z-index: 280; }
        .详情层 {
            position: absolute; left: 0; right: 0; bottom: 0;
            max-height: 88%;
            display: flex; flex-direction: column;
            border-radius: clamp(16px, 4.6vw, 20px) clamp(16px, 4.6vw, 20px) 0 0;
            background: rgba(var(--panel), 0.97);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
            backdrop-filter: blur(var(--blur)) saturate(150%);
            box-shadow: 0 -6px 28px rgba(var(--shade), 0.2);
            animation: 上滑 .24s ease-out;
        }
        @keyframes 上滑 { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .详情头 {
            position: relative; flex-shrink: 0;
            padding: clamp(14px, 4vw, 18px) clamp(14px, 4vw, 18px) clamp(8px, 2.3vw, 11px);
            text-align: center;
            border-bottom: 1px solid rgba(var(--line), 0.14);
        }
        .详情头标题 { font-size: clamp(14px, 4vw, 16px); font-weight: 600; color: var(--ink); }
        .详情关闭 {
            position: absolute; right: clamp(12px, 3.4vw, 16px); top: clamp(12px, 3.4vw, 16px);
            width: clamp(24px, 6.9vw, 28px); height: clamp(24px, 6.9vw, 28px);
            border: none; background: transparent; cursor: pointer;
            font-size: clamp(17px, 4.9vw, 20px); color: var(--ink-3); line-height: 1;
        }
        /* ★ 内容不顶边缘：左右统一留白，底部也留安全区 */
        .详情体 {
            flex: 1; overflow-y: auto; scrollbar-width: none;
            padding: clamp(10px, 2.9vw, 14px) clamp(14px, 4vw, 18px)
                     calc(clamp(14px, 4vw, 20px) + env(safe-area-inset-bottom, 0px));
        }
        .详情体::-webkit-scrollbar { display: none; }
        .详情头图 { display: flex; gap: clamp(10px, 2.9vw, 13px); }
        .详情封面 {
            position: relative; flex-shrink: 0;
            width: clamp(64px, 18.3vw, 78px); height: clamp(85px, 24.4vw, 104px);
            border-radius: 3px clamp(7px, 2vw, 9px) clamp(7px, 2vw, 9px) 3px;
            overflow: hidden; box-shadow: 0 3px 12px rgba(var(--shade), 0.2);
        }
        .详情封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .详情名 { font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; color: var(--ink); line-height: 1.35; }
        .详情作者 { margin-top: 2px; font-size: clamp(11.5px, 3.3vw, 12.5px); color: var(--ink-3); }
        .详情指标 {
            display: flex; flex-wrap: wrap; gap: clamp(6px, 1.8vw, 10px);
            margin-top: clamp(6px, 1.8vw, 9px);
            font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-3);
        }
        .详情指标 b { color: var(--accent-ink); font-weight: 600; }
        .详情块 { padding: clamp(4px, 1.2vw, 7px) clamp(14px, 4vw, 18px) clamp(8px, 2.3vw, 11px); }
        .详情块标题 {
            font-size: clamp(12px, 3.4vw, 13px); font-weight: 600; color: var(--ink-2);
            margin-bottom: clamp(4px, 1.2vw, 6px);
        }
        .详情简介 {
            font-size: clamp(12px, 3.4vw, 13.5px); color: var(--ink-2); line-height: 1.75;
        }
        .详情章预览 {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; text-align: left;
            padding: clamp(7px, 2vw, 9px) clamp(8px, 2.3vw, 10px);
            margin-bottom: clamp(4px, 1.2vw, 6px);
            border: none; border-radius: 9px;
            background: rgba(var(--line), 0.08);
            font-family: inherit; font-size: clamp(11.5px, 3.3vw, 12.5px);
            color: var(--ink-2); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .详情章预览 .淡 { flex-shrink: 0; color: var(--ink-4); font-size: clamp(10px, 2.8vw, 11.5px); }
        .评论条 {
            padding: clamp(6px, 1.8vw, 8px) clamp(8px, 2.3vw, 10px);
            margin-bottom: clamp(4px, 1.2vw, 6px);
            border-radius: 9px;
            background: rgba(var(--line), 0.08);
            font-size: clamp(11px, 3.1vw, 12.5px); color: var(--ink-2); line-height: 1.6;
        }
        .详情底 {
            display: flex; gap: clamp(7px, 2vw, 10px);
            padding: clamp(8px, 2.3vw, 11px) clamp(14px, 4vw, 18px) calc(clamp(10px, 2.9vw, 14px) + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(var(--line), 0.14);
        }
        .详情底 .大钮 { margin: 0; flex: 1; }

        /* ===== 阅读器 ===== */
        /* ★★ 阅读界面 = 【整页那张主题背景】+ 70% 白遮罩
              ★ 关键：不是「阅读层自己再垫一张图」，而是把下面所有 UI 层收起来，
                让整页的主题背景图（z-index 1 那层）直接透上来。
                ① 阅读遮罩本身透明
                ② ::after 压一层 70% 白（夜间压深灰）
                ③ 打开阅读时给容器加 .阅读中 → 隐藏顶栏/内容区/底栏/全局白遮罩
                   （不隐藏的话，书城列表会隔着 70% 白纱透上来）
                ④ 原来的「护眼/纯白/夜间/淡绿」四档自造底色【已删除】 */
        .阅读遮罩 {
            position: absolute; inset: 0; z-index: 250; display: none;
            flex-direction: column;
            background: transparent;
        }
        .阅读遮罩.显示 { display: flex; }

        /* ★ 70% 白遮罩：压在整页主题背景之上、正文之下 */
        .阅读遮罩::after {
            content: ''; position: absolute; inset: 0; z-index: 1;
            background: rgba(255, 255, 255, 0.70);
            pointer-events: none;
        }
        .阅读遮罩.夜间::after { background: rgba(28, 28, 32, 0.72); }

        /* ★★ 阅读中：把下面的 UI 全部收起，只留整页的主题背景图。
              用 visibility 而不是 display —— display:none 会丢失滚动位置。 */
        .阅读中 .顶部固定区,
        .阅读中 .内容区,
        .阅读中 .底部导航栏,
        .阅读中 .全局白色遮罩 { visibility: hidden; }

        /* 内容在遮罩之上 */
        .阅读头, .阅读体, .阅读设置 { position: relative; z-index: 2; }
        .阅读头 {
            flex-shrink: 0; display: flex; align-items: center; gap: clamp(8px, 2.3vw, 11px);
            padding: calc(clamp(10px, 2.9vw, 14px) + env(safe-area-inset-top, 0px)) clamp(14px, 4vw, 18px) clamp(8px, 2.3vw, 11px);
            border-bottom: 1px solid rgba(var(--line), 0.16);
        }
        .阅读标题 {
            flex: 1; min-width: 0;
            font-size: clamp(12.5px, 3.6vw, 14px); font-weight: 600;
            color: var(--阅字); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* ★ 左侧返回图标：与全站 .返回按钮 同一个箭头 SVG，不加边框不写文字 */
        .阅读图标钮 {
            flex-shrink: 0;
            width: clamp(26px, 7.4vw, 32px); height: clamp(26px, 7.4vw, 32px);
            display: flex; align-items: center; justify-content: center;
            border: none; background: transparent; padding: 0;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .阅读图标钮 svg {
            width: clamp(15px, 4.3vw, 18px); height: clamp(15px, 4.3vw, 18px);
            fill: none; stroke: var(--阅字); stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .阅读头钮 {
            flex-shrink: 0; padding: clamp(3px, 1vw, 5px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px; border: 1px solid rgba(var(--line), 0.3);
            background: transparent;
            font-family: inherit; font-size: clamp(11.5px, 3.3vw, 13px);
            font-weight: 600; color: var(--阅字); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        /* ★ 目录钮只在【正文态】出现 —— 已经在目录里了就不需要它 */
        .阅读头钮.隐藏 { display: none; }
        .阅读头钮.选中 {
            border-color: rgba(var(--accent-rgb), 0.55);
            color: var(--accent-ink);
            background: rgba(var(--accent-rgb), 0.13);
        }
        /* 夜间模式下 --accent-ink 是深灰，压在深底上看不清 —— 换成亮色 */
        .阅读遮罩.夜间 .阅读头钮.选中 {
            border-color: rgba(255, 255, 255, 0.5);
            color: #f0f0f4; background: rgba(255, 255, 255, 0.12);
        }
        .阅读遮罩.夜间 .阅读头钮 { border-color: rgba(255, 255, 255, 0.28); }
        .阅读体 { flex: 1; overflow-y: auto; padding: 0 0 clamp(20px, 5.7vw, 30px); scrollbar-width: none; }
        .阅读体::-webkit-scrollbar { display: none; }
        :root { --阅字: #333336; --阅淡: #7a7a80; }
        .阅读遮罩.夜间 { --阅字: #e2e2e6; --阅淡: #9a9aa2; }
        /* ★ gap 而不是 space-between：space-between 会把「读到这」甩到行中间，
             看着像它跟前后都有关系；用 gap + 标题 flex:1 才是「标题在左、标记靠右」。 */
        .章行 {
            display: flex; align-items: center;
            gap: clamp(4px, 1.2vw, 7px);
            width: 100%; text-align: left;
            padding: clamp(11px, 3.1vw, 14px) clamp(16px, 4.6vw, 20px);
            border: none; border-bottom: 1px solid rgba(var(--line), 0.14);
            background: transparent;
            font-family: inherit; font-size: clamp(13px, 3.7vw, 14.5px);
            color: var(--阅字); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .阅读遮罩.夜间 .章行 { border-bottom-color: rgba(255, 255, 255, 0.1); }
        .章行:active { background: rgba(var(--line), 0.08); }
        .章行.读到这 span:first-child { color: var(--accent-ink); font-weight: 600; }
        .阅读遮罩.夜间 .章行.读到这 span:first-child { color: #f0f0f4; }
        /* ★ 标题吃掉剩余空间，后面的标记自然靠右 —— 长标题也不会把字挤出去 */
        .章题 {
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .章行 .字数 { flex-shrink: 0; font-size: clamp(10.5px, 3vw, 12px); color: var(--阅淡); }
        /* ★ 「读到这」用一个带底色的角标，不再拼进标题文字里
             （旧写法会变成「第二章 发展 · 读到这3 字」，两段粘在一起） */
        .章行 .读到标 {
            flex-shrink: 0;
            padding: 1px clamp(5px, 1.4vw, 7px); border-radius: 999px;
            font-size: clamp(9px, 2.6vw, 10px);
            background: rgba(var(--accent-rgb), 0.15);
            color: var(--accent-ink);
        }
        .阅读遮罩.夜间 .章行 .读到标 {
            background: rgba(255, 255, 255, 0.16); color: #f0f0f4;
        }
        .章文 {
            padding: clamp(14px, 4vw, 20px) clamp(18px, 5.1vw, 22px) clamp(30px, 8.6vw, 44px);
            font-size: clamp(15px, 4.3vw, 16.5px);
            line-height: 1.95; color: var(--阅字);
        }
        /* ★★ 首行缩进两字符：必须按空行切成 <p>，
             整段塞一个节点（哪怕 pre-wrap）只会缩进第一段 —— 这是中文小说排版的关键。 */
        .章文 p { text-indent: 2em; margin: 0 0 clamp(10px, 2.9vw, 14px); }
        .章文 p:last-child { margin-bottom: 0; }
        /* ★ 首段首字母下沉一点：网文开篇的仪式感（不动颜色，只放大字号） */
        .章文 p.首段::first-letter {
            font-size: 1.9em; font-weight: 600; line-height: 1;
            padding-right: .04em;
        }
        /* ★ 章末：一句「本章完」+ 段评引导，读到底不会突然断掉 */
        .章末 {
            margin-top: clamp(16px, 4.6vw, 22px);
            padding-top: clamp(14px, 4vw, 18px);
            border-top: 1px dashed rgba(var(--line), .28);
            text-align: center; color: var(--阅淡);
            font-size: clamp(10.5px, 3vw, 11.5px); line-height: 1.9;
        }
        .章末标 {
            font-size: clamp(12px, 3.4vw, 13.5px); font-weight: 600;
            color: var(--阅字); letter-spacing: 2px;
        }
        .阅读遮罩.夜间 .章末 { border-top-color: rgba(255,255,255,.16); }
        /* ★ 默认收起 —— 常驻会一直占掉两行阅读空间 */
        .阅读设置 {
            flex-shrink: 0; display: none;
            padding: clamp(8px, 2.3vw, 11px) clamp(14px, 4vw, 18px) calc(clamp(8px, 2.3vw, 11px) + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(var(--line), 0.16);
        }
        .阅读设置.展开 { display: block; }
        .阅读遮罩.夜间 .阅读设置 { border-top-color: rgba(255, 255, 255, 0.1); }
        .设置组 { display: flex; align-items: center; gap: clamp(5px, 1.5vw, 7px); margin-bottom: clamp(5px, 1.5vw, 7px); }
        .设置标 { flex-shrink: 0; width: clamp(30px, 8.6vw, 36px); font-size: clamp(10.5px, 3vw, 11.5px); color: var(--阅淡); }
        .景钮 {
            padding: clamp(3px, 1vw, 5px) clamp(9px, 2.6vw, 12px);
            border-radius: 999px;
            border: 1px solid rgba(var(--line), 0.3);
            background: transparent;
            font-family: inherit; font-size: clamp(10.5px, 3vw, 11.5px);
            color: var(--阅字); cursor: pointer;
        }
        .景钮.选中 {
            border-color: var(--accent);
            color: var(--accent-ink); font-weight: 600;
            background: rgba(var(--accent-rgb), 0.13);
        }
        .阅读遮罩.夜间 .景钮 { border-color: rgba(255, 255, 255, 0.32); }
        /* ★ 翻页条吸底（在阅读体【之外】），只在正文态出现 */
        .翻页条 {
            flex-shrink: 0; display: none;
            gap: clamp(8px, 2.3vw, 11px); align-items: center;
            padding: clamp(7px, 2vw, 9px) clamp(14px, 4vw, 18px) 0;
            border-top: 1px solid rgba(var(--line), 0.16);
        }
        .翻页条.显示 { display: flex; }
        .翻页条 .小钮 { flex: 1; text-align: center; }
        /* ★ 章节位置「3 / 12」—— 否则用户不知道自己读到第几章了 */
        .翻页条 .章位 {
            flex: 0 0 auto; min-width: clamp(50px, 14.3vw, 62px);
            text-align: center; font-size: clamp(10.5px, 3vw, 12px);
            color: var(--阅淡); font-variant-numeric: tabular-nums;
        }
        .阅读遮罩.夜间 .翻页条 { border-top-color: rgba(255, 255, 255, 0.1); }
        .阅读遮罩.夜间 .翻页条 .小钮 {
            background: rgba(255, 255, 255, 0.12);
            color: #e2e2e6; border-color: rgba(255, 255, 255, 0.22);
        }

        /* ===== 更多菜单 ===== */
        .更多遮罩 { position: absolute; inset: 0; z-index: 320; display: none; background: rgba(var(--shade), 0.18); }
        .更多遮罩.显示 { display: block; }
        .更多菜单 {
            position: absolute;
            top: calc(clamp(44px, 12.6vw, 54px) + 6px);
            right: clamp(8px, 2.3vw, 12px);
            min-width: clamp(112px, 32vw, 136px);
            padding: clamp(4px, 1.2vw, 6px);
            border-radius: 12px;
            background: rgba(var(--panel), 0.97);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            box-shadow: 0 6px 24px rgba(var(--shade), 0.18);
            border: 1px solid rgba(var(--line), 0.12);
        }
        .更多项 {
            display: flex; align-items: center; gap: clamp(6px, 1.8vw, 9px);
            width: 100%;
            padding: clamp(8px, 2.3vw, 11px) clamp(9px, 2.6vw, 12px);
            border: none; border-radius: 9px; background: transparent;
            font-family: inherit; font-size: clamp(12px, 3.4vw, 13.5px);
            color: var(--ink); text-align: left; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .更多项:active { background: rgba(var(--line), 0.1); }
        .更多项 svg {
            flex-shrink: 0; width: clamp(14px, 4vw, 17px); height: clamp(14px, 4vw, 17px);
            fill: none; stroke: var(--ink-2); stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ===== 长按确认条 ===== */
        .长按条 {
            position: absolute; left: 50%; bottom: calc(clamp(70px, 20vw, 96px) + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: none; align-items: center; gap: clamp(6px, 1.8vw, 9px);
            padding: clamp(7px, 2vw, 10px) clamp(10px, 2.9vw, 14px);
            border-radius: 999px;
            background: rgba(var(--panel), 0.97);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            box-shadow: 0 4px 18px rgba(var(--shade), 0.2);
            z-index: 330; max-width: 88%;
        }
        .长按条.显示 { display: flex; }
        .长按条 .长按名 {
            font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-2);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* ============================================================
         * 作者中心（作家工作台）
         * ★ 颜色全走全站色板，不定义新色。
         * ============================================================ */
        .名片 {
            display: flex; align-items: center; gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(10px, 2.9vw, 14px) clamp(12px, 3.5vw, 15px);
            border: 1px solid rgba(var(--line), 0.2);
            border-radius: 14px;
            background: rgba(var(--panel), 0.5);
        }
        .名片头 {
            flex-shrink: 0;
            width: clamp(38px, 10.9vw, 46px); height: clamp(38px, 10.9vw, 46px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background: rgba(var(--accent-rgb), 0.14);
            color: var(--accent-ink);
            font-size: clamp(15px, 4.3vw, 18px); font-weight: 600;
        }
        .名片头 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .名片息 { flex: 1; min-width: 0; }
        .名片名 {
            font-size: clamp(14px, 4vw, 16px); font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .名片副 { font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-4); margin-top: 2px; }
        .笔名钮 {
            flex-shrink: 0; padding: clamp(4px, 1.2vw, 6px) clamp(10px, 2.9vw, 13px);
            border-radius: 999px; border: 1px solid rgba(var(--line), 0.3);
            background: transparent; font-family: inherit;
            font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-2); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .双列 { display: flex; gap: clamp(6px, 1.8vw, 9px); }
        .双列 .行输入 { flex: 1; min-width: 0; }
        .大钮.次 {
            background: rgba(var(--panel), 0.6); color: var(--ink-2);
            border: 1px solid rgba(var(--line), 0.3);
        }

        /* ★ 作品卡：封面 + 信息 + 操作 */
        .作品卡 {
            display: flex; gap: clamp(9px, 2.6vw, 12px);
            padding: clamp(10px, 2.9vw, 13px);
            border: 1px solid rgba(var(--line), 0.2);
            border-radius: 14px;
            background: rgba(var(--panel), 0.5);
        }
        .作品息 { flex: 1; min-width: 0; }
        .作品名行 { display: flex; align-items: center; gap: clamp(4px, 1.2vw, 6px); }
        .作品态 {
            flex-shrink: 0; padding: 1px clamp(5px, 1.4vw, 7px); border-radius: 999px;
            font-size: clamp(9px, 2.6vw, 10px);
            background: rgba(var(--line), 0.14); color: var(--ink-3);
        }
        .作品态.连载 { background: rgba(var(--accent-rgb), 0.14); color: var(--accent-ink); }
        .作品数据 {
            display: flex; gap: clamp(8px, 2.3vw, 12px);
            margin-top: clamp(5px, 1.5vw, 7px);
        }
        .作品数据 > div { flex: 1; min-width: 0; text-align: center; }
        .作品数 {
            font-size: clamp(11.5px, 3.3vw, 13px); font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .作品名2 { font-size: clamp(9px, 2.6vw, 10px); color: var(--ink-4); margin-top: 1px; }
        .作品操作 {
            display: flex; gap: clamp(5px, 1.5vw, 7px);

        .详情章列 { display: flex; flex-direction: column; gap: clamp(4px, 1.2vw, 6px); }
        .详情章预览 {

        /* ============================================================
         * 作品编辑界面（工作台）
         * ============================================================ */
        .作品遮罩 {
            position: absolute; inset: 0; z-index: 255; display: none;
            flex-direction: column;
            background: transparent;
        }
        .作品遮罩.显示 { display: flex; }
        /* ★ 白度统一 70%（与阅读器 / 编辑器 / 作者主页四处一致）——
             原来是 85%，同一张主题图在不同界面间切换时会「忽白忽灰」。 */
        .作品遮罩::before {
            content: ''; position: absolute; inset: 0; z-index: 0;
            background: rgba(255, 255, 255, 0.70);
            pointer-events: none;
        }
        .编辑头, .作品体 { position: relative; z-index: 1; }
        .作品体 {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: clamp(8px, 2.3vw, 12px) clamp(12px, 3.5vw, 16px)
                     calc(clamp(12px, 3.5vw, 16px) + env(safe-area-inset-bottom, 0px));
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .作品体::-webkit-scrollbar { display: none; }
        .作品页头 {
            display: flex; gap: clamp(9px, 2.6vw, 12px); align-items: flex-start;
            margin-bottom: clamp(8px, 2.3vw, 11px);
        }
        .作品页封面 {
            flex-shrink: 0; width: clamp(72px, 20.6vw, 90px);
            aspect-ratio: 3 / 4; border-radius: 5px; overflow: hidden;
            border: 1px solid rgba(var(--line), 0.24);
            box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
            background: rgba(var(--line), 0.1);
        }
        .作品页封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .作品页操作 {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: clamp(5px, 1.5vw, 8px);
        }
        .章列 { display: flex; flex-direction: column; gap: clamp(4px, 1.2vw, 6px); }
        .章卡 {
            display: flex; align-items: center; gap: clamp(6px, 1.8vw, 9px);
            padding: clamp(7px, 2vw, 10px) clamp(9px, 2.6vw, 12px);
            border: 1px solid rgba(var(--line), 0.2); border-radius: 10px;
            background: rgba(var(--panel), 0.5);
            font-family: inherit; text-align: left; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .章卡 .序 {
            flex-shrink: 0; min-width: clamp(26px, 7.4vw, 32px);
            font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-4);
            font-variant-numeric: tabular-nums;
        }
        .章卡 .题 {
            flex: 1; min-width: 0; font-size: clamp(12px, 3.4vw, 13.5px); color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .章卡 .字 {
            flex-shrink: 0; font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-4);
        }

        /* ★★ 封面（3:4） */
        .封面选区 {
            display: flex; gap: clamp(9px, 2.6vw, 12px); align-items: flex-start;
            padding: clamp(8px, 2.3vw, 11px);
            border: 1px solid rgba(var(--line), 0.2); border-radius: 12px;
            background: rgba(var(--panel), 0.45);
        }
        .封面预览 {
            /* ★ 比例写死 3:4 —— 宽度自适应，高度按比例算 */
            flex-shrink: 0; width: clamp(66px, 19vw, 84px);
            aspect-ratio: 3 / 4; border-radius: 5px; overflow: hidden;
            border: 1px solid rgba(var(--line), 0.24);
            background: rgba(var(--line), 0.1);
        }
        .封面预览 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .封面操作 {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: clamp(5px, 1.5vw, 7px);
        }
        .作品封面 {
            flex-shrink: 0; width: clamp(48px, 13.7vw, 58px);
            aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(var(--shade), 0.18);
        }
        .作品封面 img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ★★ 读者互动 */
        .互动区 { display: flex; flex-direction: column; gap: clamp(8px, 2.3vw, 11px); }
        .互动卡 {
            padding: clamp(9px, 2.6vw, 12px);
            border: 1px solid rgba(var(--line), 0.2); border-radius: 12px;
            background: rgba(var(--panel), 0.5);
        }
        .互动头 {
            display: flex; align-items: center; gap: clamp(5px, 1.5vw, 8px);
            margin-bottom: clamp(6px, 1.8vw, 8px);
        }
        .互动头 .书名 { font-weight: 600; }
        .评行 {
            padding: clamp(6px, 1.8vw, 9px) clamp(8px, 2.3vw, 11px);
            border-radius: 9px; background: rgba(var(--line), 0.1);
            margin-bottom: clamp(4px, 1.2vw, 6px);
        }
        .评文 { font-size: clamp(11.5px, 3.3vw, 13px); color: var(--ink-2); }
        .评回 {
            margin-top: clamp(3px, 1vw, 5px); padding-left: clamp(7px, 2vw, 10px);
            border-left: 2px solid rgba(var(--accent-rgb), 0.4);
            font-size: clamp(10.5px, 3vw, 12px); color: var(--ink-3);
        }
        .评回 .回标 { color: var(--accent-ink); font-weight: 600; margin-right: 3px; }
        .评操作 {
            display: flex; gap: clamp(5px, 1.5vw, 8px); margin-top: clamp(4px, 1.2vw, 6px);
        }
        .评操作 .行输入 { flex: 1; min-width: 0; }
        .消行 {
            display: flex; align-items: center; gap: clamp(5px, 1.5vw, 8px);
            font-size: clamp(11px, 3.1vw, 12.5px); color: var(--ink-3);
            padding: clamp(4px, 1.2vw, 6px) 0;
        }
        .消行 .时 { flex-shrink: 0; font-size: clamp(9.5px, 2.7vw, 10.5px); color: var(--ink-4); }

        /* ============================================================
         * 章节编辑器
         * ============================================================ */
        /* ★★ 编辑器背景 = 【整页主题背景】+ 70% 白遮罩
             ★ 之前写的是 background: var(--panel)，而 --panel 是【半透明】面板色，
               底下又没东西垫 —— 结果整块是半透明的，列表和书城会透上来，看着像 bug。
               现在改成：本身透明 → 透出整页主题图 → ::before 压一层白。
             ★★ 白度统一 70%（与阅读器 .阅读遮罩::after、作者主页 .作者遮罩::before
                三处一致）：原先编辑器/作者主页是 85%、阅读器是 70%，
                同一张主题图在切界面时会「忽白忽灰」，看着像换了张背景。 */
        .编辑遮罩 {
            position: absolute; inset: 0; z-index: 260; display: none;
            flex-direction: column;
            background: transparent;
        }
        .编辑遮罩.显示 { display: flex; }
        .编辑遮罩::before {
            content: ''; position: absolute; inset: 0; z-index: 0;
            background: rgba(255, 255, 255, 0.70);
            pointer-events: none;
        }
        /* 内容盖在遮罩之上 */
        .编辑头, .编辑体, .章抽屉, .编辑底 { position: relative; z-index: 1; }

        /* ★ 编辑时也收起下层 UI —— 编辑器是沉浸式全屏，
             不收的话下面的作者中心列表会抢视觉（并且会跟输入区抢滚动） */
        .编辑中 .顶部固定区,
        .编辑中 .内容区,
        .编辑中 .底部导航栏,
        /* ★★ 全局白纱（rgba(--panel,.45)）也要收 —— 阅读器的 .阅读中 早就收了它，
             而作品页 / 作者主页 / 编辑器三家共用的 .编辑中 原先没收，
             于是主题背景先被 45% 白纱糊一层、再被本界面自己的白压一层，
             比阅读器明显发灰。收掉之后，四处的主题背景才是同一个颜色。
             ★ 注意边界：这里只收【白纱】这一层装饰。
               作品页 / 作者主页【本身】绝不能收 —— 它们自己也挂 .编辑中，
               收了就自己把自己藏起来了（那是 .写稿中 才该干的事）。 */
        .编辑中 .全局白色遮罩 { visibility: hidden; }

        /* ★★ 写稿中 = 只有【编辑器打开】时才挂（.编辑中 是作者主页 / 作品页 /
             编辑器三家共用的「沉浸式」标记，所以不能把下面的规则并进 .编辑中
             —— 那会把作者主页、作品页自己也藏掉）。
             它做两件 .编辑中 没做到、却直接决定背景成败的事：

             ① （白纱已移到 .编辑中 统一收 —— 作品页 / 作者主页同样需要，
                 放在这里就漏了它们两家，见上面 .编辑中 那段注释）

             ② 收掉下层浮层 .作品遮罩(255) / .作者遮罩(270)
                编辑器自己只有 260：
                  · 从作者主页点「写」→ 作者主页 270 反而盖在编辑器之上，
                    用户看到的根本不是编辑器，而是上一界面（作者主页）；
                  · 从作品页点「写新章」→ 作品页 255 虽在编辑器之下，
                    但它没被关闭，会隔着编辑器那 30% 的透明缝透上来。
                收掉这两层之后，编辑器底下只剩 .主题背景图片(z-index 0)，
                这才是「与整体主题背景统一」—— 跟阅读器看到的是同一张图。 */
        .写稿中 .作品遮罩,
        .写稿中 .作者遮罩 { visibility: hidden; }
        .编辑头 {
            flex-shrink: 0; display: flex; align-items: center;
            gap: clamp(6px, 1.8vw, 9px);
            padding: clamp(10px, 3vw, 14px) clamp(12px, 3.5vw, 16px) clamp(6px, 2vw, 8px);
            border-bottom: 1px solid rgba(var(--line), 0.16);
        }
        .编辑标题 { flex: 1; min-width: 0; }
        .编辑书名 {
            font-size: clamp(11px, 3.1vw, 12.5px); color: var(--ink-3);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .编辑章名 {
            font-size: clamp(12.5px, 3.6vw, 14.5px); font-weight: 600; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .编辑体 {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            padding: clamp(8px, 2.3vw, 12px) clamp(12px, 3.5vw, 16px);
            gap: clamp(6px, 1.8vw, 9px);
        }
        .章题输入 {
            flex-shrink: 0; width: 100%; box-sizing: border-box;
            padding: clamp(8px, 2.3vw, 11px) clamp(10px, 3vw, 13px);
            border: 1px solid rgba(var(--line), 0.24); border-radius: 10px;
            background: rgba(var(--panel), 0.6);
            font-family: inherit; font-size: clamp(13px, 3.7vw, 14.5px);
            font-weight: 600; color: var(--ink);
        }
        /* ★ 正文输入区吃掉剩余空间 —— 不写死高度，各机型都能撑满 */
        .正文输入 {
            flex: 1; min-height: 0; width: 100%; box-sizing: border-box;
            padding: clamp(10px, 2.9vw, 14px);
            border: 1px solid rgba(var(--line), 0.24); border-radius: 10px;
            background: rgba(var(--panel), 0.6);
            font-family: inherit; font-size: clamp(13.5px, 3.9vw, 15px);
            line-height: 1.9; color: var(--ink); resize: none;
        }
        .章题输入:focus, .正文输入:focus {
            outline: none; border-color: rgba(var(--accent-rgb), 0.5);
        }
        .编辑底 {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            gap: clamp(8px, 2.3vw, 11px);
            padding: clamp(7px, 2vw, 10px) clamp(12px, 3.5vw, 16px)
                     calc(clamp(7px, 2vw, 10px) + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(var(--line), 0.16);
        }
        .编辑统计 {
            font-size: clamp(10.5px, 3vw, 11.5px); color: var(--ink-4);
            display: flex; align-items: center; gap: clamp(3px, 1vw, 5px);
            font-variant-numeric: tabular-nums;
        }
        .编辑统计 .点 { opacity: .5; }
        .编辑操作 { display: flex; gap: clamp(5px, 1.5vw, 8px); }

        /* ★ 章节抽屉：从底部升起 */
        .章抽屉 {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
            max-height: 56%; display: none; flex-direction: column;
            background: var(--panel);
            border-top: 1px solid rgba(var(--line), 0.2);
            border-radius: 14px 14px 0 0;
            box-shadow: 0 -6px 20px rgba(var(--shade), 0.14);
        }
        .章抽屉.显示 { display: flex; }
        .抽屉头 {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            padding: clamp(9px, 2.6vw, 12px) clamp(12px, 3.5vw, 16px) clamp(6px, 1.8vw, 8px);
        }
        .抽屉标 { font-size: clamp(12.5px, 3.6vw, 14px); font-weight: 600; color: var(--ink); }
        .抽屉列 {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: 0 clamp(12px, 3.5vw, 16px) clamp(10px, 2.9vw, 14px);
            scrollbar-width: none; -ms-overflow-style: none;
        }

        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================

(function () {
