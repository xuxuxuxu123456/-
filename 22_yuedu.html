    /* ★ 默认头像：与 1 页【完全同口径】—— 没换过头像就回落这张默认图，
         不是退首字（1 页原文：`头像元素.src = 头像 || '2【图片】/圆形头像1.png';`）。
         ★ 放常量区：const 有暂时性死区，定义在渲染函数之后会炸。 */
    const 默认头像 = '2【图片】/圆形头像1.png';

    /**
     * ★★ 按前缀扫 localStorage 的键。
     *   不能用 Object.keys(localStorage) —— Storage 是代理对象，
     *   在部分实现（含 jsdom）下枚举不到任何键，草稿箱会莫名其妙是空的。
     *   length + key(i) 是规范里唯一保证可用的遍历方式。
     */
    function 扫键(前缀) {
        const 出 = [];
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.indexOf(前缀) === 0) 出.push(k);
            }
        } catch (e) {}
        return 出;
    }

    const 单本上限 = 3 * 1024 * 1024;   /* 单本 3MB */
    const 新书窗 = 90 * 864e5;          /* 新书榜：3 个月内 */
    const 榜单容量 = 4;                 /* 每榜 4 本 */
    const 热门容量 = 6;                 /* 猜你喜欢 6 本 */
    const 热门权重 = { 书架: 3, 阅读: 1, 评论: 5 };

    const 题材表 = ['全部', '玄幻', '都市', '仙侠', '言情', '悬疑', '科幻', '灵异', '萌娃', '异世', '其他'];
    const 其他子类 = ['水仙', '耽美', '百合'];
    const 状态表 = ['全部', '连载', '完结', '断更'];
    const 排序表 = ['人气', '最新', '字数'];

    const 架进度表 = ['全部', '未读', '在读', '已读'];
    const 架更新表 = ['全部', '连载', '完结', '断更'];
    const 架来源表 = ['全部', '本地导入', '书城添加'];
    const 架排序表 = ['最近读', '最近加', '书名'];

    const 字号档 = [['小', 0.9], ['中', 1], ['大', 1.15]];
    /* ★ 原来的四档底色（护眼/纯白/夜间/淡绿）已删 —— 阅读界面现在用主题背景。
         只剩「日间 / 夜间」两种遮罩：白天压 70% 白，夜间压深灰。 */
    const 景档 = [['日间', ''], ['夜间', '夜间']];

    /* ---- 字典 / 表 读写 ---- */
    function 读字典(键) {
        try { return JSON.parse(localStorage.getItem(键) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function 写字典(键, 值) {
        try { localStorage.setItem(键, JSON.stringify(值)); } catch (e) {}
    }
    function 读表(键) {
        try { const a = JSON.parse(localStorage.getItem(键) || '[]'); return Array.isArray(a) ? a : []; }
        catch (e) { return []; }
    }
    function 写表(键, 值) {
        try { localStorage.setItem(键, JSON.stringify(值)); } catch (e) {}
    }
    function 读设置() {
        const s = 读字典(设置键);
        return { 字号: Number(s.字号) || 1, 景: Number(s.景) || 0 };
    }
    function 写设置(s) { 写字典(设置键, s); }

    /* ---- 阅读时长（存秒，显示才转分钟 ----
       ★ 存分钟的话读 40 秒会记成 0，一天读十次就丢十次 */
    function 今天串() {
        const d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function 读时长() {
        const 存 = 读字典(时长键);
        const 今 = 今天串();
        return {
            日: 今,
            今日: 存.日 === 今 ? (Number(存.今日) || 0) : 0,
            累计: Number(存.累计) || 0,
        };
    }
    function 加时长(秒) {
        const 数 = Math.max(0, Math.floor(Number(秒) || 0));
        if (!数) return 读时长();
        const t = 读时长();
        t.今日 += 数; t.累计 += 数;
        写字典(时长键, { 日: t.日, 今日: t.今日, 累计: t.累计 });
        return t;
    }
    function 时长文(秒) {
        const 总 = Math.floor((Number(秒) || 0) / 60);
        if (总 < 60) return 总 + '分钟';
        const 时 = Math.floor(总 / 60), 分 = 总 % 60;
        return 时 + '小时' + (分 ? 分 + '分钟' : '');
    }
    let 计时起 = 0;
    function 开始计时() { 计时起 = Date.now(); }
    function 结算计时() {
        if (!计时起) return 0;
        const 秒 = Math.floor((Date.now() - 计时起) / 1000);
        计时起 = 0;
        if (秒 <= 0) return 0;
        加时长(秒);
        return 秒;
    }

    /* ---- 热度（加入书架次数）/ 阅读人数 / 评论 ---- */
    function 取热度(id) { return Number(读字典(热度键)[id]) || 0; }
    function 加热度(id, n) {
        const 表 = 读字典(热度键);
        表[id] = (Number(表[id]) || 0) + (n || 1);
        写字典(热度键, 表);
    }
    function 取阅读数(id) { return Number(读字典(人数键)[id]) || 0; }
    /**
     * 阅读人数按【历史最深章】累计 —— 不是按「上一次的章」。
     * 用上一次的话：读到第 5 章再翻回第 1 章，基准被拉低到 1，
     * 下次读到第 5 章会白加 4 次 —— 来回翻就能刷数。
     */
    function 加阅读(id, n) {
        const 表 = 读字典(人数键);
        表[id] = (Number(表[id]) || 0) + (n || 1);
        写字典(人数键, 表);
    }
    function 读进度(id) { return 读字典(进度键)[id] || null; }
    function 写进度(id, 章) {
        const 表 = 读字典(进度键);
        表[id] = { 章: 章, 时间: Date.now() };
        写字典(进度键, 表);
        const 深表 = 读字典(深键);
        const 旧深 = Number(深表[id]);
        const 基 = Number.isFinite(旧深) ? 旧深 : -1;
        if (章 > 基) {
            加阅读(id, 基 < 0 ? 1 : 章 - 基);
            深表[id] = 章;
            写字典(深键, 深表);
        }
    }
    function 清进度(id) {
        const p = 读字典(进度键); delete p[id]; 写字典(进度键, p);
        const d = 读字典(深键); delete d[id]; 写字典(深键, d);
    }
    /**
     * ★★ 修过一个真 bug：
     *   旧写法在「列表格式」下返回的是【1】而不是列表长度 ——
     *   用户发 20 条评论，界面上永远显示「1 人评论」。
     *   不报错，只是数字不对，属于最难发现的那种。
     *   之前的测试只发 1 条，恰好等于 1，所以一直没暴露。
     */
    function 取评论数(id) {
        const c = 读字典(评论键)[id];
        if (!c) return 0;
        /* 旧格式：{ 数: N } */
        if (Number.isFinite(Number(c.数))) return Number(c.数);
        /* 新格式：{ 列表: [...] } —— 人数按条数算 */
        return Array.isArray(c.列表) ? c.列表.length : 0;
    }
    function 发评论(id, 文) {
        const 表 = 读字典(评论键);
        const 旧 = 表[id] || { 列表: [] };
        const 列表 = Array.isArray(旧.列表) ? 旧.列表.slice() : [];
        列表.push({ 文: String(文 || '').slice(0, 200), 时间: Date.now() });
        表[id] = { 列表: 列表 };
        写字典(评论键, 表);
    }
    function 读评论表() { return 读字典(评论键); }

    /** ★ 热门分 = 书架×3 + 阅读×1 + 评论×5 */
    function 热门分(条目) {
        return 取热度(条目.id) * 热门权重.书架
            + 取阅读数(条目.id) * 热门权重.阅读
            + 取评论数(条目.id) * 热门权重.评论;
    }

    /* ---- 归类兜底：不在题材表里的分类一律归「其他」 ---- */
    function 归类(分类) {
        const c = String(分类 || '').trim();
        if (!c) return '其他';
        if (题材表.includes(c)) return c;
        return '其他';
    }
    function 书状态(条目) { return String(条目.状态 || '').trim() || '连载'; }
    function 书来源(条目) {
        return (条目.来源 === '本地' || 条目.来源 === '本地导入') ? '本地导入' : '书城添加';
    }

    /* ============================================================
     * 2. IndexedDB（正文）
     * ============================================================ */
    const 库名 = '阅读_书库';
    const 表名 = '书';
    let 库 = null;

    function 开库() {
        return new Promise((完成, 失败) => {
            if (库) { 完成(库); return; }
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); }
            catch (e) { 失败(e); return; }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => { 库 = 请求.result; 完成(库); };
            请求.onerror = () => 失败(请求.error);
        });
    }
    function 存书(书) {
        return 开库().then(db => new Promise((完成, 失败) => {
            const 事 = db.transaction(表名, 'readwrite');
            事.objectStore(表名).put(JSON.parse(JSON.stringify(书)));
            事.oncomplete = 完成;
            事.onerror = () => 失败(事.error);
        })).catch(() => {});
    }
    function 取书(id) {
        return 开库().then(db => new Promise((完成) => {
            const 事 = db.transaction(表名, 'readonly');
            const 请 = 事.objectStore(表名).get(id);
            请.onsuccess = () => 完成(请.result || null);
            事.oncomplete = () => { if (!请.result) 完成(null); };
            事.onerror = () => 完成(null);
        })).catch(() => null);
    }
    function 删书(id) {
        return 开库().then(db => new Promise((完成) => {
            const 事 = db.transaction(表名, 'readwrite');
            事.objectStore(表名).delete(id);
            事.oncomplete = 完成;
            事.onerror = 完成;
        })).catch(() => {});
    }

    /* ============================================================
     * 3. 工具
     * ============================================================ */
    function 转义HTML(串) {
        return String(串 == null ? '' : 串)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function 字数文(n) {
        const v = Number(n) || 0;
        if (v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '万';
        return String(v);
    }
    const toast元素 = document.getElementById('toast');
    let toast计时 = null;
    function 提示(文) {
        if (!toast元素) return;
        toast元素.textContent = 文;
        toast元素.classList.add('显示');
        clearTimeout(toast计时);
        toast计时 = setTimeout(() => toast元素.classList.remove('显示'), 1900);
    }

    /* ★ 封面：按书名 hash 取色现场合成 SVG。
         hash 而不是随机 —— 随机会导致翻页回来封面换色，看着像换了一本书。
         低饱和莫兰迪：高饱和的橙/黄会和全站灰调打架。 */
    const 封面色 = [
        ['#8a7f78', '#b5aaa2'], ['#6f7f8f', '#9aabb8'], ['#77857a', '#a2b0a3'],
        ['#8b7c88', '#b3a6b0'], ['#8d8570', '#b6ae98'], ['#76788c', '#a2a4b6'],
        ['#8a7a70', '#b2a49b'],
    ];
    function 造封面(书名, 作者) {
        const 名 = String(书名 || '未命名');
        let h = 0;
        for (let i = 0; i < 名.length; i++) h = (h * 31 + 名.charCodeAt(i)) >>> 0;
        const 配 = 封面色[h % 封面色.length];
        const 题 = 转义HTML(名.slice(0, 6));
        const 者 = 转义HTML(String(作者 || '').slice(0, 6));
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 120">'
            + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0" stop-color="' + 配[0] + '"/><stop offset="1" stop-color="' + 配[1] + '"/>'
            + '</linearGradient></defs>'
            + '<rect width="90" height="120" fill="url(#g)"/>'
            + '<circle cx="70" cy="26" r="30" fill="rgba(255,255,255,0.10)"/>'
            + '<text x="45" y="70" text-anchor="middle" font-size="17" font-weight="600" '
            + 'fill="rgba(255,255,255,0.95)" font-family="sans-serif">' + 题 + '</text>'
            + '<text x="45" y="88" text-anchor="middle" font-size="9" '
            + 'fill="rgba(255,255,255,0.75)" font-family="sans-serif">' + 者 + '</text>'
            + '</svg>';
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function 切章(正文) {
        const 文 = String(正文 || '');
        const 位 = [];
        const 则 = /^[ \t]*(第[0-9零一二三四五六七八九十百千两]+[章节回篇][^\n]{0,40}|[Cc]hapter[ \t]*[0-9]+[^\n]{0,40})/gm;
        let m;
        while ((m = 则.exec(文)) !== null) 位.push(m.index);
        if (!位.length || 位[0] > 文.length * 0.5) {
            return [{ 题: '正文', 正文: 文.trim() || '（空文件）' }];
        }
        const 出 = [];
        for (let i = 0; i < 位.length; i++) {
            const 起 = 位[i], 止 = i + 1 < 位.length ? 位[i + 1] : 文.length;
            const 段 = 文.slice(起, 止).trim();
            if (!段) continue;
            const 换行 = 段.indexOf('\n');
            const 题 = (换行 < 0 ? 段 : 段.slice(0, 换行)).trim().slice(0, 40);
            出.push({ 题: 题, 正文: (换行 < 0 ? '' : 段.slice(换行 + 1)).trim() || '（本章无正文）' });
        }
        return 出.length ? 出 : [{ 题: '正文', 正文: 文.trim() || '（空文件）' }];
    }
    function 总字数(章们) {
        return (章们 || []).reduce((n, c) => n + String(c.正文 || '').length, 0);
    }
    function 目录项(书, 来源, 发布者) {
        return {
            id: 书.id, 书名: 书.书名, 作者: 书.作者, 分类: 书.分类, 状态: 书.状态,
            简介: 书.简介, 章数: (书.章节 || []).length, 字数: 总字数(书.章节),
            来源: 来源, 发布者: 发布者 || '', 时间: 书.时间 || Date.now(),
        };
    }

    /* ============================================================
     * 4. 案例书（只留一本）
     * ============================================================ */
    const 示例书 = [{
        id: 'demo_1', 书名: '小喵叽法则', 作者: '示例作者', 分类: '都市', 状态: '连载',
        简介: '一只猫定的规矩，比人的好使。',
        章节: [
            { 题: '第一章 第一条法则', 正文: '第一条法则：饭盆空了就要叫。\n\n这条是我来到这个家的第一天定下的。人类当时蹲在厨房地上看我，问我「你叫什么名字」。我没有回答 —— 名字不重要，饭盆重要。\n\n他把碗添满了。法则生效。' },
            { 题: '第二章 第二条法则', 正文: '第二条法则：阳光照到哪儿，就躺到哪儿。\n\n这条不需要执行，它是自动生效的。上午在窗台，下午挪到沙发，傍晚在门口那块地砖上 —— 那块地砖暖的时间最长。\n\n人类给我拍了很多照片。我不知道为什么，但也没阻止。' },
            { 题: '第三章 第三条法则', 正文: '第三条法则：人类难过的时候，要坐在他腿上。\n\n这条是我自己加的，不在最初的七条里。\n\n那天他回来得很晚，坐在沙发上不说话。我跳上去，他把手放在我背上，很久没有动。我觉得这比前两条加起来都重要。\n\n所以现在是八条。' },
            { 题: '第四章 第四条法则', 正文: '第四条法则：不许动我的尾巴。\n\n第五条：夜里可以跑，但要小声。\n\n第六条：纸箱比猫窝好，不接受反驳。\n\n剩下的三条我还没想好，等想好了再说。反正人类也看不懂。' },
        ],
        时间: Date.now(),
    }];
    const 示例热度 = { demo_1: 860 };
    const 示例阅读人数 = { demo_1: 1620 };

    async function 初始化示例() {
        const 版本 = Number(localStorage.getItem(示例版本键) || '0');
        const 留 = 示例书.map(b => b.id);

        /* 迁移：清掉旧版本铺的示例书（平台 / 书架 / 正文 / 统计 一处不留） */
        if (版本 < 当前示例版本) {
            let 平台 = 读表(平台键);
            const 该删 = 平台.filter(p => p.发布者 === '示例' && !留.includes(p.id));
            if (该删.length) {
                for (const p of 该删) await 删书(p.id);
                平台 = 平台.filter(p => !该删.includes(p));
                写表(平台键, 平台);
            }
            let 书架 = 读表(书架键);
            const 架删 = 书架.filter(b => b.发布者 === '示例' && !留.includes(b.id));
            if (架删.length) {
                书架 = 书架.filter(b => !架删.includes(b));
                写表(书架键, 书架);
            }
        }

        /* 补 / 刷新当前这本（★ 不能只「缺了才补」：老版本 demo_1 书名不同） */
        const 平台 = 读表(平台键);
        let 变了 = false;
        for (const 书 of 示例书) {
            const 位 = 平台.findIndex(p => p.id === 书.id);
            const 新项 = 目录项(书, '平台', '示例');
            if (位 < 0) { 平台.unshift(新项); 变了 = true; }
            else {
                const 旧 = 平台[位];
                if (旧.书名 !== 新项.书名 || 旧.简介 !== 新项.简介
                    || 旧.分类 !== 新项.分类 || 旧.章数 !== 新项.章数) {
                    平台[位] = 新项; 变了 = true;
                }
            }
            await 存书(书);
        }
        if (变了) 写表(平台键, 平台);

        const 热 = 读字典(热度键);
        Object.keys(示例热度).forEach(k => { if (!(k in 热)) { 热[k] = 示例热度[k]; 变了 = true; } });
        写字典(热度键, 热);
        const 人 = 读字典(人数键);
        Object.keys(示例阅读人数).forEach(k => { if (!(k in 人)) { 人[k] = 示例阅读人数[k]; 变了 = true; } });
        写字典(人数键, 人);

        if (版本 !== 当前示例版本) localStorage.setItem(示例版本键, String(当前示例版本));
    }

    /* ============================================================
     * 5. 元素
     * ============================================================ */
    const 内容区 = document.getElementById('内容区');
    const 中间标题 = document.getElementById('中间标题');
    const 右钮 = document.getElementById('右钮');
    const 搜索框 = document.getElementById('搜索框');
    const 分类宫 = document.getElementById('分类宫');
    const 榜单区 = document.getElementById('榜单区');
    const 书城列表 = document.getElementById('书城列表');
    const 热门标题 = document.getElementById('热门标题');
    const 热门侧字 = document.getElementById('热门侧字');
    const 书城主体 = document.getElementById('书城主体');
    const 书架列表 = document.getElementById('书架列表');
    const 继续区 = document.getElementById('继续区');
    const 文件输入 = document.getElementById('文件输入');
    const 封面输入 = document.getElementById('封面输入');

    let 当前页 = '书架';
    let 当前题材 = '全部';
    let 当前子类 = '';
    let 当前状态 = '全部';
    let 当前排序 = '人气';
    let 当前架进度 = '全部';
    let 当前架更新 = '全部';
    let 当前架来源 = '全部';
    let 当前架排序 = '最近读';

    /* ============================================================
     * 6. 导航（底部 Tab）
     * ============================================================ */
    const Tab们 = Array.from(document.querySelectorAll('.Tab项'));
    function 切页(名) {
        if (名 !== 当前页) 结算计时();
        当前页 = 名;
        Tab们.forEach(t => t.classList.toggle('选中', t.dataset.页 === 名));
        ['书架', '书城', '作者'].forEach(n => {
            document.getElementById('面板-' + n).classList.toggle('显示', n === 名);
        });
        中间标题.textContent = 名;
        /* 「更多」只在书架页出现（导入入口） */
        右钮.classList.toggle('隐藏', 名 !== '书架');
        if (名 !== '书架') 关更多();
        if (内容区) 内容区.scrollTop = 0;
        渲染();
    }
    Tab们.forEach(t => t.addEventListener('click', () => 切页(t.dataset.页)));

    /* ★★ 返回映射：从哪个界面进来，就回哪个界面
         ★ 用【表】而不是一串 if —— 以后再加入口，往表里加一行就行。 */
    const 返回表 = {
        '1': '1_shouyeyulan.html',   /* 首页预览 */
        '4': '4_tongxun.html',       /* 通讯录 */
        '7': '7_liaotian.html',      /* 聊天 */
    };
    const 默认回 = '1_shouyeyulan.html';
    const 来源键 = '阅读_来源';

    /**
     * ★★ 记来源：?from= 只在【带着参数进来】那一次才有。
     *    直接打开 / 刷新 / 从别处绕过入口时它会丢，所以落一份到 sessionStorage 兜底。
     *    （旧版只认 ?from=，一丢就只能 history.back()，
     *     而 history.back() 回到的是同一页时看起来就是「点了没反应」。）
     */
    (function 记来源() {
        const 来 = new URLSearchParams(location.search).get('from');
        if (来 && 返回表[来]) { try { sessionStorage.setItem(来源键, 来); } catch (e) {} }
    })();

    /** 从 referrer 里认出是哪一页（兜底第三层） */
    function 从引用来() {
        const 引 = document.referrer || '';
        const m = 引.match(/([^\/]+\.html)/);
        if (!m) return '';
        for (const k of Object.keys(返回表)) {
            if (返回表[k] === m[1]) return 返回表[k];
        }
        return '';
    }

    /**
     * @returns {string} 目标文件名；都查不到返回 ''（交给 history.back 的默认兜底）
     *   优先顺序：?from=  →  sessionStorage 记忆  →  referrer  →  空
     */
    function 回上一界面() {
        const 来 = new URLSearchParams(location.search).get('from');
        if (返回表[来]) return 返回表[来];
        let 记 = '';
        try { 记 = sessionStorage.getItem(来源键) || ''; } catch (e) {}
        if (返回表[记]) return 返回表[记];
        return 从引用来();
    }

    /** ★ 点返回键 / 按 Esc 都走这里 */
    function 回上一页() {
        const 去 = 回上一界面();
        if (去) { location.href = 去; return; }
        if (history.length > 1) { history.back(); return; }
        location.href = 默认回;
    }
    document.getElementById('返回按钮').addEventListener('click', 回上一页);
    /* ★ 与项目其他页保持一致：Esc 也能返回（21 页就是这个写法） */
    document.addEventListener('keydown', e => { if (e.key === 'Escape') 回上一页(); });

    /* ============================================================
     * 7. 更多菜单（导入）
     * ============================================================ */
    const 更多遮罩 = document.getElementById('更多遮罩');
    const 更多导入 = document.getElementById('更多导入');
    function 开更多() { 更多遮罩.classList.add('显示'); }
    function 关更多() { 更多遮罩.classList.remove('显示'); }
    右钮.addEventListener('click', () => {
        更多遮罩.classList.contains('显示') ? 关更多() : 开更多();
    });
    更多遮罩.addEventListener('click', e => { if (e.target === 更多遮罩) 关更多(); });
    更多导入.addEventListener('click', () => {
        关更多();
        文件输入.click();   /* 唤起系统文件选择器 */
    });

    /* ============================================================
     * 8. 导入 TXT
     * ============================================================ */
    文件输入.addEventListener('change', () => {
        const f = 文件输入.files && 文件输入.files[0];
        文件输入.value = '';
        if (!f) return;
        if (f.size > 单本上限) { 提示('文件太大，单本上限 3MB'); return; }
        const 读 = new FileReader();
        读.onload = async () => {
            /* ★ 先 UTF-8 严格解，失败退 GBK —— 中文小说常见 GBK，
                 直接 readAsText(f,'utf-8') 会得到一屏「�」 */
            let 文 = null;
            try { 文 = new TextDecoder('utf-8', { fatal: true }).decode(读.result); }
            catch (e) { try { 文 = new TextDecoder('gbk').decode(读.result); } catch (e2) { 文 = 读.result; } }
            const 名 = String(f.name || '未命名').replace(/\.txt$/i, '');
            const 章们 = 切章(文);
            const 书 = {
                id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                书名: 名, 作者: '本地导入', 分类: '其他', 状态: '连载',
                简介: '', 章节: 章们, 时间: Date.now(),
            };
            await 存书(书);
            const 书架 = 读表(书架键);
            书架.unshift(目录项(书, '本地', ''));
            写表(书架键, 书架);
            提示('《' + 名 + '》已导入，共 ' + 章们.length + ' 章');
            切页('书架');
        };
        读.readAsArrayBuffer(f);
    });

    /* ============================================================
     * 9. 书城
     * ============================================================ */
    async function 取书城源() { return 读表(平台键); }

    /**
     * ★ 点分类时调用 —— 上线后这里就是后台请求入口。
     *   现在只是本地过滤，签名保持 (条件) => 书数组。
     */
    async function 拉分类书(条件) {
        const 全 = await 取书城源();
        return 全.filter(b => {
            if (条件.状态 !== '全部' && 书状态(b) !== 条件.状态) return false;
            if (条件.题材 !== '全部' && 归类(b.分类) !== 条件.题材) return false;
            if (条件.子类 && !(b.分类 === 条件.子类 || b.细分 === 条件.子类)) return false;
            return true;
        });
    }

    async function 搜书(词) {
        const 关 = String(词 || '').trim().toLowerCase();
        let 表 = await 拉分类书({ 状态: 当前状态, 题材: 当前题材, 子类: 当前子类 });
        if (关) {
            表 = 表.filter(b =>
                (String(b.书名 || '') + ' ' + String(b.作者 || '') + ' '
                    + String(b.简介 || '') + ' ' + String(b.分类 || '') + ' '
                    + String(b.细分 || '')).toLowerCase().includes(关));
        }
        return 表;
    }
    /** 排序：人气按热门分（书架×3 + 阅读×1 + 评论×5） */
    function 排序书(表) {
        const 出 = 表.slice();
        if (当前排序 === '最新') return 出.sort((a, b) => (b.时间 || 0) - (a.时间 || 0));
        if (当前排序 === '字数') return 出.sort((a, b) => (b.字数 || 0) - (a.字数 || 0));
        return 出.sort((a, b) => 热门分(b) - 热门分(a) || (b.时间 || 0) - (a.时间 || 0));
    }

    /**
     * ★★ 猜你喜欢 —— 【全站整体热门】：
     *   口径与热门分一致：加入书架×3 + 阅读人数×1 + 评论数×5。
     *   ★ 不做个人题材偏好加权 —— 用户要的是「全站当下最热」，
     *     加权之后推荐就不再等于全站热门了。
     *   界面上只展示结果，不写口径说明（只要逻辑，不要提示）。
     */
    function 猜你喜欢(表) {
        return 表.slice().sort((a, b) =>
            热门分(b) - 热门分(a) || (b.时间 || 0) - (a.时间 || 0));
    }

    /** 分类宫格 */
    function 渲染分类宫() {
        const 全 = 读表(平台键);
        分类宫.innerHTML = '';
        题材表.filter(x => x !== '全部').forEach(名 => {
            const 项 = document.createElement('div');
            项.className = '宫格项' + (当前题材 === 名 ? ' 选中' : '');
            项.dataset.值 = 名;
            const 圈 = document.createElement('div');
            圈.className = '宫格圈';
            圈.textContent = 名.slice(0, 1);
            const 字 = document.createElement('div');
            字.className = '宫格名';
            字.textContent = 名;
            项.appendChild(圈); 项.appendChild(字);
            项.addEventListener('click', () => {
                当前题材 = 当前题材 === 名 ? '全部' : 名;   /* 再点一次取消 */
                if (当前题材 !== '其他') 当前子类 = '';
                渲染书城();
            });
            分类宫.appendChild(项);
        });
    }

    /**
     * 三个榜：人气 / 推荐 / 新书
     * ★ 口径各不相同：
     *   ① 人气榜 = 加入书架次数最多
     *   ② 推荐榜 = 阅读人数最多
     *   ③ 新书榜 = 只收 3 个月内发布的，再按加入书架次数最多排
     * ★ 界面不写这些口径说明（只要逻辑，不要提示）
     */
    const 榜定义 = [
        { 键: '人气', 名: '人气榜' },
        { 键: '推荐', 名: '推荐榜' },
        { 键: '新书', 名: '新书榜' },
    ];
    function 榜指标(键, 条目) {
        return 键 === '推荐'
            ? 字数文(取阅读数(条目.id)) + ' 人在读'
            : 字数文(取热度(条目.id)) + ' 人收藏';
    }
    function 取榜(键, 表) {
        const 值 = b => (键 === '推荐' ? 取阅读数(b.id) : 取热度(b.id));
        let 出 = 表.slice().sort((a, b) => 值(b) - 值(a) || (b.时间 || 0) - (a.时间 || 0));
        if (键 === '新书') {
            const 界 = Date.now() - 新书窗;
            const 内 = 出.filter(b => (b.时间 || 0) >= 界);
            if (内.length) 出 = 内;    /* 万一一本都没有，退回全部，别让榜空着 */
        }
        return 出;
    }
    function 渲染榜单(全) {
        榜单区.innerHTML = '';
        /* ★ 少于 2 本不排榜：1 本书排出三个一模一样的榜纯属占地方 */
        if (全.length < 2) return;
        榜定义.forEach(定 => {
            const 取 = 取榜(定.键, 全).slice(0, 榜单容量);
            if (!取.length) return;
            const 块 = document.createElement('div');
            块.className = '榜块';
            块.dataset.榜 = 定.键;
            const 题 = document.createElement('div');
            题.className = '分区标题';
            题.innerHTML = '<span>' + 定.名 + '</span>';
            块.appendChild(题);
            const 网 = document.createElement('div');
            网.className = '榜网格';
            网.dataset.榜 = 定.键;
            取.forEach((条目, i) => {
                const 卡 = document.createElement('div');
                /* ★ 第一名挂 .榜首：封面投影更重，一眼看到榜首 */
                卡.className = '榜卡' + (i === 0 ? ' 榜首' : '');
                卡.dataset.id = 条目.id;
                const 面 = document.createElement('div');
                面.className = '榜封面';
                const img = document.createElement('img');
                img.alt = ''; img.src = 取封面(条目);
                面.appendChild(img);
                if (i < 3) {
                    const 徽 = document.createElement('span');
                    徽.className = '排名徽 排名' + (i + 1);
                    /* ★ 前三写 TOP1/2/3，比单纯数字更有「榜」的网感 */
                    徽.textContent = 'TOP' + (i + 1);
                    面.appendChild(徽);
                }
                卡.appendChild(面);
                const 名 = document.createElement('div');
                名.className = '榜名';
                名.textContent = 条目.书名;
                卡.appendChild(名);
                const 副 = document.createElement('div');
                副.className = '榜热';
                副.textContent = 榜指标(定.键, 条目);
                卡.appendChild(副);
                卡.addEventListener('click', () => 开详情(条目.id));
                网.appendChild(卡);
            });
            块.appendChild(网);
            榜单区.appendChild(块);
        });
    }

    function 建书卡(条目, 按钮们) {
        const 卡 = document.createElement('div');
        卡.className = '书卡';
        卡.dataset.id = 条目.id;
        const 面 = document.createElement('div');
        面.className = '书封面';
        const img = document.createElement('img');
        img.alt = ''; img.src = 取封面(条目);
        面.appendChild(img);
        卡.appendChild(面);
        const 息 = document.createElement('div');
        息.className = '书信息';
        const 名 = document.createElement('div');
        名.className = '书名';
        名.textContent = 条目.书名;
        const 副 = document.createElement('div');
        副.className = '书副';
        副.textContent = (条目.作者 || '佚名') + ' · ' + 字数文(条目.字数) + '字 · ' + (条目.章数 || 0) + '章';
        const 简 = document.createElement('div');
        简.className = '书简';
        简.textContent = 条目.简介 || '';
        const 标 = document.createElement('div');
        标.className = '书标行';
        if (条目.分类) {
            const t = document.createElement('span');
            t.className = '同行标签'; t.textContent = 条目.分类; 标.appendChild(t);
        }
        const st = document.createElement('span');
        st.className = '同行标签'; st.textContent = 书状态(条目); 标.appendChild(st);
        息.appendChild(名); 息.appendChild(副);
        if (条目.简介) 息.appendChild(简);
        /* ★★ 标签与按钮【同一行】：标签在左占剩余空间，按钮贴右，等高同圆角同字号 */
        const 区 = document.createElement('div');
        区.className = '同行区';
        区.appendChild(标);
        (按钮们 || []).forEach(配 => {
            const 钮 = document.createElement('button');
            钮.className = '同行钮' + (配.已加 ? ' 已加' : '');
            钮.type = 'button';
            钮.dataset.作用 = 配.文;
            钮.textContent = 配.文;
            if (配.禁) 钮.disabled = true;
            else 钮.addEventListener('click', e => { e.stopPropagation(); 配.点(); });
            区.appendChild(钮);
        });
        息.appendChild(区);
        卡.appendChild(息);
        return 卡;
    }

    /**
     * ★ 热搜词：取平台里最热的前几个书名 + 题材名。
     *   纯装饰的假热搜没意义（点了搜不到东西），所以只放【真的搜得到】的词。
     */
    function 渲染热搜() {
        const 行 = document.getElementById('热搜行');
        if (!行) return;
        const 表 = 读表(平台键);
        const 词们 = 表.slice().sort((a, b) => 取热度(b.id) - 取热度(a.id))
            .slice(0, 3).map(p => p.书名).filter(Boolean);
        /* 书少时补两个题材名，免得这一行空着 */
        题材表.filter(x => x !== '全部').slice(0, 4).forEach(t => {
            if (词们.length < 5 && 表.some(p => p.分类 === t)) 词们.push(t);
        });
        if (!词们.length) { 行.innerHTML = ''; return; }
        行.innerHTML = '';
        const 标 = document.createElement('span');
        标.className = '热搜标'; 标.textContent = '热搜';
        行.appendChild(标);
        词们.forEach(w => {
            const b = document.createElement('button');
            b.className = '热搜词'; b.type = 'button';
            b.textContent = w;
            b.addEventListener('click', () => {
                搜索框.value = w;
                渲染书城();
                try { 搜索框.focus(); } catch (e) {}
            });
            行.appendChild(b);
        });
    }

    function 渲染书城() {
        const 词 = String(搜索框.value || '').trim();
        const 是搜索 = !!词;
        渲染分类宫();
        渲染热搜();

        /* 搜索时收起分类宫 / 热搜 / 榜单 —— 只留结果 */
        分类宫.style.display = 是搜索 ? 'none' : '';
        const 热搜行 = document.getElementById('热搜行');
        if (热搜行) 热搜行.style.display = 是搜索 ? 'none' : '';
        榜单区.style.display = (是搜索 || 当前题材 !== '全部') ? 'none' : '';

        搜书(搜索框.value).then(排好0 => {
            const 排好 = 排序书(排好0);
            渲染榜单(排好);

            /* ★ 猜你喜欢走【阅读偏好 × 热门】，不是榜单那份纯热门 */
            const 猜 = 猜你喜欢(排好0);
            const 显 = 是搜索 ? 排好 : 猜.slice(0, 热门容量);
            热门标题.textContent = 是搜索 ? '搜索结果' : '猜你喜欢';
            热门侧字.textContent = (是搜索 || 显.length >= 排好.length) ? '' : '部分';

            书城列表.innerHTML = '';
            if (!显.length) {
                const 空 = document.createElement('div');
                空.className = '空态';
                if (是搜索) {
                    空.innerHTML = '<span class="空态标">没搜到「' + 转义HTML(词) + '」</span>换个书名或作者试试';
                } else if (当前题材 !== '全部') {
                    空.innerHTML = '<span class="空态标">' + 转义HTML(当前题材) + '分类下还没有书</span>换个分类看看';
                } else {
                    空.innerHTML = '<span class="空态标">书城还是空的</span>去「作者中心」把书架里的书发布上来';
                }
                书城列表.appendChild(空);
                return;
            }
            const 书架 = 读表(书架键);
            显.forEach(条目 => {
                const 已有 = 书架.some(b => b.id === 条目.id);
                const 卡 = 建书卡(条目, [{
                    文: 已有 ? '已在书架' : '加入书架',
                    已加: 已有, 禁: 已有,
                    点: () => 加入书架(条目),
                }]);
                卡.addEventListener('click', () => 开详情(条目.id));
                书城列表.appendChild(卡);
            });
        });
    }
    let 搜索计时 = null;
    搜索框.addEventListener('input', () => {
        clearTimeout(搜索计时);
        搜索计时 = setTimeout(渲染书城, 220);
    });

    async function 加入书架(条目) {
        const 书架 = 读表(书架键);
        if (书架.some(b => b.id === 条目.id)) { 提示('已在书架里了'); return; }
        书架.unshift(条目);
        写表(书架键, 书架);
        加热度(条目.id, 1);
        提示('《' + 条目.书名 + '》已加入书架');
        渲染书城();
    }

    /* ============================================================
     * 10. 书架
     * ============================================================ */
    function 刷新时长() {
        const t = 读时长();
        const 今 = document.getElementById('今日时长');
        const 累 = document.getElementById('累计时长');
        if (今) 今.textContent = 时长文(t.今日);
        if (累) 累.textContent = 时长文(t.累计);
    }

    function 阅读比(条目) {
        const p = 读进度(条目.id);
        const 总 = Number(条目.章数) || 0;
        if (!p || !总) return 0;
        return Math.min(1, ((Number(p.章) || 0) + 1) / 总);
    }
    function 按架筛选(表) {
        return 表.filter(b => {
            const r = 阅读比(b);
            if (当前架进度 === '未读' && r !== 0) return false;
            if (当前架进度 === '在读' && !(r > 0 && r < 1)) return false;
            if (当前架进度 === '已读' && r < 1) return false;
            if (当前架更新 !== '全部' && 书状态(b) !== 当前架更新) return false;
            if (当前架来源 !== '全部' && 书来源(b) !== 当前架来源) return false;
            return true;
        });
    }
    function 按架排序(表) {
        const 复 = 表.slice();
        if (当前架排序 === '书名') return 复.sort((a, b) => String(a.书名).localeCompare(String(b.书名), 'zh'));
        if (当前架排序 === '最近加') return 复.sort((a, b) => (b.时间 || 0) - (a.时间 || 0));
        return 复.sort((a, b) => {
            const pa = 读进度(a.id), pb = 读进度(b.id);
            if (!pa && !pb) return (b.时间 || 0) - (a.时间 || 0);
            if (!pa) return 1;
            if (!pb) return -1;
            return (pb.时间 || 0) - (pa.时间 || 0);
        });
    }

    /** 三组 chips：每组只按本组条件统计数量（否则三组一叠数量会互相乘出来） */
    function 建chips(容器, 项们, 当前, 点) {
        容器.innerHTML = '';
        项们.forEach(值 => {
            const 钮 = document.createElement('button');
            钮.className = 'chip' + (当前 === 值 ? ' 选中' : '');
            钮.type = 'button';
            钮.dataset.值 = 值;
            钮.textContent = 值;
            钮.addEventListener('click', () => 点(值));
            容器.appendChild(钮);
        });
    }
    function 渲染架筛选(架) {
        const 比 = b => 阅读比(b);
        const 计 = {
            全部: 架.length,
            未读: 架.filter(b => 比(b) === 0).length,
            在读: 架.filter(b => 比(b) > 0 && 比(b) < 1).length,
            已读: 架.filter(b => 比(b) >= 1).length,
        };
        建chips(document.getElementById('架进度栏'), 架进度表, 当前架进度,
            v => { 当前架进度 = v; 渲染书架(); });
        Array.from(document.getElementById('架进度栏').children).forEach(钮 => {
            钮.textContent = 钮.dataset.值 + ' ' + (计[钮.dataset.值] || 0);
        });

        const 更计 = { 全部: 架.length };
        架更新表.filter(x => x !== '全部').forEach(x => {
            更计[x] = 架.filter(b => 书状态(b) === x).length;
        });
        建chips(document.getElementById('架更新栏'), 架更新表, 当前架更新,
            v => { 当前架更新 = v; 渲染书架(); });
        Array.from(document.getElementById('架更新栏').children).forEach(钮 => {
            钮.textContent = 钮.dataset.值 + ' ' + (更计[钮.dataset.值] || 0);
        });

        const 来计 = { 全部: 架.length };
        架来源表.filter(x => x !== '全部').forEach(x => {
            来计[x] = 架.filter(b => 书来源(b) === x).length;
        });
        建chips(document.getElementById('架来源栏'), 架来源表, 当前架来源,
            v => { 当前架来源 = v; 渲染书架(); });
        Array.from(document.getElementById('架来源栏').children).forEach(钮 => {
            钮.textContent = 钮.dataset.值 + ' ' + (来计[钮.dataset.值] || 0);
        });

        建chips(document.getElementById('架排序栏'), 架排序表, 当前架排序,
            v => { 当前架排序 = v; 渲染书架(); });
    }

    /** 继续阅读：读到哪记到哪 */
    function 渲染继续(全架) {
        继续区.innerHTML = '';
        let 最佳 = null;
        全架.forEach(b => {
            const p = 读进度(b.id);
            if (!p) return;
            if (!最佳 || (p.时间 || 0) > (最佳.p.时间 || 0)) 最佳 = { b: b, p: p };
        });
        if (!最佳) return;
        const 条目 = 最佳.b;
        const 比 = 阅读比(条目);
        if (比 >= 1) return;    /* 读完了就不用「继续」了 */

        const 卡 = document.createElement('div');
        卡.className = '继续卡';
        卡.id = '继续卡';
        const 面 = document.createElement('div');
        面.className = '继续封面';
        const img = document.createElement('img');
        img.alt = ''; img.src = 造封面(条目.书名, 条目.作者);
        面.appendChild(img);
        卡.appendChild(面);
        const 文 = document.createElement('div');
        文.className = '继续文';
        const 名 = document.createElement('div');
        名.className = '继续名';
        名.textContent = 条目.书名;
        const 副 = document.createElement('div');
        副.className = '继续副';
        副.textContent = '读到第 ' + (Number(最佳.p.章) + 1) + ' 章 · ' + Math.round(比 * 100) + '%';
        const 条 = document.createElement('div');
        条.className = '进度条';
        const 内 = document.createElement('div');
        内.className = '进度内';
        内.style.width = Math.round(比 * 100) + '%';
        条.appendChild(内);
        文.appendChild(名); 文.appendChild(副); 文.appendChild(条);
        卡.appendChild(文);
        const 钮 = document.createElement('button');
        钮.className = '小钮 主';
        钮.type = 'button';
        钮.textContent = '继续';
        钮.addEventListener('click', e => {
            e.stopPropagation();
            开书来源 = null;                 /* 从书架进来 → 返回就回书架 */
            开书(条目.id, Number(最佳.p.章));
        });
        卡.appendChild(钮);
        卡.addEventListener('click', () => 开详情(条目.id));
        继续区.appendChild(卡);
    }

    /** ★ 长按 → 移出书架（4 列网格里放删除按钮太挤，长按是阅读 App 的通用手势） */
    const 长按阈值 = 480;
    const 移动阈值 = 12;
    const 长按条 = document.getElementById('长按条');
    let 长按目标 = null;

    function 挂长按(卡, 条目) {
        let 计时 = null, 起x = 0, 起y = 0, 算了 = false;
        const 取消 = () => { clearTimeout(计时); 计时 = null; };
        const 触发 = () => { 算了 = true; 长按目标 = 条目; 开长按条(条目); };
        卡.addEventListener('touchstart', e => {
            const t = e.touches && e.touches[0];
            起x = t ? t.clientX : 0; 起y = t ? t.clientY : 0;
            算了 = false; 取消();
            计时 = setTimeout(触发, 长按阈值);
        }, { passive: true });
        卡.addEventListener('touchmove', e => {
            const t = e.touches && e.touches[0];
            if (!t) return;
            if (Math.abs(t.clientX - 起x) > 移动阈值 || Math.abs(t.clientY - 起y) > 移动阈值) 取消();
        }, { passive: true });
        卡.addEventListener('touchend', () => {
            取消();
            /* 长按触发过就吃掉这次 click —— 松手不该还进详情 */
            if (算了) {
                算了 = false;
                卡.dataset.吞一次 = '1';
                setTimeout(() => { delete 卡.dataset.吞一次; }, 60);
            }
        });
        卡.addEventListener('touchcancel', 取消);
        卡.addEventListener('mousedown', () => { 取消(); 计时 = setTimeout(触发, 长按阈值); });
        卡.addEventListener('mouseup', 取消);
        卡.addEventListener('mouseleave', 取消);
    }
    function 开长按条(条目) {
        长按条.innerHTML = '';
        const 名 = document.createElement('span');
        名.className = '长按名';
        名.textContent = '《' + 条目.书名 + '》';
        const 移 = document.createElement('button');
        移.className = '小钮 主';
        移.type = 'button';
        移.id = '长按移出';
        移.textContent = '移出书架';
        移.addEventListener('click', async () => {
            关长按条();
            const id = 条目.id;
            await 删书(id);
            写表(书架键, 读表(书架键).filter(b => b.id !== id));
            清进度(id);
            提示('已移出书架');
            渲染();
        });
        const 取 = document.createElement('button');
        取.className = '小钮';
        取.type = 'button';
        取.textContent = '取消';
        取.addEventListener('click', 关长按条);
        长按条.appendChild(名); 长按条.appendChild(移); 长按条.appendChild(取);
        长按条.classList.add('显示');
    }
    function 关长按条() { 长按条.classList.remove('显示'); 长按目标 = null; }

    function 渲染书架() {
        const 全架 = 读表(书架键);
        刷新时长();
        渲染继续(全架);
        渲染架筛选(全架);

        const 读过 = 全架.filter(b => 读进度(b.id)).length;
        const 总数元 = document.getElementById('书架总数');
        const 读过元 = document.getElementById('读过总数');
        if (总数元) 总数元.textContent = String(全架.length);
        if (读过元) 读过元.textContent = String(读过);

        书架列表.innerHTML = '';
        const 架 = 按架排序(按架筛选(全架));

        if (!全架.length) {
            书架列表.appendChild(建书架空态());
            return;
        }
        if (!架.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            const 条件文 = [当前架进度, 当前架更新, 当前架来源]
                .filter(x => x !== '全部').join(' · ');
            空.innerHTML = '<span class="空态标">「' + 转义HTML(条件文 || '当前条件') + '」里没有书</span>换个筛选条件看看';
            书架列表.appendChild(空);
            return;
        }

        const 网 = document.createElement('div');
        网.className = '书架网格';
        架.forEach(条目 => {
            const 比 = 阅读比(条目);
            const 卡 = document.createElement('div');
            卡.className = '架卡';
            卡.dataset.id = 条目.id;
            const 面 = document.createElement('div');
            面.className = '架封面';
            const img = document.createElement('img');
            img.alt = ''; img.src = 造封面(条目.书名, 条目.作者);
            面.appendChild(img);
            const 角 = document.createElement('span');
            角.className = '状态角 ' + 书状态(条目);
            角.textContent = 书状态(条目);
            面.appendChild(角);
            if (比 >= 1) {
                const p = document.createElement('span');
                p.className = '进度角 读完'; p.textContent = '读完'; 面.appendChild(p);
            } else if (比 > 0) {
                const p = document.createElement('span');
                p.className = '进度角'; p.textContent = Math.round(比 * 100) + '%'; 面.appendChild(p);
            }
            卡.appendChild(面);
            const 名 = document.createElement('div');
            名.className = '架名';
            名.textContent = 条目.书名;
            卡.appendChild(名);
            卡.addEventListener('click', () => {
                if (卡.dataset.吞一次) return;
                开详情(条目.id);
            });
            挂长按(卡, 条目);
            网.appendChild(卡);
        });
        书架列表.appendChild(网);
    }

    function 建书架空态() {
        const 空 = document.createElement('div');
        空.className = '空态 架空';
        空.id = '架空态';
        const 画 = document.createElement('div');
        画.className = '空态画';

            + '<path d="M14 12c-4 3-6 7-6 12v26c0 3 2 5 5 5h13c2 0 3-1 3-3V16c0-3-3-5-6-4z"/>'
            + '<path d="M50 12c4 3 6 7 6 12v26c0 3-2 5-5 5H38c-2 0-3-1-3-3V16c0-3 3-5 6-4z"/>'
            + '<path d="M32 18v30"/>'
            + '</svg>';

    /* ============================================================
     * 11. 作者中心
     * ============================================================ */
    function 渲染作者() {
        const 笔名 = localStorage.getItem(笔名键) || '';
        const 显示 = document.getElementById('笔名显示');
        显示.textContent = 笔名 || '未设置笔名';
        显示.style.color = 笔名 ? '' : 'var(--ink-4)';
        /* ★ 作家头像 = 全站【用户头像】
             没设用户头像时才退回首字。两者同源，改了头像这里跟着变。 */
        同步作家头像();
        document.getElementById('名片副').textContent = 笔名
            ? ('共 ' + 我的作品().length + ' 部作品')
            : '设置笔名后即可发布作品';

        const 我的 = 我的作品();
        /* 分类下拉（只建一次） */
        ['新分类'].forEach(键 => {
            const 下 = document.getElementById(键);
            if (!下 || 下.options.length) return;
            题材表.filter(x => x !== '全部').concat(其他子类).forEach(名 => {
                const o = document.createElement('option');
                o.value = 名; o.textContent = 名;
                下.appendChild(o);
            });
            下.value = '其他';
        });
        const 新建钮 = document.getElementById('新建钮');
        新建钮.disabled = !笔名;
        新建钮.textContent = 笔名 ? '创建并开始写第一章' : '先设置笔名';
        /* ★ 封面预览（新建时用） */
        渲染封面预览();

        /* 作品管理 */
        const 列 = document.getElementById('作品列表');
        const 侧 = document.getElementById('管理侧字');
        侧.textContent = 我的.length ? '共 ' + 我的.length + ' 部' : '';
        列.innerHTML = '';
        if (!我的.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有作品</span>'
                + (笔名 ? '用上面的「新建作品」直接开写吧' : '先设置笔名，再开新书');
            列.appendChild(空);
            return;
        }
        我的.forEach(p => {
            const 卡 = document.createElement('div');
            卡.className = '作品卡';
            卡.dataset.id = p.id;
            /* ★ 点卡片进【作品编辑界面】（新章节 / 草稿箱 / 设置封面），
                 不是直接跳进某一章 —— 作者先看到的是工作台。 */
            卡.addEventListener('click', () => 开作品页(p.id));
            /* ★ 用自己的封面（3:4），没设就按书名生成 */
            const 封 = document.createElement('div');
            封.className = '作品封面';
            const 图 = document.createElement('img');
            图.alt = ''; 图.src = 取封面(p);
            封.appendChild(图);
            卡.appendChild(封);

            const 息 = document.createElement('div');
            息.className = '作品息';

            const 名行 = document.createElement('div');
            名行.className = '作品名行';
            const 名 = document.createElement('div');
            名.className = '书名'; 名.textContent = p.书名;
            const 态 = document.createElement('span');
            态.className = '作品态 ' + 书状态(p);
            态.textContent = 书状态(p);
            名行.appendChild(名); 名行.appendChild(态);
            息.appendChild(名行);

            const 副 = document.createElement('div');
            副.className = '书副';

            const 数 = document.createElement('div');

            写.className = '小钮 主'; 写.type = 'button'; 写.textContent = '写新章节';
            写.addEventListener('click', e => { e.stopPropagation(); 开编辑器(p.id); });

            const 换封 = document.createElement('button');
            换封.className = '小钮'; 换封.type = 'button'; 换封.textContent = '封面';
            换封.addEventListener('click', e => {
                e.stopPropagation();

            });

            删.addEventListener('click', e => {
                e.stopPropagation();

        });
        渲染互动();
    }

    /* ---------- 封面 ---------- */
    /** ★ 取封面：有自定义就用自定义，否则按书名生成 */
    function 取封面(条) {
        return (条 && 条.封面) ? 条.封面 : 造封面(条 ? 条.书名 : '', 条 ? 条.作者 : '');
    }
    let 待用封面 = '';   /* 新建时选的封面 */

        const 盒 = document.getElementById('封面预览');
        if (!盒) return;
        const 名 = (document.getElementById('新书名') || {}).value || '';

    /* ---------- 删除作品 ---------- */
    /** ★ 删除要清干净：目录、书架、正文、进度、热度、阅读数、评论、封面、草稿 */
    function 删作品(id) {
        写表(平台键, 读表(平台键).filter(x => x.id !== id));
        写表(书架键, 读表(书架键).filter(x => x.id !== id));
        删书(id);
        清进度(id);
        [热度键, 人数键, 深键, 评论键].forEach(键 => {
            const 表 = 读字典(键); delete 表[id]; 写字典(键, 表);
        });
        /* 草稿：章号不固定，按前缀扫一遍 */
        扫键('阅读_草稿_' + id + '_').forEach(k => localStorage.removeItem(k));
    }

    /* ---------- 读者互动 ---------- */
    /**
     * ★ 作者视角的读者互动：
     *   ① 读者评论 —— 可逐条回复

        let 评数 = 0, 消数 = 0;
        我的.forEach(p => {
            const 卡 = document.createElement('div');

            /* ① 评论 */

            if (们.length) {

                标.appendChild(计);
                卡.appendChild(标);
                们.slice().reverse().forEach(c => {
                    评数++;
                    const 行 = document.createElement('div');
                    行.className = '评行';
                    const 文 = document.createElement('div');
                    文.className = '评文'; 文.textContent = (c && c.文) || '';
                    行.appendChild(文);
                    if (c && c.回) {
                        const 回 = document.createElement('div');
                        回.className = '评回';
                        const 标2 = document.createElement('span');
                        标2.className = '回标'; 标2.textContent = '我的回复';
                        回.appendChild(标2);
                        回.appendChild(document.createTextNode(c.回));
                        行.appendChild(回);
                    } else {
                        const 操 = document.createElement('div');
                        操.className = '评操作';
                        const 入 = document.createElement('input');
                        入.className = '行输入'; 入.type = 'text';
                        入.placeholder = '回复这位读者……'; 入.maxLength = 60;
                        const 钮 = document.createElement('button');
                        钮.className = '小钮 主'; 钮.type = 'button'; 钮.textContent = '回复';
                        钮.addEventListener('click', () => {
                            const v = 入.value.trim();
                            if (!v) { 提示('写点什么再回复'); return; }
                            回评论(p.id, c, v);
                            渲染作者();
                            提示('已回复');
                        });
                        操.appendChild(入); 操.appendChild(钮);
                        行.appendChild(操);
                    }
                    卡.appendChild(行);
                });
            }

            /* ② 书架消息 */
            const 数 = 取热度(p.id);
            if (数 > 0) {
                消数 += 数;
                const 标 = document.createElement('div');
                标.className = '分区标题'; 标.textContent = '书架消息';
                const 计 = document.createElement('span');
                计.className = '侧字'; 计.textContent = 数 + ' 次加入书架';
                标.appendChild(计);
                卡.appendChild(标);
                const 行 = document.createElement('div');
                行.className = '消行';
                行.textContent = '有读者把《' + p.书名 + '》加入了书架';
                const 时 = document.createElement('span');
                时.className = '时'; 时.textContent = '共 ' + 数 + ' 次';
                行.appendChild(时);
                卡.appendChild(行);
            }
            if (们.length || 数 > 0) 区.appendChild(卡);
        });
        侧.textContent = (评数 || 消数) ? (评数 + ' 条评论 · ' + 消数 + ' 次书架') : '';
        if (!区.children.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有读者互动</span>作品被评论或加入书架后会出现在这里';
            区.appendChild(空);
        }
    }

    /** ★ 回复读者评论：按【内容+时间】定位，避免多个空评论互相串号 */
    function 回评论(id, 条, 文) {
        const 表 = 读字典(评论键);
        const 评 = 表[id];
        if (!评 || !Array.isArray(评.列表)) return;
        const 目标 = 评.列表.find(c => c && c.文 === 条.文 && c.时 === 条.时);
        if (!目标) return;
        目标.回 = 文;
        写字典(评论键, 表);
    }

    /**
     * ★ 作家头像与【用户头像】同步：
     *   localStorage 里有个全站的 `用户头像`（dataURL，1 页在用）。
     *   有头像就显示图，没有才退回首字。
     * ★ 监听 storage 事件 —— 别的页改了头像，这一页立刻跟着变，
     *   不用等重新进入。
     */
    /**
     * ★ 作家头像与全站【用户头像】同步。
     *   ① 1 页换过 → 用那张
     *   ② 没换过   → 默认头像图（跟 1 页默认显示的一样）
     *   ③ 图加载失败（素材缺失）→ 才退回首字，不至于显示破图
     */
    function 同步作家头像() {
        const 图 = document.getElementById('头像图');
        const 字 = document.getElementById('头像字');
        if (!图 || !字) return;
        let 头 = '';
        try { 头 = localStorage.getItem('用户头像') || ''; } catch (e) {}
        const 笔名 = localStorage.getItem(笔名键) || '';
        /* ★ 有图时也更新首字，免得残留上一个笔名的字 */
        字.textContent = 笔名 ? 笔名.slice(0, 1) : '作';
        图.onload = () => { 图.hidden = false; 字.hidden = true; };
        图.onerror = () => { 图.hidden = true; 字.hidden = false; };
        图.hidden = false; 字.hidden = true;
        图.src = 头 || 默认头像;
    }
    window.addEventListener('storage', e => {
        if (e.key === '用户头像' || e.key === 笔名键) 同步作家头像();
    });

    /* ============================================================
     * 13.7 作者主页：看这个作者的其他书
     * ============================================================ */
    const 作者遮罩 = document.getElementById('作者遮罩');
    let 主页作者 = '';

    async function 开作者主页(作者名) {
        主页作者 = String(作者名 || '').trim();
        作者遮罩.classList.add('显示');
        /* ★ 作者主页背景也随【整页主题背景】：
             本身透明 → 靠 ::before 压 70% 白（与阅读器 / 编辑器统一）→ 挂 .编辑中 收起下层 UI，

        const 外层 = document.querySelector('.手机主题背景容器');

    function 关作者主页() {
        作者遮罩.classList.remove('显示');
        /* ★ 同上：编辑器可能还开着（从作者主页点「写」后没关）。 */
        收起沉浸(document.querySelector('.手机主题背景容器'));

    document.getElementById('作者返回').addEventListener('click', 关作者主页);

    async function 渲染作者主页() {
        const 体 = document.getElementById('作者体');
        体.innerHTML = '';

        /* ★ 该作者的全部作品（书城里搜得到的） */
        const 们 = 读表(平台键).filter(p => (p.作者 || '') === 主页作者);
        const 章总 = 们.reduce((n, p) => n + (Number(p.章数) || 0), 0);
        document.getElementById('作者主页副').textContent =
            们.length ? (们.length + ' 部作品 · ' + 章总 + ' 章') : '';

        /* 名片：头像也跟用户头像同步（自己看自己的主页时） */
        const 名 = document.createElement('div');
        名.className = '作者名片';
        const 头 = document.createElement('div');
        头.className = '作者头像';

        /* ★ 自己 → 全站用户头像；别人 → 通讯录里这位联系人的头像；都没有 → 默认头像图。
             口径与作家名片、1 页一致（没换过就回落默认图，不是退首字）。 */
        let 头图 = '';
        if (是自己) {
            try { 头图 = localStorage.getItem('用户头像') || ''; } catch (e) {}
        } else {
            let 索引 = [];
            try {
                const v = JSON.parse(localStorage.getItem('联系人索引') || '[]');
                if (Array.isArray(v)) 索引 = v;
            } catch (e) {}
            const 那 = 索引.find(c => (c.名称 || c.备注) === 主页作者);
            if (那 && 那.头像) 头图 = 那.头像;
        }
        const im = document.createElement('img');
        im.alt = '';
        im.onerror = () => { im.remove(); 头.textContent = 主页作者 ? 主页作者.slice(0, 1) : '作'; };
        im.src = 头图 || 默认头像;
        头.appendChild(im);
        const 息 = document.createElement('div');
        息.style.cssText = 'flex:1;min-width:0';
        const 名2 = document.createElement('div');
        名2.className = '作者名'; 名2.textContent = 主页作者 || '佚名';
        const 副 = document.createElement('div');
        副.className = '作者副';
        副.textContent = 是自己 ? '我（这是你自己的主页）' : '这位作者的其他作品';
        息.appendChild(名2); 息.appendChild(副);
        名.appendChild(头); 名.appendChild(息);
        体.appendChild(名);

        if (!们.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有其他作品</span>这位作者暂时只发布了这些';
            体.appendChild(空);

        }
        们.forEach(p => {
            const 卡 = 建书卡(p, []);

            });
            体.appendChild(卡);
