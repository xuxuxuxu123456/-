    /* ============================================================
     * 13.9 听书：选一位角色联系人，用他的音色念
     *   ★ 音色来源与 7 / 14 页完全一致：
     *     ① 音色配置_<联系人id>（3 页 per-contact 调的：克隆 ID / 音色 / 音速…）
     *     ② 音频API配置（21 页写：网址 / 密钥 / 模型）
     *     ③ 都没配 → 退系统朗读，并如实说明（不假装是角色在念）
     * ============================================================ */
    const 听书遮罩 = document.getElementById('听书遮罩');
    let 念的人 = null;      /* { id, 名, 音色, 来源, 音速, 语调, 语言, 性别 } */

    /** 读该联系人的音色分桶（与 14 页同口径） */
    function 取联系人音色(联系人ID) {
        let 分桶 = null;
        try {
            const v = JSON.parse(localStorage.getItem('音色配置_' + 联系人ID) || 'null');
            if (v && typeof v === 'object') 分桶 = v;
        } catch (e) {}
        const 自定 = String((分桶 && 分桶.自定义ID) || '').trim();
        const 用分桶 = !!(分桶 && 分桶.已启用 && (自定 || 分桶.音色));
        const 音色 = 用分桶 ? (自定 || String(分桶.音色 || '').trim()) : '';
        return {
            音色: 音色,
            来源: (用分桶 && 自定) ? '克隆' : (用分桶 ? '联系人' : '默认'),
            音速: (分桶 && typeof 分桶.音速 === 'number') ? 分桶.音速 : 1,
            语调: (分桶 && typeof 分桶.语调 === 'number') ? 分桶.语调 : 1,
            语言: String((分桶 && 分桶.语言) || '').trim(),
            性别: String((分桶 && 分桶.性别) || '').trim(),
        };
    }

    function 读音频配置() {
        try {
            const v = JSON.parse(localStorage.getItem('音频API配置') || 'null');
            return (v && typeof v === 'object') ? v : null;
        } catch (e) { return null; }
    }

    function 开听书() {
        if (!当前书 || 阅读态 !== '正文') { 提示('先打开一章再听'); return; }
        渲染听书面板();
        听书遮罩.classList.add('显示');
    }
    function 关听书() { 听书遮罩.classList.remove('显示'); }
    document.getElementById('听书关闭').addEventListener('click', 关听书);
    听书遮罩.addEventListener('click', e => { if (e.target === 听书遮罩) 关听书(); });
    document.getElementById('听书钮').addEventListener('click', 开听书);

    function 渲染听书面板() {
        const 体 = document.getElementById('听书体');
        const 底 = document.getElementById('听书底');
        体.innerHTML = ''; 底.innerHTML = '';

        let 索引 = [];
        try {
            const v = JSON.parse(localStorage.getItem('联系人索引') || '[]');
            if (Array.isArray(v)) 索引 = v;
        } catch (e) {}
        const 配置 = 读音频配置();
        const 有API = !!(配置 && 配置.网址 && 配置.密钥);

        const 说 = document.createElement('div');
        说.className = '提示文';
        说.textContent = 有API
            ? '选一位角色，会用他在 3 页设好的音色来念。'
            : '还没配音频 API，会用系统语音朗读（不是角色的音色）。可在「我的 → 音频API」里配。';
        体.appendChild(说);

        if (!索引.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有联系人</span>先去通讯录添加角色';
            体.appendChild(空);
            return;
        }

        索引.forEach(c => {
            const 音 = 取联系人音色(c.id);
            const 行 = document.createElement('button');
            行.className = '抽屉行' + (念的人 && 念的人.id === c.id ? ' 当前' : '');
            行.type = 'button';
            行.dataset.人 = String(c.id);

            const 头 = document.createElement('span');
            头.className = '章序';
            头.textContent = '';
            行.appendChild(头);

            const 名 = document.createElement('span');
            名.className = '章题';
            名.textContent = c.名称 || c.备注 || ('联系人 ' + c.id);
            行.appendChild(名);

            const 标 = document.createElement('span');
            标.className = '草稿标';
            标.textContent = 有API ? (音.音色 ? (音.来源 + '·' + 音.音色) : '未设音色') : '系统语音';
            行.appendChild(标);

            行.addEventListener('click', () => {
                念的人 = Object.assign({ id: c.id, 名: 名.textContent }, 音);
                关听书();
                开始念();
            });
            体.appendChild(行);
        });

        const 停 = document.createElement('button');
        停.className = '大钮 次'; 停.type = 'button'; 停.textContent = '停止朗读';
        停.addEventListener('click', () => { 停念(); 关听书(); 提示('已停止'); });
        底.appendChild(停);
    }

    /** ★ 把当前章正文切成小段再念：整章一次请求太容易被服务端截断 */
    function 切朗读段(文) {
        const 句 = String(文 || '').split(/(?<=[。！？；!?;])/).map(s => s.trim()).filter(Boolean);
        const 出 = [];
        let 缓冲 = '';
        句.forEach(s => {
            if ((缓冲 + s).length > 180) { if (缓冲) 出.push(缓冲); 缓冲 = s; }
            else 缓冲 += s;
        });
        if (缓冲) 出.push(缓冲);
        return 出.length ? 出 : [String(文 || '')];
    }

    async function 开始念() {
        if (!当前书 || 阅读态 !== '正文' || !念的人) return;
        停念();
        const 章 = 当前书.章节[当前章];
        if (!章) return;
        const 段们 = 切朗读段(章.正文);
        const 配置 = 读音频配置();
        const 有API = !!(配置 && 配置.网址 && 配置.密钥) && !!念的人.音色;

        提示('开始朗读：' + 念的人.名);
        if (!有API) { 系统念(段们); return; }

        for (const 段 of 段们) {
            if (!念的人) return;            /* 中途停了 */
            const r = await 合成一段(段, 配置);
            if (!念的人) return;
            if (r && r.好 && r.url) {
                try { await 播一段(r.url); } catch (e) { break; }
            } else {
                /* ★ 合成失败不静默：告诉用户原因，别让他以为是书没声音 */
                提示('朗读中断：' + ((r && r.原因) || '合成失败'));
                return;
            }
        }
        提示('本章读完了');
    }

    /** ★ 调音频 API 合成一段（端点拼法与 14 页一致，逐个试） */
    async function 合成一段(文, 配置) {
        const 基 = String(配置.网址 || '').replace(/\/+$/, '');
        const 地址表 = [基 + '/v1/audio/speech', 基 + '/audio/speech'];
        const 体 = JSON.stringify({
            model: 配置.模型 || 'tts-1',
            input: 文,
            voice: 念的人.音色,
            ...(念的人.音速 !== 1 ? { speed: 念的人.音速 } : {}),
            ...(念的人.语调 !== 1 ? { pitch: 念的人.语调, tone: 念的人.语调, intonation: 念的人.语调 } : {}),
            ...(念的人.语言 ? { language: 念的人.语言, lang: 念的人.语言 } : {}),
            ...(念的人.性别 ? { gender: 念的人.性别, voice_gender: 念的人.性别 } : {}),
            response_format: 'mp3',
        });
        for (const url of 地址表) {
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + (配置.密钥 || ''),
                        'Content-Type': 'application/json',
                    },
                    body: 体,
                });
                if (!r.ok) continue;
                const b = await r.blob().catch(() => null);
                if (!b || !b.size) continue;
                return { 好: true, url: URL.createObjectURL(b) };
            } catch (e) {}
        }
        return { 好: false, 原因: '合成失败' };
    }

    let 当前音频 = null;
    function 播一段(url) {
        return new Promise((完成) => {
            const a = new Audio(url);
            当前音频 = a;
            a.onended = () => { try { URL.revokeObjectURL(url); } catch (e) {} 完成(); };
            a.onerror = () => { try { URL.revokeObjectURL(url); } catch (e) {} 完成(); };
            a.play().catch(() => 完成());
        });
    }

    /** ★ 没配 API 时的兜底：用系统语音（如实说明，不假装是角色音色） */
    function 系统念(段们) {
        if (typeof speechSynthesis === 'undefined' || !speechSynthesis) {
            提示('这台设备不支持朗读');
            return;
        }
        speechSynthesis.cancel();
        段们.forEach(s => {
            const u = new SpeechSynthesisUtterance(s);
            u.lang = 'zh-CN';
            u.rate = Number(念的人 && 念的人.音速) || 1;
            speechSynthesis.speak(u);
        });
    }

    function 停念() {
        try { if (当前音频) { 当前音频.pause(); 当前音频 = null; } } catch (e) {}
        try { if (typeof speechSynthesis !== 'undefined' && speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    }
    /* 关书 / 切章要停，否则会一直念下去 */
    document.getElementById('阅读返回').addEventListener('click', 停念);

    /* ============================================================
     * 13.8 段评：长按段落写评论，点段落看段评
     * ============================================================ */
    const 段评遮罩 = document.getElementById('段评遮罩');
    let 段评书 = null, 段评章 = -1, 段评段 = -1;

    /** 段评键：一本书一章一段 */
    function 段键(id, 章, 段) { return id + '|' + 章 + '|' + 段; }
    function 读段评表() { return 读字典(段评键); }

    /** ★ 段评数量（给段落角标用） */
    function 段评数(id, 章, 段) {
        const 表 = 读段评表();
        const 们 = 表[段键(id, 章, 段)];
        return Array.isArray(们) ? 们.length : 0;
    }

    /** ★ 第四参数 直写=true 表示是长按进来的 —— 直接聚焦输入框，少点一次 */
    function 开段评(id, 章, 段, 直写) {
        段评书 = id; 段评章 = 章; 段评段 = 段;
        段评遮罩.classList.add('显示');
        渲染段评();
        if (直写) {
            const 入 = document.getElementById('段评输入');
            if (入) setTimeout(() => { try { 入.focus(); } catch (e) {} }, 60);
        }
    }
    function 关段评() {
        段评遮罩.classList.remove('显示');
        段评书 = null; 段评章 = -1; 段评段 = -1;
    }
    document.getElementById('段评关闭').addEventListener('click', 关段评);
    段评遮罩.addEventListener('click', e => { if (e.target === 段评遮罩) 关段评(); });

    function 渲染段评() {
        const 体 = document.getElementById('段评体');
        const 原 = document.getElementById('段评原文');
        体.innerHTML = '';
        if (段评段 < 0 || !当前书) return;

        const 章 = 当前书.章节[段评章];
        const 段文 = 章 ? String(章.正文 || '').split(/\n\s*\n/)[段评段] || '' : '';
        原.textContent = 段文.replace(/\n/g, ' ').trim().slice(0, 60);

        const 键 = 段键(段评书, 段评章, 段评段);
        const 表 = 读段评表();
        const 们 = Array.isArray(表[键]) ? 表[键] : [];
        document.getElementById('段评数').textContent = 们.length ? (们.length + ' 条') : '';

        if (!们.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有段评</span>长按这段话就能写下想法';
            体.appendChild(空);
        }
        们.forEach(c => {
            const 行 = document.createElement('div');
            行.className = '评行';
            const 文 = document.createElement('div');
            文.className = '评文'; 文.textContent = (c && c.文) || '';
            行.appendChild(文);
            体.appendChild(行);
        });

        /* 输入 */
        const 输行 = document.createElement('div');
        输行.className = '评论输行';
        const 入 = document.createElement('input');
        入.className = '行输入'; 入.type = 'text';
        入.id = '段评输入'; 入.placeholder = '写下你的想法……'; 入.maxLength = 60;
        const 钮 = document.createElement('button');
        钮.className = '小钮 主'; 钮.type = 'button'; 钮.textContent = '发表';
        钮.addEventListener('click', () => {
            const v = 入.value.trim();
            if (!v) { 提示('写点什么再发'); return; }
            const t = 读段评表();
            const k = 段键(段评书, 段评章, 段评段);
            if (!Array.isArray(t[k])) t[k] = [];
            t[k].push({ 文: v, 时: Date.now() });
            写字典(段评键, t);
            入.value = '';
            渲染段评();
            渲染正文(当前章);   /* 刷新段落角标 */
            提示('已发表段评');
        });
        入.addEventListener('keydown', e => { if (e.key === 'Enter') 钮.click(); });
        输行.appendChild(入); 输行.appendChild(钮);
        体.appendChild(输行);
    }

    function 我的作品() {
        const 笔名 = localStorage.getItem(笔名键) || '';
        if (!笔名) return [];
        return 读表(平台键).filter(p => p.发布者 === 笔名);
    }

    /* ============================================================
     * 13. 阅读器
     * ============================================================ */
    const 阅读遮罩 = document.getElementById('阅读遮罩');
    const 阅读标题 = document.getElementById('阅读标题');
    const 阅读体 = document.getElementById('阅读体');
    const 阅读设置 = document.getElementById('阅读设置');
    const 返回钮 = document.getElementById('阅读返回');
    const 设置钮 = document.getElementById('阅读设置钮');
    const 目录钮 = document.getElementById('阅读目录钮');
    const 翻页条 = document.getElementById('翻页条');

    /* ★★ 显式状态机：'目录' / '正文'
         旧版靠「阅读体里有没有 .章文」反推当前在哪一屏 —— 那是 DOM 嗅探，
         一旦正文区的结构变了就会判断错，返回键也就跟着乱跳。 */
    let 当前书 = null;
    let 当前章 = -1;
    let 阅读态 = '目录';
    /* ★ 记住是从哪一层打开书的（详情层 / 书架 / 书城），
         返回图标要回到【对应的】那一层，而不是一律丢回书架。 */
    let 开书来源 = null;   /* { 类型: '详情', id } 或 null */

    /** ★ 容器 = 铺主题背景那一层，阅读时给它挂 .阅读中 */
    const 容器 = document.querySelector('.手机主题背景容器');

    /** ★ 只管偏好（夜间 / 字号）—— 【不碰】显示状态。
         旧版把「应用偏好」和「打开遮罩」写在一起，改个字号就等于强行开一次阅读器。 */
    function 应用设置() {
        const s = 读设置();
        阅读遮罩.classList.toggle('夜间', s.景 === 1);
        阅读体.style.fontSize = (字号档[s.字号] ? 字号档[s.字号][1] : 1) + 'rem';
    }

    async function 开书(id, 跳到章) {
        结算计时();          /* 先结掉上一本，换书时别把时长算混 */
        const 书 = await 取书(id);
        if (!书 || !Array.isArray(书.章节) || !书.章节.length) {
            提示('读不到正文');
            return;
        }
        当前书 = 书;
        当前书.id = 当前书.id || id;
        if (开书来源 && 开书来源.id !== 当前书.id) 开书来源 = null;
        开始计时();
        if (容器) 容器.classList.add('阅读中');
        阅读遮罩.classList.add('显示');
        应用设置();
        建设置条();

        /* ★ 入口规则（写死在这里，别再各入口各写一套）：
             ① 显式给了章号 → 直接进那一章（详情层点目录、试读第一章、继续阅读）
             ② 否则有进度   → 续读上次那一章
             ③ 都没有       → 停在目录，让用户自己挑 */
        const 显 = Number.isFinite(Number(跳到章)) ? Number(跳到章) : -1;
        const 续 = 读进度(id) ? Number(读进度(id).章) : -1;
        const 目标 = 显 >= 0 ? 显 : 续;
        if (目标 >= 0 && 目标 < 书.章节.length) 渲染正文(目标);
        else 渲染章列表();
    }

    function 关书() {
        结算计时();
        阅读遮罩.classList.remove('显示');
        阅读遮罩.classList.remove('夜间');
        if (容器) 容器.classList.remove('阅读中');
        阅读设置.classList.remove('展开');
        设置钮.classList.remove('选中');
        翻页条.classList.remove('显示');
        当前书 = null; 当前章 = -1; 阅读态 = '目录';
        开书来源 = null;
        if (目录钮) 目录钮.classList.add('隐藏');
        刷新时长();
        /* ★ 修：退出后要重画当前页，否则「继续阅读」卡还停在旧进度
             （从书架直接点开再退出时，不会经过切页，就刷新不到） */
        渲染();
    }

    /**
     * ★★ 左侧返回图标 —— 一次只退【一层】，从哪来回哪去：
     *   ① 在目录里（目录是阅读器内部的浮层）
     *      · 已经读过 → 回到【阅读界面】（正文，读到的那一章）
     *      · 一章都没读过 → 目录无处可退，才退出阅读器
     *   ② 在正文里 → 退出阅读器，回到【进来那个界面】：
     *      · 从详情层进来的 → 重开那一本书的详情层
     *      · 从书架 / 书城 / 作者中心进来的 → 停在原来那一页，不动
     */
    返回钮.addEventListener('click', () => {
        if (!当前书) { 关书(); return; }

        /* ① 目录态：优先回阅读界面 */
        if (阅读态 === '目录') {
            const 续 = 读进度(当前书.id) ? Number(读进度(当前书.id).章) : -1;
            if (续 >= 0 && 续 < 当前书.章节.length) { 渲染正文(续); return; }
        }

        /* ② 正文态（或目录已无可退） → 退出阅读器 */
        const 来源 = 开书来源;
        关书();
        if (来源 && 来源.类型 === '详情') 开详情(来源.id);
        /* ★ 从哪个 Tab 进来的就停在哪，不再强行切回书架 */
    });

    /* ★ 右侧「目录」钮：只在正文态出现，点了回目录 */
    目录钮.addEventListener('click', () => {
        if (阅读态 === '正文') 渲染章列表();
    });

    /* ★ 设置面板：点 Aa 呼出 / 收起 */
    设置钮.addEventListener('click', () => {
        const 开 = 阅读设置.classList.toggle('展开');
        设置钮.classList.toggle('选中', 开);
    });

    /** 头部随状态更新：标题 + 目录钮显隐（目录态不需要「目录」钮） */
    function 更新头部() {
        if (!当前书) return;
        if (阅读态 === '正文') {
            const 章 = 当前书.章节[当前章];
            阅读标题.textContent = (章 && 章.题) || ('第 ' + (当前章 + 1) + ' 章');
            if (目录钮) 目录钮.classList.remove('隐藏');
        } else {
            阅读标题.textContent = 当前书.书名 + '（' + 当前书.章节.length + ' 章）';
            if (目录钮) 目录钮.classList.add('隐藏');
        }
    }

    function 渲染章列表() {
        阅读态 = '目录';
        当前章 = -1;
        翻页条.classList.remove('显示');
        更新头部();
        阅读体.innerHTML = '';

        const 进度 = 读进度(当前书.id);
        const 读到 = 进度 ? Number(进度.章) : -1;
        当前书.章节.forEach((章, i) => {
            const 行 = document.createElement('button');
            行.className = '章行' + (读到 === i ? ' 读到这' : '');
            行.type = 'button';
            行.dataset.章 = String(i);

            const 左 = document.createElement('span');
            左.className = '章题';
            左.textContent = 章.题 || ('第 ' + (i + 1) + ' 章');
            行.appendChild(左);

            /* ★ 角标是独立元素、跟标题分开 —— 旧版拼进标题里，
                 渲染出来是「第二章 发展 · 读到这3 字」，两段糊在一起 */
            if (读到 === i) {
                const 标 = document.createElement('span');
                标.className = '读到标';
                标.textContent = '读到这';
                行.appendChild(标);
            }

            const 数 = document.createElement('span');
            数.className = '字数';
            数.textContent = (章.正文 || '').length + ' 字';
            行.appendChild(数);

            行.addEventListener('click', () => 渲染正文(i));
            阅读体.appendChild(行);
        });
        阅读体.scrollTop = 0;
        /* ★ 有进度时把那一章滚到可见处 —— 章数多的时候不用自己找 */
        if (读到 > 0) {
            const 目标行 = 阅读体.children[读到];
            if (目标行 && 目标行.scrollIntoView) 目标行.scrollIntoView({ block: 'center' });
            else 阅读体.scrollTop = 目标行 ? 目标行.offsetTop : 0;
        }
    }

    /**
     * ★ 长按段落 → 直接写段评
     *   手指移动超过 12px 取消（否则滑动阅读会误触），
     *   触发后吞掉那次 click（松手不该再弹出段评窗）。
     */
    function 挂段落长按(p, id, 章, 段) {
        let 计时 = null, 起x = 0, 起y = 0, 触发 = false;
        const 清 = () => { if (计时) { clearTimeout(计时); 计时 = null; } };
        p.addEventListener('touchstart', e => {
            触发 = false;
            const t = e.touches && e.touches[0];
            起x = t ? t.clientX : 0; 起y = t ? t.clientY : 0;
            计时 = setTimeout(() => { 触发 = true; 开段评(id, 章, 段, true); }, 长按阈值);
        }, { passive: true });
        p.addEventListener('touchmove', e => {
            const t = e.touches && e.touches[0];
            if (!t) return;
            if (Math.abs(t.clientX - 起x) > 12 || Math.abs(t.clientY - 起y) > 12) 清();
        }, { passive: true });
        p.addEventListener('touchend', () => 清());
        p.addEventListener('touchcancel', () => 清());
        /* 桌面端：右键也当作长按（方便调试 / 鼠标操作） */
        p.addEventListener('contextmenu', e => { e.preventDefault(); 开段评(id, 章, 段, true); });
        p.addEventListener('click', e => { if (触发) { 触发 = false; e.stopPropagation(); } });
    }

    function 渲染正文(i) {
        if (!当前书 || !当前书.章节[i]) return;
        阅读态 = '正文';
        当前章 = i;
        更新头部();

        const 章 = 当前书.章节[i];
        阅读体.innerHTML = '';
        const 文 = document.createElement('div');
        文.className = '章文';
        文.id = '章文';
        /* ★★ 按空行切 <p> —— 整段塞一个节点只会缩进第一段 */
        String(章.正文 || '').split(/\n\s*\n/).forEach((段, k) => {
            const p = document.createElement('p');
            if (k === 0) p.classList.add('首段');
            p.textContent = 段.replace(/\n/g, ' ').trim();
            /* ★ 段评：每段带号，长按写、点击看 */
            p.dataset.段 = String(k);
            const n = 段评数(当前书.id, i, k);
            if (n > 0) {
                p.classList.add('有段评');
                const 角 = document.createElement('span');
                角.className = '段评角';
                角.textContent = n;
                p.appendChild(角);
            }
            挂段落长按(p, 当前书.id, i, k);
            p.addEventListener('click', () => 开段评(当前书.id, i, k));
            文.appendChild(p);
        });
        阅读体.appendChild(文);
        /* ★ 章末 */
        const 末 = document.createElement('div');
        末.className = '章末';
        const 末标 = document.createElement('div');
        末标.className = '章末标'; 末标.textContent = '本章完';
        const 末提 = document.createElement('div');
        末提.textContent = '长按段落可以写下你的想法';
        末.appendChild(末标); 末.appendChild(末提);
        阅读体.appendChild(末);

        建翻页条(i);
        写进度(当前书.id, i);
        阅读体.scrollTop = 0;
    }

    /** ★ 翻页条：吸底，含「第几章 / 共几章」 */
    function 建翻页条(i) {
        const 总 = 当前书.章节.length;
        翻页条.innerHTML = '';

        const 上 = document.createElement('button');
        上.className = '小钮'; 上.type = 'button'; 上.textContent = '上一章';
        上.disabled = i <= 0;
        上.addEventListener('click', () => i > 0 && 渲染正文(i - 1));

        const 位 = document.createElement('div');
        位.className = '章位';
        位.id = '章位';
        位.textContent = (i + 1) + ' / ' + 总;

        const 下 = document.createElement('button');
        下.className = '小钮'; 下.type = 'button'; 下.textContent = '下一章';
        下.disabled = i >= 总 - 1;
        下.addEventListener('click', () => i < 总 - 1 && 渲染正文(i + 1));

        翻页条.appendChild(上); 翻页条.appendChild(位); 翻页条.appendChild(下);
        翻页条.classList.add('显示');
    }

    function 建设置条() {
        const s = 读设置();
        阅读设置.innerHTML = '';
        const 组1 = document.createElement('div');
        组1.className = '设置组';
        const 标1 = document.createElement('span');
        标1.className = '设置标'; 标1.textContent = '字号';
        组1.appendChild(标1);
        字号档.forEach((档, i) => {
            const 钮 = document.createElement('button');
            钮.className = '景钮' + (s.字号 === i ? ' 选中' : '');
            钮.type = 'button'; 钮.textContent = 档[0];
            钮.addEventListener('click', () => {
                写设置(Object.assign(读设置(), { 字号: i }));
                应用设置(); 建设置条();
            });
            组1.appendChild(钮);
        });
        阅读设置.appendChild(组1);

        const 组2 = document.createElement('div');
        组2.className = '设置组';
        const 标2 = document.createElement('span');
        标2.className = '设置标'; 标2.textContent = '夜间';
        组2.appendChild(标2);
        景档.forEach((档, i) => {
            const 钮 = document.createElement('button');
            钮.className = '景钮' + (s.景 === i ? ' 选中' : '');
            钮.type = 'button'; 钮.textContent = 档[0];
            钮.addEventListener('click', () => {
                写设置(Object.assign(读设置(), { 景: i }));
                应用设置(); 建设置条();
            });
            组2.appendChild(钮);
        });
        阅读设置.appendChild(组2);
    }

    /* ============================================================
     * 13.4 作品编辑界面（工作台）
     *   ★ 点作品卡进这里：写新章节 / 草稿箱 / 封面 / 作品信息
     * ============================================================ */
    const 作品遮罩 = document.getElementById('作品遮罩');
    const 作品封面输入 = document.getElementById('作品封面输入');
    let 作品页书 = null;

    async function 开作品页(id) {
        const 条 = 读表(平台键).find(p => p.id === id);
        if (!条) { 提示('找不到这部作品'); return; }
        作品页书 = 条;
        作品遮罩.classList.add('显示');
        const 外层 = document.querySelector('.手机主题背景容器');
        if (外层) 外层.classList.add('编辑中');

        document.getElementById('作品页名').textContent = '《' + 条.书名 + '》';
        document.getElementById('改书名').value = 条.书名 || '';
        document.getElementById('改简介').value = 条.简介 || '';
        document.getElementById('改状态').value = 条.状态 || '连载';

        const 分 = document.getElementById('改分类');
        if (!分.options.length) {
            题材表.filter(x => x !== '全部').concat(其他子类).forEach(名 => {
                const o = document.createElement('option');
                o.value = 名; o.textContent = 名;
                分.appendChild(o);
            });
        }
        分.value = 条.分类 || '其他';

        await 渲染作品页();
    }

    async function 渲染作品页() {
        if (!作品页书) return;
        const p = 作品页书;

        /* 先读正文 —— 数据面板和章节列表都要用 */
        const 书 = await 取书(p.id) || { 章节: [] };
        const 章 = 书.章节 || [];

        /* ★ 详细数据（四格）：章节 / 字数 / 加入书架 / 评论 */
        const 面 = document.getElementById('作品数据面板');
        面.innerHTML = '';
        const 字数 = 章.reduce((t, c) => t + (c.正文 || '').length, 0);
        [['章节', String(章.length)],
         ['阅读', 字数文(取阅读数(p.id))],
         ['评论', String(取评论数(p.id))]].forEach(([名, 值]) => {
            const 格 = document.createElement('div');
            格.className = '数据格';
            const 数 = document.createElement('div');
            数.className = '数据数'; 数.textContent = 值;
            const 字 = document.createElement('div');
            字.className = '数据名'; 字.textContent = 名;
            格.appendChild(数); 格.appendChild(字);
            面.appendChild(格);
        });

        /* 封面 */
        const 盒 = document.getElementById('作品页封面');
        盒.innerHTML = '';
        const img = document.createElement('img');
        img.alt = ''; img.src = 取封面(p);
        盒.appendChild(img);

        document.getElementById('作品页副').textContent =
            (p.分类 || '其他') + ' · ' + 书状态(p) + ' · ' + 章.length + ' 章';
        document.getElementById('页章数').textContent = 章.length ? ('共 ' + 章.length + ' 章') : '';
        const 列 = document.getElementById('页章列');
        列.innerHTML = '';
        if (!章.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有章节</span>点上面「写新章节」开写';
            列.appendChild(空);
        }
        章.forEach((c, i) => {
            const 卡 = document.createElement('button');
            卡.className = '章卡'; 卡.type = 'button';
            const 序 = document.createElement('span');
            序.className = '序'; 序.textContent = '第' + (i + 1) + '章';
            const 题 = document.createElement('span');
            题.className = '题'; 题.textContent = c.题 || ('第 ' + (i + 1) + ' 章');
            const 字 = document.createElement('span');
            字.className = '字'; 字.textContent = (c.正文 || '').length + ' 字';
            卡.appendChild(序); 卡.appendChild(题); 卡.appendChild(字);
            卡.addEventListener('click', () => 开编辑器(p.id, i));
            列.appendChild(卡);
        });

        /* ★ 草稿箱：扫所有 阅读_草稿_<id>_* 键 */
        const 头 = '阅读_草稿_' + p.id + '_';
        const 们 = 扫键(头).map(k => {
            const 草 = 读草稿(k);
            return { 键: k, 号: k.slice(头.length), 题: 草.题, 文: 草.文 };
        }).filter(g => g.文 || g.题);   /* 空草稿不显示 */
        document.getElementById('页草数').textContent = 们.length ? ('共 ' + 们.length + ' 份') : '';
        const 草列 = document.getElementById('页草列');
        草列.innerHTML = '';
        if (!们.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">草稿箱是空的</span>写一半点「存草稿」就会收在这里';
            草列.appendChild(空);
        }
        们.forEach(g => {
            const 卡 = document.createElement('button');
            卡.className = '章卡'; 卡.type = 'button';
            const 序 = document.createElement('span');
            序.className = '序'; 序.textContent = g.号 === '-1' ? '新章' : ('第' + (Number(g.号) + 1) + '章');
            const 题 = document.createElement('span');
            题.className = '题';
            题.textContent = g.题 || ('（无标题）' + g.文.slice(0, 12));
            const 字 = document.createElement('span');
            字.className = '字'; 字.textContent = g.文.length + ' 字';
            卡.appendChild(序); 卡.appendChild(题); 卡.appendChild(字);
            卡.addEventListener('click', () => {
                const n = Number(g.号);
                开编辑器(p.id, Number.isFinite(n) ? n : -1);
            });
            草列.appendChild(卡);
        });
    }

    /** 保存作品信息 */
    function 存作品信息() {
        if (!作品页书) return;
        const 名 = document.getElementById('改书名').value.trim();
        if (!名) { 提示('作品名不能为空'); return; }
        const 表 = 读表(平台键);
        const i = 表.findIndex(x => x.id === 作品页书.id);
        if (i < 0) return;
        表[i].书名 = 名;
        表[i].简介 = document.getElementById('改简介').value.trim();
        表[i].分类 = document.getElementById('改分类').value;
        表[i].状态 = document.getElementById('改状态').value;
        写表(平台键, 表);
        /* 书架里那份也同步，否则书架显示的还是旧书名 */
        const 架 = 读表(书架键);
        const j = 架.findIndex(x => x.id === 作品页书.id);
        if (j >= 0) {
            架[j].书名 = 名;
            架[j].分类 = 表[i].分类;
            架[j].状态 = 表[i].状态;
            写表(书架键, 架);
        }
        作品页书 = 表[i];
        document.getElementById('作品页名').textContent = '《' + 名 + '》';
        提示('已保存');
    }

    function 关作品页() {
        作品遮罩.classList.remove('显示');
        /* ★ 同 关编辑器：编辑器可能还开着（从作品页点进章节后没关），
             此时摘掉 .编辑中 会让作者中心透出来。 */
        收起沉浸(document.querySelector('.手机主题背景容器'));
        作品页书 = null;
        渲染作者();
    }

    document.getElementById('作品返回').addEventListener('click', 关作品页);
    document.getElementById('作品存钮').addEventListener('click', 存作品信息);
    document.getElementById('写新章钮').addEventListener('click', () => {
        if (作品页书) 开编辑器(作品页书.id);   /* 不给章号 = 新章节 */
    });
    document.getElementById('换封面钮').addEventListener('click', () => {
        if (!作品页书) return;
        作品封面输入.dataset.书 = 作品页书.id;
        作品封面输入.value = '';
        作品封面输入.click();
    });
    作品封面输入.addEventListener('change', () => {
        const f = 作品封面输入.files && 作品封面输入.files[0];
        const id = 作品封面输入.dataset.书;
        作品封面输入.value = '';
        if (!f || !id) return;
        const 读 = new FileReader();
        读.onload = () => {
            const img = new Image();
            img.onload = () => {
                const 图 = 裁封面图(img);
                if (!图) return;
                const 表 = 读表(平台键);
                const i = 表.findIndex(x => x.id === id);
                if (i >= 0) { 表[i].封面 = 图; 写表(平台键, 表); }
                const 架 = 读表(书架键);
                const j = 架.findIndex(x => x.id === id);
                if (j >= 0) { 架[j].封面 = 图; 写表(书架键, 架); }
                提示('封面已更新');
                if (作品页书 && 作品页书.id === id) 渲染作品页();
                else 渲染作者();
            };
            img.onerror = () => 提示('这张图读不了');
            img.src = String(读.result || '');
        };
        读.onerror = () => 提示('这张图读不了');
        读.readAsDataURL(f);
    });

    /* ============================================================
     * 13.5 章节编辑器
     * ============================================================ */
    const 编辑遮罩 = document.getElementById('编辑遮罩');

    /**
     * ★★ 回收「沉浸式」标记 .编辑中 —— 谁都不许无条件摘。
     *
     * .编辑中 是【作品页 / 作者主页 / 编辑器】三家共用的：它负责收起顶栏、
     * 内容区、底栏和全局白纱，让整页主题背景露出来。
     * 原先三家都是「自己一关就摘掉」，于是：
     *     在作品详情里点进章节 → 开编辑器 → 退出 → 关编辑器无条件摘掉 .编辑中
     *     → 可作品页还开着、正依赖它收着内容区
     *     → 作者中心（上一界面）重新可见，透过半透明的作品遮罩显出来
     *     → 用户看到的「背景」就是上一界面，而不是主题背景。
     *
     * 所以改成：只有当【没有任何沉浸式界面还在显示】时才摘。
     * ★ 用 id 现查 DOM，不依赖任何变量的声明顺序。
     */
    function 收起沉浸(外层) {
        if (!外层) return;
        const 开着 = id => {
            const el = document.getElementById(id);
            return !!el && el.classList.contains('显示');
        };
        const 还有 = 开着('作品遮罩') || 开着('作者遮罩') || 开着('编辑遮罩');
        if (!还有) 外层.classList.remove('编辑中');
    }
    const 章题输入 = document.getElementById('章题输入');
    const 正文输入 = document.getElementById('正文输入');
    const 抽屉 = document.getElementById('章抽屉');
    const 抽屉列 = document.getElementById('抽屉列');
    let 编辑书 = null;      /* 当前在写的书（平台表条目） */
    let 编辑章号 = -1;      /* -1 = 新建章节 */
    let 脏 = false;         /* 有没有改动 */
    /* ★ 记住这一屏是从【哪个草稿键】载入的：
         新章节是 -1，发布后它会变成真实的章号（比如 0）。
         不记住的话，发布时清草稿会去清第 0 章的键，
         而正文其实存在 -1 的键里 —— 结果是草稿永远清不掉，
         下次进来又把这堆旧字倒回编辑器。 */
    let 当前草稿键 = '';

    /** 草稿键：每本书每一章一份 */
    function 草稿键(id, 章) { return '阅读_草稿_' + id + '_' + 章; }
    /**
     * ★★ 草稿要连【章节标题】一起存：
     *   只存正文的话，关掉编辑器再回来，标题会被重置成「第 N 章」，
     *   用户改过的标题白改了 —— 不报错，只是悄悄丢内容。
     *   兼容旧草稿（纯字符串）。
     */
    function 读草稿(键) {
        const 原 = localStorage.getItem(键);
        if (!原) return { 题: '', 文: '' };
        if (原.charAt(0) === '{') {
            try { const o = JSON.parse(原); return { 题: o.题 || '', 文: o.文 || '' }; } catch (e) {}
        }
        return { 题: '', 文: 原 };
    }
    function 写草稿(键, 题, 文) {
        try { localStorage.setItem(键, JSON.stringify({ 题: 题, 文: 文 })); return true; }
        catch (e) { return false; }
    }

    async function 开编辑器(id, 章号) {
        const 条 = 读表(平台键).find(p => p.id === id);
        if (!条) { 提示('找不到这部作品'); return; }
        编辑书 = 条;
        编辑章号 = Number.isFinite(Number(章号)) ? Number(章号) : -1;

        编辑遮罩.classList.add('显示');
        /* ★ 容器在【阅读器】那段才定义，这里是编辑器 —— 直接用选择器取，
             别依赖声明顺序（之前写 容器.classList 会因为在后面声明而无效）。 */
        const 外层 = document.querySelector('.手机主题背景容器');
        if (外层) {
            外层.classList.add('编辑中');
            /* ★★ 再挂 .写稿中：收掉下层浮层（作品页 / 作者主页），
                 让编辑器底下只剩整页主题背景（见 CSS 里那段注释）。
                 ★ 白纱不用在这里收 —— 已由 .编辑中 统一收（三处沉浸界面都要收）。
                 关编辑器时会一并摘掉。 */
            外层.classList.add('写稿中');
        }
        document.getElementById('编辑书名').textContent = '《' + 条.书名 + '》';
        渲染抽屉();
        await 载章();
    }

    /** 载入某一章（没有则新建） */
    async function 载章() {
        const 书 = await 取书(编辑书.id) || { 章节: [] };
        const 章 = 编辑章号 >= 0 ? 书.章节[编辑章号] : null;
        当前草稿键 = 草稿键(编辑书.id, 编辑章号);
        const 草 = 读草稿(当前草稿键);

        if (章) {
            章题输入.value = 草.题 || 章.题 || ('第 ' + (编辑章号 + 1) + ' 章');
            正文输入.value = 草.文 || 章.正文 || '';
        } else {
            章题输入.value = 草.题 || ('第 ' + ((书.章节 || []).length + 1) + ' 章');
            正文输入.value = 草.文 || '';
        }
        /* ★★ 脏 要看【标题或正文任一有草稿】，不能只认正文：
             只改了标题、正文还空着时，存草稿 → 关掉 → 再进来，
             状态显示「已保存」，可标题其实还没发布 —— 用户会以为已经发出去了。
             落到 IndexedDB 里才算真保存，草稿≠已发布，所以这里必须判 true。 */
        脏 = !!(草.文 || 草.题);
        更新编辑头();
        更新统计();
        关抽屉();
    }

    function 更新编辑头() {
        const 章名 = document.getElementById('编辑章名');
        if (编辑章号 >= 0) 章名.textContent = '第 ' + (编辑章号 + 1) + ' 章（已发布）';
        else 章名.textContent = '新章节';
    }

    function 更新统计() {
        const n = 正文输入.value.replace(/\s/g, '').length;
        document.getElementById('编辑字数').textContent = n + ' 字';
        document.getElementById('编辑保存').textContent = 脏 ? '有改动' : '已保存';
    }

    正文输入.addEventListener('input', () => { 脏 = true; 更新统计(); });
    /* ★ 改标题也算改动 —— 原写法只置 脏 却不调 更新统计()，
         于是「已保存」那行字永远停在旧值，用户改了标题却毫无反馈，
         看着像没保存成功。 */
    章题输入.addEventListener('input', () => { 脏 = true; 更新统计(); });

    /** ★ 存草稿：不进书城，只留在本机 */
    function 存草稿() {
        if (!编辑书) return;
        当前草稿键 = 草稿键(编辑书.id, 编辑章号);
        if (!写草稿(当前草稿键, 章题输入.value.trim(), 正文输入.value)) {
            提示('草稿存不下（本机空间不足）'); return;
        }
        脏 = false;
        更新统计();
        渲染抽屉();
        提示('草稿已存');
    }

    /** ★ 发布本章：写进 IndexedDB 正文 + 更新平台表目录 */
    async function 发布章() {
        if (!编辑书) return;
        const 题 = 章题输入.value.trim();
        const 文 = 正文输入.value.trim();
        if (!文) { 提示('正文还是空的'); return; }

        const 书 = await 取书(编辑书.id) || {
            id: 编辑书.id, 书名: 编辑书.书名, 作者: 编辑书.作者, 章节: [],
        };
        if (!Array.isArray(书.章节)) 书.章节 = [];

        const 章 = { 题: 题 || ('第 ' + (书.章节.length + 1) + ' 章'), 正文: 文 };
        if (编辑章号 >= 0 && 书.章节[编辑章号]) 书.章节[编辑章号] = 章;
        else 书.章节.push(章);
        书.书名 = 编辑书.书名;
        书.作者 = 编辑书.作者 || '';
        await 存书(书);

        /* 目录同步：章数 / 字数 / 时间 */
        const 表 = 读表(平台键);
        const i = 表.findIndex(x => x.id === 编辑书.id);
        if (i >= 0) {
            表[i].章数 = 书.章节.length;
            表[i].字数 = 书.章节.reduce((n, c) => n + (c.正文 || '').length, 0);
            表[i].时间 = Date.now();
            写表(平台键, 表);
            编辑书 = 表[i];
        }
        /* 发布后清掉这一章的草稿（已在正文里了）
             ★ 清【载入时那个键】，不是按新章号算出来的键 —— 见 当前草稿键 的注释 */
        const 号 = 编辑章号 >= 0 ? 编辑章号 : 书.章节.length - 1;
        if (当前草稿键) localStorage.removeItem(当前草稿键);
        localStorage.removeItem(草稿键(编辑书.id, 号));
        编辑章号 = 号;              /* 这一屏现在代表已发布的那一章 */
        当前草稿键 = 草稿键(编辑书.id, 号);
        脏 = false;
        更新编辑头();
        更新统计();
        渲染抽屉();
        提示('已发布：' + 章.题);
        if (作品页书 && 作品页书.id === 编辑书.id) 渲染作品页();
        渲染作者();
    }

    /** 新建作品 → 立刻进编辑器 */
    async function 新建作品() {
        const 笔名 = localStorage.getItem(笔名键) || '';
        if (!笔名) { 提示('先设置笔名'); return; }
        const 名 = document.getElementById('新书名').value.trim();
        if (!名) { 提示('填一下作品名'); return; }
        const 分类 = document.getElementById('新分类').value;
        const 状态 = document.getElementById('新状态').value;
        const 简介 = document.getElementById('新简介').value.trim();

        const id = 'my_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const 条 = {
            id: id, 书名: 名, 作者: 笔名, 分类: 分类, 状态: 状态, 细分: '',
            简介: 简介, 章数: 0, 字数: 0, 来源: '平台', 发布者: 笔名, 时间: Date.now(),
        };
        /* ★ 同时进平台表和书架：自己的作品也要能在书架里读到 */
        写表(平台键, 读表(平台键).concat([条]));
        const 架 = 读表(书架键);
        if (!架.some(b => b.id === id)) 写表(书架键, 架.concat([条]));
        await 存书({ id: id, 书名: 名, 作者: 笔名, 章节: [] });

        document.getElementById('新书名').value = '';
        document.getElementById('新简介').value = '';
        渲染作者();
        开编辑器(id);   /* 直接开写第一章 */
    }

    /* ---------- 章节抽屉 ---------- */
    function 开抽屉() { 抽屉.classList.add('显示'); 渲染抽屉(); }
    function 关抽屉() { 抽屉.classList.remove('显示'); }

    async function 渲染抽屉() {
        if (!编辑书) return;
        const 书 = await 取书(编辑书.id) || { 章节: [] };
        const 章 = 书.章节 || [];
        抽屉列.innerHTML = '';
        if (!章.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有章节</span>写完点「发布本章」就会出现在这里';
            抽屉列.appendChild(空);
        }
        章.forEach((c, i) => {
            const 行 = document.createElement('button');
            行.className = '抽屉行' + (i === 编辑章号 ? ' 当前' : '');
            行.type = 'button';
            const 序 = document.createElement('span');
            序.className = '章序'; 序.textContent = '第' + (i + 1) + '章';
            const 题 = document.createElement('span');
            题.className = '章题'; 题.textContent = c.题 || ('第 ' + (i + 1) + ' 章');
            行.appendChild(序); 行.appendChild(题);
            if (localStorage.getItem(草稿键(编辑书.id, i))) {
                const 标 = document.createElement('span');
                标.className = '草稿标'; 标.textContent = '有草稿';
                行.appendChild(标);
            }
            行.addEventListener('click', () => { 编辑章号 = i; 载章(); });
            抽屉列.appendChild(行);
        });
        /* 正在写的新章节 */
        if (编辑章号 < 0) {
            const 行 = document.createElement('button');
            行.className = '抽屉行 当前'; 行.type = 'button';
            const 序 = document.createElement('span');
            序.className = '章序'; 序.textContent = '新';
            const 题 = document.createElement('span');
            题.className = '章题'; 题.textContent = '（正在写的新章节）';
            行.appendChild(序); 行.appendChild(题);
            抽屉列.appendChild(行);
        }
    }

    /* ---------- 编辑器事件 ---------- */
    document.getElementById('新建钮').addEventListener('click', 新建作品);

    /* ★★ 笔名：底部上滑弹层（原 prompt 已废）
         prompt 的老毛病：样式跟系统走、没有字数反馈、部分 WebView 直接返回 null。
         弹层还给两样 prompt 给不了的东西 —— 实时字数、空值时禁用保存。 */
    const 笔名遮罩 = document.getElementById('笔名遮罩');
    const 笔名输入框 = document.getElementById('笔名输入');

    /** 输入即刷新字数与「保存」可用性 */
    function 刷新笔名态() {
        const 值 = 笔名输入框.value;
        document.getElementById('笔名字数').textContent = 值.length + ' / 16';
        document.getElementById('笔名保存').disabled = !值.trim();
        /* ★ 只有「用户敲了东西但清不出有效名」才报警 ——
             刚打开、还没设过笔名时不该上来就红字吓人。 */
        document.getElementById('笔名警').classList.toggle('显示', !值.trim() && 值.length > 0);
    }

    function 开笔名() {
        笔名遮罩.classList.add('显示');
        笔名输入框.value = localStorage.getItem(笔名键) || '';
        刷新笔名态();
        /* 晚一帧再聚焦：弹层有上滑动画，立刻 focus 会让软键盘和动画打架，
           键盘顶起来的容器高度与动画结束态不一致，输入框会落到可视区外。 */
        setTimeout(() => { try { 笔名输入框.focus(); } catch (e) {} }, 260);
    }
    function 关笔名() {
        笔名遮罩.classList.remove('显示');
        try { 笔名输入框.blur(); } catch (e) {}
    }

    function 存笔名() {
        const 旧 = localStorage.getItem(笔名键) || '';
        const 名 = 笔名输入框.value.trim().slice(0, 16);
        if (!名) { 刷新笔名态(); try { 笔名输入框.focus(); } catch (e) {} return; }
        localStorage.setItem(笔名键, 名);
        /* ★ 改笔名要把已发布作品的作者名一起改，
             否则旧作品还挂在旧笔名下，「我的作品」里会凭空消失。 */
        const 表 = 读表(平台键);
        let 改了 = 0;
        表.forEach(x => { if (x.发布者 === 旧 || (!旧 && !x.发布者)) { x.发布者 = 名; x.作者 = 名; 改了++; } });
        if (改了) 写表(平台键, 表);
        关笔名();
        同步作家头像();
        渲染作者();
        提示(改了 ? ('笔名已改为「' + 名 + '」，' + 改了 + ' 部作品已同步') : ('笔名已改为「' + 名 + '」'));
    }

    document.getElementById('改笔名钮').addEventListener('click', 开笔名);
    document.getElementById('笔名保存').addEventListener('click', 存笔名);
    document.getElementById('笔名取消').addEventListener('click', 关笔名);
    document.getElementById('笔名关闭').addEventListener('click', 关笔名);
    笔名遮罩.addEventListener('click', e => { if (e.target === 笔名遮罩) 关笔名(); });
    笔名输入框.addEventListener('input', 刷新笔名态);
    笔名输入框.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); 存笔名(); }
    });
    /* Esc 关：与页面其余弹层一致（详情层也是点遮罩关，这里多给一条键盘路径） */
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && 笔名遮罩.classList.contains('显示')) 关笔名();
    });

    /* ★ 封面：相册 / 自动生成 / 恢复默认 */
    document.getElementById('选封面钮').addEventListener('click', () => {
        封面输入.value = '';
        封面输入.click();
    });
    document.getElementById('清封面钮').addEventListener('click', () => 设待用封面(''));
    封面输入.addEventListener('change', () => {
        const f = 封面输入.files && 封面输入.files[0];
        封面输入.value = '';
        if (!f) return;
        读图为封面(f);
    });
    /** ★ 读图 → 裁成 3:4 → 存
         原图直接存会把 localStorage 撑爆（上限 5MB，一本封面就没了），
         所以统一压到 300×400 的 JPEG。 */
    function 读图为封面(f) {
        const 读 = new FileReader();
        读.onload = () => {
            const img = new Image();
            img.onload = () => 裁封面(img);
            img.onerror = () => 提示('这张图读不了');
            img.src = String(读.result || '');
        };
        读.onerror = () => 提示('这张图读不了');
        读.readAsDataURL(f);
    }
    function 裁封面(img) { 设待用封面(裁封面图(img)); }
    /** ★ 裁成 3:4 的 JPEG —— 抽成公共函数，新建和作品页换封面共用 */
    function 裁封面图(img) {
        try {
            const 宽 = 300, 高 = 400;   /* 3:4 */
            const 画 = document.createElement('canvas');
            画.width = 宽; 画.height = 高;
            const 笔 = 画.getContext('2d');
            /* 居中裁剪：按较长方向缩放后取中间一块，不留白边 */
            const 比 = Math.max(宽 / img.width, 高 / img.height);
            const w = img.width * 比, h = img.height * 比;
            笔.drawImage(img, (宽 - w) / 2, (高 - h) / 2, w, h);
            return 画.toDataURL('image/jpeg', 0.82);
        } catch (e) { 提示('封面处理失败'); return ''; }
    }
    /* 书名变了，自动生成封面要跟着变（没自定义时） */
    document.getElementById('新书名').addEventListener('input', () => {
        if (!待用封面) 渲染封面预览();
    });
    document.getElementById('存草稿钮').addEventListener('click', 存草稿);
    document.getElementById('发布章钮').addEventListener('click', 发布章);
    document.getElementById('加章钮').addEventListener('click', () => { 编辑章号 = -1; 载章(); });
    document.getElementById('编辑目录钮').addEventListener('click', () => {
        抽屉.classList.contains('显示') ? 关抽屉() : 开抽屉();
    });
    document.getElementById('编辑返回').addEventListener('click', () => {
        if (抽屉.classList.contains('显示')) { 关抽屉(); return; }
        if (脏) { if (!confirm('有改动没保存，确定离开？')) return; }
        关编辑器();
    });
    function 关编辑器() {
        编辑遮罩.classList.remove('显示');
        const 外层 = document.querySelector('.手机主题背景容器');
        if (外层) {
            /* ★ 摘 .写稿中 —— 让作品页 / 作者主页恢复显示。
                 漏摘的话回到作品详情后那两层会一直看不见。 */
            外层.classList.remove('写稿中');
            /* ★★ .编辑中 不能直接摘 —— 作品页可能还开着并正依赖它。
                 用 收起沉浸() 判断，没人用了才摘。 */
            收起沉浸(外层);
        }
        编辑书 = null; 编辑章号 = -1; 脏 = false;
        关抽屉();
        渲染作者();
    }

    /* ============================================================
     * 13.6 书籍详情层（书城 / 书架点卡片打开）
     *   ★ 这个函数原先【被误删过】：多处调用 开详情()，但定义没了，
     *     页面一加载就在调用点抛 ReferenceError，整个脚本挂掉。
     *     静态看代码很难发现（调用点在回调里，肉眼看不出），只有实跑才暴露。
     * ============================================================ */
    const 详情遮罩 = document.getElementById('详情遮罩');
    let 详情书 = null;

    async function 开详情(id) {
        const 条 = 读表(平台键).find(p => p.id === id) || 读表(书架键).find(b => b.id === id);
        if (!条) { 提示('找不到这本书'); return; }
        详情书 = 条;
        渲染详情();
        详情遮罩.classList.add('显示');
    }
    function 关详情() {
        详情遮罩.classList.remove('显示');
        详情书 = null;
    }
    document.getElementById('详情关闭').addEventListener('click', 关详情);
    详情遮罩.addEventListener('click', e => { if (e.target === 详情遮罩) 关详情(); });

    async function 渲染详情() {
        if (!详情书) return;
        const p = 详情书;
        const 体 = document.getElementById('详情体');
        const 底 = document.getElementById('详情底');
        体.innerHTML = ''; 底.innerHTML = '';

        /* 封面 + 书名 + 作者 */
        const 头 = document.createElement('div');
        头.className = '详情头区';
        const 封 = document.createElement('div');
        封.className = '详情封面';
        const 封图 = document.createElement('img');
        封图.alt = ''; 封图.src = 取封面(p);
        封.appendChild(封图);
        头.appendChild(封);
        const 息 = document.createElement('div');
        息.style.cssText = 'flex:1;min-width:0';
        const 名 = document.createElement('div');
        名.className = '详情名'; 名.textContent = p.书名;
        /* ★ 作者昵称可点 → 进作者主页看这位作者的其他书 */
        const 作行 = document.createElement('div');
        作行.className = '作者行';
        const 作钮 = document.createElement('button');
        作钮.className = '作者钮'; 作钮.type = 'button';
        作钮.id = '详情作者钮';
        作钮.textContent = (p.作者 || '佚名') + ' ›';
        作钮.addEventListener('click', () => 开作者主页(p.作者 || ''));
        作行.appendChild(作钮);
        息.appendChild(名); 息.appendChild(作行);
        const 标行 = document.createElement('div');
        标行.className = '书标行';
        [p.分类 || '其他', 书状态(p)].forEach(t => {
            const 标 = document.createElement('span');
            标.className = '同行标签'; 标.textContent = t;
            标行.appendChild(标);
        });
        息.appendChild(标行);
        头.appendChild(息);
        体.appendChild(头);

        /* 数据 */
        const 数 = document.createElement('div');
        数.className = '作品数据';
        [['字数', 字数文(p.字数)], ['章节', String(p.章数 || 0)],
         ['收藏', 字数文(取热度(p.id))], ['阅读', 字数文(取阅读数(p.id))]].forEach(([n, v]) => {
            const 格 = document.createElement('div');
            const a = document.createElement('div');
            a.className = '作品数'; a.textContent = v;
            const b = document.createElement('div');
            b.className = '作品名2'; b.textContent = n;
            格.appendChild(a); 格.appendChild(b);
            数.appendChild(格);
        });
        体.appendChild(数);

        if (p.简介) {
            const 简区 = document.createElement('div');
            简区.className = '简介区';
            const 简 = document.createElement('div');
            简.className = '详情简 详情简介 收起';
            简.id = '详情简介文';
            简.textContent = p.简介;
            简区.appendChild(简);
            /* ★ 简介长了才给「展开」——短简介挂个按钮很奇怪 */
            if (String(p.简介 || '').length > 42) {
                const 展 = document.createElement('button');
                展.className = '展开钮'; 展.type = 'button';
                展.id = '详情展开钮';
                展.textContent = '展开';
                展.addEventListener('click', () => {
                    const 收 = 简.classList.toggle('收起');
                    展.textContent = 收 ? '展开' : '收起';
                });
                简区.appendChild(展);
            }
            体.appendChild(简区);
        }

        /* ★ 评论块：热门分里的「评论人数」就靠这里产生 */
        const 块 = document.createElement('div');
        块.className = '详情块';
        const 块标 = document.createElement('div');
        块标.className = '分区标题';
        块标.textContent = '评论';
        const 计 = document.createElement('span');
        计.className = '侧字';
        计.textContent = 取评论数(p.id) + ' 条';
        块标.appendChild(计);
        块.appendChild(块标);

        const 列2 = document.createElement('div');
        列2.className = '评论列';
        const 评 = 读字典(评论键)[p.id];
        const 们 = (评 && Array.isArray(评.列表)) ? 评.列表 : [];
        if (!们.length) {
            const 空 = document.createElement('div');
            空.className = '空态';
            空.innerHTML = '<span class="空态标">还没有评论</span>来说两句';
            列2.appendChild(空);
        }
        们.slice(-8).forEach(c => {
            const 行 = document.createElement('div');
            行.className = '评论行';
            const 文 = document.createElement('span');
            文.textContent = (c && c.文) || '';
            行.appendChild(文);
            列2.appendChild(行);
        });
        块.appendChild(列2);

        const 输行 = document.createElement('div');
        输行.className = '评论输行';
        const 入 = document.createElement('input');
        入.className = '行输入'; 入.type = 'text';
        入.placeholder = '说点什么……'; 入.maxLength = 60;
        const 发 = document.createElement('button');
        发.className = '小钮 主'; 发.type = 'button'; 发.textContent = '发表评论';
        发.addEventListener('click', () => {
            const 文 = 入.value.trim();
            if (!文) { 提示('写点什么再发'); return; }
            发评论(p.id, 文);
            入.value = '';
            渲染详情();
            提示('已发表');
        });
        入.addEventListener('keydown', e => { if (e.key === 'Enter') 发.click(); });
        输行.appendChild(入); 输行.appendChild(发);
        块.appendChild(输行);
        体.appendChild(块);

        /* 目录预览 */
        const 书 = await 取书(p.id);
        const 章 = (书 && Array.isArray(书.章节)) ? 书.章节 : [];
        const 进度 = 读进度(p.id);
        if (章.length) {
            const 标 = document.createElement('div');
            标.className = '分区标题'; 标.textContent = '目录';
            体.appendChild(标);
            const 列 = document.createElement('div');
            列.className = '详情章列';
            const 起 = 进度 ? Number(进度.章) : 0;
            章.slice(Math.max(0, 起), Math.max(0, 起) + 5).forEach((c, k) => {
                const i = Math.max(0, 起) + k;
                const 行 = document.createElement('button');
                行.className = '详情章预览';
                行.type = 'button';
                行.textContent = c.题 || ('第 ' + (i + 1) + ' 章');
                行.addEventListener('click', () => {
                    关详情();
                    开书来源 = { 类型: '详情', id: p.id };
                    开书(p.id, i);
                });
                列.appendChild(行);
            });
            体.appendChild(列);
        }

        /* 底部按钮 */
        const 已有 = 读表(书架键).some(b => b.id === p.id);
        if (已有) {
            const 读 = document.createElement('button');
            读.className = '大钮'; 读.type = 'button';
            读.textContent = 进度 ? ('继续读 第' + (Number(进度.章) + 1) + '章') : '开始阅读';
            读.addEventListener('click', () => {
                关详情();
                开书来源 = { 类型: '详情', id: p.id };
                开书(p.id, 进度 ? Number(进度.章) : undefined);
            });
            底.appendChild(读);
            const 删 = document.createElement('button');
            删.className = '大钮 次'; 删.type = 'button'; 删.textContent = '移出书架';
            删.addEventListener('click', () => {
                写表(书架键, 读表(书架键).filter(b => b.id !== p.id));
                提示('已移出书架');
                关详情(); 渲染();
            });
            底.appendChild(删);
        } else {
            const 加 = document.createElement('button');
            加.className = '大钮'; 加.type = 'button'; 加.textContent = '加入书架';
            加.addEventListener('click', () => { 加入书架(p); 渲染详情(); });
            底.appendChild(加);
            if (章.length) {
                const 试 = document.createElement('button');
                试.className = '大钮 次'; 试.type = 'button'; 试.textContent = '试读第一章';
                试.addEventListener('click', () => {
                    关详情();
                    开书来源 = { 类型: '详情', id: p.id };
                    开书(p.id, 0);
                });
                底.appendChild(试);
            }
        }
    }

    /* ============================================================
     * 14. 渲染入口
     * ============================================================ */
    function 渲染() {
        if (当前页 === '书架') 渲染书架();
        else if (当前页 === '书城') 渲染书城();
        else if (当前页 === '作者') 渲染作者();
    }

    /* ★ 切后台 / 关页面时结算 —— 否则这段时间读了也不算 */
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { 结算计时(); 刷新时长(); }
        else if (当前书) 开始计时();
    });
    window.addEventListener('pagehide', () => 结算计时());

    /* ============================================================
     * 15. 启动
     * ============================================================ */
    初始化示例().then(() => {
        切页('书架');
        刷新时长();
    });

    /* ============================================================
     * 16. 测试探针
     * ============================================================ */
    window.阅读 = {
        /* 存储 */
        书架键: 书架键, 平台键: 平台键, 笔名键: 笔名键, 进度键: 进度键,
        热度键: 热度键, 人数键: 人数键, 时长键: 时长键, 评论键: 评论键,
        读表: 读表, 写表: 写表, 读字典: 读字典, 写字典: 写字典,
        /* 进度 / 统计 */
        读进度: 读进度, 写进度: 写进度, 清进度: 清进度,
        取热度: 取热度, 加热度: 加热度,
        取阅读数: 取阅读数, 取评论数: 取评论数, 发评论: 发评论,
        读时长: 读时长, 加时长: 加时长, 时长文: 时长文,
        刷新时长: 刷新时长, 结算计时: 结算计时, 开始计时: 开始计时,
        热门分: 热门分, 阅读比: 阅读比,
        归类: 归类, 书状态: 书状态, 书来源: 书来源,
        /* 书 */
        取书: 取书, 存书: 存书, 删书: 删书, 切章: 切章,
        造封面: 造封面, 总字数: 总字数,
        加入书架: 加入书架,
        /* 书城 */
        搜书: 搜书, 排序书: 排序书, 取榜: 取榜, 拉分类书: 拉分类书,
        猜你喜欢: 猜你喜欢,
        题材表: 题材表, 其他子类: 其他子类, 状态表: 状态表, 排序表: 排序表,
        榜单容量: 榜单容量, 热门容量: 热门容量, 新书窗: 新书窗, 热门权重: 热门权重,
        切题材: v => { 当前题材 = v; if (v !== '其他') 当前子类 = ''; 渲染书城(); },
        切子类: v => { 当前子类 = 当前子类 === v ? '' : v; 渲染书城(); },
        切状态: v => { 当前状态 = v; 渲染书城(); },
        切排序: v => { 当前排序 = v; 渲染书城(); },
        当前题材: () => 当前题材, 当前子类: () => 当前子类,
        /* 书架 */
        架进度表: 架进度表, 架更新表: 架更新表, 架来源表: 架来源表,
        切架进度: v => { 当前架进度 = v; 渲染书架(); },
        切架更新: v => { 当前架更新 = v; 渲染书架(); },
        切架来源: v => { 当前架来源 = v; 渲染书架(); },
        切架排序: v => { 当前架排序 = v; 渲染书架(); },
        当前架进度: () => 当前架进度,
        /* 导航 */
        切页: 切页, 当前页: () => 当前页,
        开编辑器: 开编辑器, 关编辑器: 关编辑器,
        开作品页: 开作品页, 关作品页: 关作品页,
        开作者主页: 开作者主页, 关作者主页: 关作者主页, 存作品信息: 存作品信息,
        作品页中: () => 作品页书, 新建作品: 新建作品,
        发布章: 发布章, 存草稿: 存草稿, 我的作品: 我的作品,
        编辑中: () => 编辑书, 回上一界面: 回上一界面, 返回表: 返回表,
        回上一页: 回上一页,
        /* 详情 / 阅读 */
        开详情: 开详情, 关详情: 关详情,
        开书: 开书, 关书: 关书, 渲染章列表: 渲染章列表, 渲染正文: 渲染正文,
        阅读态: () => 阅读态, 当前章: () => 当前章,
        开更多: 开更多, 关更多: 关更多,
        开长按条: 开长按条, 关长按条: 关长按条, 长按阈值: 长按阈值,
        /* 段评 / 听书 */
        开段评: 开段评, 关段评: 关段评, 段评数: 段评数, 段键: 段键,
        开听书: 开听书, 关听书: 关听书, 停念: 停念, 念的人: () => 念的人,
        取联系人音色: 取联系人音色, 切朗读段: 切朗读段,
    };
})();
    </script>

    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时

 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);
        })).catch(() => null);
    }

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */
    function 读状态() {
        try { return JSON.parse(localStorage.getItem(状态键) || 'null'); } catch (e) { return null; }
    }

    function 写状态(存) {

     * 主体
     * ------------------------------------------------------------- */

     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位

     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */

    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {
        return document.getElementById('音乐播放器') || document.getElementById(元素id);
    }

    const 全局音频 = {

            占用.add(键);

            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */

        音频.addEventListener('ended', () => {
            写状态({ id: 存.id, 名: 存.名, 类型: 存.类型, 时间: 0, 播放中: false });
        });

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */

                id: 存.id, 名: 存.名, 类型: 存.类型,
                时间: 音频.currentTime || 0,
                /* ★ 同 4 页那个坑：只认真正的布尔。pagehide / beforeunload

         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没
         *      ready），失败后就再也没机会了 —— 表现正是「切过去没声音」。
         *      必须【成功才停】，这是这段里最要紧的一句。
         * ---------------------------------------------------------- */

            document.removeEventListener('visibilitychange', 见可见);
            收提示();
        }

        function 见可见() {
            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();                     // 老浏览器无 Promise：当成功处理
        }

        /** 被拦 → 挂持续监听 + 显示提示条 */
        function 展提示() {
            if (!补播中) {
                补播中 = true;
                /* ★ 捕获阶段：冒泡阶段可能被页面自己的 stopPropagation 吃掉 */
                事件名.forEach(n => document.addEventListener(n, 试补播, true));
                document.addEventListener('visibilitychange', 见可见);
            }
            亮提示();
        }

        /* ---- 提示条：自建，不依赖各页自己的 toast 实现（各页不统一）---- */
        let 提示元素 = null;
        function 亮提示() {
            if (提示元素) return;
            const 条 = document.createElement('div');
            条.id = '全局音乐提示';
            条.textContent = '♪ 音乐已就绪，点一下继续播放';
            // 样式全内联 + !important：各页 CSS 互不统一，不这样会被盖掉 / 变形
            条.setAttribute('style', [
                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】

 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *

 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），

 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */

    let 已弹出 = false;

    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
</body>
</html>
