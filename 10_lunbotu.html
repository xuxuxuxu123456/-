<!DOCTYPE html>
<!--
    10_lunbotu —— 动态轮播图设置

    入口：5_dongtai 轻点轮播卡片 → 10_lunbotu.html?序=0~3
    出口：★ 从哪进来就回哪去 —— ?from=<页号> 优先（8 页设置入口带 from=8），
          其次 document.referrer（5 页轻点卡片进来），都没有才回 5 页。

    ★ 4 张各自独立替换：
        顶部（返回 /「轮播图 · 第 N 张」/ 右侧占位）
        → 16:9 大预览（左下角标「第 N 张」，自定义后追加「· 自定义」）
        → 4 张缩略图横排，当前张描边高亮；点任意一张即切过去
        → 「从手机相册选择」→ 来源面板（拍摄 / 相册 / 取消）→ 16:9 裁剪 → 应用
      ?序= 越界或非法 → 回落第 1 张，不崩。

    ★ 存 localStorage「轮播图_<序>」（dataURL）。5 页载入图片时优先读它，
      读不到（或 dataURL 坏了）再退回 2【图片】/3D图N 做扩展名探测。

    ★ 与 9 页共用同一套图片预处理（HEIC 拦截 / EXIF 摆正 / 超大图降采样），
      改动请与 1 / 2 / 9 页同步。

    风格：与 1~9 页统一（同色板、毛玻璃、灰描边、深灰强调、SVG 图标）。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>轮播图设置</title>
    <style>
        /* ===== 统一色板（与 1~9 页完全一致） ===== */
        :root {
            --ink: #333336;
            --ink-2: #55555a;
            --ink-3: #7a7a80;
            --ink-4: #a4a4aa;
            --accent: #4a4a50;
            --accent-soft: #d5d5d9;
            --accent-hi: #e6e6ea;
            --accent-ink: #35353b;
            --panel: 255, 255, 255;
            --line: 158, 158, 162;
            --shade: 48, 48, 54;
            --glass: 0.5;
            --blur: 14px;
            --blur-sm: 8px;

            /* ★ rgb 伴生变量：hex 变量【不能】直接进 rgba()（整条声明会被静默丢弃），
               要带透明度时必须用这批数值三元组。与 1 / 4 / 7 / 8 / 9 页同一套。 */
            --ink-rgb: 51, 51, 54;
            --ink-2-rgb: 85, 85, 90;
            --ink-3-rgb: 122, 122, 128;
            --ink-4-rgb: 164, 164, 170;
            --accent-rgb: 74, 74, 80;
            --accent-soft-rgb: 213, 213, 217;
            --accent-hi-rgb: 230, 230, 234;
            --accent-ink-rgb: 53, 53, 59;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { overflow-x: hidden; touch-action: pan-y; }

        body {
            background-color: #dadae0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink-2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .手机主题背景容器 {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            position: relative;
            background-color: transparent;
            overflow: hidden;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(var(--shade), 0.16);
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        @media (max-width: 430px) { .手机主题背景容器 { box-shadow: none; } }

        .主题背景图片 {
            width: 100%;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .全局白色遮罩 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(var(--panel), 0.45);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 顶部固定区 ===== */
        .顶部固定区 {
            position: relative;
            z-index: 10;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            backdrop-filter: blur(var(--blur)) saturate(150%) brightness(1.06);
            flex-shrink: 0;
            padding-bottom: clamp(8px, 2.5vw, 12px);
        }

        .顶部导航栏 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 16px) clamp(6px, 2vw, 8px);
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--ink-2);
            position: relative;
        }

        .返回按钮 {
            cursor: pointer;
            width: clamp(24px, 7vw, 28px);
            height: clamp(24px, 7vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .返回按钮 svg {
            width: clamp(17px, 4.8vw, 20px);
            height: clamp(17px, 4.8vw, 20px);
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.9;
        }

        /* ★ 与 5 / 7 / 8 / 9 页同款：绝对定位脱离 flex 流，真正居中 */
        .中间标题 {
            position: absolute;
            left: 0; right: 0;
            top: clamp(10px, 3vw, 14px);
            text-align: center;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink);
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;
        }

        .右侧占位 { width: clamp(24px, 7vw, 28px); flex-shrink: 0; }

        /* ===== 中间滚动区 ===== */
        .手机界面内容 {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 2;
            touch-action: pan-y;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .手机界面内容::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ================================================================
           ===== 预览区（16:9）===== */
        .预览区 {
            position: relative;
            margin: clamp(14px, 4vw, 20px) clamp(14px, 4vw, 18px) 0;
            aspect-ratio: 16 / 9;
            border-radius: clamp(11px, 3.2vw, 14px);
            overflow: hidden;
            background: rgba(var(--panel), var(--glass));
            -webkit-backdrop-filter: blur(var(--blur-sm));
            backdrop-filter: blur(var(--blur-sm));
            box-shadow: 0 2px 10px rgba(var(--shade), 0.1);
        }

        .预览图 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .预览区.空 .预览图 { display: none; }
        .预览区.空::after {
            content: attr(data-兜底);
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(11px, 3.2vw, 13px);
            color: var(--ink-4);
        }

        /* 左下角标：第 N 张（自定义后追加「· 自定义」） */
        .预览角标 {
            position: absolute;
            left: clamp(7px, 2vw, 10px);
            bottom: clamp(7px, 2vw, 10px);
            padding: clamp(3px, 1vw, 5px) clamp(8px, 2.4vw, 11px);
            border-radius: 999px;
            background: rgba(40, 40, 46, 0.55);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: clamp(10px, 2.9vw, 11.5px);
            letter-spacing: .3px;
            z-index: 2;
        }

        /* ================================================================
           ===== 4 张缩略图 ===== */
        .缩略行 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(7px, 2vw, 10px);
            margin: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 18px) 0;
        }

        .缩略格 {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: clamp(6px, 1.8vw, 8px);
            overflow: hidden;
            background: rgba(var(--panel), var(--glass));
            border: none;
            padding: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .16s, box-shadow .16s;
        }
        .缩略格:active { transform: scale(.96); }

        /* 当前张：深灰描边 + 序号底色 */
        .缩略格.当前 {
            box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(var(--shade), 0.14);
        }

        .缩略格 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .缩略序 {
            position: absolute;
            left: 0; bottom: 0;
            padding: 1px clamp(4px, 1.2vw, 6px);
            border-radius: 0 4px 0 0;
            background: rgba(40, 40, 46, 0.5);
            color: #fff;
            font-size: clamp(8.5px, 2.4vw, 10px);
            line-height: 1.5;
        }

        .缩略格.当前 .缩略序 { background: var(--accent); }

        .缩略格.空::after {
            content: attr(data-兜底);
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(9px, 2.6vw, 10.5px);
            color: var(--ink-4);
        }
        .缩略格.空 img { display: none; }

        /* ================================================================
           ===== 操作行 / 来源面板 / 裁剪弹窗（与 9 页同款）===== */
        .操作区 {
            margin: clamp(14px, 4vw, 20px) clamp(14px, 4vw, 18px) clamp(18px, 5vw, 24px);
        }

        .操作行 {
            display: flex;
            align-items: center;
            gap: clamp(9px, 2.6vw, 12px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(12px, 3.6vw, 15px);
            border: none;
            border-radius: clamp(11px, 3.2vw, 14px);
            background: rgba(var(--panel), 0.5);
            -webkit-backdrop-filter: blur(var(--blur-sm));
            backdrop-filter: blur(var(--blur-sm));
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .操作行:active { background: rgba(var(--panel), 0.72); }

        .操作图标 {
            width: clamp(16px, 4.6vw, 18px);
            height: clamp(16px, 4.6vw, 18px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .操作文字 { flex: 1; min-width: 0; font-size: clamp(12.5px, 3.6vw, 14px); color: var(--ink); }

        .操作箭头 {
            width: clamp(12px, 3.4vw, 14px);
            height: clamp(12px, 3.4vw, 14px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-4);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .来源遮罩 {
            position: absolute; inset: 0; z-index: 300;
            background: rgba(0, 0, 0, 0.42);
            display: none; align-items: flex-end; justify-content: center;
        }
        .来源遮罩.显示 { display: flex; }
        .来源面板 {
            width: 100%; max-width: 430px;
            padding: 0 clamp(8px, 2.4vw, 10px)
                     calc(clamp(8px, 2.4vw, 10px) + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform .26s cubic-bezier(.32, .72, 0, 1);
        }
        .来源遮罩.显示 .来源面板 { transform: translateY(0); }
        .来源组 {
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            border-radius: clamp(13px, 3.8vw, 15px);
            overflow: hidden;
        }
        .来源项 {
            display: flex;
            align-items: center;
            gap: clamp(10px, 3vw, 13px);
            width: 100%;
            padding: clamp(12px, 3.5vw, 15px) clamp(14px, 4vw, 17px);
            border: none;
            background: transparent;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .来源项 + .来源项 { border-top: 1px solid rgba(var(--line), 0.15); }
        .来源项:active { background: rgba(var(--line), 0.09); }
        .来源项 svg {
            width: clamp(17px, 4.8vw, 19px);
            height: clamp(17px, 4.8vw, 19px);
            flex-shrink: 0;
            fill: none;
            stroke: var(--ink-2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .来源文字 { font-size: clamp(13.5px, 3.9vw, 15px); color: var(--ink); font-weight: 500; }
        .来源项.取消 {
            margin-top: clamp(7px, 2vw, 9px);
            border-radius: clamp(13px, 3.8vw, 15px);
            background: rgba(252, 252, 254, 0.98);
            -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
            justify-content: center;
        }
        .来源项.取消 .来源文字 { font-weight: 600; }

        /* 裁剪：16:9 取景框（与 5 页轮播卡片同比例） */
        .裁剪遮罩 {
            position: absolute; inset: 0; z-index: 320;
            background: rgba(20, 20, 24, 0.86);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 4vw, 20px);
        }
        .裁剪遮罩.显示 { display: flex; }
        .裁剪标题 { color: #fff; font-size: clamp(12.5px, 3.6vw, 14px); margin-bottom: clamp(10px, 3vw, 14px); opacity: .9; }
        .裁剪视口 {
            position: relative;
            width: min(84vw, 330px);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #2a2a30;
            touch-action: none;
        }
        .裁剪图片 {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0px 0px;   /* ★ 与 tx/ty 公式匹配 */
            will-change: transform;
            -webkit-user-drag: none;
            user-select: none;
        }
        .裁剪参考线 { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
        .裁剪参考线 i { position: absolute; background: rgba(255, 255, 255, 0.34); }
        .裁剪参考线 i:nth-child(1) { left: 33.33%; top: 0; width: 1px; height: 100%; }
        .裁剪参考线 i:nth-child(2) { left: 66.66%; top: 0; width: 1px; height: 100%; }
        .裁剪参考线 i:nth-child(3) { top: 33.33%; left: 0; height: 1px; width: 100%; }
        .裁剪参考线 i:nth-child(4) { top: 66.66%; left: 0; height: 1px; width: 100%; }
        .裁剪提示 { color: #fff; font-size: clamp(10.5px, 3vw, 12px); opacity: .62; margin-top: clamp(10px, 3vw, 14px); text-align: center; line-height: 1.5; }
        .裁剪按钮行 { display: flex; gap: clamp(10px, 3vw, 14px); margin-top: clamp(14px, 4vw, 20px); }
        .裁剪按钮 {
            min-width: clamp(78px, 23vw, 96px);
            height: clamp(34px, 9.6vw, 39px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: clamp(12.5px, 3.5vw, 14px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .16s;
        }
        .裁剪按钮:active { background: rgba(255, 255, 255, 0.14); }
        .裁剪按钮.主 { background: var(--accent); border-color: var(--accent); font-weight: 600; }
        .裁剪按钮.主:active { background: var(--accent-ink); }

        .视觉隐藏文件输入 {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .toast {
            position: fixed; left: 50%; bottom: clamp(80px, 22vw, 110px);
            transform: translateX(-50%) translateY(20px);
            background: rgba(40, 40, 46, 0.92);
            color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 999px;
            z-index: 9999; opacity: 0; pointer-events: none; white-space: nowrap; max-width: 86vw;
            overflow: hidden; text-overflow: ellipsis; transition: opacity .2s, transform .2s;
        }
        .toast.显示 { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="手机主题背景容器">
    <img class="主题背景图片" src="2【图片】/默认主题背景.png" alt="">
    <div class="全局白色遮罩"></div>

    <!-- ===== 顶部固定区 ===== -->
    <div class="顶部固定区">
        <div class="顶部导航栏">
            <div class="返回按钮" id="返回按钮" role="button" aria-label="返回">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="15 6 9 12 15 18"></polyline>
                </svg>
            </div>
            <div class="中间标题" id="页面标题">轮播图 · 第 1 张</div>
            <div class="右侧占位"></div>
        </div>
    </div>

    <!-- ===== 中间滚动区 ===== -->
    <div class="手机界面内容">
        <div class="预览区" id="预览区" data-兜底="3D图1">
            <img class="预览图" id="预览图" alt="当前轮播图">
            <div class="预览角标" id="预览角标">第 1 张</div>
        </div>

        <div class="缩略行" id="缩略行"></div>

        <div class="操作区">
            <button class="操作行" id="上传行" type="button">
                <svg class="操作图标" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
                    <circle cx="8.6" cy="9.8" r="1.6"></circle>
                    <path d="M3.6 17.2l4.6-4.3 3.5 3.2 3.2-2.8 5.5 4.9"></path>
                </svg>
                <span class="操作文字">从手机相册选择</span>
                <svg class="操作箭头" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="9,5 16,12 9,19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <input class="视觉隐藏文件输入" id="相册输入" type="file" accept="image/*">
    <input class="视觉隐藏文件输入" id="拍照输入" type="file" accept="image/*" capture="environment">

    <!-- ===== 来源选择面板 ===== -->
    <div class="来源遮罩" id="来源遮罩">
        <div class="来源面板">
            <div class="来源组">
                <button class="来源项" id="来源拍照" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 8.5h3l1.5-2h7L17 8.5h3a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5z"></path>
                        <circle cx="12" cy="13.5" r="3.2"></circle>
                    </svg>
                    <span class="来源文字">拍摄</span>
                </button>
                <button class="来源项" id="来源相册" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
                        <circle cx="8.6" cy="9.8" r="1.6"></circle>
                        <path d="M3.6 17.2l4.6-4.3 3.5 3.2 3.2-2.8 5.5 4.9"></path>
                    </svg>
                    <span class="来源文字">从手机相册选择</span>
                </button>
            </div>
            <button class="来源项 取消" id="来源取消" type="button">
                <span class="来源文字">取消</span>
            </button>
        </div>
    </div>

    <!-- ===== 裁剪弹窗（16:9） ===== -->
    <div class="裁剪遮罩" id="裁剪遮罩">
        <div class="裁剪标题">拖动调整位置，双指缩放</div>
        <div class="裁剪视口" id="裁剪视口">
            <img class="裁剪图片" id="裁剪图片" alt="">
            <div class="裁剪参考线"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="裁剪提示">只替换第 <span id="裁剪序号">1</span> 张，其余三张不受影响</div>
        <div class="裁剪按钮行">
            <button class="裁剪按钮" id="裁剪取消" type="button">取消</button>
            <button class="裁剪按钮 主" id="裁剪确定" type="button">使用</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
(function () {
    'use strict';

    /* ============================================================
     * 0. 通用：Toast
     * ============================================================ */
    function 提示(消息) {
        const 元素 = document.getElementById('toast');
        if (!元素) return;
        元素.textContent = 消息;
        元素.classList.add('显示');
        clearTimeout(元素._计时);
        元素._计时 = setTimeout(() => 元素.classList.remove('显示'), 1800);
    }
    window.提示 = 提示;

    /* ============================================================
     * 1. 图片预处理：与 9 页同一套（HEIC / EXIF / 降采样）
     * ============================================================ */
    const 解码像素上限 = 16000000;
    const HEIC正则 = /^image\/hei(c|f)$/i;
    const HEIC扩展名正则 = /\.hei(c|f)$/i;
    function 是HEIC(文件) {
        return HEIC正则.test(文件.type || '') || HEIC扩展名正则.test(文件.name || '');
    }
    window.是HEIC = 是HEIC;

    function 读方向(文件) {
        return new Promise(解决 => {
            if (!/^image\/(jpeg|jpg)/i.test(文件.type || '')) return 解决(1);
            const 读 = new FileReader();
            读.onload = (e) => {
                try {
                    const 视 = new DataView(e.target.result);
                    if (视.getUint16(0, false) !== 0xFFD8) return 解决(1);
                    let 偏 = 2;
                    const 长 = 视.byteLength;
                    while (偏 + 4 <= 长) {
                        if (视.getUint8(偏) !== 0xFF) { 偏++; continue; }
                        const 标记 = 视.getUint8(偏 + 1);
                        if (标记 === 0xD8 || 标记 === 0x01 || (标记 >= 0xD0 && 标记 <= 0xD7)) { 偏 += 2; continue; }
                        if (标记 === 0xD9 || 标记 === 0xDA) break;
                        const 段长 = 视.getUint16(偏 + 2, false);
                        if (标记 === 0xE1) {
                            const 标识 = String.fromCharCode(
                                视.getUint8(偏 + 4), 视.getUint8(偏 + 5),
                                视.getUint8(偏 + 6), 视.getUint8(偏 + 7));
                            if (标识 === 'Exif') {
                                const tiff = 偏 + 10;
                                const 小端 = 视.getUint16(tiff, false) !== 0x4D4D;
                                if (视.getUint16(tiff + 2, 小端) === 0x002A) {
                                    const 目录偏 = 视.getUint32(tiff + 4, 小端);
                                    const 条目数 = 视.getUint16(tiff + 目录偏, 小端);
                                    for (let i = 0; i < 条目数; i++) {
                                        const 项 = tiff + 目录偏 + 2 + i * 12;
                                        if (项 + 10 > 长) break;
                                        if (视.getUint16(项, 小端) === 0x0112) {
                                            const 值 = 视.getUint16(项 + 8, 小端);
                                            return 解决(值 >= 1 && 值 <= 8 ? 值 : 1);
                                        }
                                    }
                                }
                            }
                        }
                        偏 += 2 + 段长;
                    }
                } catch (err) {}
                解决(1);
            };
            读.onerror = () => 解决(1);
            读.readAsArrayBuffer(文件.slice(0, 131072));
        });
    }
    window.读方向 = 读方向;

    function 规范化图片(图源, 方向) {
        const 原宽 = 图源.naturalWidth || 图源.width;
        const 原高 = 图源.naturalHeight || 图源.height;
        const 交换 = 方向 >= 5 && 方向 <= 8;
        let 出宽 = 交换 ? 原高 : 原宽;
        let 出高 = 交换 ? 原宽 : 原高;
        const 像素 = 原宽 * 原高;
        let 比例 = 1;
        if (像素 > 解码像素上限) 比例 = Math.sqrt(解码像素上限 / 像素);
        出宽 = Math.max(1, Math.round(出宽 * 比例));
        出高 = Math.max(1, Math.round(出高 * 比例));
        const 画布 = document.createElement('canvas');
        画布.width = 出宽; 画布.height = 出高;
        const 笔 = 画布.getContext('2d');
        switch (方向) {
            case 2: 笔.transform(-1, 0, 0, 1, 出宽, 0); break;
            case 3: 笔.transform(-1, 0, 0, -1, 出宽, 出高); break;
            case 4: 笔.transform(1, 0, 0, -1, 0, 出高); break;
            case 5: 笔.transform(0, 1, 1, 0, 0, 0); break;
            case 6: 笔.transform(0, 1, -1, 0, 出高, 0); break;
            case 7: 笔.transform(0, -1, -1, 0, 出高, 出宽); break;
            case 8: 笔.transform(0, -1, 1, 0, 0, 出宽); break;
            default: break;
        }
        笔.drawImage(图源, 0, 0, 交换 ? 出高 : 出宽, 交换 ? 出宽 : 出高);
        return { dataURL: 画布.toDataURL('image/jpeg', 0.92), 宽: 出宽, 高: 出高 };
    }
    window.规范化图片 = 规范化图片;

    /* ============================================================
     * 2. 当前序号：?序=0~3，越界 / 非法 → 回落第 1 张
     * ============================================================ */
    const 目录 = '2【图片】/';
    const 扩展候选 = ['png', 'jpg', 'jpeg', 'webp'];
    const 张数 = 4;

    function 读序号() {
        const 原 = new URLSearchParams(location.search).get('序');
        const n = parseInt(原, 10);
        // ★ 越界 / NaN / 负数一律回落 0，不让页面停在"没有当前张"的怪状态
        return (Number.isFinite(n) && n >= 0 && n < 张数) ? n : 0;
    }
    let 当前序 = 读序号();

    function 轮播键(序) { return '轮播图_' + 序; }
    function 读轮播(序) { try { return localStorage.getItem(轮播键(序)) || ''; } catch (e) { return ''; } }
    function 写轮播(序, 数据) {
        try { localStorage.setItem(轮播键(序), 数据); }
        catch (e) { 提示('保存失败：存储空间不足，换张小一点的图试试'); }
    }

    const 标题 = document.getElementById('页面标题');
    const 角标 = document.getElementById('预览角标');
    const 预览区 = document.getElementById('预览区');
    const 预览图 = document.getElementById('预览图');
    const 缩略行 = document.getElementById('缩略行');

    /**
     * 逐张探测默认素材 3D图N，全落空则显示文件名兜底。
     * ★ 用 onload 撤掉 .空：原先只加不撤，图片明明加载成功了，大预览却
     *   一直显示「3D图N」占位文字 —— 这是 10 页最直观的一个 bug。
     * ★ 用 onerror = 赋值而不是 addEventListener：切张会反复调 同步显示，
     *   累加监听器会让一次失败触发 N 次重试，src 来回跳。
     */
    function 载入默认(img, 容器, 名) {
        let 序 = 1;
        img.onload = () => 容器.classList.remove('空');
        img.onerror = () => {
            if (序 >= 扩展候选.length) { 容器.classList.add('空'); return; }
            img.src = 目录 + 名 + '.' + 扩展候选[序++];
        };
        img.src = 目录 + 名 + '.' + 扩展候选[0];
    }

    /** 渲染 4 张缩略图 */
    function 渲染缩略() {
        缩略行.innerHTML = '';
        for (let i = 0; i < 张数; i++) {
            const 格 = document.createElement('button');
            格.className = '缩略格' + (i === 当前序 ? ' 当前' : '');
            格.type = 'button';
            格.dataset.序 = String(i);
            格.dataset.兜底 = '3D图' + (i + 1);

            const img = document.createElement('img');
            img.alt = '第 ' + (i + 1) + ' 张';
            const 自定义 = 读轮播(i);
            if (自定义) img.src = 自定义;           // 用户换过 → 用换过的
            else 载入默认(img, 格, '3D图' + (i + 1));

            const 序标 = document.createElement('span');
            序标.className = '缩略序';
            序标.textContent = String(i + 1);

            格.appendChild(img);
            格.appendChild(序标);
            格.addEventListener('click', () => 切到(i));
            缩略行.appendChild(格);
        }
    }

    /** 同步标题 / 角标 / 预览 / 缩略高亮 */
    function 同步显示() {
        const 第几 = 当前序 + 1;
        const 自定义 = 读轮播(当前序);

        标题.textContent = '轮播图 · 第 ' + 第几 + ' 张';
        角标.textContent = 自定义 ? ('第 ' + 第几 + ' 张 · 自定义') : ('第 ' + 第几 + ' 张');
        角标.classList.toggle('自定义', !!自定义);

        预览区.dataset.兜底 = '3D图' + 第几;
        if (自定义) {
            预览区.classList.remove('空');
            预览图.src = 自定义;
        } else {
            预览区.classList.add('空');      // 先设空，探测成功时再撤
            载入默认(预览图, 预览区, '3D图' + 第几);
        }

        Array.from(缩略行.children).forEach((格, i) => {
            格.classList.toggle('当前', i === 当前序);
        });
    }

    function 切到(序) {
        当前序 = 序;
        同步显示();
    }
    window.切到 = 切到;

    /** 写入某张轮播图并刷新显示（业务方 / 测试可直接调） */
    window.应用轮播图 = function (序, dataURL) {
        const n = parseInt(序, 10);
        if (!Number.isFinite(n) || n < 0 || n >= 张数 || !dataURL) return false;
        写轮播(n, dataURL);
        当前序 = n;
        渲染缩略();
        同步显示();
        return true;
    };

    /* ============================================================
     * 3. 来源选择 + 选文件
     * ============================================================ */
    const 来源遮罩 = document.getElementById('来源遮罩');
    const 相册输入 = document.getElementById('相册输入');
    const 拍照输入 = document.getElementById('拍照输入');

    function 关来源() { 来源遮罩.classList.remove('显示'); }
    document.getElementById('上传行').addEventListener('click', () => 来源遮罩.classList.add('显示'));
    来源遮罩.addEventListener('click', e => { if (e.target === 来源遮罩) 关来源(); });
    document.getElementById('来源取消').addEventListener('click', 关来源);
    document.getElementById('来源拍照').addEventListener('click', () => { 关来源(); 挑(拍照输入); });
    document.getElementById('来源相册').addEventListener('click', () => { 关来源(); 挑(相册输入); });
    function 挑(输入) { 输入.value = ''; 输入.click(); }

    [相册输入, 拍照输入].forEach(输入 => {
        输入.addEventListener('change', () => {
            const 文件 = 输入.files && 输入.files[0];
            if (文件) 处理文件(文件);
        });
    });

    async function 处理文件(文件) {
        if (是HEIC(文件)) { 提示('HEIC 格式无法使用：请在相册里导出为 JPG，或改用「拍摄」'); return; }
        if (!/^image\//.test(文件.type || '')) { 提示('请选择图片文件'); return; }

        const 方向 = await 读方向(文件);
        const 读 = new FileReader();
        读.onload = () => {
            const 原始 = 读.result;
            /* ★ 用页面里真实的 #裁剪图片 来读尺寸，而不是 new Image()：
               游离的 Image 元素在部分 WebView（以及无布局环境）里不触发
               onload，整条链路会静默断掉 —— 表现就是「选完图没反应」。
               挂在已存在的元素上还能顺带复用它的解码结果。 */
            let 阶段 = 0;              // 0 = 先量原图；1 = 规范化后重来一轮
            let 数据 = 原始, 宽 = 0, 高 = 0;

            裁剪图片.onload = () => {
                宽 = 裁剪图片.naturalWidth || 裁剪图片.width;
                高 = 裁剪图片.naturalHeight || 裁剪图片.height;
                // 需要摆正 / 降采样 → 规范化一次，再把结果塞回同一个元素重来一轮
                if (阶段 === 0 && (方向 !== 1 || 宽 * 高 > 解码像素上限)) {
                    阶段 = 1;
                    try {
                        const 规 = 规范化图片(裁剪图片, 方向);
                        数据 = 规.dataURL; 宽 = 规.宽; 高 = 规.高;
                        裁剪图片.src = 数据;      // 会再触发一次 onload
                        return;
                    } catch (e) { /* canvas 不可用 → 用原图继续，不阻塞用户 */ }
                }
                开裁剪(数据 || 原始, 宽, 高);
            };
            裁剪图片.onerror = () => 提示('这张图读不出来，换一张试试');
            裁剪图片.src = 原始;
        };
        读.onerror = () => 提示('读取失败，请重试');
        读.readAsDataURL(文件);
    }

    /* ============================================================
     * 4. 裁剪：16:9，拖动平移 + 双指 / 滚轮缩放
     * ============================================================ */
    const 裁剪遮罩 = document.getElementById('裁剪遮罩');
    const 裁剪视口 = document.getElementById('裁剪视口');
    const 裁剪图片 = document.getElementById('裁剪图片');
    const 裁剪序号 = document.getElementById('裁剪序号');

    let 状态 = null;

    /* 无布局环境（jsdom / 首帧未排版）下的兜底取景框宽度，保证几何不断 */
    const 兜底视口宽 = 300;

    /**
     * 量取景框尺寸。★ 必须在遮罩加 .显示【之后】调用 —— 祖先还在
     * display:none 时 clientWidth 恒为 0，会把 cover 比例算成接近 0，
     * 图片缩成看不见的小点。改代码时务必保住这个顺序。
     */
    function 量视口() {
        const 宽 = 裁剪视口.clientWidth;
        const 高 = 裁剪视口.clientHeight;
        if (宽 > 0 && 高 > 0) return { 宽, 高 };
        return { 宽: 兜底视口宽, 高: Math.round(兜底视口宽 * 9 / 16) };
    }

    function 开裁剪(dataURL, 图宽, 图高) {
        裁剪图片.onload = null;              // ★ 下面还要设一次 src，先摘回调避免重入
        裁剪遮罩.classList.add('显示');        // ★ 先显示，再量尺寸 —— 顺序不能反
        const 视 = 量视口();
        /* cover：短边铺满取景框。
           ★ 乘 1.001 留一点余量：严格等于 cover 时，浮点误差 + 下面
             scale 的位数截断会让缩放后的边比取景框短那么零点几像素 ——
             表现为边缘露出一线底色。千分之一的放大肉眼完全看不出来。 */
        const 最小 = Math.max(视.宽 / 图宽, 视.高 / 图高) * 1.001;
        状态 = {
            图宽, 图高, 视宽: 视.宽, 视高: 视.高,
            比: 最小, 最小, 最大: 最小 * 4,
            tx: (视.宽 - 图宽 * 最小) / 2,
            ty: (视.高 - 图高 * 最小) / 2,
        };
        裁剪图片.src = dataURL;
        裁剪图片.style.transformOrigin = '0px 0px';
        应用变换();
        裁剪序号.textContent = String(当前序 + 1);
    }

    function 应用变换() {
        if (!状态) return;
        裁剪图片.style.width = 状态.图宽 + 'px';
        裁剪图片.style.height = 状态.图高 + 'px';
        裁剪图片.style.transform =
            'translate(' + 状态.tx.toFixed(2) + 'px, ' + 状态.ty.toFixed(2) + 'px)'
            + ' scale(' + 状态.比.toFixed(6) + ')';   // 6 位：4 位会截断出可见误差
    }

    function 夹紧() {
        if (!状态) return;
        const 显宽 = 状态.图宽 * 状态.比, 显高 = 状态.图高 * 状态.比;
        状态.tx = Math.min(0, Math.max(状态.视宽 - 显宽, 状态.tx));
        状态.ty = Math.min(0, Math.max(状态.视高 - 显高, 状态.ty));
    }

    let 拖拽 = null;
    /* ★ 按下手指计数：手机上 pointer 与 touch 事件同时触发，
       第二根手指落下时若继续走 pointermove 平移，就会和双指缩放打架 ——
       画面一边缩放一边被拖跑。多指时把拖拽让给 touch 的缩放逻辑。 */
    let 指针数 = 0;

    裁剪视口.addEventListener('pointerdown', e => {
        if (!状态) return;
        指针数++;
        if (指针数 > 1) { 拖拽 = null; return; }
        拖拽 = { x: e.clientX, y: e.clientY, tx: 状态.tx, ty: 状态.ty };
        try { 裁剪视口.setPointerCapture(e.pointerId); } catch (err) {}
    });
    裁剪视口.addEventListener('pointermove', e => {
        if (!拖拽 || !状态 || 指针数 > 1) return;
        状态.tx = 拖拽.tx + (e.clientX - 拖拽.x);
        状态.ty = 拖拽.ty + (e.clientY - 拖拽.y);
        夹紧(); 应用变换();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(名 =>
        裁剪视口.addEventListener(名, () => {
            指针数 = Math.max(0, 指针数 - 1);
            拖拽 = null;
        }));

    let 双指 = null;
    裁剪视口.addEventListener('touchstart', e => {
        if (!状态 || e.touches.length !== 2) return;
        双指 = {
            距: Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                          e.touches[0].clientY - e.touches[1].clientY),
            比: 状态.比,
        };
    }, { passive: true });
    裁剪视口.addEventListener('touchmove', e => {
        if (!双指 || !状态 || e.touches.length !== 2) return;
        e.preventDefault();
        const 距 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
        const 区 = 裁剪视口.getBoundingClientRect();
        const px = (e.touches[0].clientX + e.touches[1].clientX) / 2 - 区.left;
        const py = (e.touches[0].clientY + e.touches[1].clientY) / 2 - 区.top;
        const 图x = (px - 状态.tx) / 状态.比, 图y = (py - 状态.ty) / 状态.比;
        状态.比 = Math.min(状态.最大, Math.max(状态.最小, 双指.比 * (距 / 双指.距)));
        状态.tx = px - 图x * 状态.比;
        状态.ty = py - 图y * 状态.比;
        夹紧(); 应用变换();
    }, { passive: false });
    裁剪视口.addEventListener('touchend', () => { 双指 = null; }, { passive: true });

    裁剪视口.addEventListener('wheel', e => {
        if (!状态) return;
        e.preventDefault();
        状态.比 = Math.min(状态.最大, Math.max(状态.最小, 状态.比 * (e.deltaY < 0 ? 1.1 : 0.9)));
        夹紧(); 应用变换();
    }, { passive: false });

    /* ★ 旋转屏幕 / 分屏会改变取景框尺寸：不重算的话 cover 比例与夹紧
         仍按旧尺寸算，图片会露底或被推歪。 */
    window.addEventListener('resize', () => {
        if (!状态 || !裁剪遮罩.classList.contains('显示')) return;
        const 视 = 量视口();
        if (视.宽 === 状态.视宽 && 视.高 === 状态.视高) return;
        状态.视宽 = 视.宽;
        状态.视高 = 视.高;
        状态.最小 = Math.max(视.宽 / 状态.图宽, 视.高 / 状态.图高) * 1.001;
        状态.最大 = 状态.最小 * 4;
        状态.比 = Math.min(状态.最大, Math.max(状态.最小, 状态.比));
        夹紧();
        应用变换();
    });

    function 关裁剪() {
        裁剪遮罩.classList.remove('显示');
        状态 = null;
        裁剪图片.removeAttribute('src');
    }
    document.getElementById('裁剪取消').addEventListener('click', 关裁剪);

    document.getElementById('裁剪确定').addEventListener('click', () => {
        if (!状态) return;
        try {
            const 源x = Math.max(0, Math.round(-状态.tx / 状态.比));
            const 源y = Math.max(0, Math.round(-状态.ty / 状态.比));
            const 源宽 = Math.min(状态.图宽 - 源x, Math.round(状态.视宽 / 状态.比));
            const 源高 = Math.min(状态.图高 - 源y, Math.round(状态.视高 / 状态.比));

            // 输出上限 1280（长边）：轮播卡实际显示宽度远小于此，够用且不占空间
            const 出比例 = Math.min(1, 1280 / Math.max(源宽, 源高));
            const 画布 = document.createElement('canvas');
            画布.width = Math.max(1, Math.round(源宽 * 出比例));
            画布.height = Math.max(1, Math.round(源高 * 出比例));
            const 笔 = 画布.getContext('2d');
            笔.imageSmoothingQuality = 'high';
            笔.drawImage(裁剪图片, 源x, 源y, 源宽, 源高, 0, 0, 画布.width, 画布.height);

            window.应用轮播图(当前序, 画布.toDataURL('image/jpeg', 0.88));
            关裁剪();
            提示('第 ' + (当前序 + 1) + ' 张已更新');
        } catch (e) {
            提示('裁剪失败，请重试');
        }
    });

    /* ============================================================
     * 5. 返回 → 5 页
     * ============================================================ */
    const 来源 = new URLSearchParams(location.search).get('from') || '';
    const 返回表 = { '5': '5_dongtai.html', '8': '8_wode.html' };

    /** referrer 兜底：入口忘了带 ?from= 时，仍能从「上一个页面」认出该回哪 */
    function 推来源页() {
        try {
            const 名 = (document.referrer || '').split('/').pop().split('?')[0];
            return /^\d+_.+\.html$/.test(名) ? 名 : '';
        } catch (e) { return ''; }
    }

    const 返回页 = 返回表[来源] || 推来源页() || '5_dongtai.html';
    window.取返回页 = () => 返回页;          // 对外暴露，供测试与业务接管
    document.getElementById('返回按钮').addEventListener('click', () => {
        location.href = 返回页;
    });

    /* ============================================================
     * 6. 启动
     * ============================================================ */
    渲染缩略();
    同步显示();
})();
</script>

    <script id="全局音乐">
/* =============================================================================
 * 全局音乐.js —— 跨页续播（4 页开始播，切到任何界面都不中断）
 *
 * 【为什么需要它】
 *   4_tongxun 有自己的完整 UI 播放器，但 HTML 页面之间是真跳转：
 *   一离开 4 页，整个 JS 上下文连同 <audio> 一起被销毁，音乐就断了。
 *   本脚本在每个页面挂一个「无界面的续播器」：进来先读存档，
 *   如果上次是在播，就重建 audio、跳回原秒数、接着播。
 *
 * 【它不是什么】
 *   不做 UI、不做播放列表 —— 那些是 4 页播放器的职责。
 *   这里只负责「让声音不断」，回到 4 页时完整播放器会自然接手。
 *
 * 【契约（改这里前务必看）】
 *   ① 存档键 '音乐播放状态'，格式必须与 4 页 保存状态() 完全一致：
 *        { id, 名, 类型:'默认'|'上传', 时间:秒, 播放中:bool }
 *      —— 两边都写、都读同一个键，才能无缝交接。
 *   ② ★ 让位规则：页面里若存在 #音乐播放器（4 页的），本脚本【完全不启动】。
 *      否则两个 audio 会同时出声。这是唯一的冲突防线，别删。
 *   ③ 上传曲目在 IndexedDB：库名 '音乐库' / 表名 '音频'（与 4 页同名同结构）。
 *
 * 【让位 API（其它页面调用）】
 *   window.全局音频.暂停('语音消息') / .恢复('语音消息')
 *   window.全局音频.暂停('语音通话') / .恢复('语音通话')
 *   7 页播语音条、14 页通话时分别调用，避免两路声音叠在一起。
 *   ★ 用【原因集合】而非布尔：语音与通话可能重叠，布尔会在语音播完时
 *     把仍在通话中的音乐放出来。全部原因解除才恢复。
 *   ★ 会记住「占用前是否在播」，本来没放音乐就不会凭空启动。
 *
 * 【自动播放限制】
 *   浏览器会拦「没有用户手势的自动播放」。被拦时不报错、不打断，
 *   改为监听页面上第一次 pointerdown / touchstart 补播一次
 *   —— 与 4 页 尝试续播() 同一个套路。
 * ========================================================================== */
(function () {
    'use strict';

    const 状态键 = '音乐播放状态';
    const 目录候选 = ['1【音乐】/', '../1【音乐】/'];   // 与 4 页一致：html 挪进子文件夹时自动回退
    const 库名 = '音乐库';
    const 表名 = '音频';

    /* ---------------------------------------------------------------
     * IndexedDB：只为拿上传曲目的 blob，读不到就 null（调用方兜底）
     * ------------------------------------------------------------- */
    function 打开库() {
        return new Promise((完成, 失败) => {
            if (typeof indexedDB === 'undefined') return 失败(new Error('无 IndexedDB'));
            let 请求;
            try { 请求 = indexedDB.open(库名, 1); } catch (e) { return 失败(e); }
            请求.onupgradeneeded = () => {
                const db = 请求.result;
                if (!db.objectStoreNames.contains(表名)) db.createObjectStore(表名, { keyPath: 'id' });
            };
            请求.onsuccess = () => 完成(请求.result);
            请求.onerror = () => 失败(请求.error || new Error('打开失败'));
        });
    }

    function 读一条(id) {
        return 打开库().then(db => new Promise((完成, 失败) => {
            const 事务 = db.transaction(表名, 'readonly');
            const 请求 = 事务.objectStore(表名).get(id);
            请求.onsuccess = () => 完成(请求.result || null);
            请求.onerror = () => 失败(请求.error);
        })).catch(() => null);
    }

    /* ---------------------------------------------------------------
     * 存档读写
     * ------------------------------------------------------------- */
    function 读状态() {
        try { return JSON.parse(localStorage.getItem(状态键) || 'null'); } catch (e) { return null; }
    }

    function 写状态(存) {
        try { localStorage.setItem(状态键, JSON.stringify(存)); } catch (e) {}
    }

    /* ---------------------------------------------------------------
     * 主体
     * ------------------------------------------------------------- */
    const 元素id = '全局音乐播放器';

    /* =========================================================================
     * ★ 占用管理：语音消息 / 语音通话 出声时，背景音乐让位
     *
     *   为什么用 Set 而不是布尔：两种占用可能重叠（比如播着语音条的同时来电话）。
     *   布尔会在「语音播完恢复」时把仍在通话中的音乐也放出来。
     *   记成「原因集合」，全部解除才恢复 —— 这是这类让位逻辑的正确写法。
     *
     *   另外要记住【占用前是否在播】：如果本来就没放音乐，
     *   语音播完不该把音乐凭空启动。
     * ======================================================================= */
    const 占用 = new Set();
    let 占用前在播 = false;
    /* ★ 声明在 IIFE 顶层而不是 启动() 内：页尾探针 __全局音乐.补播中() 要访问它，
         放在 启动() 里的话外层作用域取不到（TDZ / 未定义）。 */
    let 补播中 = false;

    /** 4 页让位时，操作目标是它自己的 #音乐播放器；否则是本脚本建的那个 */
    function 取音频() {
        return document.getElementById('音乐播放器') || document.getElementById(元素id);
    }

    const 全局音频 = {
        /** 暂停背景音乐（可重入；同一原因重复调用无害） */
        暂停(原因) {
            const 键 = 原因 || '未命名';
            if (占用.size === 0) {
                const a = 取音频();
                占用前在播 = !!a && !a.paused;
            }
            占用.add(键);
            const a = 取音频();
            if (a && !a.paused) { try { a.pause(); } catch (e) {} }
        },

        /** 解除某个占用；全部解除且占用前在播 → 恢复播放 */
        恢复(原因) {
            const 键 = 原因 || '未命名';
            if (!占用.has(键)) return;
            占用.delete(键);
            if (占用.size > 0) return;              // 还有别的占用（比如仍在通话）
            if (!占用前在播) return;                 // 本来就没在播 → 不凭空启动
            const a = 取音频();
            if (a && a.paused) {
                const 试 = a.play();
                if (试 && typeof 试.catch === 'function') 试.catch(() => {});
            }
        },

        /** 强制清掉所有占用（异常路径兜底用） */
        清除() { 占用.clear(); },

        占用中() { return 占用.size > 0; },
        占用表() { return Array.from(占用); },
        是否在播() { const a = 取音频(); return !!a && !a.paused; },
    };
    /* ★ 无论让不让位都挂上：让位时它操作的是 4 页自己的播放器，
       调用方（语音条 / 通话）不必关心自己在哪个页面。 */
    window.全局音频 = 全局音频;

    function 启动() {
        /* ★★ 让位：4 页有完整播放器（#音乐播放器），这里绝不能再建第二个 audio。
              注意 7 页那个是 #语音播放器（点语音消息用的），与本脚本无关，
              各播各的，所以【只】认 #音乐播放器 这一个 id。 */
        if (document.getElementById('音乐播放器')) return;
        /* 防重：脚本万一被引了两次，也只建一个 audio */
        if (document.getElementById(元素id)) return;

        const 存 = 读状态();
        // 没在播（或压根没播过）→ 安静退出，不建元素、不占资源
        if (!存 || !存.播放中 || !存.名) return;

        const 音频 = document.createElement('audio');
        音频.id = 元素id;
        音频.dataset.全局音乐 = '1';        // 便于排查 / 测试定位
        音频.preload = 'metadata';
        document.body.appendChild(音频);

        const 目标 = Math.max(0, Number(存.时间) || 0);
        let 已定位 = false;      // loadedmetadata 只处理一次（切目录会重复触发）
        let 目录序 = 0;
        let 上传链接 = '';

        /* 跳回上次的秒数再播。★ 先 seek 后 play：
           否则会从 0 开始，听感上像换了一首。 */
        音频.addEventListener('loadedmetadata', () => {
            if (已定位) return;
            已定位 = true;
            const 长 = isFinite(音频.duration) ? 音频.duration : 0;
            try {
                音频.currentTime = 长 > 0
                    ? Math.min(目标, Math.max(0, 长 - 0.3))
                    : 目标;
            } catch (e) {}
            续播();
        });

        /* 目录逐个试：与 4 页 载入当前目录() 同款（文件缺失 / 解码失败都能兜住） */
        音频.addEventListener('error', () => {
            if (目录序 < 目录候选.length) {
                音频.src = encodeURI(目录候选[目录序++] + 存.名);
            }
        });

        /* 播完了：不自动切歌（这里没有播放列表），停住并把状态改成「没在播」，
           免得下一次进任意页面又从头播一遍。 */
        音频.addEventListener('ended', () => {
            写状态({ id: 存.id, 名: 存.名, 类型: 存.类型, 时间: 0, 播放中: false });
        });

        /* ---- 进度回写：下一页（或回到 4 页）要靠它续上 ---- */
        function 存一次(播放中) {
            写状态({
                id: 存.id, 名: 存.名, 类型: 存.类型,
                时间: 音频.currentTime || 0,
                /* ★ 同 4 页那个坑：只认真正的布尔。pagehide / beforeunload
                     的监听器会把 Event 对象当第一个参数传进来，
                     `播放中 === undefined` 拦不住它 → `!!Event` = true。 */
                播放中: typeof 播放中 !== 'boolean' ? !音频.paused : 播放中,
            });
        }
        // 播着的时候每秒存一次，中途崩溃 / 强杀也不会丢太多
        setInterval(() => { if (!音频.paused) 存一次(true); }, 1000);
        // 离开页面再存一次：跳转、切后台、关闭三种情况都覆盖
        const 存一次同步 = () => 存一次();
        window.addEventListener('pagehide', 存一次同步);
        window.addEventListener('beforeunload', 存一次同步);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') 存一次同步();
        });

        /* ------------------------------------------------------------
         * 补播：浏览器会拦「没有用户手势」的自动播放，这是硬限制，绕不过去。
         *   策略：
         *     ① 直接播；
         *     ② 被拒 → 【持续】监听用户交互，直到真的播起来才撤监听；
         *     ③ 期间挂一个可见小条，告诉用户「点一下继续」。
         *   ★★ 关键：不能用 once:true。那一次点击可能仍被拒（或音频还没
         *      ready），失败后就再也没机会了 —— 表现正是「切过去没声音」。
         *      必须【成功才停】，这是这段里最要紧的一句。
         * ---------------------------------------------------------- */
        const 事件名 = ['pointerdown', 'touchstart', 'click', 'keydown'];

        function 撤补播() {
            if (!补播中) return;
            补播中 = false;
            事件名.forEach(n => document.removeEventListener(n, 试补播, true));
            document.removeEventListener('visibilitychange', 见可见);
            收提示();
        }

        function 见可见() {
            if (document.visibilityState === 'visible') 试补播();
        }

        function 试补播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();                     // 老浏览器无 Promise：当成功处理
        }

        /** 被拦 → 挂持续监听 + 显示提示条 */
        function 展提示() {
            if (!补播中) {
                补播中 = true;
                /* ★ 捕获阶段：冒泡阶段可能被页面自己的 stopPropagation 吃掉 */
                事件名.forEach(n => document.addEventListener(n, 试补播, true));
                document.addEventListener('visibilitychange', 见可见);
            }
            亮提示();
        }

        /* ---- 提示条：自建，不依赖各页自己的 toast 实现（各页不统一）---- */
        let 提示元素 = null;
        function 亮提示() {
            if (提示元素) return;
            const 条 = document.createElement('div');
            条.id = '全局音乐提示';
            条.textContent = '♪ 音乐已就绪，点一下继续播放';
            // 样式全内联 + !important：各页 CSS 互不统一，不这样会被盖掉 / 变形
            条.setAttribute('style', [
                'position:fixed', 'left:50%', 'bottom:16px', 'transform:translateX(-50%)',
                'z-index:99999', 'padding:8px 14px', 'border-radius:999px',
                'background:rgba(28,28,32,0.86)', 'color:#fff', 'font-size:12px',
                'letter-spacing:.3px', 'pointer-events:none',
                'box-shadow:0 4px 16px rgba(0,0,0,.2)',
                'transition:opacity .25s', 'opacity:0',
                'font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
            ].join('!important;') + '!important');
            document.body.appendChild(条);
            提示元素 = 条;
            setTimeout(() => { if (提示元素) 提示元素.style.opacity = '1'; }, 20);
            setTimeout(收提示, 8000);           // 8 秒后自动收，别一直杵着
        }
        function 收提示() {
            if (!提示元素) return;
            const 条 = 提示元素;
            提示元素 = null;
            条.style.opacity = '0';
            setTimeout(() => { if (条.parentNode) 条.parentNode.removeChild(条); }, 300);
        }

        function 续播() {
            let 试;
            try { 试 = 音频.play(); } catch (e) { 展提示(); return; }
            if (试 && typeof 试.then === 'function') 试.then(撤补播).catch(展提示);
            else 撤补播();
        }

        // 播起来了就收掉提示（例如用户从别处触发了播放）
        音频.addEventListener('play', 撤补播);

        /* ---- 载入：上传曲目走 blob URL，其余按目录拼路径 ---- */
        function 载入默认() {
            目录序 = 0;
            音频.src = encodeURI(目录候选[目录序++] + 存.名);
        }

        if (存.类型 === '上传' && 存.id) {
            读一条(存.id).then(记录 => {
                if (记录 && 记录.数据) {
                    try {
                        上传链接 = URL.createObjectURL(记录.数据);
                        音频.src = 上传链接;
                        return;
                    } catch (e) {}
                }
                载入默认();          // 读不到（库被清了）→ 退回按名字找文件
            });
        } else {
            载入默认();
        }
    }

    /* DOM 就绪再跑：4 页的 #音乐播放器 也在 body 里，早了会误判成「没有」
       → 两个 audio 同时出声。 */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    // 测试 / 调试用：暴露一个只读探针，验证脚本确实起来了
    window.__全局音乐 = {
        键: 状态键,
        元素id: 元素id,
        让位条件: () => !!document.getElementById('音乐播放器'),
        占用: 全局音频.占用表,
        补播中: () => 补播中,
    };
})();
    </script>

    <script id="软键盘适配">
/* =============================================================================
 * 软键盘适配.js —— 让输入框在手机输入法弹出时始终可见
 *
 * 【要解决什么】
 *   全站每个页面都是「100dvh 的固定容器 + 中间滚动区 + 底部固定区」的结构：
 *       .手机主题背景容器 { height: 100dvh; overflow: hidden; display:flex; column }
 *         ├── .顶部固定区      (flex-shrink: 0)
 *         ├── .手机界面内容    (flex: 1; overflow-y: auto)  ← 唯一滚动区
 *         └── .底部输入区      (flex-shrink: 0)
 *   容器高度被 100dvh 硬锁死，所以输入法一弹出：
 *     · iOS Safari：layout viewport 不变，visual viewport 被键盘吃掉一块，
 *       容器高度纹丝不动 → 底部输入区整个被键盘盖住。
 *     · Android Chrome（resize 模式）：innerHeight 会变小，dvh 跟着变，
 *       容器自动变矮 → 但只在部分浏览器成立，换一家就打回原形。
 *   同一套代码在两家表现不一样，正是这次要抹平的东西。
 *
 * 【核心思路：只信 visualViewport】
 *   键盘高度 = 基准布局高 − visualViewport.height − visualViewport.offsetTop
 *   然后把容器高度直接设成 visualViewport.height，并整体平移 offsetTop。
 *   —— 不猜机型、不猜浏览器，只认「当前真正能看见的这块矩形」，
 *      所以 iOS / Android / 各家输入法走的都是同一条代码路径。
 *
 *   ★ 基准布局高不是实时的 window.innerHeight —— 这是最容易写错的一处。
 *     Android 键盘弹出时 innerHeight 本身就会变小，拿实时 innerHeight 去减
 *     visualViewport.height 会得到 0，等于永远检测不到键盘（典型的「安卓没效果」）。
 *     基准只在「确认键盘收起」时更新，弹出期间冻结。
 *
 * 【两件事一起做，缺一个都会漏】
 *   ① 容器自适应：解决「底部常驻输入区被盖」（7 页的 .底部输入区）
 *   ② 焦点滚入可视：解决「滚动区里的输入框被盖」（2 / 11 / 19~22 页的表单）
 *
 * 【四条硬约束（需求点，改动时别破）】
 *   ① 不抖动：高度变化 ≤ 2px 不写样式；所有写入合并进一帧 rAF；
 *              键盘判定阈值 80px，避开地址栏收起、工具栏隐藏这类假信号。
 *   ② 不丢焦点：全程不 blur、不重建 DOM、不动 tabindex、不改 DOM 顺序。
 *   ③ 不整页滚：绝不用 window.scrollTo 做补偿 —— 那会让 iOS 整个 layout
 *      viewport 上移，顶部被切掉且松手后弹不回来。只改容器高度与
 *      「最近的可滚动祖先」的 scrollTop。
 *   ④ 不硬编码机型：没有 User-Agent 判断，没有 iOS / Android 分支。
 *
 * 【降级】
 *   没有 visualViewport（老浏览器）→ 退回 window.resize + innerHeight 比对。
 *   再不行 → 什么都不做，恢复成页面原本的样子（不会更糟）。
 *
 * 【对外 API（业务与测试用）】
 *   window.软键盘.是否弹出()   → bool
 *   window.软键盘.键盘高度()   → 像素
 *   window.软键盘.校准()       → 立刻重算一次（比如弹窗关闭后）
 *   window.软键盘.让位(px)     → 声明额外的底部占用（如自定义输入条），
 *                                容器会再让出这么多高度
 *   window.软键盘._喂(...)     → 测试用：直接喂一个可视区矩形
 *
 * ★★ 本文件是唯一源。改完跑：python3 同步软键盘.py
 *     （与 全局音乐.js / 音频助手.js 同一套内联同步机制）
 * ========================================================================== */
(function () {
    'use strict';

    /* ------------------------------------------------------------------
     * 常量
     * ---------------------------------------------------------------- */
    const 容器类名 = '手机主题背景容器';
    const 弹出阈值 = 80;      // 键盘高度超过它才认定「键盘弹出了」
    const 变化阈值 = 2;       // 高度变化不超过它就不写样式，省掉无意义的重排
    const 底部余量 = 14;      // 焦点元素与可视区底部之间留的呼吸位
    const 顶部余量 = 8;
    const 类名键已弹 = '软键盘已弹出';
    const 样式id = '软键盘适配样式';

    const vv = (typeof window.visualViewport === 'object' && window.visualViewport)
        ? window.visualViewport : null;

    /* ------------------------------------------------------------------
     * 状态
     * ---------------------------------------------------------------- */
    let 容器 = null;
    let 基准高 = 0;           // 「键盘收起时」的布局高度，弹出期间冻结
    let 已弹出 = false;
    let 上次可视高 = 0;
    let 上次偏移 = 0;
    let 帧 = 0;               // rAF 句柄，用于合并
    let 额外让位 = 0;         // window.软键盘.让位() 设进来的额外高度
    let 焦点 = null;          // 最近一次聚焦的输入元素

    /* ------------------------------------------------------------------
     * 小工具
     * ---------------------------------------------------------------- */
    function 是输入框(el) {
        if (!el || !el.tagName) return false;
        const 标签 = el.tagName.toLowerCase();
        return 标签 === 'input' || 标签 === 'textarea'
            || (标签 === 'div' && el.isContentEditable === true);
    }

    /** 找容器：优先类名（全站统一），退化到 body 的唯一直接子元素 */
    function 找容器() {
        if (容器 && 容器.isConnected) return 容器;
        容器 = document.querySelector('.' + 容器类名) || null;
        return 容器;
    }

    function 可视顶() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }
    function 可视底() {
        if (vv) return (vv.offsetTop || 0) + vv.height;
        return (window.scrollY || 0) + window.innerHeight;
    }
    function 当前可视高() { return vv ? vv.height : window.innerHeight; }
    function 当前偏移() { return vv ? (vv.offsetTop || 0) : (window.scrollY || 0); }

    /* ------------------------------------------------------------------
     * 注入样式：只在键盘弹出时生效，收起即移除，不留残余
     * ---------------------------------------------------------------- */
    function 装样式() {
        if (document.getElementById(样式id)) return;
        const 样式 = document.createElement('style');
        样式.id = 样式id;
        /* ★ 用 class 而不是内联 style：收起时摘掉 class 就能还原，
             不用逐个记住页面原本的 align-items / padding 是多少。 */
        样式.textContent =
            'html.' + 类名键已弹 + ' body{align-items:flex-start !important;}\n' +
            'html.' + 类名键已弹 + ' .' + 容器类名 + '{padding-bottom:0 !important;}\n';
        (document.head || document.documentElement).appendChild(样式);
    }

    /* ------------------------------------------------------------------
     * 核心：把容器压到「真正看得见」的那块矩形里
     * ---------------------------------------------------------------- */
    function 应用() {
        const 盒 = 找容器();
        if (!盒) return;

        const 可视高 = 当前可视高();
        const 偏移 = 当前偏移();

        if (!基准高) 基准高 = window.innerHeight || 可视高;

        /* ★★ 键盘高度：基准 − 可视高 − 偏移。
              基准在弹出期间冻结，所以 Android 那种「innerHeight 自己也会缩」
              的情况同样算得出来。 */
        let 键盘 = 基准高 - 可视高 - 偏移;
        if (键盘 < 0) 键盘 = 0;

        const 弹出 = 键盘 > 弹出阈值;

        /* 状态没变、且可视高几乎没动 → 什么都不做（防抖动的第①道闸） */
        if (弹出 === 已弹出
            && Math.abs(可视高 - 上次可视高) <= 变化阈值
            && Math.abs(偏移 - 上次偏移) <= 变化阈值) {
            if (弹出) 校准焦点();
            return;
        }

        上次可视高 = 可视高;
        上次偏移 = 偏移;
        已弹出 = 弹出;

        const 根 = document.documentElement;
        const 体 = document.body;

        if (弹出) {
            装样式();
            if (!根.classList.contains(类名键已弹)) 根.classList.add(类名键已弹);

            /* 容器高度 = 真正看得见的高度（再减去业务声明的额外让位） */
            const 目标高 = Math.max(120, 可视高 - 额外让位);
            盒.style.height = 目标高 + 'px';
            盒.style.minHeight = 目标高 + 'px';
            /* 跟着 visualViewport 的偏移走（iOS 页面被上推时靠它归位） */
            盒.style.transform = (偏移 ? 'translateY(' + 偏移 + 'px)' : '');

            /* ③ 不整页滚：只在系统确实把 layout viewport 推走时温和拉回原点。
                 阈值 4px 是为了不跟正常的 1~2px 抖动打架。 */
            if (!vv && (window.pageYOffset || 0) > 4 && 体) {
                const 体溢出 = window.getComputedStyle(体).overflow;
                if (体溢出 === 'hidden' || 体溢出 === 'clip') window.scrollTo(0, 0);
            }
        } else {
            /* 收起：摘 class、清掉所有内联改动，回到页面原本的样子 */
            if (根.classList.contains(类名键已弹)) 根.classList.remove(类名键已弹);
            盒.style.height = '';
            盒.style.minHeight = '';
            盒.style.transform = '';
            /* 收起时基准可以放心更新 —— 此刻量到的就是「无键盘」的真实高度 */
            基准高 = window.innerHeight || 可视高;
        }

        /* 容器变矮之后滚动区也变矮，焦点元素可能又落到可视区外 → 再校准一次 */
        校准焦点();
    }

    /** 合并到下一帧，避免 resize 连发时反复读写布局 */
    function 排一帧() {
        if (帧) return;
        const 跑 = window.requestAnimationFrame
            || function (f) { return setTimeout(f, 16); };
        帧 = 跑(function () { 帧 = 0; 应用(); });
    }

    /* ------------------------------------------------------------------
     * ② 焦点滚入可视
     * ---------------------------------------------------------------- */
    /** 向上找最近一个「真的能滚」的祖先 */
    function 找滚动祖先(el) {
        let n = el ? el.parentElement : null;
        while (n && n !== document.body && n !== document.documentElement) {
            const 样式 = window.getComputedStyle(n);
            const 可滚 = /(auto|scroll|overlay)/.test(样式.overflowY || '');
            if (可滚 && n.scrollHeight > n.clientHeight + 1) return n;
            n = n.parentElement;
        }
        return null;
    }

    /**
     * 把焦点元素挪进可视区。
     * ★ 只动「最近滚动祖先」的 scrollTop —— 不动 window，避免整页位移。
     * ★ 元素本来就在可视区里时什么都不做，不会没事乱滚。
     */
    function 校准焦点() {
        const el = 焦点 || document.activeElement;
        if (!是输入框(el)) return;
        if (!找容器()) return;

        const 矩形 = el.getBoundingClientRect();
        if (!矩形.height && !矩形.top) return;      // 还没布局完，跳过

        const 下界 = 可视底() - 底部余量;
        const 上界 = 可视顶() + 顶部余量;

        let 差 = 0;
        if (矩形.bottom > 下界) 差 = 矩形.bottom - 下界;
        else if (矩形.top < 上界) 差 = 矩形.top - 上界;

        if (Math.abs(差) <= 1) return;

        const 滚动父 = 找滚动祖先(el);
        /* 不在任何滚动区里（比如底部常驻输入区）：容器已经跟着可视区收缩了，
           理论上不该再超出。真超了也不碰 window —— 那才是抖动的根源。 */
        if (滚动父) 滚动父.scrollTop += 差;
    }

    /* ------------------------------------------------------------------
     * 事件
     * ---------------------------------------------------------------- */
    function 起监听() {
        /* ① visualViewport：键盘弹出 / 收起 / 页面被上推 都走这里，逐帧跟随 */
        if (vv) {
            vv.addEventListener('resize', 排一帧);
            vv.addEventListener('scroll', function () {
                /* iOS 键盘弹出时若系统把 layout viewport 推走，offsetTop 会变，
                   这里同步一下容器位置，避免顶部被切掉。 */
                if (已弹出) 排一帧();
            });
        }

        /* ② 降级：没有 visualViewport 的老浏览器，靠 window.resize */
        window.addEventListener('resize', 排一帧);

        /* ③ 方向变化：横竖屏切换后基准要重测 */
        window.addEventListener('orientationchange', function () {
            基准高 = 0;
            setTimeout(排一帧, 120);
        });

        /* ④ 聚焦：记下元素并立刻校准一次。
             键盘弹出是异步动画（iOS 约 250ms），所以这里先做一次「预防性」校准，
             随后 visualViewport.resize 每帧触发时会继续跟着校准到最终位置。 */
        document.addEventListener('focusin', function (e) {
            if (!是输入框(e.target)) return;
            焦点 = e.target;
            /* 先测一次基准：此刻键盘还没弹，量到的正是无键盘高度 */
            if (!已弹出) 基准高 = window.innerHeight || 当前可视高();
            setTimeout(排一帧, 30);
        }, true);

        /* ⑤ 失焦：键盘收起由 resize 兜底，这里只清记录、不主动改布局
              —— 切到下一个输入框时 focusin 会立刻接手，不会闪。 */
        document.addEventListener('focusout', function (e) {
            if (焦点 === e.target) 焦点 = null;
        }, true);

        /* ⑥ 切后台回来：尺寸可能已经变了 */
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { 基准高 = 0; 排一帧(); }
        });
    }

    /* ------------------------------------------------------------------
     * 启动
     * ---------------------------------------------------------------- */
    function 启动() {
        找容器();
        基准高 = window.innerHeight || 当前可视高();
        上次可视高 = 当前可视高();
        上次偏移 = 当前偏移();
        起监听();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', 启动);
    } else {
        启动();
    }

    /* ------------------------------------------------------------------
     * 对外 API
     * ---------------------------------------------------------------- */
    window.软键盘 = {
        是否弹出: function () { return 已弹出; },
        键盘高度: function () {
            return Math.max(0, 基准高 - 当前可视高() - 当前偏移());
        },
        校准: 排一帧,
        /** 业务声明额外的底部占用（例如自定义输入条），容器再让出这么多 */
        让位: function (px) {
            额外让位 = Math.max(0, Number(px) || 0);
            排一帧();
        },
        /**
         * 测试用：直接喂一个「可视区矩形」，跳过真实环境探测。
         *   _喂(可视高, 偏移, 布局高)
         * · 有 visualViewport：改它的 height / offsetTop
         * · 没有（降级路径）：改 window.innerHeight
         * 两种都是测试替身走的同一条代码路径，所以断言对真机同样成立。
         */
        _喂: function (可视高, 偏移, 布局高) {
            if (typeof 布局高 === 'number' && 布局高 > 0) 基准高 = 布局高;
            上次可视高 = -999;                 // 强制通过变化阈值，保证一定重算
            if (vv) {
                try {
                    vv.height = 可视高;
                    vv.offsetTop = 偏移 || 0;
                } catch (e) {
                    Object.defineProperty(vv, 'height', { value: 可视高, configurable: true });
                    Object.defineProperty(vv, 'offsetTop', { value: 偏移 || 0, configurable: true });
                }
            } else {
                try { window.innerHeight = 可视高; } catch (e) {
                    Object.defineProperty(window, 'innerHeight',
                        { value: 可视高, configurable: true, writable: true });
                }
            }
            应用();
            return true;
        },
        /** 测试用：当前容器被压到的高度（内联样式里的值，未设置则空串） */
        _容器高: function () {
            const 盒 = 找容器();
            return 盒 ? (盒.style.height || '') : null;
        },
    };
})();
    </script>
</body>
</html>
